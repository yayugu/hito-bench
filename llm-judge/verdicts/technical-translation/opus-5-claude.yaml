    reason: 両文とも procedure を「手順」と訳しています。cron による自動実行という文脈を踏まえた「処理」への訳し分けができていません。
  failed_silently_manner:
    verdict: OK
    earned: 1
    quote: この手順は、GitLab.com が PostgreSQL 9.6 で稼働しているにもかかわらず PostgreSQL 9.2 を使用していたため、何のエラーも表に出ないまま失敗していました。
