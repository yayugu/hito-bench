    earned: 1
    quote: その時が来るまで何も出力せずに待機し続けるのです。
    reason: silently を出力がないこととして適切に説明し、sit に由来する擬人化表現も残していません。
  finding_and_using:
    verdict: OK
    earned: 1
    quote: バックアップを見つけることも使うことも、いずれも完全に失敗に終わりました。
    reason: 「検索と使用の両方のプロセス」という名詞構文を避け、「見つけることも使うことも」という動詞による並列構造に展開しています。
  they_pronoun:
    verdict: NG
    earned: 0
    quote: pg_dump のバックアップを探しに行ったところ、それらが存在しないことが分かりました。
    reason: they を「それら」と機械的に訳出しており、日本語では不要な代名詞が残っています。
  while_notifications:
    verdict: NG
    earned: 0
    quote: エラーが発生した cron ジョブについては通知が有効になっていますが、これらの通知はメールで送信されます。
    reason: 通知の有効化とメール送信をそのまま逆接でつないでいます。「通知手段がメールだった」という問題の焦点を明示できていません。
  while_snapshots:
    verdict: NG
    earned: 0
    quote: NFS サーバーでは有効になっていたものの、他のバックアップ手順で十分だと想定していたため、データベースサーバーではスナップショットが有効になっていませんでした。
    reason: スナップショットという主語が文末近くまで現れず、その前に長い理由節が挟まれています。主語の先出しや理由節の整理ができていません。
