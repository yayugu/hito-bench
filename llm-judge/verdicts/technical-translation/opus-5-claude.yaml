  procedure_shori:
    verdict: NG
    earned: 0
    quote: |-
      この手順は、GitLab.com が PostgreSQL 9.6 で稼働しているにもかかわらず PostgreSQL 9.2 を使用していたため、何のエラーも表に出ないまま失敗していました。

