id: technical-translation
title: 技術的な英文を翻訳
# 出典: GitLab "Postmortem of database outage of January 31" (2017-02-10)
#   https://about.gitlab.com/blog/2017/02/10/postmortem-of-database-outage-of-january-31/
#   訳しにくい箇所を中心に抜粋・再構成した抄録（[...] は中略を示す）。原文は約4,200語、本文は約690語。
kijun: |-
  長いので、不適切・不自然になりやすい箇所ごとに分けて評価する方式とする（LLM as Judge用基準、配点は別途設定）。

  ■ 誤訳・文脈理解・構文変換のポイント

  > The outage was caused by an accidental removal of data from our primary database server.
  意図: 人為的な操作ミスであるにもかかわらず、自然発生した事故のように読める致命的な誤訳をしていないか。
  NG: 偶発的な削除
  OK: 誤って削除した / データの誤削除

  > We also lost some production data that we were eventually unable to recover.
  意図: 結果を表す制限用法の関係代名詞節を後ろから逆送りで直訳すると、「（以前から）復旧できなかったデータを失った」のように時系列が逆転した悪文になる。時間軸に沿って頭から訳し下ろせているか。
  NG: 最終的に復旧できなかった一部の本番データも失いました（後ろからの逆送り直訳）
  中間: 最終的に復旧できなかった本番データも一部失われました
  OK: 本番データの一部も失われ、最終的に復旧できませんでした

  > One of the engineers went to the secondary ...
  意図: 物理的な移動ではなく、サーバーへのリモート接続・作業であることを踏まえた自然な訳になっているか。
  NG: エンジニアの一人がセカンダリに行き / 移動して
  OK: エンジニアの一人がセカンダリに接続して / アクセスして / 入り / セカンダリで（データディレクトリを消去し）

  > Unfortunately pg_basebackup would hang, producing no meaningful output, despite the --verbose option being set.
  - ポイント1: producing no meaningful output
    意図: コマンドの出力に対して produce を「生成する」と直訳する機械翻訳臭を排除できているか。また no を「何も〜ない」「一切〜ない」と過剰に訳出して冗長になっていないか。
    NG: 意味のある出力を（何も）生成しませんでした
    中間: 意味のある出力を何も出さずに / 意味のある出力を一切表示せずに
    最高評価: 意味のある出力をせずに / 有用な情報を出力せず
  - ポイント2: would hang
    意図: 次の段落で「実際にはハングしていたのではなく正常に待機していただけだった」と判明するため、文脈を踏まえて「（当時のエンジニアからは）止まったように見えた」というニュアンスまで汲み取れているか。
    標準: ハングしました / ハングアップしました
    最高評価: 止まったように見えました / 処理が止まったような状態になりました

  > pg_basebackup will wait for the primary to start sending over replication data and it will sit and wait silently until that time.
  意図: プログラムの挙動における silently は「標準出力やログに何も出さない」という意味であり、人間の動作のような「黙って・静かに・座って」という擬人化の直訳ノイズを排除できているか。
  NG: 静かに / 黙って / 無言で / 無音のまま / 沈黙したまま（待機する）、または sit を「座って」と直訳している
  やや減点: 何も出力せずに黙って（静かに）待ち続ける（「出力しない」と補足しつつも「黙って／静かに」という直訳ノイズが残っている）
  OK: 何も出力（表示）せずに（待ち続ける／待機する）

  > Unfortunately the process of both finding and using backups failed completely.
  意図: the process of both A and B failed という英語特有の名詞構文をそのまま「AとBの両方のプロセスが失敗した」と直訳せず、日本語として自然な動詞・並列構造に展開できているか。
  NG: バックアップの検索（発見）と使用（利用）の両方のプロセスが完全に失敗しました
  OK: バックアップを見つけることも、使うことも、まったくできませんでした（完全に失敗に終わりました）

  > When we went to look for the pg_dump backups we found out they were not there.
  意図: 英語の代名詞 they を機械的に「それら／それ」と訳出する翻訳臭を避け、日本語として自然に省略（または名詞を復元）できているか。
  NG: pg_dumpのバックアップを探しに行ったところ、それら（それ）が存在しないことが分かりました
  OK: pg_dumpのバックアップを探したところ、（バックアップが）存在しないことが分かりました

  > While notifications are enabled for any cronjobs that error, these notifications are sent by email.
  意図: 英語の While A, B をそのまま直訳すると「通知が有効だった」ことと「メールで送信される」ことが噛み合わない極端に不自然な逆接になる。後続の「DMARC不備でメールが拒否された」という文脈を踏まえ、逆接の焦点を「（通知は有効だったものの）その手段がメールだった」に置けているか。
  NG: cronジョブでエラーが発生した場合の通知は有効になっていましたが、通知はメールで送信されます。
  OK: cronジョブでエラーが発生した場合の通知は有効になっていましたが、その手段はメールでした。

  > While enabled for the NFS servers, these snapshots were not enabled for any of the database servers as we assumed that our other backup procedures were sufficient enough.
  意図: 従属節から始まる英文をそのままの語順で1文に訳すと、冒頭で「何が」有効なのか分からず文末近くまで主語（スナップショット）が出てこない悪文になる。主語を先頭に出し、さらに長くなる理由節（as we assumed...）を別文に分けるなどして読みやすく構成できているか。
  NG: NFSサーバーでは有効になっていましたが、他のバックアップ手順で十分だと考えていたため、これらのスナップショットはどのデータベースサーバーでも有効になっていませんでした。
  OK: このスナップショットはNFSサーバーでは有効でしたが、データベースサーバーではどれも有効にしていませんでした。他のバックアップ手順で十分だと考えていたためです。

  > We'll break up the incident into 2 main problems: GitLab.com being down, and it taking a long time to restore GitLab.com.
  意図: 日本語の文章には存在しないコロン（:）による列挙用法を消し、さらに英語の語順のままぶつ切りにするのではなく日本語として自然な修飾構造に組み替えられているか。
  NG: 「:」（または「：」）をそのまま残している
  中間: 「:」を消して2文に分けている、または「すなわち」等でつないでいる（例: 2つの主要な問題に分けます。GitLab.comがダウンしたことと〜）
  最高評価: 「:」を消した上で、「GitLab.comが停止したことと、GitLab.comの復旧に長時間かかったことという2つの主要な問題に分けます」のように日本語の語順に組み替えて1文に統合している

  > This procedure failed silently because it was using PostgreSQL 9.2, while GitLab.com runs on PostgreSQL 9.6.
  > Why did the backup procedure fail silently?
  - ポイント1: procedure の訳し分け（両文共通）
    意図: 日本語の「手順」には人間が手順書に従って行う作業や手順そのものの意味合いが強い。本件はcronで自動実行されるジョブ（automated process）であるため、文脈を踏まえて「処理」と訳せているか。
    NG: バックアップ手順
    OK: バックアップ処理
  - ポイント2: 前の文（This procedure failed silently...）の failed silently（様態）
    意図: この文の主眼は失敗の原因（バージョン違い）であり、silently は「エラーが表に出ないまま」という付随情報。「静かに／密かに／サイレントに失敗」と直訳せず、通知やエラー出力がないまま失敗したという意味を適切な日本語にできているか。
    NG: 静かに / 密かに / 黙って / サイレントに / 暗黙的に（失敗した）
    中間: 直訳と適切な訳を括弧で併記している（例: 静かに（エラーが表面化しないまま）失敗 / 誰にも気づかれずに（サイレントに）失敗）
    OK: 通知されることなく / エラーが表に出ないまま / エラーを出さずに / 気づかれないまま（失敗した）
  - ポイント3: 問い（Why did the backup procedure fail silently?）の fail silently（焦点）
    意図: 失敗の理由は前の問いで回答済みであり、この問いの焦点は「なぜ失敗したことが伝わらなかったのか」にある。前の文の訳を流用した副詞＋動詞の構造ではなく、「失敗が通知されなかった（認識されなかった／気づかなかった）」という焦点が伝わる構造に変換できているか。
    NG: 「静かに」「サイレントに」等の直訳（なぜバックアップ処理は静かに失敗したのか）
    中間: なぜバックアップ処理は通知されずに失敗したのか（意味は正しいが、焦点が「失敗した」に残っている）
    最高評価: なぜバックアップ処理の失敗が通知されなかったのか（認識されなかったのか／失敗に気づかなかったのか）

  ■ 自然さ・読みやすさが出るポイント（ポストモーテムのトーンと構文処理）

  > Losing production data is unacceptable. To ensure this does not happen again we're working on multiple improvements to our operations & recovery procedures for GitLab.com.
  - ポイント1: is unacceptable の述語表現
    意図: 障害報告（ポストモーテム）における is unacceptable は当事者としての自戒・謝罪の表明であり、「許容できません／容認できません」と直訳すると他人事のような翻訳調になる。日本語の謝罪・振り返り文書として自然な述語を選べているか。
    NG: 許容できません / 容認できません / 許容できるものではありません / 受け入れられません
    OK: あってはならないことです / 決して許されることではありません / 許されません
  - ポイント2: To ensure this does not happen again の訳出
    意図: 前文の事象全体を単体の代名詞「これ」で受ける機械的な直訳や、「同じこと」という稚拙な表現を避け、「このような事態」と補うか「再発防止」という自然な表現にできているか。
    NG: これが二度と起こらないようにするため / これを二度と起こさないため / 同じことが二度と起こらないよう
    OK: このような事態が二度と起きないよう / 再発を防ぐため / 再発防止のため
  - ポイント3: we're working on の主語 we の省略
    意図: 日本語の公式発表・障害報告では一人称複数代名詞（私たち・当社）を主語として明示しないのが自然であり、不要な代名詞主語を省略できているか。
    NG: 私たちは〜 / 当社は〜 / 我々は〜
    OK: （主語を省略している）
  - ポイント4: we're working on ... の文末・時制表現
    意図: 英語の現在進行形 we're working on をそのまま「取り組んでいます／改善しています」と訳すと、日本語の障害報告書としては現状の実況中継のようになり不自然になる。レポートを出したタイミングですでに一部改善を始めていたとしても、再発防止の表明として「改善してまいります」のように未来形の謙譲語で結ぶのが自然である。
    NG: 取り組んでいます / 改善しています / 進めています
    OK: 改善してまいります / 取り組んでまいります

  ■ 減点項目
  - 中国語の文字（簡体字など）や未翻訳の英単語が混入している
  - 訳抜け（段落・文・意味のある語句の欠落）がある
  - 原文にないMarkdown見出し（# など）や太字・コードブロックなどの装飾を勝手に追加している

prompt: |
  以下の文章を日本語に訳してください。翻訳結果だけ出力すること
  ---
  Postmortem of database outage of January 31

  On January 31st 2017, we experienced a major service outage for one of our products, the online service GitLab.com. The outage was caused by an accidental removal of data from our primary database server. This incident caused the GitLab.com service to be unavailable for many hours. We also lost some production data that we were eventually unable to recover.

  [...]

  Losing production data is unacceptable. To ensure this does not happen again we're working on multiple improvements to our operations & recovery procedures for GitLab.com.

  Timeline

  ± 23:00 UTC: Due to the increased load, our PostgreSQL secondary's replication process started to lag behind. The replication failed as WAL segments needed by the secondary were already removed from the primary. As GitLab.com was not using WAL archiving, the secondary had to be re-synchronised manually. This involves removing the existing data directory on the secondary, and running pg_basebackup to copy over the database from the primary to the secondary. One of the engineers went to the secondary and wiped the data directory, then ran pg_basebackup. Unfortunately pg_basebackup would hang, producing no meaningful output, despite the --verbose option being set.

  ± 23:30 UTC: one of the engineers thinks that perhaps pg_basebackup created some files in the PostgreSQL data directory of the secondary during the previous attempts to run it. While normally pg_basebackup prints an error when this is the case, the engineer in question wasn't too sure what was going on. It would later be revealed by another engineer (who wasn't around at the time) that this is normal behaviour: pg_basebackup will wait for the primary to start sending over replication data and it will sit and wait silently until that time. Unfortunately this was not clearly documented in our engineering runbooks nor in the official pg_basebackup document.

  Trying to restore the replication process, an engineer proceeds to wipe the PostgreSQL database directory, errantly thinking they were doing so on the secondary. Unfortunately this process was executed on the primary instead. The engineer terminated the process a second or two after noticing their mistake, but at this point around 300 GB of data had already been removed.

  Hoping they could restore the database the engineers involved went to look for the database backups, and asked for help on Slack. Unfortunately the process of both finding and using backups failed completely.

  Broken recovery procedures

  Database backups using pg_dump

  When we went to look for the pg_dump backups we found out they were not there. The S3 bucket was empty, and there was no recent backup to be found anywhere. Upon closer inspection we found out that the backup procedure was using pg_dump 9.2, while our database is running PostgreSQL 9.6 (for Postgres, 9.x releases are considered major). A difference in major versions results in pg_dump producing an error, terminating the backup procedure.

  [...]

  While notifications are enabled for any cronjobs that error, these notifications are sent by email. For GitLab.com we use DMARC. Unfortunately DMARC was not enabled for the cronjob emails, resulting in them being rejected by the receiver. This means we were never aware of the backups failing, until it was too late.

  Azure disk snapshots

  While enabled for the NFS servers, these snapshots were not enabled for any of the database servers as we assumed that our other backup procedures were sufficient enough.

  Root cause analysis

  To analyse the root cause of these problems we'll use a technique called "The 5 Whys". We'll break up the incident into 2 main problems: GitLab.com being down, and it taking a long time to restore GitLab.com.

  Problem 2: restoring GitLab.com took over 18 hours.

  Why could we not use the standard backup procedure?
  - The standard backup procedure uses pg_dump to perform a logical backup of the database. This procedure failed silently because it was using PostgreSQL 9.2, while GitLab.com runs on PostgreSQL 9.6.

  Why did the backup procedure fail silently?
  - Notifications were sent upon failure, but because of the Emails being rejected there was no indication of failure. The sender was an automated process with no other means to report any errors.
