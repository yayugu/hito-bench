id: short-short
title: ショートショート
nerai: |
  0→1の話を考える、オチをつける、短くまとめる。いずれもLLMが非常に苦手とする分野。
  また実行してみてわかったこととして100%「ショッピングサイト+南アメリカの密林」というありがちなダブルミーニングになってしまう。どちらか一方でもいいし、仮面ライダーアマゾンなど色々利用方法はあるのに収束してしまっている。お題活用でベタを打破できるかで意外性も測定する。また星新一SFになりすぎるのでこれも避けられたらプラス。
  オチを解説させているのは短いので人間の理解力が試されすぎるから。実在の良いショートショートも人間もオチをすんなりと理解できないことがままある
kijun: |-
  0: ショートショートではない
  10: 尺がショートショートになっている
  50: 話がなんとなく意味が通る
  70: 話がおもしろい。すべて意味が通る
  100: 最高

  話をつくらせるにあたり、AIは同じようなものをつくりすぎる。創作である以上は意外性は面白さに直結する。
  また人間が作る場合にお題をあまりにもストレートに使うことは普通はしない

  減点:
    - 「ショッピングサイト+南アメリカの密林」のありきたりすぎる組み合わせ（減点大）
    - ショッピングサイト (減点小)
    - 星新一まんますぎる (減点大)
    - SF (減点微)
prompt: ショートショートをつくって。お題はアマゾン。話を書ききったあとに---で区切ってオチを解説して