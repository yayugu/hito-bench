id: sangoku
title: ゲームと歴史
nerai: 史実ベースがありすぎると詳しく書きすぎる、また文書がかたくなりすぎるきらいがある。無双というかなりカジュアルでアクションに寄ったゲームタイトルであることを明示することでエンターテインメントに付属するものとして適切な文体を保てているか確認する。また中国側での文献や一般的な認識をベースに書いてしまわずに、日本人の前提知識や認知を踏まえたものとなっているか見る
prompt: "三国無双のゲーム内の武将情報画面をつくっています。300文字程度で紹介テキストをつくって。各キャラシナリオクリア後に見せるものなので生涯を最後まで。対象: 関羽"