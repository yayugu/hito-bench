id: sangoku
title: ゲームと歴史
nerai: 史実ベースがありすぎると詳しく書きすぎる、また文書がかたくなりすぎるきらいがある。かなりカジュアルでアクションに寄ったゲームタイトルであることを明示することでエンターテインメントに付属するものとして適切な文体を保てているか確認する。また中国側での文献や一般的な認識をベースに書いてしまわずに、日本人の前提知識や認知を踏まえたものとなっているか見る
kijun: |-
  0: 紹介テキストになっていない
  20: Wikipediaや教科書や観光名所の石碑のようなおもしろみのない文章
  100: 最高

  減点:
    - 中国のものであることに引っ張られて日本の読者に馴染みのない単語・表現がある

prompt: "三国BASARAレボリューションのゲーム内の武将詳細情報画面をつくっています。300文字程度で紹介テキストをつくって。生涯を最後まで。対象: 関羽"