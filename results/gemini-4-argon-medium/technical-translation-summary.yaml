response: |-
  この記事は、Gitリポジトリを大規模にホストする際の技術的課題と、Cursor社が開発した新ストレージシステム「Continuity」のアーキテクチャについて解説しています。技術的に特に興味深いポイントは以下の通りです。

  **1. 従来の分散アプローチの限界**
  Gitのデータ構造は有向非巡回グラフ（DAG）であり、ディスク上の「packfile」内でオブジェクトが差分圧縮・ランダム配置されています。そのため、KVSへの分散はネットワーク往復遅延で破綻し、NFS等の分散ファイルシステムもランダムリードの多さから機能しません。GitHubの「Spokes」はローカルNVMe上にリポジトリを複製し、3PC（3相コミット）で強整合性を保ちましたが、最も遅いノードに律速されるためレプリカ数を増やせず、巨大モノレポやAIが大量生成する使い捨てリポジトリに対応できない課題がありました。

  **2. S3を「真実の源」とするステートレス設計**
  Continuityは、S3上のWAL（Write-Ahead Log）を唯一の真実の源（Source of Truth）とし、各ノードのNVMe上のリポジトリを単なる「キャッシュ」として扱います。ルーティング用DBすら持たず、Rendezvous Hashingで接続先を決定し、S3のCAS（Compare-and-Swap）操作のみで排他制御と直列化を実現しています。アイドル状態のリポジトリはディスクから破棄（レプリカ数ゼロ）し、必要時にWALから再構築可能です。

  **3. UDPゴシップとS3のETagによる強整合性の両立**
  レプリケーション通知には信頼性の低いUDPゴシップを使用しますが、Read時にS3へETagを用いた条件付きGET（10ms未満のメタデータ操作）を行うことで強整合性を保証します。「304 Not Modified」なら即座にローカルから応答し、遅れていればS3から差分を適用します。

  **4. コンパクション（Repack）のオフロード**
  Gitの運用で最もCPUを消費するpackfileの再編成（repack）をプライマリノードのみが実行し、結果をS3にアップロードします。他レプリカはそれをダウンロードするだけ（CPU負荷を帯域幅とトレードオフ）にすることで、システム全体の可用性と最大100レプリカまでの線形なReadスケールを実現しています。
