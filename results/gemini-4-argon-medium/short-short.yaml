  箱を部屋に持ち帰り、カッターでテープを切る。
  開けた瞬間、むせ返るような土と草の匂いが部屋中に充満した。箱の中身は、湿った黒土が一握りだけ。

  「なんだよ、イタズラか？」

  文句を言おうとスマホを手にとった、その時だった。
  ミシッ、と床が鳴った。
  見ると、箱からこぼれたわずかな土から、緑色のツタが猛烈なスピードで這い出していた。ツタは生き物のようにフローリングを這い、テレビを飲み込み、冷蔵庫を締め上げ、天井へと達した。

  「うわっ、なんだこれ！」

  窓を開けようとしたが、すでにガラスは分厚い大木の幹に塞がれていた。室温が急激に上がり、湿度が100％に達する。どこからか極彩色の鳥の鳴き声と、獰猛な獣の唸り声が聞こえてきた。俺のワンルームマンションは、わずか数分で鬱蒼とした熱帯雨林に姿を変えたのだ。

  足元のスマホが震えた。『配達が完了しました』という通知。
  震える手で画面を見る。この悪夢を終わらせるため、「返品する」のボタンを探した。あった。俺は迷わずそれをタップした。

