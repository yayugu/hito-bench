  **【天義の武神】関羽（かんう）**

  桃園で誓った「義」を胸に、愛用の青龍偃月刀で乱世を薙ぎ払う一騎当千の豪傑。見事な美髯をなびかせ、盟友・劉備の天下統一のため最前線を駆け抜けた。

  一度は宿敵・曹操の捕虜となるも、その義理堅さと圧倒的な武勇で敵将すら魅了。恩義に報いた後は、千の関門を突破して主君のもとへ帰還を果たす。その後、赤壁の戦いを経て重要拠点・荊州を託され、魏・呉の二大国を相手に「軍神」として君臨し、天下を震撼させた。

  しかし、あまりに強大すぎた力は同盟国・呉の裏切りを招く。退路を断たれ、四面楚歌の絶望的な状況に陥るも、その誇りは微塵も揺るがなかった。最期まで義を貫き、壮絶な散り際を見せた彼の魂は、文字通り「神」へと昇華されたのである。

