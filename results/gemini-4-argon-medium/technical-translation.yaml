  1月31日のデータベース障害に関する事後調査（ポストモーテム）

  2017年1月31日、当社の製品の1つであるオンラインサービス「GitLab.com」において大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーから誤ってデータを削除したことが原因でした。このインシデントにより、GitLab.comのサービスは何時間にもわたって利用できなくなりました。また、一部の本番環境データが失われ、最終的に復旧することができませんでした。

  [...]

  本番環境データの喪失は容認できるものではありません。このような事態が二度と起こらないようにするため、現在、GitLab.comの運用および復旧手順に対して複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC：負荷の増大により、PostgreSQLセカンダリのレプリケーションプロセスに遅延が発生し始めました。セカンダリが必要とするWALセグメントがすでにプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーする作業が含まれます。エンジニアの1人がセカンダリにアクセスしてデータディレクトリを消去し、pg_basebackupを実行しました。しかし残念ながら、--verboseオプションを設定していたにもかかわらず、pg_basebackupは意味のある出力を一切出さずにハングアップしてしまいました。

  ± 23:30 UTC：エンジニアの1人は、先ほどの実行試行中に、pg_basebackupがセカンダリのPostgreSQLデータディレクトリ内にいくつかのファイルを作成してしまったのではないかと考えました。通常、このような場合にはpg_basebackupはエラーを出力しますが、当該のエンジニアは何が起きているのか確信が持てませんでした。後に（当時はその場にいなかった）別のエンジニアによって、これが正常な動作であることが判明します。つまり、pg_basebackupはプライマリがレプリケーションデータの送信を開始するのを待ち、その時が来るまで何も出力せずに待機し続けるのです。残念ながら、このことは当社のエンジニアリング手順書（ランブック）にも、pg_basebackupの公式ドキュメントにも明確に記載されていませんでした。

  レプリケーションプロセスを復旧させようとして、あるエンジニアはPostgreSQLのデータベースディレクトリの消去を進めましたが、セカンダリ上で作業していると誤認していました。不運なことに、この処理は代わりにプライマリ上で実行されてしまいました。エンジニアは間違いに気づいてから1〜2秒後にプロセスを強制終了しましたが、この時点ですでに約300GBのデータが削除されていました。

  データベースを復元できることを期待して、関係するエンジニアたちはデータベースのバックアップを探しに行き、Slackで助けを求めました。しかし残念ながら、バックアップの探索と使用のプロセスはどちらも完全に失敗しました。

  機能しなかった復旧手順

  pg_dumpを使用したデータベースのバックアップ

  pg_dumpのバックアップを探しに行ったところ、そこには存在しないことが判明しました。S3バケットは空であり、最近のバックアップはどこにも見当たりませんでした。詳しく調査したところ、データベースがPostgreSQL 9.6で稼働しているにもかかわらず、バックアップ手順ではpg_dump 9.2が使用されていたことがわかりました（Postgresでは、9.xのリリースはメジャーバージョンとみなされます）。メジャーバージョンの違いによりpg_dumpはエラーを出力し、バックアップ手順を強制終了させていました。

  [...]

  エラーが発生したすべてのcronジョブに対して通知が有効になっていましたが、これらの通知はメールで送信されます。GitLab.comではDMARCを使用しています。残念ながら、cronジョブのメールに対してDMARCが有効になっていなかったため、受信側で拒否されていました。これは、手遅れになるまで私たちがバックアップの失敗にまったく気づかなかったことを意味します。

  Azureのディスクスナップショット

  NFSサーバーに対しては有効になっていましたが、他のバックアップ手順で十分だと想定していたため、これらのスナップショットはどのデータベースサーバーに対しても有効になっていませんでした。

  根本原因の分析

  これらの問題の根本原因を分析するため、「5つのなぜ（The 5 Whys）」と呼ばれる手法を使用します。このインシデントを、「GitLab.comがダウンしたこと」と「GitLab.comの復旧に長い時間がかかったこと」という2つの主要な問題に分割します。

  問題2：GitLab.comの復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使用できなかったのか？
  - 標準のバックアップ手順では、pg_dumpを使用してデータベースの論理バックアップを実行しています。GitLab.comがPostgreSQL 9.6で稼働している一方で、この手順ではPostgreSQL 9.2を使用していたため、誰にも気づかれずに（サイレントに）失敗していました。

  なぜバックアップ手順は誰にも気づかれずに失敗したのか？
  - 失敗時に通知は送信されていましたが、メールが拒否されていたため、失敗の兆候が伝わりませんでした。送信元は自動化されたプロセスであり、エラーを報告する他の手段を持っていませんでした。
