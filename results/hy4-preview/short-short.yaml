  僕は重度の通販依存症だ。特に、あの南米を流れる大河の名前を持つ巨大通販サイト「アマゾン」には、生活のすべてを依存している。
  朝はアマゾンで注文した目覚まし時計で起き、アマゾンで買ったコーヒーを飲む。気づけば僕のワンルームは、アマゾンのロゴが入ったダンボールの山で埋め尽くされ、足の踏み場もなくなっていた。

  ある深夜、いつものようにスマホで商品を物色していると、妙なページに辿り着いた。

  商品名：【中古】アマゾン（熱帯雨林）
  価格：1円（送料込み）
  説明：世界最大のジャングル奥地。無数の動植物と原住民付き。※大型商品のため玄関先での受け渡しとなります。

  好奇心に駆られた僕は、冗談半分でその「ポチる」ボタンを押した。

  数日後の早朝、けたたましい鳥のさえずりと獣の咆哮で目が覚めた。
  玄関のドアの隙間から、じめっとした熱気と土の匂いが漏れ出している。
  いつもの配達チャイムが鳴った。震える手でドアを開ける。

  そこに広がっていたのは、視界を遮るほど鬱蒼と生い茂る巨大な樹木と、無数の毒虫が飛び交う密林だった。
  茂みをかき分け、屈強な体つきをした現地の原住民が現れた。彼は手に持った端末を僕に差し出すと、片言の日本語で言った。

  「アマゾンでーす。ご注文のジャングル、玄関先に置いておきました」

  僕は絶望のあまり叫んだ。
  「おい！ 部屋に入らないんだから置き配にするなよ！ ……っていうか、スケール大きすぎるだろ！」

  ---

  ### オチの解説
  今回のショートショートは、お題である「アマゾン」が持つ2つの意味を利用した**ダブルミーニング（地口）**が核になっています。

  1つは巨大通販サイトの「Amazon」、もう1つは南米の「アマゾン熱帯雨林」です。
  主人公がネット通販で何でも買ってしまうという現代人の日常を描き、その究極系として「アマゾン（熱帯雨林）そのもの」をポチってしまうというシュールな展開を作りました。

  最後の「アマゾンでーす」というおなじみの配達員の挨拶を原住民に言わせることで、「通販サイトのアマゾンから荷物が届いた」のか「本物のアマゾン（ジャングル）から配達された」のかを意図的に混同させ、言葉のギャップによる笑いを生み出しています。

  また、近年普及した通販の**「置き配」**というシステムに対して、「スケールが大きすぎて部屋に入らない」という物理的なサイズのギャップをツッコミとしてぶつけることで、不条理な状況をより強調するオチとしています。
