  1月31日のデータベース障害に関するポストモーテム

  2017年1月31日、当社の製品の一つであるオンラインサービス「GitLab.com」で大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーからデータが誤って削除されたことによって引き起こされました。このインシデントにより、GitLab.comのサービスは数時間にわたり利用できない状態となりました。また、最終的に復旧できなかった本番データの一部も失われました。

  [...]

  本番データを失うことは許容できません。これを二度と起こさないようにするため、当社はGitLab.comの運用および復旧手順について複数の改善に取り組んでいます。

  タイムライン

  UTC 23:00頃：負荷の増加により、当社のPostgreSQLセカンダリのレプリケーションプロセスが遅延し始めました。セカンダリが必要とするWALセグメントがすでにプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリは手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーする作業が含まれます。エンジニアの一人がセカンダリにアクセスしてデータディレクトリを消去し、その後pg_basebackupを実行しました。しかし残念なことに、--verboseオプションを指定していたにもかかわらず、pg_basebackupはハングアップし、意味のある出力を一切行いませんでした。

  UTC 23:30頃：エンジニアの一人は、以前にpg_basebackupを実行しようとした際に、セカンダリのPostgreSQLデータディレクトリ内に何らかのファイルが作成されたのではないかと考えました。通常、このような状況ではpg_basebackupはエラーを出力しますが、そのエンジニアは何が起きているのかあまりよく分かっていませんでした。後になって、その場に居合わせなかった別のエンジニアによって、これが正常な挙動であることが明らかになりました。pg_basebackupは、プライマリがレプリケーションデータの送信を開始するのを待ち、その時まで何も出力せずに黙って待機し続けるのです。残念ながら、このことは当社のエンジニアリング・ランブック（運用手順書）にも、公式のpg_basebackupのドキュメントにも明確には記載されていませんでした。

  レプリケーションプロセスを復元しようとして、あるエンジニアはPostgreSQLのデータベースディレクトリの消去を開始しましたが、それをセカンダリに対して行っていると誤って思い込んでいました。しかし残念なことに、この処理は実際にはプライマリ上で実行されてしまいました。エンジニアはミスに気付いた1〜2秒後にその処理を終了させましたが、その時点で既に約300GBのデータが削除されていました。

  データベースを復元できることを期待して、関係したエンジニアたちはデータベースのバックアップを探し、Slackで助けを求めました。しかし残念ながら、バックアップを見つけることも、それを使用することも完全に失敗しました。

  機能していなかった復旧手順

  pg_dumpを使用したデータベースバックアップ

  pg_dumpのバックアップを探したところ、それらが存在しないことが分かりました。S3バケットは空で、最近のバックアップはどこにも見当たりませんでした。詳しく調べたところ、バックアップ手順ではpg_dump 9.2が使用されていましたが、当社のデータベースはPostgreSQL 9.6で稼働していました（Postgresでは、9.xのリリースはメジャーバージョンと見なされます）。メジャーバージョンが異なると、pg_dumpはエラーを出力してバックアップ手順を終了させてしまいます。

  [...]

  エラーが発生したすべてのcronジョブについては通知が有効になっていますが、これらの通知はメールで送信されます。GitLab.comではDMARCを利用しています。しかし残念なことに、cronジョブのメールではDMARCが有効になっていなかったため、受信側でそれらのメールが拒否されました。これは、バックアップが失敗していることに、手遅れになるまで一度も気付かなかったことを意味します。

  Azureディスクスナップショット

  これらのスナップショットはNFSサーバーでは有効になっていましたが、データベースサーバーでは一切有効になっていませんでした。他のバックアップ手順で十分に賄えると考えていたためです。

  根本原因分析

  これらの問題の根本原因を分析するために、当社は「The 5 Whys（なぜなぜ分析）」と呼ばれる手法を使用します。私たちはこのインシデントを2つの主要な問題、すなわちGitLab.comが停止したことと、GitLab.comの復元に長時間を要したことに分けます。

  問題2：GitLab.comの復元に18時間以上を要した。

  なぜ標準のバックアップ手順を使用できなかったのか？
  - 標準のバックアップ手順では、データベースの論理バックアップを実行するためにpg_dumpを使用します。しかしこの手順は、GitLab.comがPostgreSQL 9.6で稼働しているにもかかわらずPostgreSQL 9.2を使用していたため、エラーを出さずに失敗しました。

  なぜバックアップ手順はエラーを出さずに失敗したのか？
  - 失敗時には通知が送信されていましたが、そのメールが拒否されたため、失敗の兆候は一切ありませんでした。送信側は自動化されたプロセスであり、エラーを報告する他の手段を持っていませんでした。
