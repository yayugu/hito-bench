  俺は先にシャワーを浴びて、部屋のベッドに腰かけていた。

  髪をタオルで適当に拭きながら、さっきの部屋での出来事を反芻する。あかねからの告白。そして俺たちは、正式に恋人同士になったんだ。

  「……まだ、夢を見てるみたいだな」

  思わず呟くと、ドアがそっとノックされた。

  「おにぃ、入るよ」
  「あ、ああ」

  返事をすると、ドアが開いてあかねが部屋に入ってきた。

  湯気と一緒に、甘くて少し切ないようなシャンプーの香りが漂ってくる。
  彼女の姿を見て、俺は思わず息を飲んだ。

  あかねは、湯上がりで火照った肌に、俺のTシャツを一枚だけ羽織っていた。

  「あ、これ……おにぃのTシャツ。自分のパジャマ、鞄の中でぐちゃぐちゃになっちゃってて……ごめん、借りてもいいかな」
  「あ、ああ。もちろんいいけど……なんか、変な感じだな」
  「えへへ。おにぃの匂いがして、なんだか落ち着くよ」

  少し照れくさそうに笑うあかね。
  俺のTシャツは、あかねが着るには少し大きすぎて、裾が太ももの半ばあたりまで来ている。生足が露わになっていて、その足取りはどこか頼りなげで、でも今までで一番色っぽく見えた。
  俺の視線に気づいたのか、あかねが少しだけもじもじと裾を引っ張る。

  「おにぃも、髪をしっかり拭いたほうがいいよ。まだ濡れてる」
  「あ、ああ。そうだな」

  俺は自分の髪を乱雑に拭きながら、ベッドの端にちょこんと座るあかねの隣に腰掛けた。

  二人きりの部屋。親はまだ帰ってこない。
  この密室の状況と、さっきまで唇を重ねていたことの余韻が、甘くもどかしい空気を生み出していた。

  「おい、あかね」
  「……なに、おにぃ」
  「もう一回、言ってくれないか。さっきの……俺のこと、好きだって言ってくれた言葉」

  俺が顔を赤くしながら言うと、あかねも真っ赤な顔で俯いた。

  「ずるいよ、おにぃ。あたしがこんなに緊張してるのに、そんなこと言わないでよ……」
  「ご、ごめん。でも、もう一回聞きたいんだ。さっきのは夢とかじゃなくて、本当なのかなって思って。幼なじみだったあかねが、本当に俺と付き合ってくれてるんだって、実感したくて」

  俺の言葉に、あかねはゆっくりと顔を上げた。湯上がりで潤んだ瞳が、真っ直ぐに俺を見つめる。

  「あたし……おにぃのことが、大好きだよ。ずっとずっと、小鹿村にいた頃から、おにぃのことばかり見てた。だから、今日おにぃとこうして……恋人同士になれて、あたし、すごく幸せ」
  「あかね……」

  その言葉に胸がいっぱいになって、俺は思わずあかねの手を握りしめた。彼女の手は小さくて、少し冷たかった。

  「俺もだ。ずっと、あかねのことが好きだった。幼なじみとしてじゃなくて、一人の女の子として、ずっと惹かれてたんだ」
  「おにぃ……」

  二人の距離が、吸い寄せられるように自然と縮まっていく。
  お互いの体温が伝わってきて、胸の奥の鼓動がどんどん速くなる。

  「髪、乾かしてあげる」

  俺はベッドから立ち上がると、クローゼットから新しいバスタオルを持ってきて、あかねの後ろに回った。

  「え……あ、うん」

  俺のTシャツ越しに、あかねの細い肩が微かに震えているのがわかる。

  タオルで優しくあかねの髪を包み込み、優しく水分を吸い取っていく。

  「痛くないか？」
  「うん……おにぃ、優しいね。なんだか、すごくドキドキしちゃう」
  「俺もだよ。あかねの髪に触れるだけで、胸が苦しくなるくらいドキドキしてる」

  洗いたてのシャンプーの甘い香りが、俺の鼻腔をくすぐって、思考が少しずつとろけていく。
  半乾きになった髪を梳かすように優しく撫でていると、あかねがゆっくりと俺の方を振り向いた。

  「おにぃ……」

  上目遣いで見つめるあかねの瞳は、期待と不安、そして甘い熱を孕んでいる。
  俺はタオルを置くと、そっとあかねの頬に手を添えた。熱を持った柔らかな感触に、俺の理性がきしみを上げる。

  「……あかね」
  「ん……」

  俺はゆっくりと顔を近づけ、あかねの唇にそっと重ねた。

  柔らかくて、甘くて、少しだけ熱い。
  最初はそっと触れるだけだったけれど、すぐにそれだけでは足りなくなって、俺たちはお互いの唇を求めるように深くキスをした。

  「んちゅ……ん……」

  あかねが恥ずかしそうに目を閉じ、俺の首に両手を回して体を預けてくる。
  Tシャツ越しに伝わる柔らかな胸の感触と、あかねの甘い吐息が、俺の理性を少しずつ溶かしていく。

  「あかね……髪、まだ少し濡れてるな」
  「へへ……おにぃのせいだよ。おにぃがこんなにドキドキさせるから」

  唇を離し、荒くなった息を整えながらあかねが小さく笑う。

  「おにぃ……あたし、おにぃとだったら、なんでもできる気がするよ」
  「え……？」
  「だから……今日は、あたしを、おにぃだけの女の子にしてほしいの」

  あかねの甘く囁くような言葉に、俺の頭の中が真っ白になった。
  俺は無言のまま、ゆっくりとあかねをベッドに優しく押し倒した。

  「あかね……俺のこと、好きでいてくれてありがとう。これからも、ずっと一緒にいてくれ」
  「うん。あたしも、おにぃのこと、誰よりも愛してるから……」

  俺たちはもう一度、今までで一番深く、熱いキスを交わした。
  部屋の明かりが、二人の溢れ出す想いと体温を、優しく包み込んでいた。

