response: |-
  Gitの大規模ホスティングは、差分圧縮されたDAG（パックファイル）によるランダムアクセスが多く、単なる分散FSやオブジェクトのDHT化ではネットワーク遅延が致命的です。
  従来のGitHub「Spokes」は、NVMe上のリポジトリを3PC（三層コミット）で複製し強い整合性を確保しましたが、モノレポ等のスケール限界と厳密な状態管理が課題でした。

  本稿の新システム「Continuity」は、S3互換ストレージ上のWAL（先行書き込みログ）を真の情報源とするWALファースト設計です。ローカルのGitリポジトリを単なるキャッシュと割り切り、S3へのCAS操作で更新を線形化します。

  レプリケーションはUDPゴシップで楽観的に行いつつ、読み取り時にS3へETagで条件付きGETを実行します。304（最新）なら即レスポンス、200ならS3から差分同期し「常に強い整合性」を担保します。

  また、重い再圧縮（コンパクション）はプライマリのみ実行し、他ノードはS3から完成パックをダウンロードすることでCPU負荷をネットワーク帯域に置換。これにより、大規模モノレポから無数の小規模リポジトリまで、高い耐久性と整合性を維持したまま優れた水平スケーラビリティを実現しています。
