  『三国BASARAレボリューション』のゲーム内の雰囲気を意識し、派手で熱量の高いバサラ風のテキストに仕上げました。文字数も300文字前後で、義兄弟の契りから最期（神格化）までの生涯を網羅しています。

  ーーー

  **【武将詳細：関羽（雲長）】**

  劉備・張飛と固き義兄弟の契りを交わし、乱世にその武名を轟かせた不世出の豪傑。
  「美髯公」の異名を持ち、戦場で振るわれる愛刀・青龍偃月刀（せいりゅうえんげつとう）の赫赫たる閃きは、敵将・顔良を一閃のもとに屠り、奸雄・曹操すらも震撼させた！

  曹操の厚恩には白馬の戦いで命を賭して報い、己の誇り高き武威と共に荊州の地を守り抜く。
  樊城の戦いにおいて、大水攻めで敵七軍をことごとく沈めた神々しきその在り方は、まさしく「武聖」の名に相応しい！

  しかし、孫権の卑劣なる謀略の前に孤立し、麦城で散るという無念の最期を遂げる。
  されど、その義に篤く孤高なる魂は死してなお神へと昇華され、永遠に戦場の覇道を照らし続けている！

  ーーー
  （文字数：290文字）

  **【調整のポイント】**
  *   **バサラ感:** 「赫赫たる閃き」「震撼させた」「ことごとく沈めた」「卑劣なる謀略」「孤高なる魂」など、大袈裟で重厚な表現（漢字多めの熱いフレーズ）を使用しています。
  *   **生涯の網羅:** 桃園の誓い（義兄弟）→ 顔良討伐（武勇）→ 樊城の戦い（水攻め）→ 麦城での最期 → 関帝（神）としての后世への影響までを無駄なくまとめています。
  *   もしゲーム内でフリガナ（ルビ）を振る場合は、「武聖（ブシドー）」「覇道（クリムゾンロード）」などのように、バサラ特有の当て字ルビを振るのも面白いかもしれません。
