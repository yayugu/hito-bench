  # 神の箱

  探検家の真木が密林で遭難して、七日目のことだった。

  食料は尽き、方位磁針は壊れ、衛星電話はワニに呑まれた。もうだめだ、と倒れ込んだ真木の前に、槍を持った男たちが現れた。文明と接触したことのない部族——噂には聞いていたが、まさか最初の接触相手が行き倒れの日本人とは。

  村に運ばれた真木は、広場の祭壇を見て目を疑った。

  段ボール箱が、うずたかく積まれている。

  長老が空を指し、厳かに語った。言葉は分からないが、身振りで伝わってくる。「箱は空から降ってくる。中には食べ物、刃物、布、あらゆる恵みが入っている。神からの授かり物だ」

  見上げると、密林の上空をドローンの編隊が横切っていく。なるほど、と真木は理解した。配送ドローンが何らかの理由でここに荷物を落としていく。部族はそれを神の恵みとして受け取り、暮らしてきたのだ。祭壇の箱の側面には、あの矢印の笑ったようなロゴが並んでいた。神の御印というわけか。

  真木は缶詰と寝袋を分けてもらい、九死に一生を得た。せめてもの礼にと、祭壇の箱を整理するのを手伝ったときだった。一番古い箱の送り状に、ふと目が留まった。

  宛名——真木達也。住所は、東京の自宅。

  三年前、「商品が届かない」と申告して、返金してもらった登山用テントだった。本当は少しも疑っていなかった。ただ、届くのが遅くて腹が立ったから、嘘をついたのだ。

  長老が箱を指し、にこにこと何かを説いている。おそらくこう言っているのだろう。

  「神は、受け取りを拒まれた恵みを、必要とする者のもとへ運び直すのだ」

  真木はテントの箱に手を合わせた。あの夜ついた嘘が、密林を三年かけて旅して、飢えた自分を待っていてくれた。

  帰国した真木は、以来どんなに配達が遅れても、レビューに星を五つつけている。

  ---

  ## オチの解説

  このオチは三段構えになっています。

  1. **「アマゾン」の二重の意味** — 密林のアマゾンで遭難した男を救うのが、通販のアマゾン(の荷物)だという、お題の同音異義を軸にした構造です。文明未接触の部族が空から降る物資を崇拝するのは、実在した「カーゴ・カルト(積荷信仰)」という現象が下敷きです。

  2. **本当のオチ:自分の嘘との再会** — 祭壇で見つけた最古の箱の宛名が、真木自身。しかも「届いていない」と嘘の申告をして返金させた、後ろめたい荷物です。つまり彼を密林で生かしたのは、かつて自分が「受け取りを拒んだ恵み」だった。因果応報が罰ではなく救いとして返ってくる、という逆転がこの話の核です。

  3. **最後の一行** — 「どんなに遅れても星五つ」は、彼が嘘をついた動機(配達が遅くて腹が立った)への答えになっています。荷物は三年遅れで、しかし確かに届いた——世界一遅くて、世界一正確な配達だった、という余韻で締めています。
