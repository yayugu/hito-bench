  CursorがGitホスティング基盤「Origin」とそのストレージシステム「Continuity」を発表した記事の要約です。

  ## 要約(技術的に面白い部分・約500字)

  Gitのサーバー側スケーリングが難しい根本原因は、データがDAG構造で「次のポインタは前のオブジェクトを取得するまで分からない」ため、分散KVSに載せるとラウンドトリップが爆発する点にある。オブジェクトはpackfile内にランダム配置・delta圧縮されるため、NFSやDRBDなどの分散ファイルシステムも壊滅的に遅い。GitHubのSpokesは「Gitリポジトリをそのままローカ ルNVMeに置き、3PC(三相コミット)でレプリカ間の参照更新を同期する」方式で業界標準になったが、レプリカを増やすほど最遅ノードに律速され、逆に小規模リポジトリにも最低3レプリカ必要という「床が高く天井が低い」問題を抱える。

  CursorのContinuityはS3上のWrite-Ahead Logを唯一の真実とし、ディスク上のリポジトリを「温かいキャッシュ」扱いにすることで合意形成もルーティングテーブルも不要にした。pushの線形化はS3のCAS操作で保証し、レプリケーションは信頼性のないUDPゴシップで楽観的に行うが、読み取り時にETag付き条件付きGET(304なら約10ms)でS3と照合するため常に完全一致性を保つ。「劣化時は常に正しく、健全時は常に速い」設計。compactionはプライマリのみが実行し、レプリカはS3から圧縮済みpackをダウンロードするだけ(CPUを帯域と交換)。100レプリカで読み取りが線形スケールし、S3 Express One Zoneでは300push/秒超を達成している。
