  1月31日のデータベース障害に関するポストモーテム

  2017年1月31日、当社の製品の一つであるオンラインサービス GitLab.com において、大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーからデータを誤って削除したことが原因でした。このインシデントにより、GitLab.com のサービスは何時間にもわたって利用不能となりました。また、一部の本番データが失われ、最終的に復旧することができませんでした。

  [中略]

  本番データの喪失は許容できるものではありません。二度とこのような事態が起こらないよう、私たちは GitLab.com の運用および復旧手順について複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC: 負荷の増大により、PostgreSQL のセカンダリのレプリケーション処理に遅延が発生し始めました。セカンダリが必要とする WAL セグメントがすでにプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.com では WAL アーカイビングを使用していなかったため、セカンダリを手動で再同期する必要がありました。この作業では、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackup を実行してプライマリからセカンダリへデータベースをコピーします。エンジニアの一人がセカンダリに入ってデータディレクトリを消去し、pg_basebackup を実行しました。ところが pg_basebackup は、--verbose オプションを指定していたにもかかわらず、意味のある出力を何も出さないままハングしてしまいました。

  ± 23:30 UTC: エンジニアの一人は、それまでの実行の試みの際に pg_basebackup がセカンダリの PostgreSQL データディレクトリ内に何らかのファイルを作成してしまったのではないかと考えました。通常、そのような場合には pg_basebackup はエラーを出力するのですが、このエンジニアは何が起きているのか確信を持てずにいました。後になって、（その時点では不在だった）別のエンジニアによって、これは正常な動作であることが明らかになります。pg_basebackup はプライマリがレプリケーションデータの送信を開始するのを待つのですが、その時が来るまで何も出力せずに黙って待ち続けるのです。残念ながら、この挙動は当社のエンジニアリング用ランブックにも、pg_basebackup の公式ドキュメントにも、明確には記載されていませんでした。

  レプリケーション処理を復旧させようとして、あるエンジニアは PostgreSQL のデータベースディレクトリを消去する作業に取りかかりました。本人はセカンダリ上で実行しているものと誤って思い込んでいました。しかし残念ながら、この処理はプライマリ上で実行されてしまったのです。エンジニアは間違いに気づいてから1〜2秒後に処理を中断しましたが、その時点ですでに約 300 GB のデータが削除されていました。

  データベースを復元できることを期待して、関係したエンジニアたちはデータベースのバックアップを探しに行き、Slack で助けを求めました。しかし残念ながら、バックアップを見つけることも利用することも、そのプロセスは完全に失敗に終わりました。

  機能していなかった復旧手順

  pg_dump によるデータベースバックアップ

  pg_dump によるバックアップを探しに行ったところ、それが存在しないことが判明しました。S3 バケットは空で、最近のバックアップはどこにも見当たりませんでした。さらに詳しく調べたところ、バックアップ手順では pg_dump 9.2 が使用されていた一方で、当社のデータベースは PostgreSQL 9.6 で稼働していることがわかりました（Postgres では、9.x のリリースはメジャーバージョンとして扱われます）。メジャーバージョンが異なると pg_dump はエラーを出力し、バックアップ処理は中断されます。

  [中略]

  エラーが発生した cronjob については通知が有効になっていますが、これらの通知はメールで送信されます。GitLab.com では DMARC を使用しています。残念ながら、cronjob のメールには DMARC が有効になっておらず、その結果、受信側で拒否されてしまいました。つまり、手遅れになるまで、私たちはバックアップが失敗していることに一切気づけなかったのです。

  Azure ディスクスナップショット

  NFS サーバーでは有効になっていたものの、他のバックアップ手順で十分だと思い込んでいたため、これらのスナップショットはどのデータベースサーバーでも有効になっていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するために、「なぜなぜ分析（The 5 Whys）」と呼ばれる手法を用います。インシデントを2つの主要な問題に分けて考えます。すなわち、GitLab.com がダウンしたこと、そして GitLab.com の復旧に長い時間がかかったことです。

  問題2: GitLab.com の復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使用できなかったのか？
  - 標準のバックアップ手順では、pg_dump を使ってデータベースの論理バックアップを取得します。GitLab.com は PostgreSQL 9.6 で稼働しているのに対し、この手順では PostgreSQL 9.2 が使用されていたため、この処理は静かに（気づかれないまま）失敗していました。

  なぜバックアップ手順は静かに失敗したのか？
  - 失敗時には通知が送信されていましたが、メールが拒否されていたため、失敗の兆候は何もありませんでした。送信者は自動化されたプロセスであり、エラーを報告する他の手段を持っていませんでした。
