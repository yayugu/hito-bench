response: 関羽、字は雲長。若き日に劉備・張飛と桃園で義兄弟の契りを結び、黄巾討伐から乱世を駆ける。曹操に厚遇され、顔良・文醜を斬る武功を立てても、千里を走り劉備の下へ戻った。過五関斬六将の逸話は、その忠義と豪胆さを伝える。赤壁後は荊州を任され、単刀赴会や刮骨療毒でも動じぬ器量を見せる。樊城では水淹七軍で于禁を降し、威震華夏と恐れられた。だが孫権軍の呂蒙に荊州を奪われ、敗走麦城で捕らえられる。最期まで節を曲げず処刑され、その首は孫権から曹操へ送られたが、曹操は敵将ながら厚く葬った。劉備は報復のため夷陵へ出兵し、その死は蜀漢の運命を大きく揺るがす。しかし関羽の忠義は、後世まで武神として語り継がれた。
