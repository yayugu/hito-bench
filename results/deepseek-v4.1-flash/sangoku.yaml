response: 後漢末、河東解良に生まれる。劉備・張飛と桃園の誓いを交わし、義兄弟として黄巾討伐から乱世を駆ける。曹操に敗れ一時麾下に下るも、厚遇され漢寿亭侯に封じられる。しかし劉備への忠義を貫き、五関六将を突破る千里行で駆け戻る。青龍偃月刀と赤兎馬を操り、顔良を斬るなど武勇は天下に轟き、美髯公と称される。劉備の蜀建国を支え、荊州を預かる。樊城では水攻めで于禁らを破るが、孫権の裏切りと呂蒙の奇襲で荊州を失い、麦城へ退却。捕らえられ、関平とともに斬首される。最期まで劉備への義を捨てなかった武神は、死後、関帝として崇められ、今なお義の象徴として語り継がれる。その姿は敵味方から武神と畏れられ、義に生き、義に散る。
