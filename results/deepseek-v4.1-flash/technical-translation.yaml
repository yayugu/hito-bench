  1月31日のデータベース障害のポストモーテム

  2017年1月31日、当社の製品の1つであるオンラインサービスGitLab.comで大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーからのデータの偶発的な削除によって引き起こされました。このインシデントにより、GitLab.comサービスは何時間も利用できなくなりました。また、最終的に復旧できなかった一部の本番データも失いました。

  [...]

  本番データを失うことは容認できません。これが二度と起きないようにするため、GitLab.comの運用と復旧手順に対する複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC：負荷の増加により、PostgreSQLセカンダリのレプリケーション処理が遅れ始めました。セカンダリが必要とするWALセグメントがすでにプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.comはWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーすることが含まれます。エンジニアの1人がセカンダリへ行き、データディレクトリを消去してからpg_basebackupを実行しました。残念ながら、--verboseオプションが設定されていたにもかかわらず、pg_basebackupはハングし、意味のある出力を生成しませんでした。

  ± 23:30 UTC：エンジニアの1人が、おそらく以前の実行試行中にpg_basebackupがセカンダリのPostgreSQLデータディレクトリにいくつかのファイルを作成したのだと考えました。通常、このような場合pg_basebackupはエラーを出力しますが、当該エンジニアは何が起きているのかよく分かっていませんでした。後に別のエンジニア（当時その場にいなかった）によって、これは正常な動作であることが明らかになりました。つまり、pg_basebackupはプライマリがレプリケーションデータの送信を開始するのを待ち、それまで黙って待ち続けます。残念ながら、このことは当社のエンジニアリング用ランブックにも、公式のpg_basebackupドキュメントにも明確に記載されていませんでした。

  レプリケーション処理を復旧しようとして、あるエンジニアが、誤ってセカンダリ上で行っていると思い込みながら、PostgreSQLデータベースディレクトリを消去し始めました。残念ながら、この処理は代わりにプライマリ上で実行されました。そのエンジニアは間違いに気づいてから1、2秒後に処理を終了しましたが、この時点で約300 GBのデータがすでに削除されていました。

  データベースを復旧できることを期待して、関係したエンジニアたちはデータベースバックアップを探しに行き、Slackで助けを求めました。残念ながら、バックアップを見つけることと使用することの両方のプロセスが完全に失敗しました。

  壊れた復旧手順

  pg_dumpを使用したデータベースバックアップ

  pg_dumpバックアップを探しに行ったとき、それらが存在しないことが分かりました。S3バケットは空で、どこにも最近のバックアップは見つかりませんでした。詳しく調べると、バックアップ手順はpg_dump 9.2を使用していた一方、当社のデータベースはPostgreSQL 9.6で稼働していることが分かりました（Postgresでは、9.xリリースはメジャーとみなされます）。メジャーバージョンの違いにより、pg_dumpがエラーを出力し、バックアップ手順が終了します。

  [...]

  エラーになったcronjobには通知が有効になっていますが、これらの通知はメールで送信されます。GitLab.comではDMARCを使用しています。残念ながら、cronjobのメールにはDMARCが有効になっていなかったため、受信者によって拒否されていました。つまり、手遅れになるまで、バックアップが失敗していることに気づきませんでした。

  Azureディスクスナップショット

  NFSサーバーでは有効になっていましたが、他のバックアップ手順で十分だと考えていたため、これらのスナップショットはどのデータベースサーバーでも有効になっていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するために、「なぜなぜ分析」と呼ばれる手法を使用します。インシデントを2つの主要な問題に分けます。GitLab.comがダウンしたこと、およびGitLab.comの復旧に長い時間がかかったことです。

  問題2：GitLab.comの復旧に18時間以上かかりました。

  なぜ標準のバックアップ手順を使用できなかったのか？
  - 標準のバックアップ手順は、データベースの論理バックアップを実行するためにpg_dumpを使用します。この手順は、PostgreSQL 9.2を使用していたため、GitLab.comがPostgreSQL 9.6で稼働しているのに、サイレントに失敗しました。

  なぜバックアップ手順はサイレントに失敗したのか？
  - 失敗時に通知は送信されましたが、メールが拒否されたため失敗の兆候はありませんでした。送信者は自動プロセスであり、エラーを報告する他の手段がありませんでした。
