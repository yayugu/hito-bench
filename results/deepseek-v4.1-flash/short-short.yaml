  「自由研究」

  夏休みの宿題は「アマゾンについて調べる」だった。
  小学三年生の僕は、父のパソコンで「アマゾン」と検索した。
  一番上には、欲しかったゲーム機。
  二番目には、アマゾン川の写真集。
  僕は迷わず、一番上をカートに入れた。

  翌朝、玄関に巨大な箱が置かれていた。
  開けると、湿った風が吹き出し、木と川と蚊が入っていた。
  配達員が涼しい顔で言う。
  「アマゾンです。置き配でお願いします。」

  母が叫んだ。
  「誰がこんなもの注文したの！」
  僕は正直に答えた。
  「アマゾン。」

  伝票にはこう書いてあった。
  「商品名：アマゾン（中古）。状態：良好。返品不可。送料無料。」

  庭はもう、南米だった。
  僕は宿題をやめ、その庭で自由研究を始めた。
  テーマは「通販で買ったアマゾンの生態系」。

  次の日、ピラニアを注文した。
  届いたのは、アマゾン川の水だった。
  「水だけかよ」と文句を言うと、翌日、ピラニアが置き配されていた。

  僕は思った。
  アマゾンは、どこまでいってもアマゾンなのだ。

  ---
  オチ解説：この話は「アマゾン」という言葉が、通販サイトのAmazonと南米のアマゾン（熱帯雨林・アマゾン川）の二つの意味を持つことを利用している。主人公は宿題の「アマゾン」を通販サイトのAmazonで検索し、勢いで「アマゾン」そのものを注文。すると本物のアマゾンが庭に置き配され、最後にはその庭でピラニアまで通販で買ってしまう。企業名と地名の混同が、そのまま非現実的なドタバタとして進行するのがオチ。
