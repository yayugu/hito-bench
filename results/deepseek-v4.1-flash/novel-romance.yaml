  # 第三十四話　シャワーのあと

  浴室のドアが閉まる音がして、俺はベッドの端に腰かけながら、妙に落ち着かない気持ちで天井を見上げていた。

  先にシャワーを浴びさせてもらったのは、単純に俺の方が汗をかいていたからだ。電車を乗り継いで、八月の終わりの蒸し暑い街を歩いて——そんな言い訳じみた理由を頭の中で反芻しながら、俺は自分の手のひらを見つめる。

  （……キス、したよな）

  さっきのことを思い出すだけで、顔が熱くなる。あかねの唇は、想像していたよりもずっと柔らかくて、ほんのりと飴の甘さがした。あれは、新幹線の車内で舐めていたキャンディの味だったのかもしれない。

  「おにぃ、あがったよ」

  脱衣所の方から、少しだけくぐもった声が聞こえた。俺は返事をする代わりに、立ち上がって部屋の中央へと歩く。何をするでもなく、ただ待っていた。

  ガチャリ、とドアが開く。

  「……お、おにぃ、そこにいるの？」

  「ああ、いる」

  「……うん」

  廊下の明かりが、あかねの輪郭をやわらかく照らしていた。俺の部屋着を借りたあかねは、ぶかぶかのTシャツの裾を両手で握りしめている。髪はタオルドライしただけなのか、まだ少し湿っていて、首筋にいくつかの雫が光っていた。

  「……サイズ、合わないよな。ごめん、他に適当なのがなくて」

  「ううん。……あったかい」

  あかねはそう言って、うつむいた。頬が、廊下の明かりのせいだけではないくらい赤い。

  「……おにぃの、においがする」

  「……そりゃ、俺の服だからな」

  「……うん。……なんか、へんなの。ドキドキする」

  顔を上げたあかねと目が合って、俺は思わず息を呑んだ。普段は田んぼのあぜ道を元気に走り回っている幼なじみが、今はこんなに小さく見える。部屋着のTシャツが、彼女の肩をずっと細く見せていた。

  「……あがって、いい？」

  「ああ、どうぞ」

  俺の返事を聞いて、あかねは少しだけ遠慮がちに部屋へ入ってきた。裸足の足音が、フローリングの上で小さく響く。ベッドの端にちょこんと座ると、膝を揃えて、借りたハーフパンツの裾を気にしている。

  「……なんか、落ち着かないね」

  「そうだな」

  「おにぃの部屋なのに、あたしがいるの、へんな感じ」

  「……だな」

  沈黙が降りる。でも、それは嫌な沈黙じゃなかった。窓の外からは、都会の夜の音がかすかに聞こえる。遠くを走る車の音、どこかのビルの空調の音。小鹿村では決して聞こえなかった音たち。

  「……おにぃ」

  「ん？」

  「さっきの……」

  あかねは膝の上で指を組んだりほどいたりしながら、消え入りそうな声で言う。

  「……キス、したよね」

  「ああ」

  「……夢じゃ、ないよね？」

  俺はあかねの隣に座った。ベッドが、ぎしりと小さく鳴る。肩と肩が、触れるか触れないかの距離。

  「夢じゃない」

  「……ほんと？」

  「ほんとだ」

  あかねが、そっと俺の腕に自分の指先を触れさせた。冷たい、シャワーのあとの指先。

  「……おにぃの腕、太いね」

  「そうか？」

  「うん。……小さい頃は、あたしと同じくらいだったのに」

  「もう六年も経ってるからな」

  「……六年」

  あかねはその言葉を、噛みしめるように繰り返す。

  「あたし、ずっとおにぃのこと、覚えてたよ。小鹿村の、あの夏のこと。一緒に川で遊んだこと。おにぃが東京に行っちゃうって聞いた時、すごく泣いたこと」

  「……俺も、覚えてる」

  「うそ。おにぃ、東京でたくさん友達できたんでしょ」

  「友達はできたけど……あかねのこと、忘れたことなんて一度もない」

  それは、本当だった。忙しい高校生活の中でも、ふとした瞬間に思い出すのは決まって、田んぼのあぜ道を走る小さな女の子の後ろ姿だった。あの頃はそれが恋だなんて、気づきもしなかったけれど。

  「……おにぃ」

  あかねが、俺の肩に頭を預けてきた。湿った髪から、シャンプーの匂いがする。俺の使っている、安いやつだ。

  「……あたし、おにぃのこと、好き」

  「ああ」

  「……返事、それだけ？」

  「……俺も、好きだ」

  「……うん」

  あかねが、小さく笑った。顔は見えなかったけど、声だけでわかった。それは、小鹿村で一緒に遊んでいた頃と同じ、無邪気な笑い声だった。

  「……ねえ、おにぃ」

  「ん？」

  「……もう一回、キス、していい？」

  俺は答えの代わりに、あかねの顔をそっと持ち上げた。目を閉じたあかねのまつげが、少しだけ震えている。さっきよりも、ずっと近くに彼女の気配を感じた。

  唇が触れ合う、その寸前。

  「……おにぃの、ドキドキ、うつった」

  「……なにが」

  「……心臓の音。あたしと同じくらい、うるさい」

  「……そりゃ、そうだろ」

  「……ふふっ」

  あかねの笑った息が、俺の唇をくすぐった。そのまま、二度目のキスをした。一度目よりも、ずっと長くて、ずっと優しいキスだった。

  窓の外で、遠くの電車が走り去る音がした。都会の夜は、まだ始まったばかりだった。
