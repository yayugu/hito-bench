  ### お届け予定日

  母の命日に、酔ってアマゾンの検索窓へ「母に会いたい」と打ち込んだ。

  商品は出なかった。代わりに通知が一つ現れた。

  《お客様に関する、未発送のご注文があります》

  注文日は二十年前。母が死ぬ三日前だった。

  詳細を開くと、呼び鈴が鳴った。

  玄関には紺色の制服を着た配達員が立っていた。

  「お迎えです」
  「僕、何も買ってませんけど」
  「はい。今回は商品ですので」

  差し出された端末には、母の名前があった。

  僕は靴を履いた。

  玄関を出ると、そこは病室だった。

  母はベッドに起き上がっていた。写真よりずっと痩せている。でも、僕を見るなり笑った顔は、覚えていたとおりだった。

  「大きくなったねえ」

  話したいことは山ほどあった。結婚したこと。離婚したこと。料理を覚えたこと。けれど母は、そんな話をする隙も与えずに訊いた。

  「ご飯、食べてる？」
  「食べてるよ」
  「そう」

  母はそれだけで満足したように頷いた。

  配達員が、そっと時計を指した。

  戻った玄関で僕が泣いていると、端末が差し出された。

  「受領の確認をお願いします」

  画面には、母の注文が表示されていた。

  商品名は、〈二十年後も生きている息子〉。

  その下に、たったいま投稿されたレビューがあった。

  ★★★★★  
  安心しました。これなら、明日でも大丈夫です。

  ---

