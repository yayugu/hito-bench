response: |-
  Gitの大規模ホスティングが難しいのは、履歴のDAGを順にたどる論理アクセスと、packfile内の差分圧縮を復元する物理アクセスが重なり、ネットワーク越しの読み出しが高コストになるためだ。オブジェクト単位の分散KV化も、ファイルシステムの分散化も、この構造が壁になる。

  Cursorの「Continuity」は、通常のGitリポジトリを高速なローカルNVMeに置きつつ、正本をS3上の先行書き込みログ（WAL）に移す。pushは永続化後、ログ索引をCASで原子的に更新して順序を確定する。各ノードのリポジトリは再構築可能なキャッシュとなり、複製間の合意処理や配置管理表への依存をなくす。

  おもしろいのは、複製通知には信頼性を保証しないUDPを使いながら、読み出し時にS3へETag付きの条件付きGETを行い、遅れていれば追いついてから応答する点だ。通知の信頼性と読み出しの整合性を切り離している。さらに、重い再圧縮はプライマリだけで行い、他の複製は完成済みpackfileを取得する。これによりCPU負荷を抑え、巨大リポジトリの多数複製から、休眠リポジトリのローカル複製ゼロまで対応する。
