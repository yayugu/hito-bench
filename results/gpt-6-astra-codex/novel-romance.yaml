  　隣から画面を覗くあかねが、ときどき俺の顔を見て笑う。そのたびに予定の話が止まって、またふたりで照れた。

  　次に会える日は、まだ少し先だった。

  　それでも、カレンダーに入れた『おにぃに会う』の文字を、あかねは何度も確かめていた。

  「楽しみ」

  「まだ、ここにいるだろ」

  「今日が楽しいから、次も楽しみなの」

  　俺は繋いだ手を握り直した。

  「俺も」

