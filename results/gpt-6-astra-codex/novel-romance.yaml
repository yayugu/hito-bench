  ### 第34話　恋人になって、最初の約束

  　洗面所のドアが開いた瞬間、俺はテレビのリモコンを取り落とした。

  「……おにぃ？」

  「お、おう。おかえり」

  「お風呂から出ただけだよ？」

  　あかねが笑う。

  　いつもの笑い方だった。それなのに、俺はうまく顔を見られない。

  　さっき、この子に好きだと言われた。

  　俺も好きだと伝えて、キスをした。

  　つまり、いま目の前にいるあかねは。

  「なに、その顔」

  「いや」

  「変なの」

  　俺の彼女、なのだ。

  　頭の中で言葉にしただけで、どうしてこんなに落ち着かなくなるんだ。

  「お水、もらってもいい？」

  「ああ。いま出す」

  　立ち上がって、冷蔵庫を開ける。コップを二つ並べていると、あかねが横から覗きこんできた。

  「おにぃのも？」

  「うん」

  「さっきも飲んでなかった？」

  「喉、渇くんだよ」

  「あたしも」

  　小さな声だった。

  　顔を向けると、あかねは俺ではなく、空のコップを見ていた。

  「あたしばっかり緊張してるのかと思った」

  「……そんなわけないだろ」

  「そっか」

  　それだけで、あかねは嬉しそうにした。

  　コップに水を注ぐ。いつもより慎重にやったのに、少しだけこぼれた。

  　　　　　＊

  　リビングに戻ると、あかねはソファの端に座った。

  　俺は反対側に座ろうとして、途中で止まった。

  「そこなの？」

  「え？」

  「おにぃの席」

  　あかねが、自分の隣をぽん、と叩く。

  「……そっちでいいのか」

  「そっちがいいの」

  　言ってから、あかねはコップを両手で持ち直した。

  「何回も言わせないでよ」

  「悪い」

  　隣に腰を下ろす。

  　近い。

  　いや、村ではもっと雑に隣に座っていた。縁側でアイスを食べたときなんか、扇風機の風を取り合って、肩がぶつかっていたくらいだ。

  　あのとき、俺はどうやって普通に喋っていたんだろう。

  「テレビ」

  「ああ、つけるか」

  「ううん。さっきから同じ画面だなって」

  　画面には、動画を再生する前のメニューが出たままだった。

  　俺はリモコンを持ち上げた。

  「なにか見る？」

  「おにぃ、ちゃんと見られる？」

  「……自信ない」

  「あたしも」

  　ふたりで笑って、結局、テレビは消した。

  　急に静かになった部屋で、あかねがコップをテーブルに置く。

  「あのね」

  「うん」

  「もう一回、聞いてもいい？」

  　その真剣な声に、背筋が伸びた。

  　あかねは膝の上で指を組んで、ほどいてから、俺を見た。

  「あたしたち、付き合ってるんだよね」

  「……うん」

  「おにぃが、あたしの彼氏？」

  「そう、なるな」

  「そっか」

  　あかねはうつむいた。

  　口元が、どうしようもなく緩んでいた。

  「そっかぁ」

  「そんなに確認することか？」

  「するよ。だって、ずっとなりたかったんだもん」

  　返事が出てこなかった。

  　あかねがこちらを見る。

  「おにぃは？」

  「俺？」

  「あたしが彼女で、どう？」

  　そんなの、聞かなくたって。

  　そう思ったけれど、俺だってさっきから、言葉にされるたびに嬉しくなっている。

  「……嬉しいよ」

  「どれくらい？」

  「いま、なに喋ればいいかわからなくなるくらい」

  　あかねは一瞬きょとんとして、それから笑った。

  「あたしも、それくらい」

