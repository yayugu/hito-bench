  関羽、字は雲長。長く美しい髯と並ぶ者なき武勇から「美髯公」と称された義の武人。劉備、張飛と桃園で義兄弟の契りを結び、乱世を鎮める志のもと各地を転戦した。一時は曹操のもとに身を置き、白馬で顔良を斬る功を立てるも、厚遇に心を動かされることなく劉備のもとへ帰参。劉備の入蜀後は荊州を託され、その重鎮として一軍を率いた。樊城攻めでは水勢に乗じて于禁の軍を破り、龐徳を斬って天下に威名を轟かせる。しかし、呂蒙の急襲で荊州を失い、孤立して麦城へ敗走。再起を図る途上で捕らえられ、孫権に処刑された。志半ばで倒れるも、その忠義と武勇は語り継がれ、後世には「関帝」として広く崇敬を集めた。

  ※『三国志演義』準拠。[最期の経緯の参考](https://sangokushi.jp/battles/樊城の戦い)
