  関羽、字は雲長。河東郡解県に生まれ、若くして劉備に従い、張飛とともに乱世を駆けた義の猛将。長く美しい髭と並外れた武勇で知られる。曹操との戦いに敗れて捕らわれると、厚遇に報いて敵将・顔良を討ち取るが、劉備への忠義は揺るがず、その居場所を知るや曹操のもとを去った。劉備が益州を得た後は荊州の守りを託される。219年、樊城を攻め、洪水に乗じて于禁の軍を破り、その威名は中原を震わせた。しかし、背後から孫権軍の急襲を受けて荊州を失い、麦城へ敗走。脱出を図るも捕らえられ、子の関平とともに処刑された。死後は忠義の象徴として神格化され、「関帝」として今も広く信仰を集めている。

  参考：[コトバンク「関羽」](https://kotobank.jp/word/%E9%96%A2%E7%BE%BD-48450)
