  1月31日に発生したデータベース障害の事後検証

  2017年1月31日、当社の製品の一つであるオンラインサービス「GitLab.com」で大規模なサービス障害が発生しました。原因は、プライマリデータベースサーバーのデータを誤って削除したことでした。このインシデントにより、GitLab.comは長時間にわたって利用できなくなりました。また、本番環境のデータの一部が失われ、最終的に復旧できませんでした。

  [...]

  本番環境のデータを失うことは、あってはならないことです。再発を防ぐため、GitLab.comの運用および復旧手順について、複数の改善に取り組んでいます。

  時系列

  UTC 23:00頃：負荷の増加により、PostgreSQLのセカンダリサーバーでレプリケーション処理に遅延が生じ始めました。セカンダリが必要とするWALセグメントがプライマリからすでに削除されていたため、レプリケーションが失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。この作業では、セカンダリの既存のデータディレクトリを削除し、pg_basebackupを実行して、プライマリからセカンダリへデータベースをコピーします。エンジニアの一人がセカンダリに接続してデータディレクトリを削除し、pg_basebackupを実行しました。しかし、--verboseオプションを指定していたにもかかわらず、pg_basebackupは有用な情報を出力せず、処理が止まったような状態になりました。

  UTC 23:30頃：エンジニアの一人は、それまでの実行試行で、pg_basebackupがセカンダリのPostgreSQLデータディレクトリ内に何らかのファイルを作成したのではないかと考えました。通常、この場合はpg_basebackupがエラーを出力しますが、そのエンジニアは何が起きているのか確信を持てずにいました。後になって、その場にいなかった別のエンジニアから、これは正常な動作であることが明らかになりました。pg_basebackupは、プライマリがレプリケーションデータの送信を開始するまで、何も出力せずに待機するのです。残念ながら、この動作は社内のエンジニア向け運用手順書にも、pg_basebackupの公式ドキュメントにも明確に記載されていませんでした。

  レプリケーション処理を復旧しようとして、あるエンジニアがPostgreSQLのデータベースディレクトリの削除を進めました。セカンダリ上で作業しているつもりでしたが、誤ってプライマリ上で実行していました。エンジニアは間違いに気づいてから1〜2秒後に処理を停止しましたが、その時点ですでに約300GBのデータが削除されていました。

  担当のエンジニアたちは、データベースを復元できることを期待してバックアップを探し、Slackで支援を求めました。しかし、バックアップを見つけることも、利用することも、まったくうまくいきませんでした。

  機能しなかった復旧手順

  pg_dumpによるデータベースバックアップ

  pg_dumpによるバックアップを探したところ、存在しないことがわかりました。S3バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調べると、データベースはPostgreSQL 9.6で稼働しているのに、バックアップ処理ではpg_dump 9.2を使用していたことが判明しました。Postgresでは、9.xの各リリースはメジャーバージョンとして扱われます。メジャーバージョンが異なるため、pg_dumpがエラーを出力し、バックアップ処理が終了していました。

  [...]

  cronジョブでエラーが発生した場合の通知は有効になっていましたが、通知はメールで送信されます。GitLab.comではDMARCを使用しています。しかし、cronジョブからのメールにはDMARCが有効になっておらず、受信側で拒否されていました。そのため、手遅れになるまでバックアップの失敗に気づきませんでした。

  Azureのディスクスナップショット

  NFSサーバーではスナップショットを有効にしていましたが、データベースサーバーでは一台も有効にしていませんでした。他のバックアップ手順で十分だと考えていたためです。

  根本原因分析

  これらの問題の根本原因を分析するために、「なぜなぜ分析」と呼ばれる手法を用います。インシデントを、GitLab.comが停止したことと、GitLab.comの復旧に長時間を要したことの二つの主要な問題に分けます。

  問題2：GitLab.comの復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を利用できなかったのか？

  - 標準のバックアップ手順では、pg_dumpを使用してデータベースの論理バックアップを行います。GitLab.comはPostgreSQL 9.6で稼働しているのに、この手順ではPostgreSQL 9.2を使用していたため、失敗が認識されないままになっていました。

  なぜバックアップ手順の失敗が認識されなかったのか？

  - 失敗時には通知が送信されていましたが、メールが拒否されていたため、失敗を把握する手がかりがありませんでした。送信元は自動化されたプロセスであり、エラーを報告するための他の手段がありませんでした。
