  1月31日のデータベース障害のポストモーテム

  2017年1月31日、私たちは製品の一つであるオンラインサービスGitLab.comにおいて大規模なサービス障害を経験しました。この障害は、プライマリデータベースサーバーからのデータの誤削除によって引き起こされました。このインシデントにより、GitLab.comのサービスは長時間にわたり利用できなくなりました。また、一部の本番データを失い、最終的に復旧することができませんでした。

  [...]

  本番データを失うことは許されることではありません。このようなことが二度と起こらないようにするため、GitLab.comの運用および復旧手順に対して複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC： 負荷の増加により、PostgreSQLセカンダリのレプリケーションプロセスが遅延し始めました。セカンダリが必要とするWALセグメントがプライマリから既に削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーすることが含まれます。エンジニアの一人がセカンダリにアクセスしてデータディレクトリを削除し、pg_basebackupを実行しました。しかし残念ながら、--verboseオプションを設定していたにもかかわらず、pg_basebackupはハングし、有意義な出力を何も生成しませんでした。

  ± 23:30 UTC： エンジニアの一人は、以前の実行試行の際にpg_basebackupがセカンダリのPostgreSQLデータディレクトリに何らかのファイルを作成したのではないかと考えました。通常、その場合pg_basebackupはエラーを出力しますが、当該エンジニアは状況をよく理解できていませんでした。後に（その場にいなかった）別のエンジニアによって、これが正常な動作であることが明らかにされました。すなわち、pg_basebackupはプライマリがレプリケーションデータの送信を開始するのを待ち、その時まで黙って待機し続けるのです。残念ながら、このことは当社のエンジニアリングランブックにも、pg_basebackupの公式ドキュメントにも明確に記載されていませんでした。

  レプリケーションプロセスを復旧しようとして、あるエンジニアはセカンダリに対して行っているものと思い込み、PostgreSQLのデータベースディレクトリを削除しました。しかし残念ながら、この操作はプライマリに対して実行されてしまいました。エンジニアはミスに気づいてから1、2秒後にプロセスを停止しましたが、その時点で約300GBのデータが既に削除されていました。

  データベースを復旧できることを期待して、関係したエンジニアたちはデータベースのバックアップを探しに行き、Slackで助けを求めました。しかし残念ながら、バックアップの発見と利用の両方のプロセスが完全に失敗しました。

  機能しなかった復旧手順

  pg_dumpによるデータベースバックアップ

  pg_dumpのバックアップを探しに行ったところ、それらが存在しないことがわかりました。S3バケットは空で、どこにも最近のバックアップは見つかりませんでした。詳しく調査したところ、バックアップ手順がpg_dump 9.2を使用していたのに対し、データベースはPostgreSQL 9.6で動作していることが判明しました（Postgresでは9.xのリリースはメジャーと見なされます）。メジャーバージョンの違いにより、pg_dumpはエラーを出力し、バックアップ手順は中断されてしまいます。

  [...]

  エラーが発生したcronジョブについては通知が有効になっていますが、これらの通知はメールで送信されます。GitLab.comではDMARCを使用しています。残念ながら、cronジョブのメールに対してDMARCが有効になっていなかったため、受信者側で拒否されていました。つまり、手遅れになるまでバックアップが失敗していることに全く気づかなかったのです。

  Azureディスクスナップショット

  これらのスナップショットはNFSサーバーに対しては有効になっていましたが、他のバックアップ手順で十分だと考えていたため、データベースサーバーには一切有効にしていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するために、「なぜなぜ5回」と呼ばれる手法を用います。このインシデントを、GitLab.comがダウンしたことと、GitLab.comの復旧に長い時間がかかったことという2つの主要な問題に分けて考えます。

  問題2：GitLab.comの復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使用できなかったのか？
  - 標準のバックアップ手順では、pg_dumpを使用してデータベースの論理バックアップを行います。この手順はPostgreSQL 9.2を使用していたのに対し、GitLab.comはPostgreSQL 9.6で動作していたため、密かに失敗していました。

  なぜバックアップ手順は密かに失敗したのか？
  - 失敗時には通知が送信されていましたが、メールが拒否されていたため、失敗の兆候がありませんでした。送信者は自動化されたプロセスであり、エラーを報告する他の手段がありませんでした。
