  Gitホスティングが難しいのはpackfile＋DAG構造ゆえ。オブジェクトはSHAで引けるが、履歴操作はコミット→ツリー→親と逐一ポインタを辿るため分散KVS化すると往復が爆発する。ディスク上もサイズ最適のデルタ圧縮・ランダム配置で、NFSやブロックレプリケーションと極端に相性が悪い。

  GitHubのSpokesは素のGitをNVMeに置きpackfile単位で3重化、pushはpackばら撒き＋参照更新だけ3PCで合意し強い一貫性を確保した。どのレプリカ読みも安全だが、3PCは最遅ノード律速で台数増でpushが劣化。巨大monorepoの上限、エージェント量産の小規模repoの下限ともに硬い。

  CursorのContinuityはS3をWAL兼truthにする。push毎pack追記＋CASで線形化し、サーバはステートレス、rendezvous hashで配置、UDPゴシップ＋ETag条件GETで楽観追従し読み時に必ず検証する。repackはprimaryのみ実行し配布。読みは100台まで線形、pushは120/秒(Standard)/300超(Express)を達成。
