  第34話　シャワー上がりの幼なじみがかわいすぎる

  「じゃ、じゃあ俺、先に浴びてくるな」

  声が裏返ったのが自分でもわかった。最悪だ。
  ついさっきまで、あかねとキスをしていたリビング。ソファに並んで座って、繋いだ手は汗でしっとりして。付き合おうって、言葉にしたばかりで。
  そんな雰囲気のまま「シャワー、どうする？」なんて、俺が言い出したんだ。馬鹿だろ、俺。

  「う、うん。お先にどうぞ、おにぃ」

  あかねは顔を真っ赤にして、膝の上で小さくなっていた。さっきのキスの余韻か、唇が少しだけ赤い。その光景だけで心臓がうるさくて、俺は逃げるみたいに脱衣所に駆けこんだ。

  シャワーのお湯を頭からかぶる。ざあっという音が、やけに大きく響く。
  落ち着け、落ち着けって。あかねが来てくれて、付き合うことになって、キスまでして。夢みたいな一日だ。夏に村で再会してから、ずっとあかねのことばかり考えていた。東京で離れていても、LINEを見るたびに笑って。今日のデートも、手を繋いだだけで舞い上がって。
  ……それが、いま家に二人きりだ。親父もお袋も今日は帰ってこない。時計は夜の九時を過ぎてる。

  「やばいって」

  壁に向かって小さく呟いた。嬉しいのと、緊張と、変なソワソワと。お湯で流せるわけがない。

  手早く済ませて、着替えてリビングに戻る。さすがにパジャマというか、Tシャツとスウェットだ。髪は半乾きのままタオルを首にかけた。
  あかねはソファの端で、借りたタオルと――俺のTシャツと短パンを大事そうに抱えて待っていた。俺の服、さすがにあかねには大きい。そんなのわかってたのに、渡すとき手が震えた。

  「あ、ありがと。じゃ、あたし、行ってくるね」

  立ち上がったあかねと目が合う。ほんの一瞬だったのに、ぱっと逸らされた。耳まで赤い。

  「あ、ああ。ゆっくりでいいぞ。シャンプー、そこにあるから」

  「うん」

  ぺたぺた、とスリッパの音が脱衣所に消えていく。ガチャ、と扉が閉まる音。しばらくして、シャアア、と水の音が聞こえ始めた。

  ――来てる。うちに、あかねがいる。シャワーを浴びてる。

  ソファに座り直して、膝の上で手を組む。テレビもつけない。部屋は静かで、水の音だけがかすかに聞こえる。タオルの匂い。さっきのあかねの温もり。唇の感触。
  思い出して、また顔が熱くなる。いいのかな、俺なんかで。あかねは村のアイドルみたいな子で、可愛くて、真っ直ぐで。高三の俺なんかより、よっぽどしっかりしてて。
  でも、あかねが選んでくれたんだ。「おにぃが好き」って、泣きそうな顔で言ってくれたんだ。

  待っている十五分が、やけに長かった。いや、実際は十分も経ってないかもしれない。水の音が止んで、ドライヤーの低い音がして。また静かになって。
  それから、そっと扉が開いた。

  「……お、お待たせ、おにぃ」

  振り向いて、俺は固まった。

  あかねが立っていた。濡れた黒髪をタオルで拭きながら。大きめの俺の白Tシャツは肩のところで少しずれて、鎖骨が見えて。袖を二回くらい折ってるのがわかる。短パンの裾から、すっと伸びた白い足。
  やばい。可愛すぎる。反則だろ、それ。

  「ど、どう？　ぶかぶか、だよね……」

  あかねは裾をぎゅっと握って、もじもじしている。上目遣いでこっちを見る。その頬はお風呂上がりでほんのり桜色で、目がしっとり潤んでて。

  「……か、可愛い」

  本音が漏れた。隠す気もなかった。

  「もぉ……おにぃったら」

  あかねは唇を尖らせたけど、嬉しそうに笑った。それから、ゆっくりこっちに歩いてきて、俺の隣にちょこんと座る。シャンプーのいい匂いがふわりとした。俺と同じ匂いなのに、あかねから香ると全然違う。

  しばらく、二人とも黙っていた。くっつきそうでくっつかない距離。ソファが軋む。

  「ねえ、おにぃ」

  「ん？」

  「……手、繋いでいい？」

  そんなの、いいに決まってる。俺は黙って右手を差し出した。あかねの小さな手が、そっと重なる。指と指を絡める。さっきより温かい。

  「あたしさ、今日ずっとドキドキしてた。電車で東京来るときも、デートのときも。でも、いまが一番ドキドキしてる」

  「俺もだよ。心臓、うるさくて眠れなそう」

  笑い合う。少しだけ力が抜けた。

  あかねが、俺の肩にそっと頭を預けてきた。重さなんてない。温かいだけ。

  「おにぃの匂いがする。おっきいTシャツも、なんだか包まれてるみたいで安心する」

  「そっか」

  俺はゆっくりと、あかねの肩に腕を回した。ぎこちない。でも、あかねは嫌がらないで、むしろぎゅっと俺の服を掴んだ。

  正面から向き合う。近い。あかねの長いまつげが震えている。さっきキスした唇が、また俺を見ている気がして、喉が鳴った。

  「あかね。……キス、してもいい？」

  付き合いたてなのに、何回訊くんだって話だけど。大事にしたいから、訊きたかった。

  あかねはこくんと頷いて、目を閉じた。その素直さが愛おしくてたまらない。俺はそっと顔を近づけて、唇を重ねた。
  触れるだけの、優しいキス。シャワーの後のせいか、唇が少し冷たくて、柔らかい。離して、もう一度。あかねの手が俺の胸のところでTシャツを握りしめる力が強くなる。

  「ん……おにぃ……あったかい」

  額と額をくっつけて、小さく笑い合う。恥ずかしいのに、離れたくない。繋いだ手に力を込める。

  何もすごいことはしてない。ただ隣にいて、手を繋いで、キスをして。でも、夏の村で笑っていたあかねが、いま俺の家で、俺の服を着て、俺に寄りかかってくれている。それが嬉しくて、胸がいっぱいになった。

  「あかね、可愛すぎるよ。俺、どうにかなりそう」

  「あたしも、おにぃが好きすぎてどうにかなりそうだよ」

  くすぐったいみたいに笑って、あかねがもう一度ぎゅっと抱きついてきた。ドライヤーで乾かした髪がさらさらして、頬にくっつく。

  外は静かな東京の夜。でもこの部屋だけ、甘くて温かい時間がゆっくり流れていた。
