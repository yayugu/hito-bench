response: 河東郡解県の出身、字は雲長。劉備・張飛と桃園で義兄弟の誓いを結び、乱世に身を投じた豪傑。長躯・美髯をたたえられた「美髯公」であり、赤兎馬を駆って青龍偃月刀を振るう姿は鬼神の如し。汜水関で華雄を、官渡で顔良・文醜を斬り、一時曹操に降っても忠節は揺るがず千里行で帰参。赤壁後は荊州督となり、五虎大将軍の筆頭に列せられた。樊城を水攻めで落とし于禁を降して龐徳を斬り、威は華夏に震えた。だが傲りと油断を突かれ、呉・呂蒙の白衣渡江で背後を断たれて麦城に孤立。降伏を拒み、子・関平と共に捕らえられ斬られた。義に生き義に死した武聖は、後に「関聖帝君」として神に祀られた。
