response: 劉備、張飛と桃園で義兄弟の契りを結び、終生蜀漢を支えた忠義の武神。字は雲長、河東郡解の出身。黄巾討伐以来常に劉備の側近として戦い、一時曹操に身を寄せるも恩賞を捨てて千里を駆け主に帰参。白馬で顔良・文醜を斬り、赤壁後は荊州の守将となる。愛馬赤兎、青龍偃月刀を携え、樊城攻めでは水攻で于禁七軍を降し龐徳を処断、その威名は華夏を震撼させ関羽を前には魏呉も遷都・襲撃を余儀なくされた。しかし荊州支配に慢心し呉と決裂、呂蒙の奇襲に後方を突かれ、糜芳・傅士仁の裏切りもあり麦城で捕縛され、親子共に処刑された。死後は忠義の化身として神格化され、武聖・関聖帝君として今日まで敬愛される。
