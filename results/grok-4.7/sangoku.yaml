response: 関羽、字は雲長。河東郡解の人。若き日より武勇に優れ、劉備・張飛と桃園に義兄弟の契りを結んでからは、その盟約を命より重んじた。長身に美髯、愛用の青龍偃月刀を振るえば万夫不当。曹操に敗れて主君と離散し、一度は敵陣に身を置くも忠心は変わらず、白馬の戦いで顔良を一刀のもとに斬り、恩義を返して劉備のもとへ帰った。のち荊州の守将となり、建安二十四年、樊城を攻めて于禁率いる七軍を大水に沈め、龐徳を討って威名を天下に轟かせる。しかし呉将呂蒙の調略と急襲により荊州を奪われ、麦城に孤立。援軍は届かず捕らえられて臨沮に送られ、孫権の前で降伏せず、同年十二月に処刑された。死後は関帝と崇められ、義の象徴として今も語り継がれている。
