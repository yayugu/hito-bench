  美咲はスマホの画面を見つめていた。検索窓に「幸せ」と打ち込み、出てきた商品を迷わずカートに入れた。

  「アマゾンなら、本当に何でも届くのよ」と彼女はつぶやいた。

  翌日、玄関に小さな箱が届いた。テープを丁寧に剥がし、蓋を開ける。中には一枚の白い紙だけが入っていた。大きく「幸せ」と印刷され、その下に小さな文字でこう書かれていた。

  「本商品はお客様の心に直接作用します。効果を実感できない場合も返品はお受けできません。なお、梱包材の段ボールは森林資源を使用しております。」

  美咲は紙を手に取り、しばらく眺めたあと、静かに笑った。そしてその紙を冷蔵庫に磁石で貼り、いつものようにコーヒーを淹れ始めた。

  ---

  オチは、美咲が本気で「幸せ」という商品を注文し、届いたのがただ「幸せ」と書かれた紙切れだったという点にあります。期待していた何らかの実感や変化ではなく、文字そのものが配達されることで、通販の「何でも売っている」という謳い文句を文字通りに突き放した皮肉になっています。彼女がそれを笑って受け入れることで、幸せとは外部から届くものではなく、自分で意味づけするものだという余韻も残しつつ、主なツイストは「注文通りのものが、期待を裏切る形で届いた」というすれ違いにあります。
