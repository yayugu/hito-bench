response: |-
  Gitを大規模にホストする難しさは、packfileがランダム配置とデルタ圧縮の塊であり、DAGの歩行が前のオブジェクトを読むまで次のキーが分からない点にある。オブジェクト単位の分散KVやNFS/DRBDは、この逐次アクセスとプロトコルが要求するpackfile送受信の両方で破綻した。

  GitHubのSpokesはpackfile単位で実リポジトリをNVMeに複製し、参照更新だけ3PCで強整合にする。ただし遅延は最遅ノードに縛られ、巨大モノレポにはレプリカが足りず、大量の使い捨て小リポジトリには3複製の床が高すぎる。ディスク上の複製が真実なので、配置表・チェックサム・修復が必須で運用も重い。

  CursorのContinuityはS3のWALを唯一の真実にし、ローカルGitは温キャッシュに過ぎない。pushはpackをディスクとS3へ同時書きし、ローカルで参照トランザクションを準備してWAL indexをCAS更新したときだけ可視化し、線形化する。配置はrendezvous hashing、選挙は不要で任意ノードがprimaryになれる。複製はUDP gossipの楽観通知だが、読みはETag付き条件GETでS3と照合するため、パケット損失時も整合する。compactionはprimaryだけが行い、他は圧縮済みpackを取得する。レプリカ数は自由に伸ばせ、遊休リポジトリは消してWALから再物質化できる。
