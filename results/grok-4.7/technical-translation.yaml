  2017年1月31日のデータベース障害に関する事後分析

  2017年1月31日、当社の製品の1つであるオンラインサービス GitLab.com で、大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーからデータが誤って削除されたことが原因でした。このインシデントにより、GitLab.com のサービスは何時間も利用できなくなりました。また、一部の本番データが失われ、最終的に復旧できませんでした。

  [...]

  本番データの喪失は容認できません。このような事態が二度と起こらないようにするため、GitLab.com の運用および復旧手順に関する複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC：負荷の増加により、PostgreSQL セカンダリのレプリケーションプロセスが遅延し始めました。セカンダリが必要とする WAL セグメントがプライマリからすでに削除されていたため、レプリケーションは失敗しました。GitLab.com では WAL アーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackup を実行してプライマリからセカンダリへデータベースをコピーすることが含まれます。エンジニアの1人がセカンダリにアクセスしてデータディレクトリを消去し、その後 pg_basebackup を実行しました。しかし残念ながら、--verbose オプションを設定していたにもかかわらず、pg_basebackup は意味のある出力を一切出さずにハングしました。

  ± 23:30 UTC：エンジニアの1人が、以前の実行時に pg_basebackup がセカンダリの PostgreSQL データディレクトリ内にいくつかのファイルを作成したのかもしれないと考えました。通常、このような場合には pg_basebackup がエラーを表示しますが、当該エンジニアは何が起きているのか確信が持てませんでした。後に、その場にいなかった別のエンジニアによって、これは正常な動作であることが明らかになりました。pg_basebackup はプライマリがレプリケーションデータの送信を開始するのを待ち、その時点まで何も出力せずに待機し続けます。残念ながら、これは当社のエンジニアリング用ランブックにも、公式の pg_basebackup ドキュメントにも明確に記載されていませんでした。

  レプリケーションプロセスを復旧しようとして、エンジニアは PostgreSQL のデータベースディレクトリを消去しました。セカンダリ上で作業していると誤って考えていたのです。残念ながら、この処理はプライマリ上で実行されました。エンジニアはミスに気づいて1〜2秒後にプロセスを終了させましたが、その時点ですでに約300GBのデータが削除されていました。

  データベースを復旧できることを期待して、関係するエンジニアたちはデータベースのバックアップを探し、Slack で助けを求めました。しかし残念ながら、バックアップの発見と利用の両方のプロセスは完全に失敗しました。

  機能しなかった復旧手順

  pg_dump を使用したデータベースバックアップ

  pg_dump のバックアップを探したところ、存在しないことが判明しました。S3 バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調査した結果、バックアップ手順では pg_dump 9.2 を使用していた一方、当社のデータベースは PostgreSQL 9.6 で稼働していることがわかりました（Postgres では、9.x のリリースはメジャーバージョンとみなされます）。メジャーバージョンが異なると、pg_dump はエラーを発生させ、バックアップ手順は終了します。

  [...]

  エラーが発生した cron ジョブには通知が有効になっていますが、これらの通知はメールで送信されます。GitLab.com では DMARC を使用しています。残念ながら、cron ジョブのメールでは DMARC が有効になっていなかったため、受信側で拒否されていました。つまり、手遅れになるまで、バックアップが失敗していることにまったく気づいていなかったのです。

  Azure ディスクスナップショット

  NFS サーバーでは有効になっていましたが、他のバックアップ手順で十分だと考えていたため、データベースサーバーのいずれに対してもこれらのスナップショットは有効になっていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するため、「なぜを5回繰り返す」と呼ばれる手法を使用します。インシデントを2つの主要な問題、すなわち GitLab.com が停止したことと、GitLab.com の復旧に長い時間がかかったことに分けます。

  問題2：GitLab.com の復旧に18時間以上を要した。

  なぜ標準のバックアップ手順を使用できなかったのか？
  - 標準のバックアップ手順では、pg_dump を使用してデータベースの論理バックアップを実行します。この手順は、GitLab.com が PostgreSQL 9.6 で稼働しているにもかかわらず PostgreSQL 9.2 を使用していたため、黙って失敗しました。

  なぜバックアップ手順は黙って失敗したのか？
  - 失敗時に通知は送信されましたが、メールが拒否されたため、失敗を示すものはありませんでした。送信元は自動化されたプロセスであり、エラーを報告する他の手段はありませんでした。
