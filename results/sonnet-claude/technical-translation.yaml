  1月31日のデータベース障害の事後検証

  2017年1月31日、私たちは自社製品の一つであるオンラインサービスGitLab.comにおいて重大なサービス障害を経験しました。この障害は、プライマリデータベースサーバーからデータが誤って削除されたことによって引き起こされました。この事象により、GitLab.comサービスは長時間にわたり利用不能となりました。また、最終的に復旧できなかった一部のプロダクションデータも失いました。

  [...]

  プロダクションデータを失うことは許容できません。今後このようなことが起こらないようにするため、私たちはGitLab.comの運用・復旧手順に関する複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC: 負荷の増加により、PostgreSQLのセカンダリのレプリケーション処理が遅延し始めました。セカンダリが必要とするWALセグメントがすでにプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーする作業が含まれます。エンジニアの一人がセカンダリにアクセスしてデータディレクトリを消去し、pg_basebackupを実行しました。しかし残念ながら、--verboseオプションを設定していたにもかかわらず、pg_basebackupは意味のある出力を一切出さずにハングしてしまいました。

  ± 23:30 UTC: エンジニアの一人は、これまでの実行試行の際にpg_basebackupがセカンダリのPostgreSQLデータディレクトリに何らかのファイルを作成してしまったのではないかと考えました。通常、このような場合pg_basebackupはエラーを出力するのですが、当該エンジニアは何が起きているのか確信が持てませんでした。後になって(当時は現場にいなかった)別のエンジニアによって、これは正常な動作であることが明らかになりました。つまり、pg_basebackupはプライマリがレプリケーションデータの送信を開始するのを待機し、その間は黙って待ち続けるのです。残念ながら、これは私たちのエンジニアリング運用手順書にも、pg_basebackupの公式ドキュメントにも明確に記載されていませんでした。

  レプリケーション処理を復旧させようとして、あるエンジニアがPostgreSQLデータベースディレクトリの消去を進めましたが、誤ってセカンダリ上で操作していると思い込んでいました。しかし残念ながら、この処理は実際にはプライマリ上で実行されてしまいました。当該エンジニアは自分の誤りに気付いた1~2秒後に処理を中断しましたが、その時点で約300GBのデータが既に削除されていました。

  データベースを復旧できることを期待して、関係したエンジニアたちはデータベースのバックアップを探し始め、Slackで助けを求めました。しかし残念ながら、バックアップを見つける作業と、それを使用する作業の両方が完全に失敗しました。

  壊れていた復旧手順

  pg_dumpによるデータベースバックアップ

  pg_dumpのバックアップを探しに行ったところ、それらが存在しないことが分かりました。S3バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調査したところ、バックアップ手順ではpg_dump 9.2を使用していたのに対し、私たちのデータベースはPostgreSQL 9.6で稼働していることが分かりました(Postgresでは9.xリリースはメジャーバージョンとみなされます)。メジャーバージョンの違いにより、pg_dumpはエラーを出し、バックアップ処理が中断されてしまいます。

  [...]

  エラーが発生したcronジョブについては通知が有効になっているものの、これらの通知はメールで送信されます。GitLab.comではDMARCを使用しています。しかし残念ながら、cronジョブのメールに対してDMARCが有効化されていなかったため、受信者側でメールが拒否される結果となりました。つまり、私たちはバックアップが失敗していることに、手遅れになるまで気付くことができませんでした。

  Azureディスクスナップショット

  NFSサーバーに対しては有効化されていましたが、これらのスナップショットはデータベースサーバーのいずれにも有効化されていませんでした。これは、他のバックアップ手順で十分だろうと想定していたためです。

  根本原因分析

  これらの問題の根本原因を分析するために、「5つのなぜ」と呼ばれる手法を用います。この事象を2つの主な問題に分けます。GitLab.comがダウンしたこと、そしてGitLab.comの復旧に長時間かかったことです。

  問題2:GitLab.comの復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使用できなかったのか?
  - 標準のバックアップ手順は、pg_dumpを使用してデータベースの論理バックアップを行います。この処理は、GitLab.comがPostgreSQL 9.6で稼働しているのに対しPostgreSQL 9.2を使用していたため、サイレントに失敗しました。

  なぜバックアップ処理はサイレントに失敗したのか?
  - 失敗時には通知が送信されていましたが、メールが拒否されたため失敗を示す情報がありませんでした。送信者は自動化された処理であり、それ以外にエラーを報告する手段がありませんでした。
