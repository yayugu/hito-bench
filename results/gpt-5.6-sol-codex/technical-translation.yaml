  1月31日に発生したデータベース障害の事後分析

  2017年1月31日、当社製品の一つであるオンラインサービス「GitLab.com」で大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーから誤ってデータを削除したことが原因でした。このインシデントにより、GitLab.comのサービスは長時間にわたって利用できなくなりました。また、本番環境のデータの一部が失われ、最終的に復旧できませんでした。

  [...]

  本番データの損失は許容できません。このような事態が二度と起きないよう、GitLab.comの運用および復旧手順について複数の改善に取り組んでいます。

  タイムライン

  UTC 23:00頃：負荷の増加により、PostgreSQLのセカンダリサーバーでレプリケーション処理の遅延が発生し始めました。セカンダリが必要としていたWALセグメントがすでにプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。この作業では、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーします。エンジニアの一人がセカンダリに移動してデータディレクトリを消去し、その後pg_basebackupを実行しました。しかし残念ながら、--verboseオプションを設定していたにもかかわらず、pg_basebackupは有益な出力を何も表示せずに停止したような状態になりました。

  UTC 23:30頃：エンジニアの一人は、以前にpg_basebackupを実行しようとした際に、セカンダリのPostgreSQLデータディレクトリ内に何らかのファイルが作成されたのではないかと考えました。通常、このような場合にはpg_basebackupがエラーを表示しますが、当該エンジニアは何が起きているのか確信を持てませんでした。後になって、当時その場にいなかった別のエンジニアにより、これは正常な動作であることが判明しました。pg_basebackupはプライマリがレプリケーションデータの送信を開始するまで待機し、それまでは何も表示せずに待ち続けます。残念ながら、この動作は当社のエンジニアリング運用手順書にも、公式のpg_basebackupドキュメントにも明確に記載されていませんでした。

  レプリケーション処理を復旧しようとしたエンジニアは、セカンダリ上で作業していると誤認したまま、PostgreSQLのデータベースディレクトリを消去しました。しかし実際には、この処理はセカンダリではなくプライマリ上で実行されていました。エンジニアはミスに気づいてから1〜2秒後に処理を停止しましたが、その時点ですでに約300GBのデータが削除されていました。

  データベースを復旧できることを期待し、関係するエンジニアたちはデータベースのバックアップを探し、Slackで支援を求めました。しかし残念ながら、バックアップの発見と利用の両方のプロセスが完全に失敗しました。

  機能しなかった復旧手順

  pg_dumpを使用したデータベースバックアップ

  pg_dumpのバックアップを探したところ、存在しないことが判明しました。S3バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調査した結果、バックアップ手順ではpg_dump 9.2が使用されていた一方、当社のデータベースはPostgreSQL 9.6で稼働していたことが分かりました（Postgresでは、9.xの各リリースはメジャーバージョンとして扱われます）。メジャーバージョンが異なるとpg_dumpでエラーが発生し、バックアップ処理が終了します。

  [...]

  エラーが発生したcronジョブについては通知が有効になっていましたが、その通知はメールで送信されていました。GitLab.comではDMARCを使用しています。しかし、cronジョブのメールではDMARCが有効になっていなかったため、受信側に拒否されていました。つまり、手遅れになるまでバックアップが失敗していることにまったく気づきませんでした。

  Azureディスクスナップショット

  NFSサーバーでは有効になっていましたが、ほかのバックアップ手順で十分だと想定していたため、データベースサーバーではスナップショットが一切有効になっていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するため、「なぜなぜ分析（5 Whys）」と呼ばれる手法を使用します。このインシデントを、GitLab.comが停止したことと、GitLab.comの復旧に長時間を要したことという、二つの主要な問題に分けます。

  問題2：GitLab.comの復旧に18時間以上を要した。

  なぜ標準のバックアップ手順を使用できなかったのか？

  - 標準のバックアップ手順では、pg_dumpを使用してデータベースの論理バックアップを作成します。この手順ではPostgreSQL 9.2が使用されていた一方、GitLab.comはPostgreSQL 9.6で稼働していたため、通知されないまま処理が失敗していました。

  なぜバックアップ手順は通知されないまま失敗したのか？

  - 失敗時には通知が送信されていましたが、メールが拒否されたため、失敗を示すものが何もありませんでした。送信元は自動化されたプロセスであり、エラーを報告するほかの手段がありませんでした。
