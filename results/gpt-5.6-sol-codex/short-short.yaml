  「アマゾンから荷物が届いたぞ」

  父の声に、家族全員が玄関へ集まった。

  箱は冷蔵庫ほどもあり、表面はびっしょり濡れている。伝票の差出人欄には、ただ「上流」とだけ書かれていた。

  父がふたを開けると、熱気とともに鮮やかな蝶が舞い上がった。続いて色とりどりのカエル、見たこともない花、そして小さなカヌーに乗った男が現れた。

  男は玄関を見回し、首をかしげた。

  「ここは海ではないのか？」

  父は慌てて注文履歴を確認した。

  「おかしいな。頼んだのは『アマゾン川流域大全』一冊だけなのに」

  箱の底で、巨大なワニが目を開けた。

  男はため息をついた。

  「また梱包担当が、“大全”と“全体”を間違えたな」

  その晩、父は返品を申し込んだ。

  翌朝、家ごとなくなっていた。

  玄関跡には、濡れた伝票が一枚だけ残されていた。

  「返品先：アマゾン上流」

  ---

  「アマゾン」と聞いて多くの人が通販会社を連想することを利用した話です。通販の荷物だと思わせておきながら、実際に届いたのはアマゾン川流域そのもの。「大全（本）」が「全体」と取り違えられたのが最初のオチです。さらに返品を頼んだ結果、今度は家族の家が“返品物を包む箱”として扱われ、家ごとアマゾンへ送られてしまった、という二段落ちになっています。
