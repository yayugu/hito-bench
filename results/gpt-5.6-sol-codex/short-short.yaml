  ### 『置き配』

  アマゾンの奥地で、探検家は一軒の小屋を見つけた。

  扉の前には、見慣れた段ボール箱が置かれている。

  「こんな密林にまで配達するのか」

  感心して宛名を見ると、自分の名前があった。

  震える手で箱を開ける。中には、小型の衛星電話と一枚の紙。

  **〈遭難予定日より三日早くお届けしました〉**

  その瞬間、背後で小屋の扉が開いた。

  白骨死体が転がり出る。首には、自分と同じ名札。

  衛星電話が鳴った。

  「返品をご希望ですか？」

  探検家は密林を振り返った。

  そこにはいつの間にか、無数の配達員が立っていた。
