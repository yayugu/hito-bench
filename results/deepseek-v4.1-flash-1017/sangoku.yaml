response: 関羽。字は雲長。桃園で劉備・張飛と義兄弟の契りを結び、黄巾平定から乱世を義の道で駆け抜けた猛将。若き日から武勇に優れ、青龍偃月刀を振るい、曹操に厚遇されても劉備への忠義を貫き、五関を突破して主君の下へ戻る。のち荊州を預かり、蜀漢建国を支えて前将軍に任じられる。樊城では水攻めで于禁・龐徳を破り、鬼神の如き武威を示した。孫権の子との縁組を拒み、曹操が遷都を検討するほど恐れさせたが、孫権との同盟は破れ、呂蒙の奇襲で荊州を奪われ、麦城へ敗走。最期は捕らえられ、降伏を拒んで首を斬られた。死後、武神として崇められた義将の生涯は、壮絶な終幕として語り継がれる。
