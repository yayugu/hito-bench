  2017年1月31日のデータベース障害の事後分析

  2017年1月31日、当社は製品の一つであるオンラインサービスGitLab.comで大規模なサービス障害を経験しました。この障害は、プライマリデータベースサーバーからデータが誤って削除されたことによって引き起こされました。このインシデントにより、GitLab.comサービスは長時間利用不可となりました。また、最終的に復旧できなかった一部の本番データも失いました。

  [...]

  本番データを失うことは容認できません。これが再発しないように、GitLab.comの運用および復旧手順について複数の改善に取り組んでいます。

  タイムライン

  ±23:00 UTC: 負荷増大により、PostgreSQLセカンダリのレプリケーションプロセスが遅れ始めました。セカンダリが必要とするWALセグメントがすでにプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.comはWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーすることが含まれます。エンジニアの一人がセカンダリへ移動してデータディレクトリを消去し、その後pg_basebackupを実行しました。しかし、--verboseオプションを設定していたにもかかわらず、pg_basebackupは意味のある出力を出さずにハングしました。

  ±23:30 UTC: エンジニアの一人は、おそらく以前にpg_basebackupを実行しようとした際に、セカンダリのPostgreSQLデータディレクトリに何らかのファイルが作成されたのだと考えました。通常、そうした場合pg_basebackupはエラーを出力しますが、当該エンジニアは何が起きているのかよく分かっていませんでした。後に別のエンジニア（当時その場にいなかった）によって、これは正常な動作であることが明らかになりました。つまり、pg_basebackupはプライマリがレプリケーションデータの送信を開始するのを待ち、その間は何も表示せずに待機します。残念ながら、このことは当社のエンジニアリング用ランブックにも、公式のpg_basebackupドキュメントにも明確に記載されていませんでした。

  レプリケーションプロセスを復旧しようとして、あるエンジニアはPostgreSQLデータベースディレクトリを消去しましたが、誤ってセカンダリで行っていると思い込んでいました。残念ながら、この処理は実際にはプライマリで実行されました。エンジニアは誤りに気付いてから1〜2秒後に処理を終了しましたが、その時点で約300GBのデータがすでに削除されていました。

  データベースを復旧できることを期待して、関係するエンジニアたちはデータベースバックアップを探し、Slackで助けを求めました。残念ながら、バックアップの特定と使用の両方のプロセスが完全に失敗しました。

  壊れた復旧手順

  pg_dumpを使用したデータベースバックアップ

  pg_dumpのバックアップを探しに行ったところ、それらが存在しないことが分かりました。S3バケットは空で、最近のバックアップはどこにも見つかりませんでした。さらに詳しく調べたところ、バックアップ手順はpg_dump 9.2を使用していましたが、当社のデータベースはPostgreSQL 9.6で稼働していました（Postgresでは、9.xリリースはメジャーと見なされます）。メジャーバージョンの違いによりpg_dumpはエラーを出力し、バックアップ手順を終了させていました。

  [...]

  エラーが発生したcronjobについては通知が有効になっていますが、これらの通知はメールで送信されます。GitLab.comではDMARCを使用しています。残念ながら、cronjobのメールにDMARCは有効になっていなかったため、受信者によって拒否されていました。つまり、バックアップが失敗していることに気付いたのは、手遅れになってからでした。

  Azureディスクスナップショット

  NFSサーバーでは有効になっていましたが、これらのスナップショットはデータベースサーバーのいずれでも有効になっていませんでした。当社は他のバックアップ手順で十分だと考えていたためです。

  根本原因分析

  これらの問題の根本原因を分析するために、「5つのなぜ」と呼ばれる手法を使用します。インシデントを2つの主要な問題に分けます。GitLab.comがダウンしたことと、GitLab.comの復旧に長時間かかったことです。

  問題2: GitLab.comの復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使用できなかったのか？
  - 標準のバックアップ手順は、データベースの論理バックアップを実行するためにpg_dumpを使用します。この手順は、PostgreSQL 9.2を使用していた一方でGitLab.comはPostgreSQL 9.6で稼働していたため、サイレントに失敗しました。

  なぜバックアップ手順はサイレントに失敗したのか？
  - 失敗時に通知は送信されていましたが、メールが拒否されたため失敗の兆候はありませんでした。送信者は自動プロセスであり、エラーを報告する他の手段がありませんでした。
