  ## 34話　シャワーのあとで

  浴室のドアが閉まる音がして、リビングに一人きりになった。

  俺はソファに座り直して、テレビを点ける。点けたはいいけど、画面の内容はまったく頭に入ってこない。時計を見れば、あかねがシャワーを浴び始めてまだ五分。なのに、もう何十分も経った気がする。

  ――付き合うことになった。俺と、あかねが。

  三十三分前のことを思い出して、また心臓が変な跳ね方をする。あかねの「おにぃのことが好き」という言葉。震える唇。キスしたときの、柔らかくて温かい感触。ぜんぶ夢みたいで、でも夢じゃなくて。

  「……落ち着け、俺」

  呟いた声が、妙に上ずっていた。

  背もたれに深く寄りかかって、天井を見上げる。実家のリビングは、東京のアパートよりずっと広い。天井も高い。でも今は、この空間がやけに狭く感じた。あかねが、すぐそこにいる。それだけで、部屋の空気の密度が変わったみたいだ。

  しばらくして、浴室のドアが開く音がした。

  「おにぃ、あがったよ」

  声のほうを振り向いて――固まった。

  リビングの入り口に立っていたあかねは、俺のTシャツを着ていた。白い半袖シャツ。俺が寝るときに着ているやつだ。身長差のせいで、裾が太ももの半ばまで隠している。濡れた髪をタオルで拭きながら、少し恥ずかしそうに俯いていた。

  「……サイズ、合わないよな。ごめん、他に着るものなくて」

  「あ、ああ……うん。その、似合ってる」

  言ってから、顔が熱くなった。何言ってんだ俺。でも本当にそう思ったから仕方ない。ぶかぶかのTシャツを着たあかねは、反則的に可愛かった。髪から水滴が落ちて、鎖骨あたりで消える。その一本の線から目を逸らすのに必死だった。

  「座るか？　髪、乾かすならドライヤー持ってくるけど」

  「うん……お願い」

  ソファの端と端に座る。微妙な距離。さっきキスしたのに、こういうときの距離感がわからない。あかねも同じらしく、もじもじと膝を揃えていた。

  ドライヤーを持ってきて、コンセントを差す。

  「あの、自分でやるから」

  「いいよ。やってやる」

  「えっ、でも」

  「背中、向けて」

  あかねが少し迷ってから、くるりと背を向ける。髪を手に取ると、シャンプーの匂いがした。俺の家の、俺と同じやつ。それがなんだか妙にこそばゆくて、ドライヤーの温風を当てながら、なるべく集中するようにした。

  「……おにぃの手、大きいね」

  「当たり前だろ。身長だって二十センチ以上違うんだから」

  「そうだけど。なんか、実感なかったんだよ。こうやって触られると」

  髪の間から、あかねの耳が真っ赤になっているのが見えた。俺も大概だけど、あかねのほうがもっと照れてる。それがわかったら、急に気持ちが楽になった。

  「あかね」

  「なに？」

  「俺も、実感してる。あかねがここにいるって」

  ドライヤーの音が止む。あかねがゆっくり振り向いて、上目遣いに俺を見た。

  「……ずるい、そういうこと言うの」

  「ずるくない。正直に言っただけ」

  「おにぃ、昔からそうだよね。変なとこでストレートなんだから」

  「変なとこってなんだよ」

  笑い合って、その瞬間、さっきまでの緊張がすっとほどけた。

  「なあ、あかね」

  「うん」

  「こっち、来て」

  俺が手を広げると、あかねは少し迷ってから、そっと身を寄せてきた。ソファの上で、肩を並べるようにして座る。Tシャツ越しの体温が伝わってくる。濡れた髪が、俺の肩に触れた。

  「こういうの、してみたかったんだ」

  ぽつりとあかねが言う。

  「こういうの？」

  「うん。おにぃの隣で、テレビ見ながら、なんとなくくっついて……」

  「それ、ただの同居人じゃね？」

  「違うもん。恋人だから、いいの」

  恋人。その単語をあかねの口から聞いて、胸の奥がぎゅっとなった。

  「じゃあ、もっと恋人らしいことするか」

  「な、なに？」

  「手、繋ぐ」

  俺が右手を差し出すと、あかねは自分の左手を、慎重に重ねてきた。指の細さ。少し冷たい指先。そして、すぐにぎゅっと握り返してくる強さ。

  「おにぃの手、やっぱり大きい」

  「言っただろ」

  「うん。でも、嫌じゃない。むしろ、好き」

  「……そうかよ」

  照れ隠しに前を向く。テレビでは、意味のわからないバラエティ番組が流れている。でも、どうでもよかった。隣にある温もりだけで、世界の全部が埋まっていく気がした。

  しばらく無言で手を繋いでいたら、あかねが俺の肩にもたれかかってきた。

  「おにぃ」

  「ん」

  「今日、本当に来てよかった。夏休みぶりに会えて、告白して……全部、全部うまくいった」

  「ああ。俺もだ」

  「明日も、こうやってくっついてもいい？」

  「明日も？」

  「うん。明後日も、その次も。……ずっと」

  ずっと、か。その言葉の重さを、あかねはわかって言ってるんだろうか。でも、わかってるからこそ言ったんだろうな、こいつは。

  「ずっとって、夏休み中だけじゃなくて？」

  「……おにぃの意地悪」

  「意地悪じゃない。確認だ」

  あかねが顔を上げる。至近距離で目が合った。風呂上がりの、少し赤らんだ顔。濡れた前髪。真っ直ぐな瞳。

  「ずっとだよ。おにぃが、あたしを嫌いになるまで」

  「ならないよ」

  「じゃあ、ずっと」

  「ああ。ずっとだ」

  自然と、顔が近づいた。さっきみたいに勢いじゃなくて、ゆっくり、確かめるみたいに。触れるだけの、短いキス。でも、さっきよりずっと、心臓がうるさかった。

  離れたあと、あかねが小さく笑う。

  「二回目も、やっぱりドキドキするね」

  「だな」

  「慣れるのかな、これ」

  「慣れていいのか、わかんねえけど」

  「あたし、慣れたくないかも。このドキドキ、もったいないもん」

  そう言って、あかねはまた俺の肩に頭を乗せた。テレビの音が、遠くで流れている。エアコンの風が、静かに部屋を回っている。夏の終わりの夜。親がいない家。隣に、好きな人がいる。

  ――ああ、俺、今すげえ幸せだ。

  そう自覚したら、ちょっと泣きそうになったので、俺は黙ってあかねの手を握る力を、少しだけ強くした。
