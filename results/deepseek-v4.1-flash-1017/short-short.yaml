  『翌日配達』

  私はアマゾンの密林で道に迷っていた。藪をかき分けても、同じ木が見えるだけ。水も尽き、スマホの電池は残り二％。電波は奇跡的に一本立っていた。

  私は迷わずAmazonを開き、「救助」と検索した。出てきたのは救助用ホイッスル。レビューは星4.2。「音がよく通る」とある。藪の中では意味がない気もしたが、Prime会員だ。ポチッとした。

  翌朝、頭上でブーンと音がした。ドローンだ。箱が落ちてきた。中にはホイッスルと、一枚の紙。「置き配でよろしいですか？」と書いてある。

  私は必死にホイッスルを吹いた。すると、藪の向こうから声がした。

  「はーい、アマゾンでーす」

  配達員が現れ、差出人欄を指さした。

  「お客様、これ、返品ですか？」

  私は涙目でうなずいた。配達員は箱を受け取り、こう言った。

  「じゃあ、ついでに家まで送りますね。アマゾン、置き配指定が多いんですよ」

  ---

  オチ解説：冒頭の「アマゾン」は密林の意味で読ませ、ラストで通販会社アマゾンにすり替えています。遭難者にとっては「救助」のつもりが、配達員には「置き配の回収」に見えていた、というズレがオチ。さらに、ホイッスルは救助信号ではなく配達員を呼ぶ“呼び鈴”のように働き、アマゾンの配送網がアマゾン（密林）にまで届くという誇張で笑いを取っています。
