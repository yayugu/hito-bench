  1月31日のデータベース停止に関する事後分析

  2017年1月31日、当社製品の一つであるオンラインサービス GitLab.com において、重大なサービス停止が発生しました。この停止は、プライマリデータベースサーバーから誤ってデータを削除したことにより発生しました。このインシデントにより、GitLab.com のサービスが数時間にわたって利用不能となりました。また、一部の本番データが消失し、最終的に復旧不可能な状態となりました。

  [...]

  本番データの損失は許容できないことです。再発防止のため、GitLab.com の運用およびリカバリ手順について、複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC：負荷の増大により、PostgreSQLセカンダリのレプリケーションプロセスに遅延が発生しました。セカンダリが必要とするWALセグメントが既にプライマリから削除されていたため、レプリケーションが失敗しました。GitLab.com ではWALアーカイブを使用していなかったため、セカンダリを手動で再同期させる必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackup を実行してプライマリからセカンダリへデータベースをコピーする作業が含まれます。あるエンジニアがセカンダリにアクセスしてデータディレクトリを消去し、pg_basebackup を実行しました。しかし、不運にも pg_basebackup は `--verbose` オプションを設定していたにもかかわらず、有意義な出力を出さずにハングアップしました。

  ± 23:30 UTC：あるエンジニアが、前回の実行時に PostgreSQL のデータディレクトリにいくつかのファイルが作成されたのではないかと考えました。通常、この場合は pg_basebackup がエラーを表示しますが、当該エンジニアは状況を確信できませんでした。後に（当時不在だった）別のエンジニアにより、これは正常な動作であることが判明しました。pg_basebackup は、プライマリがレプリケーションデータの送信を開始するまで、静かに待機します。残念ながら、この挙動は当社のエンジニアリング・ランブックにも、pg_basebackup の公式ドキュメントにも明確に記載されていませんでした。

  レプリケーションプロセスを復旧させようとしたエンジニアが、PostgreSQL のデータベースディレクトリを消去しようとしましたが、セカンダリで行っていると思い込み、誤ってプライマリで実行してしまいました。エンジニアは間違いに気づいてから1〜2秒後にプロセスを停止しましたが、その時点で約300GBのデータが既に削除されていました。

  データベースの復旧を試み、関係したエンジニアたちはデータベースのバックアップを探し、Slack で助けを求めました。しかし、バックアップの検索と利用の両方のプロセスが完全に失敗しました。

  不備のあったリカバリ手順

  pg_dump を使用したデータベースバックアップ

  pg_dump のバックアップを確認したところ、存在しないことが判明しました。S3バケットは空であり、どこにも最近のバックアップは見当たりませんでした。詳しく調査したところ、バックアップ手順では pg_dump 9.2 が使用されていましたが、データベースは PostgreSQL 9.6 で動作していたことが分かりました（Postgres において、9.x のリリースはメジャーバージョンとみなされます）。メジャーバージョンが異なると pg_dump はエラーを出力し、バックアップ手順が停止します。

  [...]

  エラーが発生したクロンジョブの通知は有効になっていましたが、これらの通知はメールで送信されていました。GitLab.com では DMARC を使用しています。あいにく、クロンジョブのメールには DMARC が有効になっていなかったため、受信側で拒否されていました。つまり、手遅れになるまで、バックアップが失敗していることに気づかなかったということです。

  Azure ディスクスナップショット

  NFSサーバーでは有効になっていましたが、他のバックアップ手順で十分であると考えていたため、データベースサーバーではどのスナップショットも有効になっていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するため、「5つのなぜ（なぜなぜ分析）」という手法を用います。インシデントを「GitLab.com のダウン」と「GitLab.com の復旧に時間がかかったこと」の2つの主要な問題に分けて考えます。

  問題2：GitLab.com の復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使えなかったのか？
  - 標準のバックアップ手順は pg_dump を使用してデータベースの論理バックアップを行いますが、GitLab.com が PostgreSQL 9.6 で動作していたのに対し、pg_dump 9.2 が使用されていたため、この手順は静かに失敗していました。

  なぜバックアップ手順は静かに失敗したのか？
  - 失敗時に通知が送信されていましたが、メールが拒否されたため、失敗の兆候がありませんでした。送信元は自動化されたプロセスであり、エラーを報告する他の手段がありませんでした。
