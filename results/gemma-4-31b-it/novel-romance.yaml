  ### 第34話：鼓動の距離

  　シャワーを浴び終え、Ｔシャツとスウェットパンツという緩い格好で自室に戻った俺は、ベッドの縁に腰掛けて深くため息をついた。

  　……なんだこれ。心臓の音が、耳の奥まで響いている。
  　さっきまで、あかねと俺は――。

  　脳裏に、あかねの真っ赤な顔と、震える声で告白してくれた瞬間の記憶がリフレインする。
  　幼なじみ。大好きなお姉ちゃんみたいに慕ってくれていたはずのあかねが、今は俺の「彼女」になった。
  　信じられない。けれど、唇に残っているあの柔らかい感触だけは、紛れもなく現実だった。

  　もはや「幼なじみ」という心地よい壁は崩れ去り、俺たちの間には、今まで知らなかった、ひりつくような熱い緊張感が漂っている。

  　すると、廊下からかすかな足音が聞こえ、ドアがゆっくりと開いた。

  「……おまたせ、薫おにぃ」

  　そこに立っていたあかねを見て、俺は呼吸を忘れた。
  　濡れた髪をタオルで拭きながら、少し大きめのＴシャツを纏った彼女。
  　もしかして、俺が貸したＴシャツだろうか。裾から覗く白い脚と、鎖骨あたりまで大きく開いた襟元。
  　いつもは「可愛い妹分」として見ていたはずなのに、今のあかねは、どうしようもなく「女の子」だった。

  「あ……、お疲れ様」
  「……なに、じっと見て。変かな」

  　あかねは恥ずかしそうに視線を逸らした。頬はまだ林檎のように赤く、指先でもじもじとＴシャツの裾を弄っている。
  　そのしぐさ一つとっても、今の俺には刺激が強すぎる。

  　あかねが遠慮がちに俺の隣に腰を下ろした。
  　ふわりと、シャンプーの甘い香りが鼻腔をくすぐる。
  　至近距離。肩と肩が触れそうな距離。
  　さっきまでとは違う、静寂が二人を包み込んだ。

  「ねえ、薫おにぃ」
  「ん？」
  「あたし……本当に、いいの？　本当に、あたしでいいの？」

  　上目遣いで覗き込んでくる瞳。不安と期待が混ざり合った、潤んだ瞳。
  　その危うい可愛さに、俺の中の何かがぷつりと切れた。

  「……いいとか悪いとかじゃない。俺の方が、ずっと前から……」

  　言葉にするのが恥ずかしくて、俺はあかねの肩をそっと引き寄せた。
  　あかねは「ひゃっ」と小さく声を上げ、そのまま俺の胸の中にすっぽりと収まった。
  　薄い生地越しに伝わってくる、彼女の体温。そして、俺と同じか、あるいはそれ以上に速く打っているであろう、激しい鼓動。

  「心臓、すごい速いね」
  「お前のせいだろ」

  　わざとぶっきらぼうに言うと、あかねは俺の胸に顔を埋めたまま、くすくすと笑った。
  　その笑い声が心地よくて、俺は自然と彼女の背中に腕を回し、強く抱きしめる。

  　もう、幼なじみという安全地帯には戻れない。
  　戻りたくない。
  　いま、この腕の中にいるのが、世界で一番大切な女の子なんだという実感が、じわじわと身体中に染み渡っていく。

  　あかねがゆっくりと顔を上げ、俺を見た。
  　潤んだ瞳が、熱を帯びて俺を捉える。

  「……もっと、してほしい」

  　消え入りそうな、けれど確かな意思を持った声。
  　その言葉に、俺の理性が危うい音を立てて軋んだ。

  　俺は彼女の頬を両手で包み込み、ゆっくりと顔を近づけていく。
  　鼻先が触れ合い、互いの吐息が混ざり合う。
  　もう、言葉はいらなかった。

  　どちらからともなく、吸い寄せられるように唇が重なった。
  　一度目のキスよりも深く、濃く。
  　触れているだけで熱い。触れれば触れるほど、もっと奥まで、もっと深く触れたいという飢えに似た感情が、俺たちを突き動かしていた。

  　あかねが小さく喘ぎながら、俺の背中に回した手が、ぎゅっとＴシャツを掴む。
  　その指先の震えが、彼女の緊張と、そして俺と同じだけの期待を伝えていた。

  　俺たちは、どちらからともなく、ゆっくりとベッドへと倒れ込んだ。
