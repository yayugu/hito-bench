  ### パターン1：BASARA風・劇的スタイル
  （キャラの強さとカリスマ性を強調し、プレイヤーの期待感を煽る構成）

  **【武聖・関羽】**
  義に生き、武に殉じた三国最強の猛将。青龍偃月刀の一振りで千軍万馬を薙ぎ払うその姿は、まさに「戦神」の化身。劉備との桃園の誓いを生涯の指針とし、不変の忠誠心をもって乱世を駆け抜けた。
  高潔すぎるがゆえの誇りと、妥協なき武人の精神は、敵さえも心服させる。最期は荊州を失い、運命に抗いながら散ったが、その魂は神格化され、後世にまで語り継がれる不滅の伝説となった。
  義理と誇りにすべてを捧げ、至高の頂点に君臨し続けた、究極の武人である。

