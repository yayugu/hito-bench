  ### パターン2：ストーリー重視・叙事詩スタイル
  （生涯の流れを追い、人物像を深く掘り下げた構成）

  **【武聖・関羽】**
  類まれなる武勇と、一点の曇りもない義心を持つ男。劉備、張飛と共に天下への道を誓い、数々の戦場でその名を轟かせた。彼にとっての勝利とは、単なる敵の撃破ではなく、己の信じる「義」を貫くことにある。
  そのあまりに高い誇りは時に傲慢とも映ったが、それこそが彼を唯一無二の英雄たらしめた。激動の時代の果て、荊州にて惜しまれながらその生涯を閉じるが、その精神は時代を超えて崇められ、「武聖」として神の座へと昇った。
  乱世に咲いた、最も気高く、最も強き一輪の華である。

