  Gitの大規模ホスティングにおける技術的課題と、それを解決する新システム「Continuity」についての解説です。

  **【技術的ポイント】**
  Gitのデータ保存形式である「パックファイル」は、読み取り時にディスク上をランダムに走査するため、ネットワークファイルシステムやオブジェクト単位の分散保存では性能が著しく低下します。GitHubの「Spokes」はNVMeディスクと3相コミット（3PC）で一貫性を確保しましたが、ノード数増加に伴う遅延や管理コストが限界に達していました。

  Cursorの「Continuity」は、**S3をWrite-Ahead Log (WAL) として正本（Source of Truth）に据える**ことでこの問題を解決しています。
  1. **ステートレス化**: ローカルのGitリポジトリを単なる「ウォームキャッシュ」として扱い、欠損時はWALから復元します。
  2. **合意形成の効率化**: 3PCの代わりにS3のCAS操作を利用し、書き込みのスループットを向上させました。
  3. **効率的な複製**: UDPゴシップによる楽観的複製とS3のETag検証を組み合わせ、読み取り性能の線形スケールを実現しています。
  4. **負荷分散**: 重いコンパクション（最適化）をプライマリのみで行い、結果をS3経由で配布してCPU負荷を抑えています。
