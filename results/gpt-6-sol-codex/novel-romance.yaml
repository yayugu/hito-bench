  ### 第34話　恋人になった、そのあとで

  　浴室のドアが開く音がして、俺はソファの上で背筋を伸ばした。

  　さっきまで平気で会話していたはずなのに、急に落ち着かない。テレビはついている。何の番組かは、もう十分くらいわからないままだ。

  「……おにぃ？」

  　廊下から、あかねが顔をのぞかせた。いつもの部屋着に着替えている。俺と目が合うと、なぜか一歩だけ後ずさった。

  「どうした？」
  「ううん。おにぃが、すごい真面目な顔してたから」
  「テレビ見てただけだ」
  「じゃあ、いま何の話してる？」

  　画面に目を向ける。知らない芸人が全力で坂を駆け上がっていた。

  「……坂の話」
  「ぜったい見てなかったでしょ」

  　あかねが笑う。俺もつられて笑った。

  　彼女はソファの端に腰を下ろした。間には、クッションひとつ分の距離。さっき告白されて、キスまでした相手との距離としては、妙に遠い。

  「おにぃ」

  　呼ばれて振り向くと、あかねはクッションを見つめたまま言った。

  「ほんとに、付き合ってるんだよね。あたしたち」
  「ああ」
  「さっきの、夢じゃない？」
  「夢だったら俺も困る」

  　俺がそう言うと、あかねはようやくこちらを見た。

  「じゃあ、もう一回言って」
  「俺は、あかねが好きだ」

  　言えたことに自分で驚いた。さっきまであれほど勇気が必要だった言葉なのに、今は、照れくさくても伝えたかった。

  　あかねは両手で頬を押さえた。

  「……もう一回」
  「調子に乗るな」
  「だって、聞きたいんだもん」
  「俺にも言ってくれるなら」
  「あたしはおにぃが好き。ずっと好きだった」

  　今度は俺が黙る番だった。

  　あかねがクッションを抱えて、少しだけ近づいてくる。

  「夏休み、おにぃが村に来たときね。また東京に帰っちゃうって、最初からわかってた。だから楽しいほど、帰る日が嫌だった」
  「……俺もだよ」
  「ほんと？」
  「帰りの電車で、あかねからのメッセージばっかり読み返してた」

  　あかねの目が丸くなる。

  「言ってよ、そういうの」
  「言えるかよ」
  「今なら言えるでしょ。彼氏なんだから」

  　彼氏。

  　その二文字を聞いた途端、俺は急にあかねの顔を見られなくなった。あかねも同じらしく、クッションに顔を半分埋めている。

  「おにぃ、手」

  　差し出された手を取る。指先が触れて、やがて自然に絡んだ。

  「こういうの、前なら普通にできたのにね」
  「小鹿村じゃ、よく手を引いて歩いてたな」
  「おにぃ、歩くの速かったから」
  「あかねが寄り道ばっかりするからだろ」
  「きれいな石とか、見つけたら教えたかったんだもん」

  　昔の話をしていると、少しだけ呼吸が楽になった。

  　テレビの中で歓声が上がる。俺たちはそろって画面を見たが、何が起きたのかはやっぱりわからなかった。

  「ねえ。東京って、思ってたよりずっと広いね」

  　あかねがぽつりと言った。

  「駅でも、はぐれそうになった」
  「次はもっとわかりやすいところに行こう」
  「次も、来ていい？」
  「もちろん。俺も村に行くよ」
  「約束？」
  「約束」

  　つないだ手を、あかねが小さく揺らした。

  「遠くても、会えるんだね」
  「ああ。連絡だって毎日できる」
  「毎日？」
  「……迷惑じゃなければ」
  「迷惑なわけないじゃん」

  　あかねは俺の肩に頭を預けた。さっきのクッションは、いつの間にか床に落ちている。

  　俺たちはしばらく、そのままでいた。気の利いたことは何も言えない。でも、あかねの手を離したくなかった。

  「おにぃ」
  「ん？」
  「あたし、今日のこと、忘れないと思う」
  「俺も」

  　あかねが顔を上げる。近すぎて、また緊張した。

  「……まだ、照れる？」
  「照れるに決まってる」
  「あたしも」

  　そう言いながら、あかねは笑った。俺も笑って、彼女の手を握り直す。

  　付き合う前と同じ部屋、同じソファだ。それなのに、隣に座るだけでこんなにうれしい。

  「明日の朝さ」
  「うん」
  「一緒に朝飯、作ろうか」
  「いいよ。あたし、卵焼き作る」
  「前に作ったやつ、甘かったよな」
  「小鹿村の味です」
  「じゃあ楽しみにしてる」

  　あかねは満足そうにうなずき、また俺の肩にもたれた。

  　テレビの番組が終わるころ、俺たちはようやく、画面を見ていなかったことを認め合った。
