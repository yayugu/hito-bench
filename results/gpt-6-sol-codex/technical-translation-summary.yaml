response: |-
  Gitの大規模ホスティングが難しいのは、履歴がDAG（有向非巡回グラフ）で、次に読むオブジェクトが直前の読み込みまで分からないためだ。さらにpackfile内のオブジェクトは圧縮や差分保存によって散らばり、分散ストレージでは読み込みの往復が重くなる。従来のSpokesはローカルNVMe上のGitリポジトリを複製し、参照の更新を3フェーズコミットで同期するが、複製数を増やすほどpushが遅くなる。

  CursorのContinuityは、各pushのpackfileをS3の書き込みログ（WAL）に永続化し、その索引を原子的な比較・交換で更新する。ローカルのリポジトリは復元可能なキャッシュとして扱う。複製への通知はUDPで素早く行い、読み込み時にはS3のETagで最新版か確認するため、通知が失われても古い状態を返さない。圧縮処理も主担当の一台で行い、他の複製は完成したpackfileを取得する。この設計により、小さなリポジトリは複製一台、大規模リポジトリは多数の複製で運用できる。
