  1月31日のデータベース障害に関する事後報告

  2017年1月31日、当社の製品の一つであるオンラインサービスGitLab.comで、大規模な障害が発生しました。原因は、プライマリデータベースサーバーから誤ってデータを削除したことです。この事故により、GitLab.comは長時間利用できなくなりました。また、最終的に復旧できなかった本番データも一部失われました。

  [...]

  本番データの喪失は容認できません。再発を防ぐため、GitLab.comの運用手順と復旧手順を複数の面から改善しています。

  時系列

  UTC 23:00ごろ：負荷の増加により、PostgreSQLのセカンダリサーバーでレプリケーション処理に遅れが生じ始めました。セカンダリに必要なWALセグメントがすでにプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。その作業では、セカンダリの既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーします。エンジニアの一人がセカンダリに接続してデータディレクトリを消去し、pg_basebackupを実行しました。しかし、--verboseオプションを指定していたにもかかわらず、pg_basebackupは意味のある出力を何も表示せず、処理が止まったように見えました。

  UTC 23:30ごろ：エンジニアの一人は、それまでに実行を試みたpg_basebackupが、セカンダリのPostgreSQLデータディレクトリに何らかのファイルを作成したのではないかと考えました。通常、このような場合にはpg_basebackupがエラーを表示しますが、そのエンジニアは何が起きているのか確信を持てませんでした。後に、その場にいなかった別のエンジニアによって、これは通常の動作だと分かりました。pg_basebackupはプライマリがレプリケーションデータの送信を開始するまで待機し、その間は何も表示しません。しかし、この動作は社内のエンジニア向け運用手順書にも、pg_basebackupの公式ドキュメントにも明確に記載されていませんでした。

  レプリケーションを復旧しようとして、あるエンジニアはセカンダリで作業していると誤認したまま、PostgreSQLのデータベースディレクトリを消去する操作を実行しました。実際には、その操作はプライマリで実行されていました。エンジニアは間違いに気づいて1、2秒後に処理を停止しましたが、その時点ですでに約300 GBのデータが削除されていました。

  データベースを復旧できることを願い、対応に当たったエンジニアたちはバックアップを探し、Slackで支援を求めました。しかし、バックアップの発見も利用も、まったくうまくいきませんでした。

  機能していなかった復旧手順

  pg_dumpによるデータベースのバックアップ

  pg_dumpによるバックアップを探したところ、存在しないことが分かりました。S3バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調べると、バックアップ手順ではpg_dump 9.2を使用していた一方、データベースはPostgreSQL 9.6で稼働していました（PostgreSQLでは、9.xの各リリースはメジャーバージョンとして扱われます）。メジャーバージョンが異なるとpg_dumpがエラーを出し、バックアップ処理は終了します。

  [...]

  エラーが発生したcronジョブには通知が設定されていましたが、その通知はメールで送信されていました。GitLab.comではDMARCを使用しています。しかし、cronジョブから送られるメールにはDMARCが設定されておらず、受信側に拒否されていました。そのため、手遅れになるまでバックアップが失敗していることに気づきませんでした。

  Azureのディスクスナップショット

  NFSサーバーではスナップショットを有効にしていましたが、データベースサーバーでは一台も有効にしていませんでした。他のバックアップ手順で十分だと考えていたためです。

  根本原因の分析

  これらの問題の根本原因を分析するため、「なぜなぜ分析」という手法を使います。この事故を、GitLab.comが停止したことと、GitLab.comの復旧に長い時間がかかったことの二つの主な問題に分けます。

  問題2：GitLab.comの復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使えなかったのか？
  - 標準のバックアップ手順では、pg_dumpを使ってデータベースの論理バックアップを作成します。この手順では、GitLab.comがPostgreSQL 9.6で稼働しているにもかかわらず、PostgreSQL 9.2のpg_dumpを使用していたため、失敗が表面化しないまま処理が止まっていました。

  なぜバックアップ手順の失敗が表面化しなかったのか？
  - 失敗時には通知が送信されていましたが、メールが拒否されたため、失敗を示すものがありませんでした。送信元は自動処理であり、エラーを報告する手段がほかになかったためです。
