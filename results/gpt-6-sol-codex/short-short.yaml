  ### アマゾン

  村でいちばん年を取った男が、初めてネット通販を使った。

  検索欄に「アマゾン」と入れ、画面に出た青いボタンを押す。孫に頼まれた本を買うつもりだった。

  翌朝、玄関の前が濡れていた。泥が流れ、魚が一匹、敷石の上で跳ねている。

  配達員が困った顔で立っていた。

  「すみません。置き配にしたかったんですが、大きすぎて」

  男が家の裏へ回ると、昨日まで畑だったところを、幅の広い川が流れていた。

  孫は目を丸くした。

  「おじいちゃん、本は？」

  男は注文履歴を見た。

  **アマゾン川　数量１　配達完了**

  「返品できるかな」

  「できるよ」と孫は言った。「でも、上流はどこに返すの？」

  ---

  **オチの解説：** 男は通販サイトのアマゾンで本を買ったつもりが、アマゾン川そのものを注文していた。返品しようにも、川は家の裏から流れ出していて、送り返す先が分からない。
