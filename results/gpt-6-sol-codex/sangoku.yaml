  後漢末の武将。字は雲長。劉備の旗揚げ以来、張飛とともに各地を転戦した。曹操に捕らえられた際は厚遇を受けるが、敵将・顔良を討って恩に報いると、劉備のもとへ帰還。のちに荊州の守りを託される。美しい髯をたくわえ、武勇に優れ、『春秋左氏伝』を好んだという。二一九年、北上して樊城を包囲し、洪水に乗じて曹操軍の于禁を降伏させた。しかし、孫権軍に背後の荊州を奪われ、軍は崩壊。退却の末、息子の関平とともに捕らえられ、処刑された。その忠義と武勇は後世まで語り継がれ、「関帝」として祀られた。

  [出典：コトバンク「関羽」](https://kotobank.jp/word/%E9%96%A2%E7%BE%BD-48450)
