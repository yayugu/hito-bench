response: 義に生き、義に散った武神。字は雲長、河東解県の人。劉備・張飛と志を同じくし、青龍偃月刀を携えて乱世を駆けた。一時曹操に身を寄せるも、白馬で顔良を斬って恩に報い、劉備のもとへ帰還。毒矢の傷を骨まで削られても動じなかった胆力も語り草である。荊州を預かると樊城を攻め、大水で于禁の七軍を覆し、その威は華夏を震わせた。しかし傲岸さが呉や味方との亀裂を深め、呂蒙の急襲と徐晃の反攻で退路を失う。麦城を脱出するも臨沮で捕らえられ、子・関平とともに斬られた。後世、忠義の極致として神格化され、「関帝」「武聖」の名で今も祀られている。
