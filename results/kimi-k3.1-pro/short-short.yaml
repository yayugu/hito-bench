  **『アマゾン、翌日配送』**

  アマゾンの森が消えた年、祖父は孫娘に言った。

  「本物のアマゾンを見せてやる」

  そしてスマホを取り出し、こっそり何かを注文した。

  翌日、ドローンが小さな箱を届けた。孫娘は飛びついたが、箱は驚くほど軽い。中には、土の入った袋と、種がひとつ。説明書には、こう印刷されていた。

  『アマゾン（組み立て式）  
  　一、種をまいてください。  
  　二、水と日差しを与えてください。  
  　三、動物たちが戻るまでお待ちください。  
  　完成までの目安：約四千万年』

  孫娘が顔を上げると、祖父は請求画面を睨んでいた。

  「……プライム会員なのに」

  ---

  **オチの解説：**  
  「アマゾン」を、通販サイトと熱帯雨林の二つの意味で使っています。通販なら翌日に届いても、失われた森や生態系は人間の都合ではすぐに取り戻せません。「プライム会員なのに」という祖父の愚痴が、自然の時間まで短縮できると思い込む人間の身勝手さを風刺するオチです。
