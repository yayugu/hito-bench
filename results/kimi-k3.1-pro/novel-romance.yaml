  ### 第34話　シャワーのあと、恋人同士

  シャワーから上がり、リビングの時計を見上げる。針は夜の十時を回ろうとしていた。

  さっきまで浴室から聞こえていた水音は、いつの間にか止んでいる。

  俺は冷蔵庫から麦茶を取り出し、グラスを二つ並べた。氷を入れようとして手を止め、代わりにコースターを用意する。落ち着かないせいで、どうも動作がぎこちない。

  あかねと、付き合うことになった。

  さっきの言葉も、触れた唇の感触も、まだ胸の内側で熱を持ったままだった。

  「おにぃ、おまたせ」

  振り返ると、あかねが部屋着姿で立っていた。乾かした髪はいつもよりふわりとしていて、俺にはないはずの石けんの香りまで、どこか特別に感じられる。

  「あ、うん。麦茶でよかったか？」

  「うん。ありがと」

  あかねはグラスを受け取ると、ソファへ腰掛けた。俺も隣に座る。ただし、いつもより少しだけ距離がある。

  その間隔に気づいたのか、あかねがくすりと笑った。

  「なんで、そんなに離れてるの？」

  「離れてないだろ。普通だ」

  「さっきまで、もっと近かったよ」

  「それは……流れってものがあったから」

  言いながら、自分でも苦しい言い訳だと思った。

  あかねはグラスを置くと、するりとこちらへ寄ってくる。肩と肩が触れる距離で座り直し、俺の顔をのぞき込んだ。

  「おにぃ、緊張してる？」

  「してない」

  「耳、赤いよ」

  「風呂上がりだからだ」

  「あたしも？」

  「……あかねは、ちょっと赤いな」

  「ふふ。おそろいだね」

  無邪気に笑うあかねを見て、俺の肩からも少し力が抜けた。

  恋人になったからといって、急に何かが変わるわけじゃない。幼なじみの頃から知っているあかねが、今もすぐ隣にいる。それなのに、手を伸ばすのにためらいが生まれるのは、きっと俺だけじゃないはずだ。

  「なあ、あかね」

  「ん？」

  「さっきのこと、後悔してないか？」

  あかねは瞬きを一度だけした。それから、グラスの縁を指先でなぞりながら、小さく首を横に振る。

  「してない。あたし、自分で言いたくて言ったもん」

  「そうか」

  「おにぃこそ、してる？」

  「するわけないだろ」

  思わず強い口調になり、あかねが目を丸くする。俺は咳払いをして、言い直した。

  「俺も、ちゃんと自分の気持ちで答えた。あかねが好きだ。幼なじみとしてだけじゃなくて……恋人として、大事にしたい」

  言葉にするのは、まだ少し照れくさかった。

  けれど、あかねには曖昧なままにしたくなかった。

  あかねは伏し目がちに笑うと、俺の手の隣にあった自分の手を、そっと重ねてきた。

  「うれしい。何度も聞きたくなっちゃう」

  「何度でも言うよ」

  「ほんと？　じゃあ、明日の朝も言って」

  「起きてすぐか？」

  「寝ぼけててもいいよ」

  「それはずるいだろ」

  ふたりで笑い、重ねた手が今度は自然に指を絡めた。

  しばらく、テレビのないリビングに時計の音だけが響く。昔なら気まずかったかもしれない沈黙が、今は不思議と心地よかった。

  「あのね、おにぃ」

  「ん」

  「これからも、おにぃって呼んでいい？」

  「当たり前だ。急に名字で呼ばれたら、俺のほうが困る」

  「かおる、は？」

  「……それは、ちょっと慣れがいるな」

  「かおる」

  あかねが真顔で呼んだ。

  俺は思わず黙り込み、あかねも自分で言っておいて頬を赤くする。

  「やっぱり、おにぃがいい」

  「だろうな」

  「でも、たまには呼ぶ。おにぃだけの特別な呼び方、あったほうがいい気がするし」

  「特別か……」

  恋人という言葉だけでも十分特別なのに、あかねは欲張りなところがある。そんなところも、昔から少しも変わっていなかった。

  俺はもう片方の手で、あかねの頭を軽く撫でる。あかねは目を細め、子猫みたいに肩へ体重を預けてきた。

  「東京まで来て、よかった」

  「ひとりで来て、親御さんには心配かけたんじゃないか？」

  「うん。ちゃんと謝る。でも、後悔はしてないよ」

  「あまり無茶はするなよ。俺が心配する」

  「心配してくれるの？」

  「するに決まってるだろ」

  「じゃあ、次はおにぃが小鹿村に来て。今度はあたしが、いっぱい案内するから」

  「ああ。約束だ」

  次の休みや、冬の帰省の話をしているうちに、あかねの声は次第に小さくなった。口では楽しそうにしていても、村を出てからの緊張がずっと続いていたのだろう。

  俺はそっと、あかねを抱き寄せた。

  「今日は、よく頑張ったな」

  「……告白のこと？」

  「それも含めて、全部だ」

  あかねは俺のシャツを軽くつまみ、顔を上げた。

  「おにぃ。もう一回、キスしてもいい？」

  こちらから尋ねるのと同じくらい、あかねのほうも照れている。それでもまっすぐに見つめてくる瞳から、俺は目をそらせなかった。

  「いいよ」

  短く答えて、顔を近づける。

  触れるだけの、やさしいキスだった。離れても、あかねはすぐには身を引かず、俺もそのぬくもりを手放したくなかった。

  「好きだよ、おにぃ」

  「俺も好きだ、あかね」

  囁くような言葉のあと、ふたりで小さく笑った。

  緊張はまだ残っている。恥ずかしさも消えてはいない。けれど、それすら今は、お互いを大事に思う気持ちの裏側にあるものだと思えた。

  俺はあかねの手を握り直す。あかねも、少し強く握り返してきた。

  夜はまだ静かに続いている。

  急がなくてもいい。これから先のことも、ひとつずつ確かめていけばいい。

  そう思いながら、俺はもう一度だけ、あかねの額に唇を触れさせた。
