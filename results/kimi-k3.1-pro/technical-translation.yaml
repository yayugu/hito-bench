  # 1月31日のデータベース障害に関する事後検証

  2017年1月31日、当社の製品の1つであるオンラインサービス「GitLab.com」で、大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーから誤ってデータが削除されたことが原因でした。このインシデントにより、GitLab.comは長時間にわたって利用できない状態となりました。また、一部の本番データを失い、最終的に復旧することはできませんでした。

  [...]

  本番データの喪失は決して許容できるものではありません。同様の事態を二度と起こさないため、当社ではGitLab.comの運用および復旧手順について、複数の改善に取り組んでいます。

  ## タイムライン

  **UTC 23時00分頃：** 負荷の増加により、PostgreSQLセカンダリのレプリケーション処理に遅延が発生し始めました。セカンダリが必要とするWALセグメントがプライマリからすでに削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。この作業には、セカンダリ上の既存のデータディレクトリを削除し、`pg_basebackup`を実行して、プライマリからセカンダリへデータベースをコピーすることが含まれます。エンジニアの1人がセカンダリにアクセスしてデータディレクトリを消去し、`pg_basebackup`を実行しました。残念ながら、`--verbose`オプションを指定していたにもかかわらず、`pg_basebackup`は意味のある出力を一切出さないまま応答しなくなりました。

  **UTC 23時30分頃：** エンジニアの1人が、以前の実行試行時に`pg_basebackup`がセカンダリのPostgreSQLデータディレクトリ内に何らかのファイルを作成したのではないかと考えました。通常、このような場合には`pg_basebackup`はエラーを表示しますが、当該エンジニアには実際に何が起きているのか、確信が持てませんでした。後になって、（当時その場にいなかった）別のエンジニアにより、これは正常な動作であることが判明しました。つまり、`pg_basebackup`はプライマリがレプリケーションデータの送信を開始するのを待ち、それまでは何も出力せずに待機し続けるのです。残念ながら、このことは当社のエンジニアリング用ランブックにも、公式の`pg_basebackup`ドキュメントにも、明確には記載されていませんでした。

  レプリケーション処理を復旧しようとして、あるエンジニアがPostgreSQLのデータベースディレクトリの消去を実行しました。セカンダリ上で作業していると誤って思い込んでいたのです。残念ながら、この処理は実際にはプライマリ上で実行されました。エンジニアは誤りに気付いてから1～2秒後に処理を中断しましたが、その時点ですでに約300 GBのデータが削除されていました。

  データベースを復旧できるのではないかと望みを託し、作業に関わったエンジニアたちはデータベースのバックアップを探し、Slackで支援を求めました。残念ながら、バックアップを見つけることも、それを使用することも、どちらも完全に失敗しました。

  ## 機能していなかった復旧手順

  ### pg_dumpを使用したデータベースバックアップ

  `pg_dump`によるバックアップを探したところ、存在しないことが判明しました。S3バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調べたところ、バックアップ手順では`pg_dump` 9.2が使用されている一方、当社のデータベースではPostgreSQL 9.6が稼働していることが分かりました（PostgreSQLでは、9.x系の各リリースはメジャーリリースと見なされます）。メジャーバージョンが異なると`pg_dump`がエラーを出力し、バックアップ手順が終了してしまいます。

  [...]

  エラーが発生したcronジョブについては通知が有効になっていましたが、これらの通知は電子メールで送信されていました。GitLab.comではDMARCを使用しています。残念ながら、cronジョブの電子メールではDMARCが有効になっていなかったため、受信側で拒否されていました。そのため、手遅れになるまで、私たちはバックアップが失敗していることに一度も気付きませんでした。

  ### Azureディスクスナップショット

  NFSサーバーでは有効になっていたものの、データベースサーバーではいずれも有効になっていませんでした。ほかのバックアップ手順で十分だと考えていたためです。

  ## 根本原因分析

  これらの問題の根本原因を分析するために、「5 Whys（5回のなぜ）」と呼ばれる手法を使用します。このインシデントは、「GitLab.comが停止したこと」と「GitLab.comの復旧に長時間を要したこと」という、主に2つの問題に分けて考えます。

  ### 問題2：GitLab.comの復旧に18時間以上を要した

  **なぜ標準的なバックアップ手順を使用できなかったのか？**
  - 標準的なバックアップ手順では、`pg_dump`を使用してデータベースの論理バックアップを実行します。この手順は、GitLab.comがPostgreSQL 9.6上で稼働しているにもかかわらず、PostgreSQL 9.2を使用していたため、警告なく失敗していました。

  **なぜバックアップ手順は警告なく失敗したのか？**
  - 失敗時には通知が送信されていましたが、電子メールが拒否されたため、失敗を示すものは何もありませんでした。送信元は自動化された処理であり、ほかにエラーを報告する手段もありませんでした。
