  **関羽（かんう）**

  字は雲長。青龍偃月刀を手に「武聖」と謳われた、蜀の五虎大将筆頭。劉備・張飛と桃園の義を結び、乱世を駆け抜けた。曹操の厚遇にも動じず、恩を返して劉備のもとへ立ち去る義の厚さは天下の逸話。顔良を斬り、荊州を守り、樊城の戦いでは水攻めで敵軍を壊滅させ、その武勇は敵味方を問わず恐れられた。しかし、盟友の裏切りにより呉・魏の挟撃を受け、麦城にて孤軍奮闘。ついに力尽き、子・関平と共に散った。死してなお、後世の人々に「関帝」として崇められ、義と忠の象徴として語り継がれる。その威風堂々たる長髯と、義を貫き通した生き様は、まさに千古不滅の英雄の証なり。

  （約300字）
