  # 最後の川

  デジタル化が完了した年、男はあることに気づいた。世界中の川の名が、順に変わっていたのだ。

  アマゾン川が、最初だった。地図アプリを開くと、南米の大河には「アマゾン・プライム川」と表示されていた。誤表記かと思ったが、翌日にはナイル川が「アレクサ川」、ガンジス川が「エコー川」に変わっていた。各国政府が命名権を売却したというニュースは、ほとんど話題にならなかった。人々はもう、川の名前など気にしなかった。

  男は地理教師だった。授業で旧い呼び名を教えても、生徒たちは「検索にヒットしないので点数になりません」と言う。男は老いた川の名前を、夜な夜なノートに書き写した。ミシシッピ。ユーフラテス。ドナウ。ライン。書き終えるたび、インクが薄れていくような気がした。

  そしてある朝、男は驚いた。最後まで残っていた長江に、新しい名前がついていたのだ。

  「大和川」——それは男の故郷の、川幅わずか数十メートルの小さな川の名だった。少年のころ、父と釣りをした川。世界のどの企業も買おうとしなかった名を、男は十年前、広告収入で地図アプリに登録していたのだった。

  男は窓を開けた。遠くで、長江は何百年ぶりかに、小さな川の名で呼ばれながら、黙々と流れていた。

  ---

  **オチ解説**

  企業による命名権買収というディストピア的な設定で「アマゾン川」をネタにしながら、実はオチは逆転です。主人公がかつて私費で登録した故郷の小さな川の名前「大和川」が、なぜか世界最大級の長江の名として表示される——それは、検索順位や広告価値というデジタルの論理が極まった世界で、唯一「お金で買われなかった記憶」が逆に世界を制してしまったという皮肉です。巨大なもの（アマゾン＝企業）がすべてを飲み込んだ末に、個人の小さな思い出だけが最後に残った、という構造の逆説的なハッピーエンド（？）を狙いました。
