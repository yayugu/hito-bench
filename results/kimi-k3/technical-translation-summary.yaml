  ## 要約：Gitホスティングをスケールさせる技術的挑戦と「Continuity」の設計

  Gitの大規模ホスティングが難しい根本原因は、packfileベースの設計にある。リポジトリはSHA-1でアドレス可能なDAG構造だが、操作のたびにDAGを逐次探索する必要があり、分散KVSへの単純マッピングは往復遅延で破綻する(GoogleのJGit+DHTの試みも失敗)。さらにpackfile内のオブジェクト配置はデルタ圧縮のため物理的にランダムで、ネットワークFS(NFS/GFS/DRBD)とも相性が悪い(GitHubの初期の失敗)。

  GitHubのSpokesは「ローカルNVMe上の通常のGitリポジトリを3PCで完全同期レプリケーション」する方式で成功したが、3PCの水平スケール限界(レプリカ増でpush遅延悪化)と、ルーティングテーブル・チェックサム管理といった運用負荷が課題だった。

  そこでCursorの開発したContinuityは、S3互換ストレージ上のWAL(先行書き込みログ)を唯一の正とする設計を採用。pushはpackfileをWALエントリとしてS3に永続化し、参照トランザクションをCAS操作で原子的に記録することで線形化を保証。合意アルゴリズムやルーティングテーブルは不要で、ディスク上のリポジトリは「暖かいキャッシュ」にすぎず、rendezvous hashingで配置する。レプリケーションはUDPゴシップで楽観的に行い、読み取り時にETag条件付きGETでS3と検証(304なら即応答)することで、常に完全整合性を維持。コンパクションはプライマリのみが実行し、レプリカは結果をS3からダウンロードするだけでCPUを節約。

  結果、読み取りは100レプリカまで線形スケールし、pushはS3 Standardで120回/秒、S3 Express One Zoneで300回/秒を達成。モノレポは数百レプリカ、エージェント生成の大量小リポジトリは1レプリカ(アイドル時はGCしてWALから再構築)と柔軟に運用でき、「劣化時は常に正しく、健全時は常に速い」システムを実現している。
