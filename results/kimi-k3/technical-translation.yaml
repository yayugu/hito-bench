  # 1月31日のデータベース障害のポストモーテム

  2017年1月31日、当社の製品の一つであるオンラインサービス GitLab.com において、大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーからのデータの誤削除によって引き起こされました。このインシデントにより、GitLab.com のサービスは長時間にわたって利用不能となりました。また、最終的に復旧できなかった本番データの一部も失われました。

  [...]

  本番データを失うことは許容できません。このような事態が二度と起こらないよう、当社は GitLab.com の運用および復旧手順に関する複数の改善に取り組んでいます。

  ## タイムライン

  ± 23:00 UTC: 負荷の増加により、PostgreSQL セカンダリのレプリケーションプロセスが遅延し始めました。セカンダリが必要とする WAL セグメントがプライマリからすでに削除されていたため、レプリケーションは失敗しました。GitLab.com は WAL アーカイブを使用していなかったため、セカンダリは手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackup を実行してプライマリからセカンダリへデータベースをコピーする作業が含まれます。エンジニアの一人がセカンダリに移動してデータディレクトリを消去し、pg_basebackup を実行しました。残念ながら pg_basebackup は、--verbose オプションが設定されていたにもかかわらず、意味のある出力を出さずにハングしてしまいました。

  ± 23:30 UTC: エンジニアの一人は、以前の実行の試みの中で pg_basebackup がセカンダリの PostgreSQL データディレクトリに何らかのファイルを作成したのではないかと考えました。通常、このような場合 pg_basebackup はエラーを出力しますが、そのエンジニアは何が起こっているのか確信が持てませんでした。後になって、（当時その場にいなかった）別のエンジニアによって、これは正常な動作であることが明らかになりました。pg_basebackup はプライマリがレプリケーションデータの送信を開始するのを待ち、その時点まで黙って待機し続けるのです。残念ながら、このことは当社のエンジニアリング用ランブックにも、公式の pg_basebackup ドキュメントにも明確に記載されていませんでした。

  レプリケーションプロセスを復旧させようとして、あるエンジニアが PostgreSQL データベースディレクトリの消去を進めましたが、それはセカンダリで行っているつもりで、誤ってプライマリで実行してしまいました。そのエンジニアはミスに気づいてから1〜2秒後にプロセスを終了させましたが、この時点ですでに約 300 GB のデータが削除されていました。

  データベースを復旧できることを期待して、関係するエンジニアたちはデータベースのバックアップを探し、Slack で助けを求めました。残念ながら、バックアップを見つけることも、それを使用することも完全に失敗に終わりました。

  ## 破綻していた復旧手順

  ### pg_dump を使用したデータベースバックアップ

  pg_dump のバックアップを探しに行ったところ、それが存在しないことが判明しました。S3 バケットは空であり、最近のバックアップはどこにも見つかりませんでした。詳しく調べたところ、バックアップ手順は pg_dump 9.2 を使用していたのに対し、当社のデータベースは PostgreSQL 9.6 で稼働していることが分かりました（PostgreSQL では、9.x のリリースはメジャーバージョンとして扱われます）。メジャーバージョンの相違により pg_dump はエラーを発生させ、バックアップ手順は終了していました。

  [...]

  エラーが発生した cron ジョブに対して通知は有効になっていましたが、これらの通知はメールで送信されていました。GitLab.com では DMARC を使用しています。残念ながら、cron ジョブのメールに対して DMARC が有効になっていなかったため、受信側によって拒否されました。つまり、手遅れになるまで、私たちはバックアップが失敗していることにまったく気づいていなかったのです。

  ### Azure ディスクスナップショット

  NFS サーバーでは有効になっていましたが、他のバックアップ手順で十分だと考えていたため、データベースサーバーのいずれでもこれらのスナップショットは有効になっていませんでした。

  ## 根本原因分析

  これらの問題の根本原因を分析するために、「なぜなぜ分析（The 5 Whys）」と呼ばれる手法を使用します。このインシデントを2つの主要な問題に分けます。GitLab.com がダウンしたこと、そして GitLab.com の復旧に長時間を要したことです。

  ### 問題2: GitLab.com の復旧に18時間以上かかった

  **なぜ標準的なバックアップ手順を使用できなかったのか？**
  - 標準的なバックアップ手順は、pg_dump を使用してデータベースの論理バックアップを実行するものです。この手順は、GitLab.com が PostgreSQL 9.6 で稼働しているのに対し、PostgreSQL 9.2 のものを使用していたため、通知されることなく失敗していました。

  **なぜバックアップ手順は通知されずに失敗したのか？**
  - 失敗時に通知は送信されていましたが、メールが拒否されていたため、失敗の兆候は一切ありませんでした。送信元は自動化されたプロセスであり、エラーを報告する他の手段はありませんでした。
