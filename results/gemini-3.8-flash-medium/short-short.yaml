  『お取り寄せ』

  男は泥にまみれ、まとわりつく熱気に喘ぎながら、鬱蒼と生い茂る巨大なシダ植物をナタで切り払っていた。

  頭上では極彩色の鳥が警戒の声を上げ、足元には猛毒を持つ蛇が潜んでいる。川に目をやれば、ピラニアや巨大ワニの気配が濃密に漂っていた。一歩足を踏み外せば生きては帰れない、まさに世界最大の魔境だ。

  そのとき、腰の防水ポーチから電子音が鳴り響いた。男は息を整えながら衛星携帯電話を取り出し、通話ボタンを押す。

  「もしもし、あなた？　頼んでおいたやつ、まだ届かないんだけど」

  電波の向こうから聞こえてきたのは、エアコンの効いたリビングで寛いでいる妻ののんびりとした声だった。

  男は額の汗を腕でぬぐい、飛び交う巨大な蚊を追い払いながら叫んだ。

  「す、すまない！　今、ようやく目的の珍しいハーブを見つけたところだ！　これから採取して、小型ボートで激流を下り、最寄りの空港へ向かう。どんなに急いでも、日本に着くのは明日の夜になる！」

  「はあ？　何言ってるのよ。即日配送じゃないの？」

  「無茶を言うな！　ここは地球の裏側だぞ！　命がけでサバイバルしてるんだ！」

  電話の向こうで、妻が深くため息をつく気配がした。

  「あなた、先週から急にパスポート持って飛び出していったと思ったら……まさか、本当に南米まで行ったの？」

  「当たり前だろ！　お前が出張前の俺に言ったんじゃないか。『アマゾンで珍しいハーブの種を注文しといて』って！」

  一瞬の沈黙のあと、妻は呆れ返った声で言った。

  「ネット通販のほうに決まってるでしょ。スマホでポチッと押しなさいよ」

  ---

  【オチの解説】
  妻はネット通販サイトの「Amazon」でハーブの種を購入しておくよう頼んだつもりでしたが、夫は南米の「アマゾン熱帯雨林」へ行って現物を直接手に入れることだと勘違いしてしまい、命がけの採取ツアーに出てしまった、という言葉の取り違えによるオチです。サバイバル描写をシリアスに描くことで、勘違いのスケールの大きさと日常のズレを際立たせています。
