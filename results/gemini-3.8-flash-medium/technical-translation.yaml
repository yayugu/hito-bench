  1月31日のデータベース障害に関する事後検証（ポストモーテム）

  2017年1月31日、当社製品の一つであるオンラインサービス「GitLab.com」において、大規模なサービス停止が発生しました。この停止は、プライマリデータベースサーバーから誤ってデータを削除してしまったことが原因でした。このインシデントにより、GitLab.comのサービスは何時間にもわたり利用できなくなりました。また、最終的に復旧できなかった本番データも一部失われました。

  [...]

  本番データの喪失は決して許されることではありません。このような事態の再発を防ぐため、当社はGitLab.comの運用および復旧手順に関して複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC: 負荷の増加に伴い、PostgreSQLセカンダリのレプリケーションプロセスに遅延が生じ始めました。セカンダリが必要とするWALセグメントがプライマリからすでに削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーする作業が伴います。エンジニアの1人がセカンダリにアクセスしてデータディレクトリを消去し、pg_basebackupを実行しました。残念ながら、--verbose オプションが設定されていたにもかかわらず、pg_basebackup はハングアップし、有意な出力を一切行いませんでした。

  ± 23:30 UTC: あるエンジニアが、前回の実行試行時にpg_basebackupがセカンダリのPostgreSQLデータディレクトリ内に何らかのファイルを作成したのではないかと考えました。通常、このような場合にはpg_basebackupがエラーを出力しますが、該当のエンジニアは何が起きているのか確信が持てずにいました。後に（その場にいなかった）別のエンジニアによって、これは正常な動作であることが明らかになります。pg_basebackupはプライマリがレプリケーションデータの送信を開始するのを待ち、その時が来るまで何も出力せず静かに待機する仕様だったのです。残念ながら、この挙動は当社の技術運用手順書（ランブック）にも公式のpg_basebackupのドキュメントにも明確には記載されていませんでした。

  レプリケーションプロセスの復旧を試みる中、あるエンジニアがPostgreSQLのデータベースディレクトリの消去を進めましたが、セカンダリ側で作業していると誤認していました。不幸にも、この処理はプライマリ側で実行されてしまいました。エンジニアはミスに気づいて1〜2秒後にプロセスを強制終了したものの、この時点で約300 GBのデータがすでに削除されてしまっていました。

  データベースを復旧できることを期待して、関係エンジニアたちはデータベースのバックアップを探し、Slackで助けを求めました。残念なことに、バックアップの検索および利用プロセスの両方が完全に失敗しました。

  破綻していた復旧手順

  pg_dump を使用したデータベースバックアップ

  pg_dumpによるバックアップを探しに行ったところ、バックアップが存在しないことが判明しました。S3バケットは空で、最近のバックアップはどこにも見当たりませんでした。詳しく調査した結果、データベースはPostgreSQL 9.6で稼働している（Postgresでは9.xのリリースがメジャーバージョンと見なされます）のに対し、バックアップ手順ではpg_dump 9.2が使用されていたことがわかりました。メジャーバージョンの不一致によりpg_dumpでエラーが発生し、バックアップ処理が途中で終了していたのです。

  [...]

  エラーが発生したcronジョブに対する通知は有効化されていたものの、それらの通知はメールで送信されていました。GitLab.comではDMARCを使用しています。あいにくcronジョブからのメールにはDMARCが設定されていなかったため、受信側で拒否されていました。このため、手遅れになるまでバックアップが失敗していることに全く気付くことができませんでした。

  Azureディスクスナップショット

  NFSサーバー向けには有効化されていたものの、他のバックアップ手順で十分であると思い込んでいたため、データベースサーバーのいずれに対してもこれらのスナップショットは有効化されていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するために、「なぜなぜ分析（5 Whys）」と呼ばれる手法を用います。今回のインシデントを「GitLab.comがダウンしたこと」と「GitLab.comの復旧に長い時間がかかったこと」という2つの主要な問題に分解して分析します。

  問題2：GitLab.comの復旧に18時間以上を要したこと。

  なぜ標準のバックアップ手順を利用できなかったのか？
  - 標準のバックアップ手順では、pg_dumpを使用してデータベースの論理バックアップを実行します。しかし、GitLab.comがPostgreSQL 9.6で動作しているのに対し、バックアップ手順ではPostgreSQL 9.2が使用されていたため、この処理はエラーを通知することなく暗黙的に失敗していました。

  なぜバックアップ手順は暗黙的に失敗したのか？
  - 失敗時に通知メールは送信されていたものの、メールが拒否されたため、失敗を示す兆候が届きませんでした。送信元は自動化されたプロセスであり、他にエラーを報告する手段を持っていませんでした。
