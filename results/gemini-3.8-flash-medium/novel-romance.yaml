  第34話　お風呂上がりと、甘い熱

  　先にシャワーを浴び終えた俺は、自分の部屋のベッドに腰掛け、さっきから何度も深呼吸を繰り返していた。

  　さっき、俺たちは恋人同士になった。
  　あかねからの真っ直ぐな告白を受け止めて、想いを伝え合って、そしてキスをした。唇に残る柔らかな感触と甘い熱が、いまだに鮮明に焼き付いて離れない。
  　しかも今夜は、両親が旅行で不在。この広い家に、俺とあかねの二人きりだ。

  　洗面所の方から、ドライヤーの音ではなく、パタパタと素足でフローリングを踏む小さな足音が近づいてくる。
  　心臓が跳ね上がった。

  「お、おにぃ……あがったよ」

  　控えめにノックされて開いたドアの隙間から、ふわっと湯気と一緒に、俺の家で使っているはずのシャンプーの香りが漂ってきた。けれど、それはいつも自分が嗅いでいる匂いとはまるで違って、ひどく甘美で艶っぽく感じられる。

  「あ、ああ……おかえり」
  「おかえりって、へんなの」

  　あかねは照れくさそうに笑いながら、部屋の中へと入ってきた。
  　その姿を見た瞬間、俺は思わず息を呑んだ。
  　着替えとして渡した俺の大きめの白Ｔシャツとスウェットパンツを着ているのだが、当然ながらサイズが合っていない。襟元からは華奢な鎖骨が覗き、肩のラインが落ちて、裾は太もものあたりまで隠している。いわゆる『彼シャツ』状態だ。

  　お風呂上がりで上気した頬はほんのりと桜色に染まり、毛先がまだ少し湿った髪が首筋に張り付いている。
  　普段の元気で無邪気なあかねとは違う、無防備で、驚くほど色っぽい少女の姿がそこにあった。

  「ど、どうかな……？　やっぱり、ぶかぶかすぎ？」
  「い、いや……すげえ似合ってる。っていうか、かわいすぎる」
  「も、もう！　すぐそういうこと言う……」

  　あかねは両手で真っ赤になった顔を覆い、指の隙間から上目遣いに俺を見てくる。その仕草すら反則的に可愛い。

  「あ、髪、まだちょっと濡れてるな。ドライヤー持ってくるから、乾かしてやるよ」
  「えっ、おにぃがやってくれるの？」
  「うん。座ってて」

  　平静を装って立ち上がり、洗面所からドライヤーを取ってきた。
  　ベッドの縁にちょこんと腰掛けたあかねの背後に回り、コンセントを差してスイッチを入れる。

  　ブオォォ、と温風が吹き出す。
  　俺はおそるおそる、あかねの黒髪に指を通した。
  　指先に触れる髪は絹のように細くて柔らかい。温風にあおられて、あかね自身の甘い体温と香りが立ち上り、鼻腔をくすぐる。

  「……ん」
  「痛くないか？」
  「ううん、すっごく気持ちいい。おにぃの手、あったかいね」

  　あかねが気持ちよさそうに目を細めた。
  　田舎にいた頃、小さなあかねの髪をこうして乾かしてやった記憶がよみがえる。あの頃は妹を世話するような感覚だったのに、今は指先が触れるたびに、心臓が爆発しそうなくらい高鳴っている。
  　うなじの白さや、Ｔシャツの隙間から覗く肌の質感に、どうしても視線がいってしまう。いけないと分かっていても、意識せずにはいられない。

  「……あかね」
  「なに？　おにぃ」
  「なんでもない。……よし、乾いたぞ」

  　スイッチを切ると、部屋の中に急な静寂が戻ってきた。
  　聞こえるのは、時計の秒針の音と、重なるふたりの呼吸音だけ。

  「ありがと、おにぃ」

  　あかねが振り返り、にこっと笑う。さらさらと揺れる黒髪が綺麗で、俺はドライヤーを床に置いたあと、吸い寄せられるようにあかねの隣に腰を下ろした。

  　わずか十数センチの距離。
  　肩と肩が触れ合いそうな距離に座ると、あかねの身体から立ち上る熱気が直に伝わってくる。
  　さっきまでのぎこちなさとは違う、甘くて重い緊張感がふたりの間に満ちていく。

  「あのね、おにぃ」
  「ん？」

  　あかねが、おずおずと小さな手を伸ばし、俺の着ているシャツの裾をきゅっと掴んだ。
  　俯いていて表情は見えないが、耳の先まで真っ赤になっているのが分かる。

  「あたしね……今日、夢みたい。ずっとずっと、おにぃのことが好きだったから……東京に来て、ちゃんとおにぃの彼女になれるなんて、思ってなかった」
  「あかね……」
  「今もね、すっごくドキドキしてて、胸が痛いくらいなの。……おにぃは？　あたしのこと、本当に好きになってくれた？」

  　確認するように、すがるように見上げてくる瞳が、濡れたように潤んでいる。
  　不安と期待が入り混じったその瞳を見ていたら、愛おしさが胸の奥から溢れ出して、たまらなくなった。

  「好きだよ。……東京に戻ってからも、ずっとあかねのこと考えてた。今日だって、あかねと一緒にいられて、世界中で一番幸せだって思ってる」

  　俺は、裾を握りしめていたあかねの手に、自分の手を重ねた。
  　あかねの手は小さくて、少しだけ震えていた。指を絡ませて恋人繋ぎにすると、あかねが小さく息を呑む。

  「おにぃの手、大きい……」
  「あかねの手が小さいんだよ」

  　ぎゅっと握り返すと、あかねは安心したようにふにゃりと眉を下げて笑った。
  　そして、するりと身を寄せてきて、俺の肩にこてんと頭を乗せてくる。

  「あったかい……ねえ、おにぃ。あたし、今日ここに来て本当によかった」
  「俺もだよ。来てくれてありがとう」

  　空いている左手で、あかねの華奢な肩を抱き寄せた。
  　薄いＴシャツ越しに伝わってくる柔らかな身体の感触。あかねの小さな心臓が、トクトクと速いリズムを刻んでいるのが直に伝わってくる。俺の心臓の音も、絶対に聞こえているはずだ。

  「おにぃの心臓、すっごく速い……」
  「あかねのだって、かなり速いだろ」
  「だって……こんなの、緊張するもん」

  　あかねは肩に顔を埋めたまま、くぐもった声で呟いた。
  　甘い匂いが、すぐ鼻先で弾ける。抱きしめている腕に力を込めると、あかねも俺の腰に両手を回し、ぎゅっと抱きついてきた。

  「おにぃ……」
  「ん？」
  「あたしね、今日……おにぃの特別になりたい」

  　顔を上げたあかねの瞳は、恥ずかしさに潤みながらも、真っ直ぐに俺を捉えていた。
  　その唇が、触れ合うほどの間近で、熱い吐息とともに紡がれる。

  「おにぃの全部、あたしにちょうだい……？」

  　その甘いおねだりに、理性の箍が音を立てて外れるのが分かった。
  　俺はあかねの頬に優しく手を添え、たまらずその唇を塞いでいた。
