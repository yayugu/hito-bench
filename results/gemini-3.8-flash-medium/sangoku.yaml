  **【関羽 雲長】**

  劉備、張飛と義兄弟の契りを結び、蜀漢建国の礎を築いた「軍神」。並外れた武勇と高潔な義節を誇り、敵である曹操からも深く敬慕されたが、常に劉備への忠義を貫き通した。

  蜀の建国後は要衝・荊州の防衛を一任される。樊城の戦いでは魏軍を圧倒し、天下にその武名をとどろかせたが、同盟関係にあった呉の裏切りにより背後を突かれて孤立。退路を断たれながらも誇り高く抗戦を続け、最期は麦城にて子の関平とともに露と消えた。

  その義に生きた劇的な生涯と圧倒的な強さは敵味方問わず称賛され、後世には神（関聖帝君）として広く信仰されることとなった。

