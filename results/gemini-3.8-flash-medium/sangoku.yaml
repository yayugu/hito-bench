  **【神威轟く、至高の義刃】**

  劉備、張飛と「桃園の誓い」を結び、義の炎を燃やして乱世を切り拓いた蜀の象徴。敵将・曹操からの破格の厚遇を振り切り、主への忠義を貫き通した生き様は、敵味方を超えて畏敬の念を集めた。神馬・赤兎を駆り、大刀「青龍偃月刀」を薙ぎ払う姿はまさに荒ぶる龍そのもの。

  蜀建国後は最前線たる荊州を死守し、天下を震撼させる猛威を振るうも、魏と呉の挟撃を受けて麦城へと追い詰められる。刃折れ矢尽きるまで誇り高く戦い抜き、壮絶な最期を遂げた。死してなおその魂は潰えず、「軍神」として後世に神格化され、永遠の武名として君臨している。

