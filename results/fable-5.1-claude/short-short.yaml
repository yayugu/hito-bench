  **置き配**

  探検家は、生涯をひとつの言葉に捧げてきた。未踏の地、である。

  だが地球は、もう狭かった。極地は観光地になり、深海には潜水艇が列をなし、ヒマラヤの山頂ではゴミの回収が議論されていた。衛星は地表の隅々まで撮り尽くし、人類の足あとがないのは、地図の余白ではなく、地図の縮尺の中だけだった。

  それでも探検家は諦めなかった。最後の望みをアマゾンに託した。緑の海。あの樹冠の下だけは、衛星の目も届かない。

  出発の前夜、荷造りを終えた探検家は、酒を一杯やった。ふと悪戯心が起こり、ノートパソコンを開いた。なんでも売っている、という評判の通販サイトだ。検索窓に、こう打ち込んだ。

  「未踏の地」

  該当する商品はありません、と出た。当然だ。探検家は笑い、ついでに「入荷したらお知らせ」の通知を登録して、パソコンを閉じた。

  それから三年。

  探検家は川をさかのぼり、支流を、さらにその支流をたどった。ガイドが引き返し、地図が白くなり、GPSの表示が「測位中」のまま動かなくなった。虫と雨と沈黙。やがて木々の間に、なにかが開けた。小さな空き地だった。

  人の手の入った形跡はどこにもない。足あとも、焚き火の跡も、削られた樹皮も。

  ここだ、と探検家は思った。膝が震えた。彼は空き地の中央までゆっくりと歩き、その一歩一歩を噛むように味わった。人類最初の足あと。

  野営し、眠った。

  翌朝、テントの入口を開けると、段ボール箱が置いてあった。

  茶色の、ありふれた段ボール箱。にやりと笑ったような矢印のロゴ。空き地の、ちょうど真ん中に、ぽつんと。周囲の湿った土には、探検家自身の足あと以外、なにも刻まれていなかった。

  伝票には彼の名前があった。届け先の欄には「現在地」とだけ。

  商品名、「未踏の地　1点」。

  備考に印字されていた。「ご登録いただいた商品が入荷いたしましたのでお届けします。ご対応がなかったため、置き配いたしました。」

  探検家は箱を開けた。

  中は空だった。

  彼はしばらく箱の底を見つめていた。それから、思い当たった。そうだ。届いたとき、もう未踏ではないのだ。誰かが運んできた時点で。いや、自分が踏み入れた時点で。この商品は、受け取ると同時に消える。

  探検家はスマホを取り出した。三年ぶりに、アンテナが一本だけ立っていた。通知が一件。

  「ご購入ありがとうございます。この商品は現在、在庫切れです。次回の入荷予定はありません。」

