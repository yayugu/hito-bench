  **オチの解説**

  - **「アマゾン」の二重の意味**が仕掛けの土台です。探検家は熱帯雨林のアマゾンに最後の未踏の地を求めますが、届いたのは通販のアマゾンの箱でした。彼が逃げ込んだ先まで、もう一方のアマゾンは配達圏内だったわけです。

  - **箱が空である理由**は、「未踏の地」という商品の性質にあります。誰かが到達した瞬間に未踏ではなくなるので、届けられた時点で中身は消えています。探検家が「人類最初の足あと」を刻んで味わった行為そのものが、商品を消費する行為でした。

  - **足あとのない配達**をあえて説明していません。ドローンなのか、別の何かなのか。「どうやって届いたか分からないのに届いてしまう」ことが、もう地球上に手つかずの場所はないという不気味さを担っています。

  - **三年ぶりに立ったアンテナ一本**も同じ意味です。電波が届くなら、そこは秘境ではありません。

  - **最後の「在庫切れ、次回入荷予定なし」**が本当の落とし所です。彼が受け取ったのは地球に残っていた最後の一点でした。生涯をかけて未踏の地を求めた男が、それを自分の手で地球から消し去ってしまった、という皮肉で締めています。
