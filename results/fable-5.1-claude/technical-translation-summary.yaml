  Cursorが開発したGitストレージ「Continuity」の設計を解説した記事です。技術的に面白い点を要約します。

  **Gitホスティングが難しい理由**
  Gitのオブジェクトは内容のSHA-1でアドレスされるため分散KVSと相性が良さそうに見えますが、実際の操作はDAGを一歩ずつ辿る必要があり、各ステップでラウンドトリップが発生すると致命的に遅くなります。さらにpackfile内のオブジェクト配置はサイズ最小化が優先されデルタ圧縮されているため、ディスク上でもランダムアクセスになります。このためNFSやDRBDなどの分散ファイルシステムは全て失敗し、「ローカルNVMe上の素のGitリポジトリ」が事実上の必須条件になっています。

  **Spokesの限界**
  GitHubのSpokesは、pushをpackfileと参照トランザクションに分離し、前者は非同期でファンアウト、後者だけを3PCで合意するという巧妙な設計です。しかし合意のレイテンシが最も遅いノードに縛られるため、レプリカを増やすほどpush性能が落ちます。また各コピーが真実の源となるため、ルーティングテーブルやチェックサム管理など運用負荷が高いという問題もあります。

  **Continuityの設計**
  真実の源をS3上のWALに置き、ローカルのGitリポジトリは単なるキャッシュとして扱います。WALインデックスの更新はS3のCASで直列化されるため、どのノードがprimaryになっても正しく動作し、合意アルゴリズムも外部DBも不要です。レプリケーションはUDPゴシップという信頼性のない手段で行いますが、読み取り時にETag付き条件付きGETでS3と照合するため常に強い一貫性が保たれます。「劣化時は常に正しく、健全時は常に速い」という原則です。

  レプリカ数は1から数百まで自由に伸縮でき、アイドルなリポジトリはディスクから削除してWALから再構築できます。CPU負荷の高いrepackはprimaryのみが実行し、他レプリカは圧縮済みpackをS3からダウンロードするだけで済みます。実測では100レプリカで読み取りが線形にスケールし、S3 Express One Zoneでは300 push/秒を超え、ボトルネックはGit自体のcompaction速度になったとのことです。
