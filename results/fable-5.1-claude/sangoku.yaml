  **関羽 雲長（かんう うんちょう）**

  河東郡解県の出身。若き日に不正な役人を斬って故郷を離れ、涿県で劉備・張飛と出会い、義兄弟の契りを結ぶ。以後、劉備の右腕として各地を転戦し、その武勇と忠義は敵将にも一目置かれた。一時は曹操の下に降るが、白馬の戦いで顔良を討って恩を返すと、義を守って劉備の元へ帰参する。赤壁の戦いの後は荊州を任され、蜀漢の要衝を一人で守り抜く。建安二十四年、樊城を攻めて于禁を降し龐徳を斬るが、背後を呉の呂蒙に襲われ、荊州を失陥。麦城に退くも捕らえられ、生涯を終えた。死後は「関帝」として神格化され、今なお忠義の象徴として崇められている。

