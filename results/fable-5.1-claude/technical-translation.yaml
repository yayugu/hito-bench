  1月31日のデータベース障害に関するポストモーテム

  2017年1月31日、当社の製品の一つであるオンラインサービスGitLab.comにおいて、大規模なサービス障害が発生しました。この障害の原因は、プライマリデータベースサーバーからデータを誤って削除してしまったことです。このインシデントにより、GitLab.comのサービスは何時間にもわたって利用できない状態となりました。また、一部の本番データを失い、最終的に復旧することができませんでした。

  [...]

  本番データの損失は許容できるものではありません。このような事態が再び起きないよう、GitLab.comの運用手順および復旧手順について複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC：負荷の増大により、PostgreSQLセカンダリのレプリケーション処理に遅延が生じ始めました。セカンダリが必要とするWALセグメントがすでにプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーする作業が含まれます。エンジニアの一人がセカンダリに入り、データディレクトリを削除した上でpg_basebackupを実行しました。しかし残念ながら、--verboseオプションを指定していたにもかかわらず、pg_basebackupは意味のある出力を何も出さずにハングしてしまいました。

  ± 23:30 UTC：エンジニアの一人が、先ほどのpg_basebackup実行の試みの際に、セカンダリのPostgreSQLデータディレクトリ内に何らかのファイルが作成されてしまったのではないかと考えました。通常この場合pg_basebackupはエラーを表示するのですが、当該エンジニアは何が起きているのかよく分かっていませんでした。後に（その時点では不在だった）別のエンジニアによって、これは正常な動作であることが明らかになります。pg_basebackupはプライマリがレプリケーションデータの送信を開始するのを待機し、それまでは何も出力せずにじっと待ち続けるのです。残念ながら、この点は当社のエンジニアリング用ランブックにも、pg_basebackupの公式ドキュメントにも明確に記載されていませんでした。

  レプリケーション処理を復旧させようとして、エンジニアはPostgreSQLのデータベースディレクトリの削除に着手しました。セカンダリ上で作業しているものと誤って思い込んでいたのです。しかし不運なことに、この処理はプライマリ上で実行されてしまいました。エンジニアは自分の誤りに気づいてから1〜2秒後にプロセスを停止しましたが、その時点ですでに約300GBのデータが削除されていました。

  データベースを復元できることを期待して、関係したエンジニアたちはデータベースのバックアップを探し、Slackで助けを求めました。しかし残念ながら、バックアップを見つけることも、それを使用することも、完全に失敗に終わりました。

  機能していなかった復旧手順

  pg_dumpによるデータベースバックアップ

  pg_dumpによるバックアップを探しに行ったところ、それらが存在しないことが判明しました。S3バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調査した結果、バックアップ手順ではpg_dump 9.2が使用されていたのに対し、当社のデータベースはPostgreSQL 9.6で稼働していることが分かりました（Postgresでは9.xの各リリースはメジャーバージョンとみなされます）。メジャーバージョンの相違によりpg_dumpがエラーを出し、バックアップ処理が中断されていたのです。

  [...]

  エラーを起こしたcronジョブについては通知が有効になっていましたが、これらの通知はメールで送信されます。GitLab.comではDMARCを使用しています。しかし残念ながら、cronジョブのメールにはDMARCが有効になっておらず、その結果、受信側で拒否されていました。つまり、手遅れになるまで、私たちはバックアップが失敗していることを一切把握していなかったのです。

  Azureディスクスナップショット

  NFSサーバーでは有効になっていましたが、データベースサーバーではスナップショットが一切有効になっていませんでした。他のバックアップ手順で十分だと想定していたためです。

  根本原因分析

  これらの問題の根本原因を分析するため、「5つのなぜ（The 5 Whys）」と呼ばれる手法を用います。今回のインシデントを、GitLab.comがダウンしたこと、およびGitLab.comの復旧に長時間を要したこと、という2つの主要な問題に分けて考えます。

  問題2：GitLab.comの復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使えなかったのか？
  - 標準のバックアップ手順では、pg_dumpを用いてデータベースの論理バックアップを行います。この手順は、GitLab.comがPostgreSQL 9.6で稼働しているのに対しPostgreSQL 9.2を使用していたため、静かに（エラーが表面化しないまま）失敗していました。

  なぜバックアップ手順は静かに失敗したのか？
  - 失敗時には通知が送信されていましたが、メールが拒否されていたため、失敗の兆候は何も届きませんでした。送信元は自動化されたプロセスであり、エラーを報告する他の手段を持っていませんでした。
