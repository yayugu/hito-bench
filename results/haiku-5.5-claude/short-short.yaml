  **貨物信仰**

  南の島に、空から箱が降ってきたのは戦争の後だった。
  箱には缶詰や布や薬が入っていた。島の人々はそれを神様からの贈り物だと信じた。やがて飛行機は来なくなった。それでも彼らは、木で滑走路を作り、竹で管制塔を組み、木の無線機を耳にあてて、夜ごと空に祈った。
  「また箱が降りてきますように」

  大学の講義でその話を聞いたとき、学生たちは笑った。
  「バカだよね、勝手に神様にしちゃって」

  その夜、ぼくはスマホでアマゾンを開いた。いつもの手順で注文する。カートに入れて、購入ボタンを押して、念のためもう一度押す。明日か明後日には届くはずだ。
  画面の隅に、小さな文字が浮かんだ。
  「このお買い物で100ポイント貯まりました」
  ぼくは数字を眺めてから、ふと窓の外を見上げた。星空の中を、ドローンの灯りがひとつ、ゆっくり近づいてくる。

  気づくと、ぼくは両手を合わせていた。

  ---

  **オチの解説**

  タイトルの「貨物信仰」は、英語の *cargo cult*（カーゴ・カルト）の訳語です。第二次世界大戦中、南太平洋の島々には米軍の輸送機から大量の物資が投下されました。戦後に物資が途絶えると、島の人々は滑走路や木製の無線機、竹の管制塔などを作り、飛行機と物資を呼び戻そうとしました。

  物語の「ぼく」は、その話を笑って聞きます。ところが、ネット通販の操作を見ると、同じ構造が見えてきます。

  - **儀式的な操作**：注文ボタンを何度も押す、ポイントを確かめる。
  - **空から降ってくる箱**：ドローン配送は、島の人々にとっての飛行機と重なります。
  - **届くことを信じて待つ**：「明日か明後日には届く」という期待そのものが祈りに近いものです。

  最後に「ぼく」が両手を合わせるのは、笑っていた相手と同じ振る舞いを自分もしていたことに、気づかされる瞬間です。

  なお、今回は「アマゾン」を通販サイトの意味で取りました。密林や大河のアマゾンで書くこともできますので、そちらがよければ書き直します。
