  2017年1月31日のデータベース障害に関する事後検証

  2017年1月31日、当社の製品の一つであるオンラインサービス GitLab.com で大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーのデータを誤って削除したことが原因です。この事象により、GitLab.com は数時間にわたって利用できない状態となりました。また、最終的に復旧できなかった本番データも一部失われました。

  [...]

  本番データの消失は許容できません。今後このようなことが起きないよう、GitLab.com の運用および復旧手順について複数の改善に取り組んでいます。

  タイムライン

  ・UTC 23:00 頃：負荷の増加により、PostgreSQL のセカンダリのレプリケーション処理が遅れ始めました。セカンダリが必要とする WAL セグメントは、プライマリからすでに削除されていたため、レプリケーションは失敗しました。GitLab.com では WAL アーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackup を実行してプライマリからセカンダリへデータベースをコピーする作業が含まれます。あるエンジニアがセカンダリでデータディレクトリを消去し、pg_basebackup を実行しました。しかし、--verbose オプションを指定していたにもかかわらず、pg_basebackup は意味のある出力をせず、処理が止まったように見えました。

  ・UTC 23:30 頃：あるエンジニアは、以前の実行時に pg_basebackup が PostgreSQL のセカンダリのデータディレクトリにファイルを作成したのではないかと考えました。通常であれば、その場合 pg_basebackup はエラーを出力しますが、当該エンジニアは何が起きているのかよく分かりませんでした。後になって、当時その場にいなかった別のエンジニアが、これは通常の動作であることを明らかにしました。pg_basebackup は、プライマリがレプリケーションデータを送信し始めるまで待機し、その間は沈黙したまま待ち続けるのです。残念ながら、このことは当社のエンジニアリング運用手順書にも、pg_basebackup の公式ドキュメントにも明確には記載されていませんでした。

  レプリケーションの復旧を試みる中で、あるエンジニアは、セカンダリで作業していると思い込んだまま PostgreSQL のデータベースディレクトリを消去しました。しかし、この処理は誤ってプライマリ上で実行されてしまいました。エンジニアは誤りに気づいてから一、二秒後にプロセスを停止しましたが、その時点で約 300 GB のデータがすでに削除されていました。

  データベースを復元するため、関係するエンジニアたちはバックアップを探し、Slack で助けを求めました。しかし、バックアップの発見と利用のいずれも完全に失敗していました。

  壊れていた復旧手順

  pg_dump によるデータベースバックアップ

  pg_dump のバックアップを探したところ、存在しないことが判明しました。S3 バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調べると、バックアップ処理は pg_dump 9.2 を使用していた一方、当社のデータベースは PostgreSQL 9.6 で稼働していました（PostgreSQL では 9.x の各リリースがそれぞれメジャーバージョンとみなされます）。メジャーバージョンが異なると pg_dump はエラーを出力し、バックアップ処理は終了してしまいます。

  [...]

  これらの cron ジョブでエラーが発生した場合の通知は有効になっていましたが、通知はメールで送信されていました。GitLab.com では DMARC を使用しています。残念ながら、cron ジョブのメールに DMARC が有効になっていなかったため、受信側で拒否されていました。その結果、バックアップが失敗していることに、手遅れになるまで気づけませんでした。

  Azure のディスクスナップショット

  これらのスナップショットは NFS サーバーでは有効になっていましたが、データベースサーバーではどれも有効になっていませんでした。他のバックアップ手順で十分だと考えていたためです。

  根本原因分析

  これらの問題の根本原因を分析するため、「5 Whys（なぜを5回繰り返す）」と呼ばれる手法を用います。インシデントを 2 つの主要な問題に分けます。GitLab.com が停止したこと、そして GitLab.com の復旧に長時間を要したことです。

  問題 2：GitLab.com の復旧に 18 時間以上かかった。

  なぜ標準のバックアップ手順を使えなかったのか？
  - 標準のバックアップ手順では、pg_dump を使ってデータベースの論理バックアップを取得していました。この手順は PostgreSQL 9.2 を使用していたため、静かに失敗していました。一方、GitLab.com は PostgreSQL 9.6 で稼働しています。

  なぜバックアップ手順は静かに失敗したのか？
  - 失敗時には通知が送信されていましたが、メールが拒否されたため、障害の兆候は一切ありませんでした。送信元は自動処理であり、エラーを報告する他の手段はありませんでした。
