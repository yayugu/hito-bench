response: 河東郡解県の出身。若き日に故郷で悪人を斬り、各地を流浪する。涿郡で劉備・張飛と出会い、桃園で義兄弟の契りを結ぶ。黄巾討伐で功を立て、以後は劉備に仕える。下邳で曹操に捕らえられるも厚遇を受け、赤兎馬と青龍偃月刀を授かる。やがて劉備の消息を知ると、恩に報いたうえで六将を斬り、関所を突破して劉備のもとへ帰還する。荊州を守り抜いたが、呉の呂蒙の策にはまって捕らえられ、建安24年、麦城にて斬られた。その武勇と義は、後に「関帝」として神格化されていく。
