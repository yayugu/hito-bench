response: |-
  Git をスケールさせてホストするのは難しい。サーバー上のリポジトリも開発者の PC と同じ構造なので、packfile へのランダムアクセスがボトルネックになる。オブジェクトを DHT に分散する案は `git clone` が遅すぎて断念され、NFS やブロック単位の複製も packfile のアクセスパターンと相性が悪く失敗した。

  GitHub の Spokes は、リポジトリをローカル NVMe に置いたまま 3 相コミット（3PC）で複数レプリカを強整合に同期する方式で、業界標準になった。ただし 3PC は最も遅いサーバーに律速されるため、レプリカを増やすと push 性能が落ちる。また、ディスク上のリポジトリが合意の真実なので、全コピーを慎重に管理する「ペット扱い」の運用負荷が大きい。

  Cursor の Continuity は、真実のソースを S3 上の書き込みログ（WAL）に置き、ローカルのリポジトリはキャッシュとして扱う。配置はリポジトリ ID からの rendezvous hashing で計算し、サーバー側は状態を持たない。push の整合性は S3 の CAS で保証し、レプリカは ETag 付きの条件付き GET で追従する。UDP の gossip が欠けても、読み取りは S3 で検証されるため常に正しい。圧縮はプライマリだけが行い、結果を WAL に載せて他のレプリカは圧縮済みパックをダウンロードするだけなので、CPU を重複して使わない。読み取りは 100 レプリカまで線形にスケールし、push は S3 Standard で約 120 回/秒、S3 Express One Zone で 300 回/秒超とされている。
