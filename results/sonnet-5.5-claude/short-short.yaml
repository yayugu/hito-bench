  **「置き配」**

  アマゾンの奥地で、探検家の田所は三日間迷っていた。食料は尽き、無線は壊れ、頭上では見たこともない鳥が嘲笑うように鳴いている。

  「ここまでか……」

  倒れ込んだ田所の目に、ふと妙なものが映った。ジャングルの巨木の根元に、茶色い段ボール箱がぽつんと置かれている。

  近づくと、箱には笑ったような矢印のロゴ。宛名はこう書かれていた。

  **「田所 剛 様」**

  震える手で箱を開けると、中には水のボトル、栄養バー、そして方位磁石とGPS端末が入っていた。端末には短いメッセージが表示されている。

  『ご注文ありがとうございます。最短ルートをご案内します』

  「注文なんか、していない……」

  そう呟きつつも、田所は水を飲み干し、端末の矢印に従って歩き出した。二時間後、木々の切れ間から川が見え、川辺には小さな船着き場があった。そこにも、箱がひとつ。

  宛名は「田所 剛 様」。中には、ボートの鍵と一枚の紙が入っていた。

  『本日中の配達を完了しました。商品にご満足いただけましたか? ぜひレビューをお願いします』

  田所は苦笑して、紙の裏に震える字で書いた。

  『★★★★★ 命拾いしました。ただ、迷ったのは私が、ですが、配達員さんの姿は一度も見ませんでした』

  書き終えて顔を上げると、川の向こう岸で、誰かが手を振っていた。

  長い黒髪に、褐色の肌。手には空の段ボール箱。

  その人物は、田所に向かって深々とお辞儀をすると、ジャングルの闇へすうっと消えた。

  田所は、ふと気づいた。ボートの鍵についていたタグに、小さくこう印字されている。

  **『配達完了:ご不在のため、最寄りの神様にお預けしました』**

  ---

  ## オチの解説

  **「アマゾン」の二重の意味**を軸にしたお話です。

  1. **ダブルミーニング**:「アマゾン(南米の熱帯雨林・アマゾン川)」と「Amazon(通販会社)」。奥地で遭難した探検家のもとに、通販のように荷物が次々と届くという、ミスマッチの面白さで進みます。

  2. **通販あるあるのパロディ**:「最短ルートをご案内」「本日中の配達完了」「レビューのお願い」など、通販サイトの文言が、遭難救助の場面でそのまま使われる可笑しさです。

  3. **最後のオチ**:通販の定番である「ご不在のため、近隣・指定場所にお預けしました」を、「**最寄りの神様にお預けしました**」に変えています。ジャングルの奥地には配達員がいない代わりに、荷物を届けた存在が**森の神(または精霊)**だったことが、この一文で明かされます。同時に、探検家の命が助かったのは、通販の便利さではなく、アマゾンの森の神の厚意だった、という含みも持たせています。

  なお、レビューの一文の「迷ったのは私が、ですが」の部分は、書き間違いで不自然な日本語になってしまいました。「★★★★★ 命拾いしました。ただ、配達員さんの姿は一度も見ませんでした」とするのが自然です。
