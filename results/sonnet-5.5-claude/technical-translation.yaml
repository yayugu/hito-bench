  1月31日のデータベース障害に関する事後検証

  2017年1月31日、当社のプロダクトの一つであるオンラインサービス「GitLab.com」において、大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーからデータを誤って削除してしまったことが原因です。このインシデントにより、GitLab.comのサービスは長時間にわたって利用できなくなりました。また、最終的に復旧できなかった本番データも一部失われました。

  [...]

  本番データの喪失は許容できません。これを二度と起こさないため、GitLab.comの運用およびリカバリ手順について、複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC:負荷の増加により、PostgreSQLセカンダリのレプリケーション処理が遅延し始めました。セカンダリが必要とするWALセグメントがすでにプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーする作業が含まれます。エンジニアの一人がセカンダリに移動してデータディレクトリを消去し、pg_basebackupを実行しました。しかし残念ながら、pg_basebackupは--verboseオプションを指定していたにもかかわらず、意味のある出力を一切出さずにハングしてしまいました。

  ± 23:30 UTC:エンジニアの一人が、それまでの実行の試行中にpg_basebackupがセカンダリのPostgreSQLデータディレクトリ内にファイルを作成してしまったのではないかと考えました。通常、そのような場合pg_basebackupはエラーを出力しますが、当該エンジニアは何が起きているのかよく分かりませんでした。後になって、(当時不在だった)別のエンジニアにより、これは通常の動作であることが明らかになりました。pg_basebackupは、プライマリがレプリケーションデータの送信を開始するのを待ち、それまでは何も出力せずにじっと待機します。残念ながら、このことはエンジニア向けのランブックにも、公式のpg_basebackupのドキュメントにも明確に記載されていませんでした。

  レプリケーション処理を復旧しようとして、エンジニアはPostgreSQLのデータベースディレクトリを消去する作業に進みましたが、セカンダリ上で行っていると誤って思い込んでいました。残念ながら、この処理は実際にはプライマリ上で実行されていました。エンジニアは間違いに気づいてから1〜2秒後に処理を中断しましたが、その時点ですでに約300GBのデータが削除されていました。

  データベースを復元できることを期待して、関係したエンジニアたちはデータベースのバックアップを探し、Slackで助けを求めました。しかし残念ながら、バックアップの発見と利用のどちらのプロセスも完全に失敗しました。

  機能しなかったリカバリ手順

  pg_dumpによるデータベースバックアップ

  pg_dumpのバックアップを探しに行ったところ、それが存在しないことが判明しました。S3バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調べたところ、バックアップ手順ではpg_dump 9.2が使われていた一方で、当社のデータベースはPostgreSQL 9.6で稼働していることが分かりました(Postgresでは9.xのリリースがメジャーバージョンとみなされます)。メジャーバージョンが異なるとpg_dumpはエラーを出し、バックアップ手順が終了してしまいます。

  [...]

  エラーになったcronジョブについては通知が有効になっていましたが、これらの通知はメールで送信されます。GitLab.comではDMARCを使用しています。残念ながら、cronジョブのメールにはDMARCが有効化されておらず、受信側に拒否されてしまいました。このため、手遅れになるまでバックアップの失敗に気づくことがありませんでした。

  Azureのディスクスナップショット

  NFSサーバーでは有効になっていましたが、他のバックアップ手順で十分だろうと考えていたため、データベースサーバーではいずれもスナップショットが有効になっていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するために、「5つのなぜ」と呼ばれる手法を使用します。インシデントを大きく2つの問題に分けます。GitLab.comがダウンしたことと、GitLab.comの復旧に長い時間がかかったことです。

  問題2:GitLab.comの復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使えなかったのか?
  - 標準のバックアップ手順では、pg_dumpを使ってデータベースの論理バックアップを取得します。この手順は、GitLab.comがPostgreSQL 9.6で稼働しているのに対しPostgreSQL 9.2を使用していたため、サイレントに失敗しました。

  なぜバックアップ手順はサイレントに失敗したのか?
  - 失敗時には通知が送信されていましたが、メールが拒否されていたため、失敗の兆候は何も得られませんでした。送信元は自動化されたプロセスであり、エラーを報告する他の手段を持っていませんでした。
