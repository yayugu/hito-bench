response: |-
  Cursorの Git ストレージ「Continuity」は、書き込み先行ログ(WAL)をS3に置き、これを唯一の真実とする設計です。従来のGitHubのSpokesは、各リポジトリを3つ前後のレプリカに複製し、3相コミット(3PC)で合意を取っていました。この方式にはレプリカを増やすほど最も遅いサーバーに足を引っ張られて push が遅くなる問題がありました。また、リポジトリごとにレプリカが最低3つ必要なので、小さなリポジトリが大量にできると無駄が増えます。さらに、各コピーが真実そのものなので運用も大変でした。

  Continuityでは、pushをWALのエントリとしてS3に永続化し、S3のCAS(比較して更新)操作でpushを直列化します。そのため、リーダー選出も合意も不要で、ルーティング表もDBも要りません。リポジトリはNVMe上の普通のGitリポジトリで、ウォームキャッシュとして扱います。無くなればWALから復元します。

  レプリカ同期はUDPゲossipによる楽観的な通知です。パケットが失われても問題ありません。読み取り時にETag付きの条件付きGETをS3に投げ、304なら最新、200なら差分を取り込んでから応答するため、常に強い一貫性が保たれます。コンパクション(repack)はプライマリだけが行い、他のレプリカは圧縮済みパックをダウンロードするだけです。100レプリカまで読み取りが線形にスケールし、pushはS3 Standardで毎秒120回以上、S3 Express One Zoneで300回以上を処理できます。
