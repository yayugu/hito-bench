  **関羽 紹介テキスト(約290字)**

  「美髯公」と称された河東の豪傑。故郷で悪徳豪族を斬って逃亡中に劉備・張飛と出会い、桃園で義兄弟の契りを結ぶ。青龍偃月刀を手に乱世を駆け、曹操に捕らわれても厚遇に心を移さなかった。白馬で顔良を討って恩を返すと、劉備のもとへ千里を走った。赤壁の後、荊州を預かると、樊城攻めで大水を用いて于禁ら七軍を降し、威名を天下に轟かせる。だが同盟を破った呉の呂蒙に背後を突かれて拠点を失い、麦城で孤立。脱出も叶わず捕らえられ、孫権により斬首された。義を貫いた最期は語り継がれ、今なお軍神として祀られている。

  - 史実と『三国志演義』の要素をもとにしています。『三国BASARAレボリューション』での関羽の設定や口調、他キャラとの関係は確認していません。ゲーム独自の設定に合わせる場合は、調整が必要です。
  - 「悪徳豪族を斬って逃亡」は演義系の逸話です。史実寄りにするなら、この部分を「涿郡で劉備と出会い」などに差し替えてください。
  - 文字数を減らす場合は、赤壁や顔良の逸話を削ると、生涯の流れを保ったまま短くできます。
