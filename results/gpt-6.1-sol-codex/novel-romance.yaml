  ### 第34話　恋人になった、そのあとで

  　風呂場のドアが開く音がした。

  　ソファに座っていた俺は、反射的に背筋を伸ばす。テーブルの上には麦茶が二つ。さっきから、意味もなくコップの位置を直している。

  　右に寄せて、戻して、また寄せる。

  　落ち着け、俺。麦茶の配置で何かが決まるわけじゃない。

  「おにぃ、お待たせ」

  　振り向くと、あかねが廊下に立っていた。

  　持ってきたらしい薄紫色の部屋着に着替えて、肩にはタオルを掛けている。髪はまだ少し湿っていた。

  「ドライヤー、使ってよかった？」
  「もちろん。っていうか、ちゃんと乾いたか？」
  「うん。ばっちり」

  　あかねは笑って、それから急に口を閉じた。

  　俺も、何を言えばいいかわからなくなる。

  　風呂に入る前、俺たちは付き合うことになった。

  　キスも、した。

  　その事実を思い出すと、どうしてもあかねの顔をまっすぐ見られない。さっきまで普通に話せていた相手なのに。

  「……麦茶、飲む？」
  「飲む」

  　あかねがソファまでやってきた。

  　俺の隣に腰を下ろす。ただし、一人ぶんくらいの隙間を空けて。

  　いつもなら、もっと遠慮なくくっついてくるくせに。

  　二人でコップを持ち上げる。氷が同時に鳴った。

  「なんかさ」
  「うん」
  「変だな」
  「……うん」

  　あかねがコップを両手で包む。

  「さっきまで、あんなにいっぱいしゃべってたのにね」
  「だな」
  「あたし、何しゃべってたっけ」
  「俺が駅で出口を間違えた話」
  「あ、それ」

  　くすっと笑ったあかねにつられて、俺も笑う。

  「おにぃ、東京に住んでるのに」
  「住んでたって、全部の駅に詳しいわけじゃない」
  「でも、あたしのこと迎えにきてくれたんだよね」
  「そりゃ、迎えにいくだろ」

  　言ってから気づく。

  　あかねが聞きたかったのは、駅の話じゃない。

  　隣を見ると、目が合った。

  「……来てくれて、うれしかったし」

  　そう付け足すと、あかねは麦茶を一口飲んだ。

  「そっか」

  　コップの陰で、口元がゆるんでいる。

  　それを見ているだけで、俺までうれしくなるから困る。

  　あかねはコップを置き、ソファの上で少し動いた。さっきより近い。

  　もう一度、少し動く。

  「あかね」
  「なに？」
  「一回で来ればいいだろ」
  「だって」

  　あかねは膝の上で指を組んだ。

  「彼氏の隣って、どこまで近くに座っていいの？」

  　彼氏。

  　自分のことだとわかっているのに、その言葉にはまだ慣れない。

  「……好きなところでいい」
  「ほんと？」
  「うん」

  　あかねは今度こそ俺のすぐ隣に座った。

  　肩が触れる。

  　その距離で顔を見上げられて、俺はまた背筋を伸ばした。

  「おにぃ、緊張してる？」
  「してる」
  「あたしも」

  　そう言いながら、あかねはうれしそうだった。

  「おにぃでも、するんだね」
  「俺を何だと思ってるんだ」
  「何でも平気な人」
  「そんなわけないだろ」

  　少なくとも今は、全然平気じゃない。

  　手をつなぎたいと思っているのに、隣にある小さな手を取るだけのことが、妙に難しい。

  　俺が迷っているあいだに、あかねの指がそっと触れた。

  「これは？」
  「……いい」
  「よかった」

  　指を重ねて、手をつなぐ。

  　あかねが自分の手と俺の手を見比べた。

  「大きいね」
  「昔からだろ」
  「昔はさ、はぐれないようにつないでくれたじゃん」
  「お前、すぐどっか行くから」
  「虫、見つけたら追いかけたくなるもん」

  　小鹿村の細い道を思い出した。

  　俺の手を握っているくせに、あかねは道端に何か見つけるたび、そっちへ引っ張っていく。帰るころには二人とも泥だらけで、よく一緒に怒られた。

  「今は？」

  　あかねが聞く。

  「今は、どうしてつないでくれるの？」

  　こういうところは、昔から変わらない。

  　答えが欲しいときは、ちゃんと俺の目を見る。

  「……つなぎたいから」

  　あかねの指に、少し力が入った。

  「あたしも」

  　たったそれだけの返事が、胸に残った。

  　テレビはついていない。冷蔵庫の音と、外を走る車の音がする。

  　あかねが俺の肩に頭を預けた。

  　俺は空いている手を持ち上げて、一度ためらってから、その頭にそっと置いた。

  「子ども扱い？」
  「嫌だったか？」
  「ううん。好き」

  　あかねは目を細めた。

  「でも、彼女扱いもしてね」

  　俺の手が止まる。

  　あかねが顔を上げた。その頬が、少し赤かった。

  「……どうすればいいんだよ」
  「それ、あたしに聞く？」

  　二人で笑ったあと、俺はつないだ手を握り直した。

  「あかね」
  「うん」
  「好きだよ」

  　さっきは、あかねに言わせてしまったから。

  　今度は俺から、ちゃんと伝えたかった。

  　あかねは目を丸くして、それから、照れたようにうつむいた。

  「……急に言うの、ずるい」
  「お前が言わせたんだろ」
  「言わせてないもん」

  　そう言って、俺の肩に額をくっつける。

  　少し待っていると、小さな声が聞こえた。

  「もう一回」

  　俺は笑いそうになるのをこらえた。

  「好きだよ、あかね」

  　肩に触れた額が、ぐりぐりと動いた。

  「……うん」

  　それから顔を上げたあかねに、短くキスをした。

  　離れると、あかねが笑った。

  　小鹿村で何度も見てきた笑顔なのに、今夜は、見るたびに胸が忙しくなる。

  「おにぃ」
  「ん？」
  「明日の朝も、彼女でいいんだよね」

  　俺はつないだ手を、少し持ち上げた。

  「明日も、その次も」
  「……そっか」

  　あかねがまた、俺の肩に寄りかかる。

  「じゃあ、明日は一緒に朝ごはん作ろ」
  「起きられるか？」
  「起こして」
  「結局、俺かよ」

  　笑いながら、明日の朝に何を食べようか考えた。

  　卵はあったはずだ。パンは二人ぶん残っていたか。

  　隣であかねが、卵焼きなら任せて、と言う。

  　その声を聞きながら、俺はしばらく、つないだ手を離せずにいた。
