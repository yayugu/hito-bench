  「アマゾン移住便」

  地球に、森はほとんど残っていなかった。

  だからアマゾン社が発表した移住先の写真は、世界中の人を泣かせた。どこまでも続く緑。澄んだ川。木漏れ日の下で暮らす人々。

  しかも、渡航費は無料だった。

  条件はひとつ。
  「現地の森林維持にご協力いただきます」

  私はすぐに申し込んだ。

  宇宙船の客室は狭かったが、窓際には鉢植えがあった。世話をするよう指示されていたので、毎朝、水をやった。

  葉にほこりがあれば拭いた。元気がない日は話しかけた。

  隣室の老人も、向かいの若い夫婦も、それぞれの鉢植えを大切にしていた。きっと移住生活の練習なのだろう。

  長い航海の末、船内に到着のアナウンスが流れた。

  「配送が完了しました」

  妙な言い方だと思った。

  客室の壁が開き、鉢植えに機械の腕が伸びた。私も一緒に、明るい温室へ運ばれた。

  ガラスの向こうには、枝を揺らす大きな木々が並んでいた。葉の擦れる音を、翻訳機が言葉に変える。

  「苗は元気そうだね」
  「付属品も生きてる？」
  「もちろん。毎日、二酸化炭素を出すよ」

  私は温室の扉に貼られた伝票を見た。

  **商品：地球産の苗木　一鉢**  
  **付属品：人間　一体**

  その下に、小さな注意書きがあった。

  **付属品は孤独になると弱ります。ときどき木漏れ日を与えてください。**

  ---

  オチは、人間が「移住サービスの客」だと思っていたのに、実は苗木と一緒に配送される付属品だった、という立場の逆転です。木々がアマゾンの購入者で、人間は二酸化炭素を供給するために付けられています。広告の木漏れ日も、人間への飼育環境の説明でした。
