  1月31日のデータベース障害に関する事後検証

  2017年1月31日、当社の製品の一つであるオンラインサービス GitLab.com で、大規模なサービス障害が発生しました。原因は、プライマリデータベースサーバー上のデータを誤って削除したことでした。このインシデントにより、GitLab.com は長時間にわたって利用できなくなりました。また、本番環境のデータの一部が失われ、最終的に復旧できませんでした。

  [...]

  本番環境のデータが失われることは、決して許容できません。再発を防ぐため、GitLab.com の運用手順と復旧手順について、複数の改善に取り組んでいます。

  タイムライン

  23:00 UTC ごろ：負荷の増加により、PostgreSQL のセカンダリのレプリケーション処理に遅延が生じ始めました。セカンダリが必要とする WAL セグメントがプライマリからすでに削除されていたため、レプリケーションは失敗しました。GitLab.com では WAL アーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。この作業では、セカンダリの既存のデータディレクトリを削除し、pg_basebackup を実行して、プライマリからセカンダリにデータベースをコピーします。エンジニアの一人がセカンダリに接続してデータディレクトリを削除し、pg_basebackup を実行しました。しかし、--verbose オプションを指定していたにもかかわらず、pg_basebackup は有用な情報を何も出力せず、処理が止まったような状態になりました。

  23:30 UTC ごろ：エンジニアの一人は、それまでに pg_basebackup の実行を試みた際、セカンダリの PostgreSQL データディレクトリに何らかのファイルが作成されたのではないかと考えました。通常、そのような場合には pg_basebackup がエラーを出力しますが、このエンジニアは何が起きているのか確信を持てずにいました。後になって、その場にいなかった別のエンジニアから、これは正常な動作であることが明らかにされました。pg_basebackup は、プライマリがレプリケーションデータの送信を開始するまで待機し、それまでは何も出力しません。残念ながら、この動作は社内のエンジニア向け運用手順書にも、pg_basebackup の公式ドキュメントにも明確に記載されていませんでした。

  レプリケーション処理を復旧しようとして、あるエンジニアが PostgreSQL のデータベースディレクトリの削除を実行しました。本人はセカンダリ上で作業していると思い込んでいましたが、実際にはプライマリ上で実行していました。エンジニアは誤りに気づいてから1、2秒後に処理を停止しましたが、その時点ですでに約300 GBのデータが削除されていました。

  データベースを復元できることを期待して、対応していたエンジニアたちはデータベースのバックアップを探し、Slack で助けを求めました。しかし、バックアップを見つけて利用するための手順は、まったく機能しませんでした。

  機能しなかった復旧手順

  pg_dump を使用したデータベースのバックアップ

  pg_dump によるバックアップを探したところ、存在しないことが判明しました。S3 バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調査した結果、データベースでは PostgreSQL 9.6 を実行している一方、バックアップ処理では pg_dump 9.2 を使用していたことがわかりました。Postgres では、9.x の各リリースはメジャーバージョンとして扱われます。メジャーバージョンが異なると、pg_dump はエラーを出力し、バックアップ処理が終了します。

  [...]

  エラーが発生した cron ジョブについては通知を有効にしていましたが、通知はメールで送信されます。GitLab.com では DMARC を使用しています。しかし、cron ジョブの通知メールには DMARC が有効になっておらず、受信側で拒否されていました。そのため、手遅れになるまでバックアップの失敗に気づきませんでした。

  Azure のディスクスナップショット

  NFS サーバーではスナップショットを有効にしていましたが、データベースサーバーでは一切有効にしていませんでした。ほかのバックアップ手順で十分だと考えていたためです。

  根本原因分析

  これらの問題の根本原因を分析するため、「なぜなぜ分析」という手法を使用します。インシデントを、GitLab.com が停止したことと、GitLab.com の復旧に長時間かかったことの、二つの主要な問題に分けて考えます。

  問題2：GitLab.com の復旧に18時間以上かかった。

  なぜ通常のバックアップ手順を利用できなかったのか？

  - 通常のバックアップ手順では、pg_dump を使用してデータベースの論理バックアップを取得します。GitLab.com は PostgreSQL 9.6 で稼働しているのに、この手順では PostgreSQL 9.2 を使用していたため、失敗していましたが、その失敗は認識されていませんでした。

  なぜバックアップ手順の失敗に気づかなかったのか？

  - 失敗時には通知が送信されていましたが、メールが拒否されていたため、失敗を知らせる情報が届きませんでした。送信元は自動処理であり、エラーを報告するほかの手段がありませんでした。
