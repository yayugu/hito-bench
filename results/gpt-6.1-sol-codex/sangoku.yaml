  関羽、字は雲長。河東郡解県に生まれ、故郷を離れて劉備と出会う。張飛とともにその旗の下へ集い、兄弟のような絆で結ばれた。乱世の戦場を駆け、劉備を支え続けたが、曹操との戦いに敗れて一時その配下となる。白馬の戦いで袁紹軍の猛将・顔良を討ち、厚遇に報いると、栄華を捨てて劉備のもとへ帰参した。赤壁の戦いを経て荊州の守備を担い、劉備の勢力拡大を支える。二一九年、樊城へ進軍。洪水に乗じて于禁の軍を破り、その威名は天下を震わせた。しかし孫権軍の呂蒙に背後を突かれ、荊州を失う。麦城へ退いた末、脱出の途中で捕らえられ、子の関平とともに処刑された。死後も忠義と武勇の象徴として敬われ、関帝として今なお人々の信仰を集めている。

