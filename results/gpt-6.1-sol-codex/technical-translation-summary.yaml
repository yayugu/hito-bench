response: |-
  Gitの大規模ホスティングが難しいのは、履歴のDAGを順にたどる処理と、packfile内の差分圧縮が生むランダムアクセスが重なるためだ。オブジェクトを分散KVストアに置くと通信往復が増え、ネットワークファイルシステムでも性能が落ちる。従来のSpokesはローカルNVMe上のGitを複製し、参照更新を三相コミットで同期するが、複製数を増やすほど遅いノードが書き込み性能を制約する。

  CursorのContinuityは、S3上の書き込み先行ログ（WAL）を正本にし、各ノードのGitを再構築可能なキャッシュとして扱う。pushのデータを永続化した後、WAL索引を原子的なCASで更新して公開し、書き込みを線形化する。複製への通知にはUDPを使うが、読み取り時にはETag付き条件GETで正本との一致を確認し、遅れていれば追いついてから応答する。通知の信頼性に依存せず、強い整合性を保つ点が面白い。さらに、重いrepackは主ノードだけで実行し、他は圧縮済みpackを取得する。これにより、巨大リポジトリは多数の複製へ、小さな休眠リポジトリはローカルコピーゼロへと伸縮できる。著者らの試験では、100複製まで読み取り性能が線形に向上した。
