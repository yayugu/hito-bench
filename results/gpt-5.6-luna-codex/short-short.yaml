  雨季のアマゾンで、探検家のユウは奇妙な村を見つけた。

  村人たちは皆、川辺に立ち、空を見上げている。

  「何を待っているんです？」

  ユウが尋ねると、長老は答えた。

  「アマゾンから荷物が届くのを待っている」

  やがて巨大な鳥が空から舞い降り、小さな箱を落としていった。村人たちは歓声を上げ、箱を開ける。

  中には、乾電池が一本入っていた。

  「これだけ？」

  ユウが驚くと、長老は誇らしげに言った。

  「お急ぎ便だ。昨日注文した」

  その夜、ユウは村の奥で、見覚えのある段ボール箱を見つけた。箱にはこう書かれていた。

  《返品受付センター》

  ---

  オチは、「アマゾン」を南米の熱帯雨林と、通販サイトAmazonの両方の意味で使ったダブルミーニングです。秘境の村にも通販が届くという現代的なギャップに加え、最後の「返品受付センター」で、村人たちが何かを返送している謎を残しています。
