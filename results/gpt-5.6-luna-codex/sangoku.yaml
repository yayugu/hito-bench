response: 漢末の乱世に生まれた関羽は、劉備・張飛と桃園で義を結び、生涯をかけて主君と民を守り抜いた豪傑である。青龍偃月刀を携え、白馬の戦いでは顔良を討ち、千里走単騎では幾重もの敵陣を突破。荊州を守る要として魏と呉を相手に奮戦し、樊城では水攻めによって魏軍を追い詰めた。しかし、呉の呂蒙に荊州を奪われ、麦城へと追い詰められる。援軍を待ちながらも屈することなく戦い続けた末、関羽は捕らえられ、最期まで誇りと義を貫いて斬首された。その名は後世、武神として永遠に語り継がれている。
