response: 関羽――字は雲長。劉備と義兄弟の契りを結び、蜀漢の建国を支えた豪傑。長き流浪の末に劉備と再会すると、曹操のもとを離れて主君のもとへ帰参し、その忠義を世に示した。荊州を守った後、樊城で魏軍を追い詰めるも、呉の呂蒙が荊州を奪取。退路を断たれた関羽は麦城へ敗走し、援軍を得られぬまま捕らえられる。孫権への降伏を拒み、息子・関平とともに最期を迎えた。その武勇と義心は後世まで語り継がれ、やがて神格化されるほどの英雄となった。
