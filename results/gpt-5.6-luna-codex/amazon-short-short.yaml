  ### アマゾン

  　祖父が死んだ日、僕のもとにアマゾンから荷物が届いた。

  　注文した覚えはない。箱を開けると、中には小さな種が一粒と、紙切れが入っていた。

  　――水をやらないでください。

  　奇妙に思いながらも、僕は種を机の上に置いた。

  　翌朝、種から芽が出ていた。昼には葉が茂り、夜には部屋いっぱいの蔓が伸びた。蔓の先には、見たこともない青い果実が実っている。

  　果実を割ると、中から祖父の声がした。

  「やっと届いたか。アマゾンは便利だろう？」

  「これ、何？」

  「森の種だ。おまえの部屋に植えておけ」

  　窓の外を見ると、街じゅうが緑に覆われていた。

  　空から、巨大な段ボール箱が次々と降ってくる。

  　送り主は、アマゾン。

  　配達予定日は、地球が森に戻る日だった。
