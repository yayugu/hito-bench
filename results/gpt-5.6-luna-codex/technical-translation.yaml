  1月31日のデータベース障害に関する事後分析

  2017年1月31日、当社の製品の1つであるオンラインサービス GitLab.com で、大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーからデータを誤って削除したことが原因でした。このインシデントにより、GitLab.com は何時間にもわたって利用できなくなりました。また、本番データの一部を失い、最終的に復旧できませんでした。

  [...]

  本番データの喪失は容認できません。二度とこのような事態を起こさないため、GitLab.com の運用および復旧手順について、複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC：負荷の増加により、PostgreSQL のセカンダリのレプリケーション処理に遅延が発生し始めました。セカンダリが必要とする WAL セグメントがすでにプライマリから削除されていたため、レプリケーションに失敗しました。GitLab.com では WAL アーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackup を実行してプライマリのデータベースをセカンダリにコピーする作業が含まれます。エンジニアの1人がセカンダリに移動し、データディレクトリを消去してから pg_basebackup を実行しました。しかし残念ながら、--verbose オプションを指定していたにもかかわらず、pg_basebackup は意味のある出力を何も表示せず、ハングしてしまいました。

  ± 23:30 UTC：あるエンジニアは、前回 pg_basebackup を実行しようとした際に、セカンダリの PostgreSQL データディレクトリ内に何らかのファイルが作成されたのではないかと考えました。通常、このような場合 pg_basebackup はエラーを表示しますが、担当のエンジニアは状況を十分に把握できていませんでした。後になって、当時その場にいなかった別のエンジニアによって、これが正常な動作であることが判明しました。pg_basebackup はプライマリがレプリケーションデータの送信を開始するまで待機し、その時点までは何も表示せず静かに待ち続けます。しかし残念ながら、この動作は社内のエンジニアリング手順書にも、公式の pg_basebackup ドキュメントにも明確に記載されていませんでした。

  レプリケーション処理を復旧させようとして、あるエンジニアが PostgreSQL のデータベースディレクトリを消去しました。その際、セカンダリ上で作業していると誤って認識していました。しかし実際には、この処理はプライマリ上で実行されていました。エンジニアは間違いに気づいてから1～2秒後に処理を終了しましたが、その時点ですでに約300GBのデータが削除されていました。

  データベースを復旧できることを期待し、関係したエンジニアたちはデータベースのバックアップを探し、Slack で支援を求めました。しかし残念ながら、バックアップの発見と利用の両方に関する手順が完全に機能しませんでした。

  機能しなかった復旧手順

  pg_dump を使用したデータベースバックアップ

  pg_dump のバックアップを探したところ、バックアップが存在しないことがわかりました。S3 バケットは空で、どこにも最近のバックアップは見つかりませんでした。詳しく調査した結果、バックアップ手順では pg_dump 9.2 を使用している一方、データベースは PostgreSQL 9.6 で稼働していることが判明しました（Postgres では、9.x のリリースはメジャーリリースと見なされます）。メジャーバージョンが異なると、pg_dump はエラーを出力して終了するため、バックアップ手順が停止します。

  [...]

  エラーが発生した cron ジョブについては通知が有効になっていましたが、これらの通知はメールで送信されていました。GitLab.com では DMARC を使用しています。しかし残念ながら、cron ジョブのメールでは DMARC が有効になっていなかったため、受信側で拒否されていました。その結果、手遅れになるまでバックアップが失敗していたことを、私たちはまったく把握できませんでした。

  Azure ディスクのスナップショット

  NFS サーバーでは有効になっていましたが、他のバックアップ手順で十分だと考えていたため、データベースサーバーではこれらのスナップショットを有効にしていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するため、「5つのなぜ」と呼ばれる手法を使用します。インシデントを、GitLab.com が停止したことと、GitLab.com の復旧に長時間を要したことという、主に2つの問題に分けて考えます。

  問題2：GitLab.com の復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使用できなかったのか？

  - 標準のバックアップ手順では、pg_dump を使用してデータベースの論理バックアップを実行します。この手順は、GitLab.com が PostgreSQL 9.6 で稼働しているのに対し、PostgreSQL 9.2 を使用していたため、通知されることなく失敗しました。

  なぜバックアップ手順は通知されることなく失敗したのか？

  - 失敗時には通知が送信されていましたが、メールが拒否されたため、失敗を示すものが何もありませんでした。送信元は自動化されたプロセスであり、エラーを報告する他の手段もありませんでした。
