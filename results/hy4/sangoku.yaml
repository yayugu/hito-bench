  **■ 関羽 雲長／義、天を斬る**

  河東の地より、義を抱いて乱世に殴り込んだ漢（おとこ）、関羽雲長。劉備と杯を交わしたその日から、背中を預けると決めた。曹操の懐に一時身を寄せても、心は売らぬ。白馬の陣で顔良を薙ぎ払い、恩は刀で返して、また主の元へ——千里を駆け抜けた赤兎馬の蹄音が、魏の肝を震わせた。荊州を任されれば、樊城の水を引き、于禁を呑み、龐徳を斬る。「威震華夏」。遷都を口にした曹操すら黙らせた、その美髯がいちばん煌めいた瞬間だ。だが義は、背後までは守り切れぬ。呂蒙の計、糜芳の裏切り、麦城の霧。退路が消えても青龍偃月刀は折れず、臨沮で刃を受けるまで、膝をつかなかった。建安二十四年、首は魏へ、魂は蜀へ。敗れたようで、誰よりも勝ち切った生涯。その瞬間、人は彼を『武聖』と呼び始めた。義に生き、義に斬られた、漢の中の漢である。

  ---

  **時系列カバー**：生立ち（河東）→ 劉備との盟約 → 曹操降伏・白馬の恩返し → 荊州鎮守 → 樊城の全盛 → 背後崩壊・麦城 → 臨沮で最期 → 関帝化、まで抜けなしです。

  **UI映えの効かせどころ**：「威震華夏」を太字／金色、「麦城の霧」を少し文字色落とし、最後の『武聖』だけフェードインさせると、BASARAの演出馴染みがいいです。必要なら「キャッチコピー版（20字）」も別に作れます 👊
