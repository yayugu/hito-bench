  1月31日のデータベース障害のポストモルテム

  2017年1月31日、当社のプロダクトの一つであるオンラインサービス GitLab.com で、大規模なサービス障害が発生しました。原因は、プライマリデータベースサーバー上のデータを誤って削除したことでした。このインシデントにより、GitLab.com は長時間にわたって利用できなくなりました。また、最終的に復旧できなかった本番データも一部失いました。

  [...]

  本番データを失うことは許されません。再発を防ぐため、当社は GitLab.com の運用および復旧手順について複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC: 負荷の増大により、PostgreSQL のセカンダリでレプリケーションが遅延し始めました。セカンダリが必要とする WAL セグメントがプライマリですでに削除されていたため、レプリケーションは失敗しました。GitLab.com では WAL アーカイブを有効にしていなかったため、セカンダリは手動で再同期する必要がありました。この作業には、セカンダリの既存データディレクトリを削除し、pg_basebackup を実行してプライマリからセカンダリへデータベースをコピーする手順が含まれます。あるエンジニアがセカンダリ側でデータディレクトリを消去し、pg_basebackup を実行しました。残念ながら、--verbose オプションを指定していたにもかかわらず、pg_basebackup は有意な出力のないままハングしてしまいました。

  ± 23:30 UTC: それまでに pg_basebackup を実行した試行で、セカンダリの PostgreSQL データディレクトリに何らかのファイルが作成されたのではないかと、あるエンジニアは考えました。通常、その場合は pg_basebackup がエラーを出力しますが、そのエンジニアは何が起きているのかよく分かっていませんでした。後になって、当時は不在だった別のエンジニアにより、これが正常な動作であることが判明しました。pg_basebackup はプライマリがレプリケーションデータの送信を開始するのを待ち、その時点まで何も出力せず待機し続けます。残念ながら、この挙動は当社のエンジニアリング用ランブックにも、pg_basebackup の公式ドキュメントにも明確には記載されていませんでした。

  レプリケーションを復旧させようとして、あるエンジニアは PostgreSQL のデータベースディレクトリを消去しました。その際、セカンダリ側で作業していると誤って思い込んでいました。しかし、この処理は実際にはプライマリで実行されていました。エンジニアは誤りに気づいてから 1〜2 秒でプロセスを停止しましたが、その時点で約 300 GB のデータがすでに削除されていました。

  データベースを復旧できることを期待して、対応していたエンジニアたちはデータベースのバックアップを探し、Slack で支援を求めました。残念ながら、バックアップの探索も利用も、いずれも完全にうまくいきませんでした。

  機能していなかった復旧手順

  pg_dump によるデータベースバックアップ

  pg_dump のバックアップを確認したところ、存在しないことが分かりました。S3 バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調べたところ、バックアップ手順では pg_dump 9.2 が使われていた一方、データベースは PostgreSQL 9.6 で稼働していることが分かりました（Postgres では 9.x の各リリースはメジャーバージョンとして扱われます）。メジャーバージョンの違いにより pg_dump がエラーを出し、バックアップ手順は中断されます。

  [...]

  エラーが発生した cron ジョブについては通知が有効になっていましたが、その通知はメールで送信されていました。GitLab.com では DMARC を利用しています。残念ながら、cron ジョブのメールには DMARC が設定されていなかったため、受信側で拒否されていました。そのため、手遅れになるまでバックアップの失敗に一切気づくことができませんでした。

  Azure ディスクスナップショット

  NFS サーバーでは有効にされていましたが、他のバックアップ手順で十分だと考えていたため、どのデータベースサーバーでもこれらのスナップショットは有効にされていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するため、"The 5 Whys" と呼ばれる手法を用います。インシデントを 2 つの主要な問題に分けます: GitLab.com が停止したことと、GitLab.com の復旧に長時間を要したことです。

  問題 2: GitLab.com の復旧に 18 時間以上を要した

  なぜ標準のバックアップ手順を使えなかったのか？
  - 標準のバックアップ手順では、pg_dump を使ってデータベースの論理バックアップを取得します。この手順は、PostgreSQL 9.2 を使用していた一方で GitLab.com が PostgreSQL 9.6 で稼働していたため、サイレントに失敗していました。

  なぜバックアップ手順はサイレントに失敗したのか？
  - 失敗時には通知が送られていましたが、そのメールが拒否されたため、失敗を知らせるものは一切ありませんでした。送信元は自動化されたプロセスで、エラーを報告する他の手段を持っていませんでした。
