  **第34話　湯気と、もう一回**

  「……はぁ、生き返った」

  シャワーの水を止めて、タオルで髪をざっと拭きながら自室へ戻る。窓の外はもうすっかり九月の夜だ。親は今週まるごと出張で、リビングの掛け時計だけが、カツ、カツとやけに大きく響いていた。

  さっきのことが、まだ唇に残っている。

  あかねの告白。『あたし、おにぃのことが好き。幼なじみじゃなくて、そういうの』。あの、少し震えて、でも最後だけまっすぐだった声。それに対して俺は……正直、ろくに言葉を返せていない。気づいたら頷いていて、気づいたら額を合わせていて、気づいたらあかねの指先が俺のシャツの襟をぎゅっと掴んでいた。

  あれが、俺たちの最初のキスだった。

  「……マジだったんだな」

  思わず漏らしてから、自分の頬に触れて、熱くて、また慌てて手を離した。先に浴びておいて正解だったかもしれない。あのままソファに並んで座り続けていたら、俺、たぶん「ありがとう」とか「おう」とか、変なことしか口にできなかった。

  ガチャ、と浴室のドアが開く音がした。

  続いて、廊下をぱたぱたと小さな足音。ドライヤーをコンセントに挿しかけた俺の手が、途中で止まる。

  「……お、おにぃ」

  あかねが、部屋の入り口で立ち止まっていた。

  俺のＴシャツを着ている。いや、正確には「貸した」んじゃなくて、「こっちのほうが落ち着くから」と、あかね自身がクローゼットから引っぱっていったアレだ。夏の帰省のときにも一度着てた、少し色の褪せた奴。丈が膝の少し上まであって、袖から出る腕が湯気でほんのり桃色になってる。濡れた髪はタオルでくるんだまま、耳の先だけが、信号灯みたいに真っ赤だった。

  「……見ないで、ってば」

  「見、見てねぇし。ドライヤー持ってただけ」

  「うそ。さっきから、じーっと……」

  「……それは、あかねが来たからだろ」

  言い訳になってない。あかねが「もう……」と小さく俯いて、それでも口元だけは微妙に緩んでいるのが、バレてる俺には余計に堪えた。飲み込んだ『かわいい』が、さっきから何回目かもう数えられない。タイトルじゃないけど、ほんと、かわいすぎるんだよな。

  おかしかった。

  つい三か月前の夏まで、あかねは小鹿村の川原で、同じように俺のＴシャツを引っぱって「おにぃ、日焼けしてる！」と笑ってた。タオルを投げ合っても、自転車の後ろで肩が触れても、俺は「まぁいっか」で済ませていた。十二歳で東京に出て以来、あかねは俺の中でずっと「帰ればいる子」だったんだ。

  なのに今は、恋人、だ。

  さっき決まったばかりのその二文字が、部屋の空気の重さをひと回り変えてしまう。同じあかね。同じ「おにぃ」。なのに、こっちの目のほうがおかしくなってる。見慣れてるはずの手首の細さまで、いちいち新品みたいに目に入ってくる。

  「……髪、乾かさないと。九月でも、濡れっぱなしは風邪ひくぞ」

  俺がドライヤーを掲げると、あかねは一瞬「あたし、自分で……」と手を伸ばしかけて、ぱたりと止めた。タオルの縁を、ぎゅ、と握り直す。

  「…………お願い」

  「……お、おう」

  返事が裏返ったのは、まあ、仕方ないと思う。

  あかねがソファの端にちょこんと座り、俺がそのすぐ後ろに回り込む。タオルをほどくと、温い湯気がふわりと肩越しに流れてきた。シャンプーはうちのを使ったはずなのに、あかねの髪からすると全然違う甘さがした。少しだけ乾いた、日当たりのいい縁側みたいな匂い。小鹿村の夏が、東京の六畳間までついてきたみたいだった。

  温風を当てながら指を通すたび、あかねの肩がぴくりと小さく跳ねる。

  「……くすぐったい」

  「我慢しろ。耳の裏、まだ濡れてる」

  「……おにぃの指、あったかい」

  「シャワー上がりだからな。……って、あかねもだろ」

  「……うん。でも、おにぃのほうが」

  言われて、俺のほうが先に固まった。ドライヤーの音だけが、二人の間の変な間を埋めていく。しばらくして、あかねが、わざとらしくないくらい小さな声で続けた。

  「ね、おにぃ」

  「ん」

  「……さっき、あたしのこと、『あかね』って呼んでたでしょ。キスのあと」

  「……呼んでたか」

  「うん。いつもより、ちょっとだけ、ゆっくりだった」

  俺はドライヤーを止めた。静かになった部屋で、あかねがこっちを振り向きかけて、途中で目を逸らす。睫毛の先に、まだ湯気がまとわりついているみたいだった。

  「……もう一回、呼んで」

  「……あかね」

  「…………っ」

  呼んだだけなのに、あかねは肩まで赤くして、Ｔシャツの裾をぎゅっと丸めた。俺だって、自分の名前を言ってるだけなのに、喉の奥が変に熱い。仕方なく、もう一回、今度はもっとゆっくり。

  「……あかね」

  「……や、やだ。もういいのに……」

  「いいのに、って言いながら、また聞いてるじゃん」

  「……おにぃのばか」

  その「ばか」が、叱る感じじゃなくて、むしろこっちに額を預けてくるみたいな言い方だったので、俺はドライヤーをテーブルに置いて、隣に座った。ソファが少しだけ鳴る。肩と肩の間に、最初は指一本ぶんの隙間があいていて、次の瞬間には、あかねの小指が俺の手の甲にちょんと触れていた。

  「……いい？」

  「……こっちこそ、いい？」

  お互いに確認して、お互いに頷いて、それから指を絡めた。あかねの手は、さっきのシャワーのせいでまだ温くて、少しだけ震えていた。俺がぎゅっと包むと、震えが止まる代わりに、今度はあかねの息がひとつ、小さく漏れた。

  時計がカツ、と鳴る。親は今夜も帰ってこない。デートの帰りに買った缶コーヒーが、テーブルの端でまだ一本残ってる。さっきまで「普通の夜」だったものが、全部こっちを見てる気がした。

  「おにぃ」

  「ん」

  「……あたし、まだドキドキしてる」

  あかねが、やっとこっちを向いた。目は少し潤んでいて、でも笑ってた。さっき告白してきた子の、あの決めた顔がまだちゃんと残ってる。

  「……俺もだよ。バレてたか」

  「うん。さっきから、耳まで」

  「……それ、あかねもだろ」

  「…………ふふ、そっちは見なかったことにして」

  見なかったことになんて、できるわけがない。俺は少しだけ身を傾けて、今度はさっきより迷わず、あかねの唇に額じゃなくて、きちんと触れた。一度目より長くて、でもまだ、二人とも息の合わせ方を覚えていない不器用なキス。離れたあと、あかねが「……ん」とだけ言って、俺のＴシャツの袖を、今度は襟じゃなく、そっと掴み直した。

  カーテンの隙間から、東京の月が細く入ってきた。小鹿村の月はもっと大きくて、川の音がしていたはずなのに、今夜は遠くのバスの音しかしない。十二歳で離れたはずの幼なじみが、九月の俺の部屋で、俺のシャツを着て、俺の手を握ってる。

  「……ね、おにぃ」

  「ん」

  「……このあと、まだ、ここにいてもいい？」

  時計が、もう一度カツと鳴った。俺は絡めた指を、ほんの少しだけ強くした。

  「……いてくれなきゃ、困る」

  あかねが「……うん」と返して、頬を俺の肩に落とす。湯気はもう殆ど消えていたのに、部屋の中の温度だけは、さっきよりまだ少しだけ上がっていた。

  電気を一盏、落とす。暗がりの中で、あかねの「おにぃ」が、またひと回り小さく、またひと回り近くなった。

  ――続きは、もう、止められなかった。

