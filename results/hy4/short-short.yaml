  アマゾン奥地、川から白い紙片が流れ着いた。未接触の部族の族長は、それを神の言葉だと大事に竿の先へ結んだ。

  四十年後、はじめて辿り着いた言語学者が、褪せたインクを読み上げた。

  「お届けにあがりましたが、ご不在でした。再配達をご希望の場合は……」

  族長は、自分たちの足跡がびっしりと重なった泥を見下ろして言った。

  「……おらんかったのは、どっちだ」

  ---

  **【オチの解説】**
  「アマゾン」を〈熱帯雨林・未開の地〉と〈通販の配達システム〉に二重に掛けています。

  配達側のルールでは「住所が登録されていない」＝「そこに受取人はいない（ご不在）」と処理されます。でも当の部族は四十年どころか何世代も、同じ泥の上にずっと居座り続けている。文明の側の「住所＝存在」という都合が、住所を持たない人間の存在そのものを静かにキャンセルしてしまっている、そのズレが笑いどころです。

  最後の「おらんかったのは、どっちだ」で主語が反転します。不在票を書いた側こそ、相手を「見る」という意味で不在だった。つまり届かなかったのは荷物ではなく、こちら向きの認識だった、というオチになっています。竿の先に結ばれた不在票が、いつの間にか「こちらが居ない」と告げる旗になっていたわけです。
