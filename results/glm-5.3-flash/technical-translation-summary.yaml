  # 要約：技術的に面白いポイント

  ## Gitスケーリングの根本問題

  Gitはコンテンツアドレス型のDAG(有向非巡回グラフ)構造を持つため、分散KVSへのオブジェクト保存は理論的に綺麗だが実用不能。オブジェクトを辿るたびに次のポインタが前の取得結果依存になり、ネットワークラウンドトリップが律速する。GoogleのShawn PearceによるDHT実装も、Gitプロトコルがパックファイル転送を強制するため失敗した。またパックファイルは「サイズ最小化」ヒューリスティックでオブジェクトをdelta圧縮・ランダム配置するため、グラフ上の論理ホップに加えて物理ホップが発生し、ネットワークファイルシステム(NFS、GFS、DRBD)では性能が崩壊する。

  ## Spokes(GitHub)の設計判断

  - Gitそのものは分散せず、パックファイルレベルでレプリケーション
  - 各レプリカはNVMe上の「普通のGitリポジトリ」
  - 3PC(3相コミット)による強い一致性。ここが肝で、pushは「パックファイル転送(非同期)」と「refトランザクション(同期)」に分離できるため、小さなref更新だけをconsensus対象にできる。Git自体がrefロックと検証をサポートしているのが鍵

  ただし3PCはレイテンシが最遅ノードに律速され、モノレポのレプリカ増加にも、エージェントが生成する大量の小リポジトリ(最低3レプリカ必須)にもスケールしない。ディスク上のリポジトリがconsensusの真実の源なので「pets not cattle」運用になり、ルーティングDBや破損検知・修復が必須。

  ## Continuity(Cursor)の新方式

  - **WALをS3に置く**:pushごとにWALエントリをS3へ。refトランザクション+WALインデックスのCAS更新でのみ可視化→線形化
  - **レプリカはステートレス**：ディスクは「ウォームキャッシュ」に過ぎず、真実の源はS3。rendezvous hashingで配置を決めるが、ずれてもWALから再materializeするだけ
  - **UDP gossipによる楽観的レプリケーション**:パケットロスは問題にならない。読み取り時にETag条件付きGETでS3検証(304は10ms未満)し、必要なら追いつく。一貫性は検証で保証
  - **コンパクション**:primaryのみがrepackし、結果をWAL経由で配布。レプリカはCPUの代わりに帯域を払う

  結果：100レプリカで読み取り線形スケール、S3 Expressで300 push/s以上。优雅な点は「健全時は高速、劣化時も常に正しい」設計で、consensus・選挙・ルーティングDBという運用負荷をS3の真実の源一本に集約したところ。
