  # 1月31日のデータベース障害の事後検証

  2017年1月31日、当社の製品の1つであるオンラインサービスGitLab.comにおいて、重大なサービス障害が発生しました。この障害は、プライマリデータベースサーバーからデータが誤って削除されたことによって引き起こされました。このインシデントにより、GitLab.comサービスが長時間にわたり利用できない状態となりました。また、一部の本番データが失われ、最終的に復旧することができませんでした。

  [...]

  本番データの喪失は許容できません。このような事態が再発しないよう、GitLab.comの運用・復旧手順の複数の改善に取り組んでいます。

  ## タイムライン

  **± 23:00 UTC:** 負荷の増加により、PostgreSQLセカンダリのレプリケーション処理が遅延し始めました。セカンダリが必要とするWALセグメントがすでにプライマリから削除されていたため、レプリケーションが失敗しました。GitLab.comはWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーすることが含まれます。エンジニアの1人がセカンダリにアクセスしてデータディレクトリを消去し、pg_basebackupを実行しました。残念ながら、--verboseオプションが設定されていたにもかかわらず、pg_basebackupは意味のある出力を producing せずにハングアップしてしまいました。

  **± 23:30 UTC:** エンジニアの1人が、以前の実行試行の際にpg_basebackupがセカンダリのPostgreSQLデータディレクトリにいくつかのファイルを作成したのではないかと考えました。通常、この場合pg_basebackupはエラーを出力しますが、当該エンジニアは状況をよく把握できていませんでした。後に別のエンジニア(当時不在だった)が明らかにしたところ、これは正常な動作でした:pg_basebackupはプライマリがレプリケーションデータの送信を開始するのを待ち、その時刻まで黙って待機し続けます。残念ながら、これは当社のエンジニアリングランブックにも公式のpg_basebackupドキュメントにも明確に記載されていませんでした。

  レプリケーションプロセスを復旧させようとして、エンジニアはPostgreSQLデータベースディレクトリを消去しましたが、誤ってセカンダリ上で実行していると思い込んでいました。残念ながら、この操作は代わりにプライマリ上で実行されてしまいました。エンジニアは自分のミスに気づいた1〜2秒後にプロセスを終了させましたが、この時点で約300GBのデータがすでに削除されていました。

  データベースを復旧できることを期待し、関係したエンジニアたちはデータベースのバックアップを探しに行き、Slackで助けを求めました。残念ながら、バックアップの検索と利用の両方のプロセスが完全に失敗しました。

  ## 壊れていた復旧手順

  ### pg_dumpを使用したデータベースバックアップ

  pg_dumpのバックアップを探したところ、それらが存在しないことが判明しました。S3バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調査した結果、バックアップ手順がpg_dump 9.2を使用していたのに対し、当社のデータベースはPostgreSQL 9.6で稼働していることが判明しました(Postgresでは、9.xのリリースはメジャーバージョンと見なされます)。メジャーバージョンの違いにより、pg_dumpはエラーを発生させてバックアップ手順が終了していました。

  [...]

  エラーが発生したcronジョブに対しては通知が有効になっていましたが、これらの通知はメールで送信されるものでした。GitLab.comではDMARCを使用しています。残念ながら、cronジョブのメールに対してはDMARCが有効になっておらず、受信側に拒否されていました。つまり、バックアップが失敗していることに、手遅れになるまで気づくことができなかったのです。

  ### Azureのディスクスナップショット

  NFSサーバーに対しては有効でしたが、他のバックアップ手順で十分だと考えていたため、データベースサーバーに対してはこれらのスナップショットが有効化されていませんでした。

  ## 根本原因分析

  これらの問題の根本原因を分析するために、「5 Whys(なぜなぜ分析)」と呼ばれる手法を使用します。インシデントを2つの主要な問題に分割します:GitLab.comのダウンと、GitLab.comの復旧に長時間を要したことです。

  ### 問題2:GitLab.comの復旧に18時間以上かかった。

  **なぜ標準のバックアップ手順を使用できなかったのか?**
  - 標準のバックアップ手順は、pg_dumpを使用してデータベースの論理バックアップを実行します。PostgreSQL 9.2を使用していたのに対し、GitLab.comはPostgreSQL 9.6で稼働していたため、この手順はサイレントに失敗していました。

  **なぜバックアップ手順はサイレントに失敗したのか?**
  - 失敗時には通知が送信されていましたが、メールが拒否されたため、失敗の兆候がありませんでした。送信者は自動プロセスであり、エラーを報告する他の手段がありませんでした。
