  # 関羽 紹介文

  美髯公の異名を持つ、蜀漢の筆頭武将。劉備とは桃園で義兄弟の契りを結び、その青龍偃月刀と赤兎馬とともに、数々の伝説を残した。

  白馬では袁紹軍の顔良を単騎で討ち取る武勇を披露し、呂布没後の赤兎馬を得て「馬中の赤兎、人中の関羽」と謳われた。曹操に一時仕えた際も厚遇を受けたが、兄・劉備の許を離れず、恩義に報いて後、困難を乗り越えて帰参したその忠義は、後世に語り継がれる。

  劉備が蜀の地を得ると、荊州の守りを任され、樊城の戦いでは洪水を利用して于禁の軍を壊滅させ、その名を恐れさせた。

  しかし、その威名は呉の警戒を招き、孫権の裏切りにより荊州を奪われる。麦城に退いた関羽は、捕らえられてついにその生涯を閉じた。

  武人としての誇りと義を貫いたその生涯は、死してなお「関帝」として崇敬され、中華の英雄の象徴となったのである。
