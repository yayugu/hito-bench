  # 関羽 紹介テキスト

  雲長と号す。蜀漢五虎大将軍の筆頭にして、義を重んじる武の神と称えられた男。河東郡解県の出身で、黄巾の乱の頃に劉備と運命的な出会いを果たし、張飛と共にその弟分として義兄弟の契りを結んだ。

  曹操の厚遇を受けても恩義に報いて去り、千里を行きて single騎千里を行く程の忠義を見せた。白馬の戦いでは袁紹軍の顔良を陣中にて斬り、その武勇は天下に轟いた。赤壁の戦いの後は荊州を守り、水軍を率いて曹操軍を破るなど、劉備の覇業を陰で支え続けた。

  建安二十四年、樊城の戦いで于禁を降し、龐徳を斬って威名は中国に震え、曹操さえも遷都を検討するほどであった。しかし孫権の背信により背後を突かれ、荊州を失って麦城に落ちる。逃走の末に捕らえられ、臨沮にて長男の関平と共に斬刑に処されて非業の死を遂げた。享年五十八。

  その忠義と武勇は死後も語り継がれ、後世「関帝」として神格化され、商売の神、武神として東アジア全体で崇敬される永遠の英雄となった。
