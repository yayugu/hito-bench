  # 最後の注文

  雨の日の午後、七十二歳の田島静江は、孫に教わったままスマホを開いた。

  「アマゾン、ね……」

  夫の三郎が亡くなって三月が経つ。生前、夫はよく言っていた。

  「静江、俺が死んだら、あのモデルハウスみたいな家に住みたいなあ」

  静江には意味が分からなかった。小さなマンションで十分な暮らしだった。だが夫は、テレビで見る広い一軒家の写真を、いつも楽しそうに眺めていたのだった。

  老人ホームの入居を考えたとき、静江は決めた。せめて紙の上だけでも、夫の夢を叶えてあげよう。

  検索欄に入力する。

  「家 販売」

  びっくりするような価格が出てきた。数千万円。静江は首を振り、金額の安い順に並べ替えた。

  そして見つけた。**「組立式 組variant 家庭用 1,980円」**送料無料。

  「まあ、安いのね」

  静江はポチッと押した。届くまでの楽しみができた、と笑いながら。

  一週間後、届いた段ボールを開けて、静江はきょとんとした。

  細かいパーツ。説明書。ドライバー。

  ネジを締めながら、静江は笑った。三郎は不器用で、家具の組立はいつも静江の役目だった。「静江、すまんね」と頭を下げる夫の顔を思い出す。

  三時間後、小さな家が完成した。

  高さ三十センチの、鳥の巣箱だった。

  静江はそれをベランダに置き、三郎の写真を隣に並べた。

  「三郎、あなたの家よ。ここで住みなさいね」

  翌朝、巣箱にスズメが一羽、とまっていた。

  静江は思わず声を上げた。三郎はスズメのように、せっせと働いて、静江を養ってくれた男だった。

  「あら、三郎。早く引っ越してきたのね」

  スズメはきょとんと静江を見て、巣箱に入っていった。

  静江は毎朝、ベランダの巣箱にパンくずを置くようになった。

  「あなたの分よ」

  それから静江は、アマゾンで何を買えばいいのか、ようやく本当の意味で理解した。物を買うサイトじゃない。**思いを届けるサイト**なのだと。

  注文履歴には、翌日、こう表示されていた。

  「ご注文ありがとうございました。**またのご利用をお待ちしております**」

  静江はスマホに向かって小さく言った。

  「ええ、また買うわ。三郎の家、増築させたろと思うし」

  ——完——

