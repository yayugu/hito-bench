  1月31日 データベース障害の事後解析（Postmortem）

  2017年1月31日、私たちのプロダクトの一つであるオンラインサービス GitLab.com で大規模なサービス障害が発生しました。この障害の原因は、プライマリデータベースサーバーからのデータが誤って削除されたことでした。この事象により、GitLab.com のサービスが数時間にわたり利用不能となり、最終的に復旧不可能となったプロダクションデータを一部喪失しました。

  [...]

  プロダクションデータの喪失は許容できません。再発防止のため、GitLab.com の運用・復旧手順の複数の改善に取り組んでいます。

  タイムライン

  約 23:00 UTC：負荷の増加により、PostgreSQL のセカンダリのレプリケーション処理が遅れ始めました。セカンダリに必要な WAL セグメントがプライマリから既に削除されていたため、レプリケーションは失敗しました。GitLab.com は WAL アーカイブを使用していなかったため、セカンダリの手動による再同期が必要となりました。これは、セカンダリの既存データディレクトリを削除し、pg_basebackup を実行してプライマリからセカンダリへデータベースをコピーする作業です。エンジニアの一人がセカンダリに接続し、データディレクトリを消去して pg_basebackup を実行しました。残念ながら、--verbose オプションが設定されていたにもかかわらず、pg_basebackup はハングし、意味のある出力が表示されませんでした。

  約 23:30 UTC：エンジニアの一人が、おそらく過去の pg_basebackup の実行時にセカンダリの PostgreSQL データディレクトリ内に一部のファイルが作成されたのではないかと考えました。通常、この場合 pg_basebackup はエラーを出力しますが、当該エンジニアは状況に確信が持てませんでした。後日、別のエンジニア（当時不在）がこの動作は正常であることを明らかにしました。pg_basebackup はプライマリがレプリケーションデータの送信を開始するまで待機し、その間は無音のまま待ち続けるのが正常な動作です。残念ながら、これは私たちのエンジニアリング・ランブックにも、公式の pg_basebackup ドキュメントにも明確に記載されていませんでした。

  レプリケーション処理の復旧を試みる中、あるエンジニアが PostgreSQL データベースディレクトリを消去する作業に取りかかり、セカンダリに対して行っているはずだと誤認していました。残念ながら、この処理はプライマリに対して実行されていました。エンジニアはミスに気づいてから1〜2秒後にプロセスを終了させましたが、この時点で約300GBのデータが既に削除されていました。

  データベースを復旧できることを願い、関与したエンジニアたちはデータベースのバックアップを探し、Slack で助けを求めました。残念ながら、バックアップの発見と使用の両方のプロセスが完全に失敗しました。

  破綻した復旧手順

  pg_dump を用いたデータベースバックアップ

  pg_dump のバックアップを探しに行ったところ、それが存在しないことが判明しました。S3 バケットは空であり、どこにも直近のバックアップが見つかりませんでした。さらに詳しく調査したところ、バックアップ手順が pg_dump 9.2 を使用していたのに対し、私たちのデータベースは PostgreSQL 9.6（PostgreSQL では 9.x リリースはメジャーバージョンとみなされる）で動作していることが判明しました。メジャーバージョンの不一致により、pg_dump はエラーを出力し、バックアップ手順は中断されていました。

  [...]

  cronjob でエラーが発生した場合の通知は有効化されていますが、これらの通知はメールで送信されます。GitLab.com では DMARC を使用しています。残念ながら、cronjob からのメールには DMARC が有効化されておらず、受信側で拒否されていました。つまり、バックアップが失敗していた事実を誰も把握しておらず、手遅れになるまで放置されていました。

  Azure ディスクスナップショット

  NFS サーバーには有効化されていましたが、他のバックアップ手順が十分だと判断したため、データベースサーバーにはスナップショットが有効化されていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するため、「5つのなぜ（The 5 Whys）」という手法を用います。本障害を2つの主要な問題に分解して分析します：GitLab.com がダウンした問題、および GitLab.com の復旧に長時間かかった問題。

  問題2：GitLab.com の復旧に18時間以上かかった。

  なぜ標準的なバックアップ手順を使用できなかったのか？
  - 標準的なバックアップ手順は、pg_dump を用いてデータベースの論理バックアップを行うものです。GitLab.com は PostgreSQL 9.6 で動作しているにもかかわらず、この手順は PostgreSQL 9.2 を使用していたため、サイレントに失敗していました。

  なぜバックアップ手順はサイレントに失敗したのか？
  - 失敗時に通知は送信されましたが、メールが拒否されたため、失敗を示す兆候が一切ありませんでした。送信元はエラーを報告する他の手段を持たない自動プロセスでした。
