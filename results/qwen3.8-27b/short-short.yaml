  # 緑の牢

  ---

  日誌、ある。

  **一日目。** アマゾンに入った。木々が神の神殿の柱みたいに立っている。空気が湿って、重くて、生きている。息を吸うたびに肺が泥を吸い込むみたいだ。

  **五日目。** 川を見失った。どっちを向いても同じ緑。終わりのない緑。

  **十二日目。** 一族に出会った。金色の箱を崇めている。言葉がわからんが、何度も同じ音を出す。「プライム、プライム、プライム」。祈りだろう。

  **二十日目。** 川がまた見える。茶色くて、終わりなく、わからないものを運んでいる。何日も止まらない。

  **三十日目。** ここでは死にそうだ。出口がない。地図を全部捨てた。

  ---

  妻は、倉庫の更衣室のロッカーからその手帳を見つけた。

  夫は本日、Gゾーン七列の棚の間で、四時間のシフトを「歩行」していた。

  ---

  **オチ解説**

  「アマゾン」を二重の意味で使っている。冒頭では読者は「アマゾンのジャングルで遭難した探検家の記録」と読む。木々＝棚の柱、川＝コンベアベルト（流れる荷物）、金色の箱＝Amazonのロゴ入りの梱包材、一族＝同僚たち、そして「プライム」の呪文＝「プライム配送」の叫び。

  三十日間の「遭難」は、実態として四時間のシフト中、棚の間に迷い続けただけの話。日付の「日」は体感時間であり、実際には数時間。

  「出口がない」という一言が、遭難の絶望と、倉庫の迷路のような構造の両方を読み込ませるのが最後の刺。妻の淡々とした語りと、夫の切迫した日記の温度差がオチを締める。
