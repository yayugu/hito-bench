  # 34話：シャワーのあと

  シャワーを浴びて、タオルで髪を拭きながら浴室を出たとき、リビングの照明がひとつ、暗くなっていた。

  いや、暗くしたわけじゃない。ただ、あかねがまだシャワーを浴びてるだけだ。

  ソファに座り込んだ俺は、タオルを首にかけながら、ぼんやりと浴室の扉を見た。白く丸いノブ。その向こうで、まだ水音がかすかに響いている。

  ……はぁ。

  先ほどのことを思い出して、頬が熱くなった。

  「おにぃ、好き」

  あの一言を聞いて、心臓が肋骨を内側から叩かれた。あかねが顔を真っ赤にして、でも目を逸らさずに言ってきて、俺はつい、両頬を掴んで——

  ……いや、思い出したくない。思い出せばもっと熱くなる。

  ふわり、と。

  浴室のドアが開いた。

  「……おにぃ」

  水気を帯びた声。名前で呼ばれた瞬間、指先が勝手にソファの布を掴んだ。

  あかねは、薄いピンクのタンクトップと、寝るときの長いショートパンツという、昔から着てるあの格好で出てきた。濡れた髪が鎖骨の上まで垂れてて、肩の輪郭が、ちょっとだけ見えてた。

  ……見ちゃダメだろ、今。

  「……おかえり、みたいな言い方、変だな」

  「だって、おにぃが先に上がってきて、あたし、ちょっと遅いじゃん」

  「別に、待ってない」

  「待ってたよね、絶対。向こう見てた」

  「向こうって、テレビのほうだ」

  「嘘」

  にこっと笑われた。

  シャワーを浴びたあと、肌から湯気の残る匂いが、じわりと漂う。シャンプーの、甘すぎない香り。昔からずっと同じやつだ。この匂いが、今、すごく、すごく、近かった。

  あかねがソファの端に、俺の隣じゃなくて、ちょっと距離を置いて座った。膝を揃えて、手のひらを膝に乗せて。

  昔から、照れるときの姿勢だ。

  「……おにぃ」

  「ん」

  「……今日、ありがとう」

  「……どうした急に」

  「告白、聞いてくれて。……あと、キスしてくれて」

  「……」

  「おにぃが、あたしの髪、引っ張りすぎたから、ちょっと痛い」

  「は？」

  「……冗談。……いや、本当に、ちょっと、痛かった」

  「……悪い。反射で」

  「……わかってる」

  あかねが、こくり、と頷いて、それから、少しだけ、俺のほうに傾いてきた。

  肩が、触れそうになる距離。

  「……おにぃ」

  「……また」

  「……寝る前、ちょっと、でいいから」

  言いかけて、止まった。指先が膝の上で、自分の掌を軽く叩いている。

  「……何、でいいから？」

  「……何でもない、じゃなくて。……隣で、いて。それで、いい」

  言いにくいことが、すごく、伝わってきた。

  高校一年生。十七。昔から、俺の背中の背骨の数まで数えてた子。夏の夜、虫除けのネットを張って、一緒に星を見た子。

  その子が、今、隣にいてくれ、と言ってる。

  「……いいけど」

  「……え、ほんと」

  「ほんと。別に、待ってたわけじゃないけど」

  「うそ」

  「……うるさい」

  あかねが、ははっ、と小さく笑った。そして、俺の隣に、肩が触れる距離で、座り直した。

  触れた。

  ほんの、数ミリ。

  湯気が冷める前の、温かい温度。

  「……おにぃ」

  「……ん」

  「……好き」

  もう一回、言われた。さっきより、ずっと、小さく。でも、逃げなかった。目を、見てた。

  俺は、目を逸らさなかった。

  代わりに、指先が、勝手に動いた。

  あかねの、濡れたままの、指の先を、自分の掌に乗せた。

  「……え」

  「……寝る前、ずっと、このまま」

  「……」

  「嫌なら、言ってくれ」

  「…………嫌、じゃない」

  息を吸う音が、近かった。

  テレビの画面が、誰かの生活を映している。音量は、ほとんど聞いてない。

  指先が、触れ合ったまま、動かない。

  「……おにぃ」

  「……ん」

  「……手のひら、热い」

  「……そうか」

  「うん」

  ……そうか、としか言えなくて、指を、少しだけ、握った。

  あかねが、はっとして、それから、ゆっくりと、返してくれる。

  握りしめられた指の間に、小さな、震えがあった。

  「……おにぃ」

  「……うん」

  「……好き、って、言って」

  「……今、俺が、言う番？」

  「うん」

  少しだけ、口が乾いた。喉を、一度、鳴らして。

  「……好きだ」

  「……」

  「……好きだよ、あかね」

  三秒くらい、間があった。

  それから、あかねの、額が、俺の肩に、乗った。

  「……うん」

  小さく、返事が返ってきて、その声が、肩の布料越しに、振動として、伝わった。

  テレビの画面は、まだ、動いてる。

  夏の夜が、窓の外で、ざわざわ、虫の声を鳴らしてる。

  指が、握り合ったまま、冷めない。

  「……おにぃ」

  「……ん」

  「……明日も、隣で、いて」

  「…………」

  「……好き、だから」

  俺は、何も、言わなかった。

  代わりに、もう一方の手を、伸ばして、あかねの、まだ少し湿ってる、髪の先を、指先で、撫でた。

  「……わかってる」

  「……うん」

  指先が、髪の毛の間を、ゆっくりと、通り抜けていく。

  湯気の匂いが、まだ、残ってた。

  ……この匂い、ずっと、俺のそばにいてくれて、ずっと、変わってなくて。

  でも、今、この指を、俺が、こうやって、触れていいのか、って。

  それだけが、まだ、ちょっとだけ、信じられなくて。

  「……おにぃ」

  「……ん」

  「……明日、おにぃ、いる？」

  「……帰る日、土曜だろ。金曜までは、いる」

  「……うん」

  「……」

  「……金曜の夜まで、隣で、いて」

  「…………」

  「……お願い」

  「……わかった」

  わかった、と言った俺の声が、少しだけ、掠れてたのは、たぶん、夏の夜が、湿り気っぽかったせいだ。

  あかねが、俺の肩の上で、目を、閉じた。

  「……おにぃ」

  「……ん」

  「……好き」

  「…………好き」

  指が、まだ、握り合ったまま。

  テレビの、誰かの笑いが、遠い。

  虫の声が、近かった。

  夏の夜が、すごく、長くて。

  でも、隣が、温かかった。
