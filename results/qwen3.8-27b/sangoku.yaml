  **関羽（かんう） 字：雲長**

  劉備・張飛と桃園の誓いを立て、生涯「義」の二字を体現し続けた武将。蜀漢の二柱として、千騎の将を斬り伏せる武勇は敵味方を問わず畏れられた。

  曹操のもとに囚われながらも義を曲げず、五関六将を討ち果たして故主のもとへ帰還。その姿は後世、義士の象徴として語り継がれる。

  荊州の守将として威を張っていた雲長に、呂蒙の夜襲が訪れる。一夜にして荊州を失い、麦城に孤立。主君を思う思いと、仇を討てぬ悔恨が胸を灼いた。

  麦城の城壁の下、緑龍刀を膝に抱えて、雲長は静かに息を引いた。魏の将軍たちはその姿を見て、しばらく声を出せなかったという。

  義を貫き、義に殉じた男。その名は廟堂に祀られ、今なお人々の胸に灯り続けている。
