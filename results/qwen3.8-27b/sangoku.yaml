  **関羽（カンウ）／前将軍・五虎大将の長**

  涿の地で結ばれた桃園の誓い――劉備、張飛、そして己。三人の兄弟が交わした約束こそ、彼の生涯を貫く唯一の剣戟であった。曹操の陣に身を置きながらも、義兄弟の旗へただ一筋に駆け戻る道は、忠義という名の無謀そのもの。長坂を斬り開き、赤壁の火を背に荊州を手中にし、樊城の門を叩いたとき、彼はもはや天下の誰よりも高い場所に立っていた。五虎大将の長、前将軍――その名は天下に轟いた。だが、頂に立つ者は最も孤独である。呂蒙の影が荊州をみ、麦城の壁に背を預けた夜、彼は遠い昔、桃園で交わした約束の残光を視た。青龍偃月刀を握る指が、生涯で唯一、震えた。斬られる直前まで、彼は笑っていたという。――忠義とは、死しても色褪せぬ名である。

  （約300字）
