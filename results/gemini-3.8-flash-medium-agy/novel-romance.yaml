  ### 第34話　お風呂上がりの熱と、名前の呼び方

  　脱衣所のドアがカチャリと開き、パタパタと素足の足音が廊下を渡ってくる。
  　俺――千石薫は、自分の部屋のベッドの端に腰掛けたまま、無意識にゴクリと喉を鳴らした。

  　先にシャワーを浴びたのは俺だった。
  　汗を流してサッパリするはずが、ついさっき起きた出来事――あかねからの告白、恋人同士になったこと、そして交わしたキスの感触が頭から離れず、むしろ火照りは増すばかりだった。

  「……おにぃ、あがったよ」

  　控えめにノックされ、ゆっくりとドアが開く。
  　そこに立っていたあかねの姿を目にした瞬間、俺の心臓は派手な音を立てて跳ね上がった。

  「あ、ああ。おつかれ……って」

  　あかねは、俺が貸した大きめの黒いＴシャツを着ていた。
  　小柄な彼女の膝上あたりまで裾が届いていて、いわゆる完全な『彼シャツ』状態だ。袖口からちょこんと出た指先、蒸気を含んでほんのり桜色に染まった白い肌、そして鎖骨のあたりに張り付いた濡れた黒髪。
  　普段の素朴で元気いっぱいな幼なじみの面影はどこへやら、とんでもなく無防備で、艶めかしい少女がそこにいた。

  「……なんか、おっきすぎたかな？　変じゃない？」
  「へ、変なわけないだろ！　むしろ、その……めちゃくちゃ可愛い」
  「っ……もう、いきなりそういうこと言うんだから……」

  　あかねは恥ずかしそうに視線を泳がせながら、両手でＴシャツの裾をきゅっと握りしめた。
  　部屋の中に、俺と同じシトラス系のボディソープの香りと、あかね自身の甘い匂いがふわりと満ちていく。それだけで頭がどうにかなりそうだ。

  「髪、まだ濡れてるな。風邪引くぞ」
  「うん。でも、あたし……ドライヤーの場所わかんなくて」
  「あ、そっか。持ってくるから座ってて」

  　洗面所からドライヤーを持って戻ると、あかねはお行儀よくベッドの前にちょこんと座っていた。俺が背後に回ると、彼女の肩がピクッと小さく跳ねる。

  「乾かすよ。熱かったら言ってな」
  「……うん。ありがと」

  　スイッチを入れ、低いうなり声とともに温風が吹き出す。
  　指先であかねの黒髪をすくい上げる。しっとりと濡れた髪は驚くほど細くて柔らかい。
  　指が触れるたび、あかねの耳たぶがみるみる赤く染まっていくのが分かった。俺の手も、緊張のせいでわずかに震えている。

  　田舎の小鹿村にいた頃は、川遊びをしてずぶ濡れになれば、お互い当たり前のようにタオルで頭を拭き合っていた。あの頃は何の後ろめたさもなかったのに、今はたった一本の髪の毛に触れるだけで、胸が痛いほど締め付けられる。

  「……おにぃの手、あったかいね」
  「そうか？　あかねの髪、すげーサラサラだな」
  「えへへ……おにぃに褒められるの、一番嬉しい」

  　ドライヤーの風音に混じって届く、あかねの甘えたような声。
  　やがて完全に乾ききった髪にブラシを通し、スイッチを切ると、部屋に濃密な静寂が戻ってきた。

  「はい、おしまい」
  「……ありがと、おにぃ」

  　あかねがゆっくりと振り返り、見上げるように俺の瞳を覗き込んできた。
  　大きな瞳が、潤んだ光を帯びて揺れている。

  「あのね……おにぃ」
  「ん？」
  「さっき、あたしたち……付き合おうって、約束したでしょ？」
  「ああ。夢じゃないよな」
  「うん、夢じゃない。……だからね、あたし、ずっと気になってたことがあって」

  　あかねはもじもじと指先をもてあそびながら、上目遣いに俺を見つめる。

  「……『おにぃ』って呼び方、やめたほうがいいのかなって」
  「え？」
  「だって、あたしたち、本当の兄妹じゃないし……今日からは、恋人同士なんだもん。『薫くん』とか……呼んだほうが、いいのかなって」

  　消え入りそうな声で紡がれたその提案に、俺は思わず息を呑んだ。
  　破壊力が桁違いすぎる。

  「で、でも……ずっと『おにぃ』って呼んできたから、急に変えるの、すっごく恥ずかしくて……」
  「……無理に変えなくてもいいよ。俺は、あかねに『おにぃ』って呼ばれるの、昔から好きだったし」
  「ほんと……？　でも、たまに……ふたりっきりのときだけ、名前で呼んでもいい？」
  「……っ、ああ。あかねの好きなように呼んでくれ」

  　答えると、あかねは花がほころぶようにふわりと微笑んだ。
  　そして、そっと立ち上がり、俺の胸元に両手を添えてきた。

  「……薫くん」

  　耳元で囁かれたその名前に、全身の血がカッと沸騰するのを感じた。
  　我慢できるはずがなかった。
  　俺はあかねの細い腰を引き寄せ、そのままぎゅっと強く抱きしめた。

  「きゃっ……薫、くん……っ」
  「あかね……ダメだ、可愛すぎる」
  「んっ……くるしくないよ。もっと、ぎゅってして……」

  　あかねの細い腕が、俺の背中に回される。
  　薄いＴシャツ越しに、彼女の柔らかな温もりと、トクトクと激しく脈打つ小さな心音が生々しいほどに伝わってくる。

  「おにぃの匂いがする……すごく、落ち着くの」
  「俺は……心臓が止まりそうなんだけど」
  「あたしもだよ？　ほら、ここ……すっごくトクンって鳴ってる」

  　あかねが俺の手を取り、自分の胸元へとそっと導いた。
  　手のひらに伝わる豊かな感触と、激しい鼓動に、頭の芯が痺れそうになる。

  「あかね……」
  「……キス、して？」

  　目を閉じて、わずかに唇を尖らせるあかね。
  　さっきの控えめな誓いのキスとは違う。熱を帯びた吐息が重なり合い、唇が触れ合った瞬間、あかねの小さな吐息が漏れた。

  　一度では終わらず、角度を変えて何度も唇を重ねる。
  　吸い付くような感触に夢中になっていると、あかねの体が力なくベッドへと倒れ込んだ。

  　重なるようにして覆いかぶさると、あかねはとろけたような瞳で俺を見つめ、シーツをきゅっと握りしめた。

  「……あたし、今日のために……覚悟、してきたんだよ？」

  　上気した頬と、乱れた胸元。
  　幼なじみという枠を越えて、ふたりきりの長い夜が、静かに始まろうとしていた。
