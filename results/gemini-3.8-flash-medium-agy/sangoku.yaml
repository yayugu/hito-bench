  ### 関羽（字：雲長）クリア後列伝テキスト

  蜀の五虎大将軍の筆頭。劉備、張飛と桃園の誓いを交わし、義兄弟として乱世に仁の世を築くべく生涯を捧げた。
  並外れた武勇と揺るぎなき信義を重んじ、「万人の敵」「美髯公」とも称された。一時身を寄せた曹操からの破格の厚遇にも心を動かされることなく、主への忠義を守って千里の道を駆け、再び劉備のもとへと帰参する。
  劉備の入蜀後は要衝・荊州の総督として防衛を一手に担い、樊城の戦いでは魏の大軍を水攻めで圧倒し、天下にその武名を轟かせた。
  だが、同盟を結んでいた孫権の背信によって挟撃を受け、麦城にて孤立。最後まで誇り高き義を貫き、壮烈な最期を遂げた。
  その高潔な義勇は敵味方を超えて語り継がれ、後世には「軍神」として祀られている。

