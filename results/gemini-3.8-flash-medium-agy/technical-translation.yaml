  1月31日のデータベース障害に関するポストモーテム（事後検証）

  2017年1月31日、当社の製品の1つであるオンラインサービスGitLab.comで大規模なサービス停止が発生しました。この停止は、プライマリデータベースサーバーから誤ってデータが削除されたことが原因でした。このインシデントにより、GitLab.comのサービスは何時間にもわたって利用不能となりました。また、最終的に復旧できなかった本番データも一部失われました。

  [...]

  本番データの喪失は決して容認できることではありません。このような事態の再発を防ぐため、GitLab.comの運用およびリカバリ手順に対して複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC: 負荷の増加に伴い、PostgreSQLセカンダリのレプリケーションプロセスに遅延が発生し始めました。セカンダリが必要とするWALセグメントがすでにプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存データディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーする作業が伴います。エンジニアの1人がセカンダリにアクセスしてデータディレクトリを消去し、pg_basebackupを実行しました。しかし残念なことに、--verbose オプションを指定していたにもかかわらず、pg_basebackupはハングアップし、意味のある出力を一切生成しませんでした。

  ± 23:30 UTC: エンジニアの1人は、前回の実行試行時にpg_basebackupがセカンダリのPostgreSQLデータディレクトリ内にいくつかファイルを作成してしまったのではないかと考えました。通常このような状況ではpg_basebackupがエラーを出力しますが、該当のエンジニアは何が起きているのかよく分かっていませんでした。後に（その場にいなかった）別のエンジニアによって、これは正常な動作であることが明らかになります。pg_basebackupはプライマリがレプリケーションデータの送信を開始するのを待ち、その時が来るまで静かに待機し続ける仕様でした。不運なことに、このことは社内のエンジニア向けランブックにも公式のpg_basebackupドキュメントにも明確に記載されていませんでした。

  レプリケーションプロセスの復旧を試みようと、あるエンジニアはセカンダリ上で操作していると誤認したまま、PostgreSQLデータベースディレクトリの消去に進みました。残念なことに、この処理は代わりにプライマリ上で実行されてしまいました。エンジニアはミスに気付いて1〜2秒後にプロセスを強制終了させましたが、その時点ですでに約300GBのデータが削除されていました。

  データベースを復旧できることを期待して、関係したエンジニアたちはデータベースのバックアップを探しに行き、Slackで助けを求めました。しかし残念ながら、バックアップを見つける手順も使用する手順も完全に失敗に終わりました。

  機能していなかったリカバリ手順

  pg_dumpを使用したデータベースバックアップ

  pg_dumpのバックアップを探しに行ったところ、それらが存在しないことが判明しました。S3バケットは空で、最近のバックアップはどこにも見当たりませんでした。詳しく調査したところ、データベースはPostgreSQL 9.6で稼働しているにもかかわらず、バックアップ手順ではpg_dump 9.2が使用されていたことが分かりました（Postgresでは9.xのリリースはメジャーバージョンとみなされます）。メジャーバージョンの不一致によりpg_dumpはエラーを出力し、バックアップ処理を終了させていました。

  [...]

  エラーが発生したcronジョブに対しては通知が有効化されていましたが、これらの通知はメールで送信されていました。GitLab.comではDMARCを使用しています。不運なことに、cronジョブのメールではDMARCが有効になっておらず、受信側によって拒否されていました。これは、手遅れになるまでバックアップが失敗していることに私たちがまったく気付かなかったことを意味します。

  Azureディスクスナップショット

  NFSサーバーに対しては有効化されていたものの、他のバックアップ手順で十分であると思い込んでいたため、データベースサーバーのいずれに対してもこれらのスナップショットは有効化されていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するために、「なぜなぜ分析（5 Whys）」と呼ばれる手法を用います。今回のインシデントを「GitLab.comの停止」と「GitLab.comの復旧に長い時間がかかったこと」の2つの主要な問題に分解します。

  問題2: GitLab.comの復旧に18時間以上かかったこと。

  なぜ標準のバックアップ手順を使用できなかったのか？
  - 標準のバックアップ手順では、pg_dumpを使用してデータベースの論理バックアップを実行していました。この手順は、GitLab.comがPostgreSQL 9.6で稼働しているのに対し、PostgreSQL 9.2を使用していたため、何のエラーも知らせずに（静かに）失敗していました。

  なぜバックアップ手順は静かに失敗したのか？
  - 失敗時に通知は送信されていましたが、メールが拒否されていたため、失敗を示す兆候がありませんでした。送信元は自動化されたプロセスであり、エラーを報告する手段が他に存在しませんでした。
