  ### 『部屋の中の密林』

  男は、もう半年も玄関から一歩も外に出ていなかった。

  仕事は完全リモート。水も、レトルト食品も、ティッシュ一枚に至るまで、生活に必要なありとあらゆるものは「アマゾン」で手に入った。欲しいものを検索し、ボタンを一度押すだけで、翌日には玄関先に届く。男にとって外の世界はもはや不要だった。

  ある日、頼んだ覚えのない小包が届いた。
  差出人はいつもの通販会社。だが、やけに箱が湿っぽく、かすかに青臭い匂いがする。伝票の品名には『サプライズ・ギフト（無料特典）』とだけ印字されていた。

  開けてみると、黒い土で汚れた奇妙な種子がひとつ入っていた。
  男は暇つぶしに、以前通販で買って放置していたプランターへその種を埋め、水をやった。

  翌朝、異変が起きた。
  種子は一夜にして芽吹き、男の背丈ほどに伸びていた。
  それだけでは終わらない。二日目には太いツタが天井の照明に巻きつき、三日目には壁一面を巨大なシダ植物が覆った。蛇口をひねっていないのに、部屋の中には霧のような湿気が立ち込め、鳥のような甲高い鳴き声までどこからか聞こえ始めた。

  普通ならパニックになるところだが、男はむしろ心地よさを感じていた。
  部屋中に積み上げられた未開封の段ボール箱の山は、ツタや苔に覆われて小さな緑の連峰のようになっている。男はその段ボールの隙間に潜り込み、スマホで追加のミネラルウォーターを注文した。

  「部屋にいながら大自然を満喫できる。さすがは何でも揃うアマゾンだ」

  男はベッドを捨て、段ボールと落ち葉で作った寝床で眠るようになった。
  一週間も経つと、ワンルームの部屋は完全に未知の生態系を宿す「密林（アマゾン）」と化していた。男の肌は浅黒く汚れ、着ていたパジャマは植物の棘でボロボロに裂けていたが、本人は至って幸福だった。

  ピーンポーン。

  木々のざわめきを縫って、懐かしいインターホンの音が響いた。注文していた缶詰が届いたらしい。
  男はツタをかき分け、草をかき分けながら、ようやく玄関のドアノブに手をかけた。

  扉を開けると、そこに立っていたのはいつもの配達員ではなかった。
  つばの広いサファリハットをかぶり、カーキ色の探検服を着て、首から双眼鏡をぶら下げた筋骨たくましい男だ。足元には泥除けのスパッツまで巻いている。

  配達員は男の姿を見るなり、胸の前で大きく十字を切った。

  「……よかった、生きておられたか。お届け物です」

  手渡されたのは、薄っぺらい一通の封筒だった。
  男は首を傾げた。

  「こんなもの、頼んだ覚えはないが？」

  「ご両親からのギフト設定になっております」
  配達員は胸ポケットから無線機を取り出しながら、朗らかに告げた。

  「品名は『文明社会への片道航空券』。――本部へ連絡、アマゾン奥地で行方不明だった遭難者を、無事発見しました」
