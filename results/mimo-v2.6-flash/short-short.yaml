  # ショートショート【アマゾン】

  十年目、俺はアマゾンで配達員をやっている。
  「今日で辞める」と店長に言った。

  翌朝、玄関先に荷物が一つ。
  破れそうなほど重い。
  「誰が注文したんだろう」──箱を開ける。

  退職届。
  注文主：店長。サイン：俺の筆跡。

  十年間、他人の荷物を届けるだけだった俺に。
  初めて届けられたのは、自分の辞表だった。

  ---

  **オチの解説：**

  退職届に自分のサインが入っている──俺は自分で辞める決断をした（退職届にサインした）のに、それを自分ではまだ受け取れていなかった。店長が荷物として届けてくれたことで、ようやく俺は自分の辞表を「受け取る側」に回れた。十年間「届ける側」だった配達員が初めて「届けられる側」になる──この役割の逆転こそが、辞めるという決断の完成だった。
