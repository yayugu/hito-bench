  # 関羽（かんう）— 詳細紹介

  桃園の誓いにより劉備・張飛と結ばれた義兄弟。赤面長髯と偃月刀を以て圧倒的な武勇を振るい、天下に名を馳せた猛将である。その忠義心は乱世にあってなお揺るがず、ある時は曹操の厚遇にも敢えて鞍替えせず、華容道にて恩を忘れぬ姿を見せた。五関突破の異名は義の貫き方そのものであり、幾多の戦場を独歩して劉備のもとへ帰り、荊州の鎮守大将として威光を示す。しかしながらその義にこだわる性格が呉との対立を深め、呂蒙の策に陥る身となり、漢水の地にて最期を迎える。劉備の覇業は道半ばで尽き、関羽の戦死は蜀の滅亡への道筋を刻む一石となった。忠義一筋に生きた男として、その名は三国史上最も輝くものである。
