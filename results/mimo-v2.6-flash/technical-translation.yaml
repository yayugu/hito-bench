  2017年1月31日 データベース障害の事後報告

  2017年1月31日、私たちのプロダクトであるオンラインサービスGitLab.comで、大規模なサービス障害が発生しました。この障害の原因は、プライマリデータベースサーバーからのデータの誤削除でした。この事故により、GitLab.comサービスは多数の時間にわたって利用できなくなりました。また、回復できなかった生産データも一部失われました。

  [...]

  生産データの喪失は許容できません。このようなことが二度と起こらないよう、GitLab.comの運用・復旧手順における複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC: 負荷増大により、PostgreSQLセカンダリのレプリケーション処理が遅れ始めました。セカンダリが必要としていたWALセグメントがすでにプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリは手動で再同期する必要がありました。この作業には、セカンダリ上の既存データディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーすることが含まれます。あるエンジニアがセカンダリにアクセスし、データディレクトリをワイプしてからpg_basebackupを実行しました。残念ながら、--verboseオプションが指定されているにもかかわらず、pg_basebackupはハングし、有意義な出力を何も生成しませんでした。

  ± 23:30 UTC: あるエンジニアは、以前の実行の際にpg_basebackupがセカンダリのPostgreSQLデータディレクトリにファイルを作成していたのかもしれないと考えました。通常であれば、このような場合pg_basebackupはエラーを表示しますが、当該エンジニアは状況がよく分かりませんでした。後に、別のエンジニア（当時その場にはいませんでした）により、これが正常な動作であることが判明しました。pg_basebackupは、プライマリがレプリケーションデータの送信を開始するまで待ち、それまで静かに待機し続けるだけです。残念ながら、これは私たちのエンジニアリングランブックにも公式のpg_basebackupドキュメントにも明確には記載されていませんでした。

  レプリケーションプロセスを復旧しようとして、あるエンジニアがPostgreSQLデータベースディレクトリをワイプしました。誤ってセカンダリではなくプライマリ上での操作であると気づいています。気づいた後、数秒でプロセスを終了しましたが、その時点ですでに約300GBのデータが削除されていました。

  データベースを復元できると期待して、関係者たちはデータベースバックアップを探し、Slackでヘルプを求めました。残念なことに、バックアップの検索と利用のプロセスは完全に失敗しました。

  復旧手順の不備

  pg_dumpによるデータベースバックアップ

  pg_dumpバックアップを探しに行ったところ、それらが存在しないことが判明しました。S3バケットは空で、どこにも最近のバックアップは見つかりませんでした。詳細に調査したところ、バックアップ手順がpg_dump 9.2を使用していたのに対し、私たちのデータベースはPostgreSQL 9.6で稼働していたことが分かりました（Postgresでは、9.xリリースはメジャーバージョンとされます）。メジャーバージョンの差異により、pg_dumpがエラーを発生させ、バックアップ手順が終了していました。

  [...]

  エラーを発生したcronジョブには通知が有効ですが、これらの通知はメールで送信されます。GitLab.comではDMARCを使用しています。残念ながら、cronジョブからのメールにはDMARCが有効化されていなかったため、受信側で拒否されました。つまり、バックアップが失敗していることを、遅きに失するまで知らされませんでした。

  Azureディスクスナップショット

  NFSサーバーには有効化されていましたが、他のバックアップ手順で十分であると考えたため、データベースサーバーには有効化されていませんでした。

  根本原因の分析

  これらの問題の根本原因を分析するため、「5つのなぜ」の手法を使用します。この障害を2つの主要な問題に分けて分析します：GitLab.comがダウンしたこと、およびGitLab.comの復旧に非常に長い時間がかかったこと。

  問題2: GitLab.comの復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使用できなかったのか？
  - 標準のバックアップ手順では、pg_dumpを使用してデータベースの論理バックアップを行っていました。この手順はPostgreSQL 9.6で稼働しているGitLab.comに対してPostgreSQL 9.2を使用していたため、静かに失敗しました。

  なぜバックアップ手順は静かに失敗したのか？
  - 失敗時には通知が送信されていましたが、メールが拒否されたため失敗の通知はありませんでした。送信元は自動化されたプロセスであり、エラーを報告する他の手段がありませんでした。
