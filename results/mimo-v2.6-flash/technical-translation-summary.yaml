  ## 要約

  Gitリポジトリの大規模ホスティングは、Packfileという構造上の課題から始まる。GitのオブジェクトはDAG構造で、各オブジェクトの参照を順にたどる必要があり、ストレージを分散するとオブジェクト単位の取得が多重ラウンドトリップとなり性能が崩壊する。さらにPackfile内部ではオブジェクトがランダム配置・デルタ圧縮されており、ネットワークファイルシステム上でのランダムアクセスも非効率だ。

  GitHubは当初NFSやDRBDなどファイルシステム分散を試みたが失敗し、最終的に「Spokes」を開発。SpokesはローカルNVMe上に通常のGitリポジトリを保持し、3PC（三段階コミット）でリファレンス更新をクォーラム同期する方式を採用した。ただし3Replica固定では大型Monorepoにも小型Repoにも硬直的で、TCPのレイテンシは最遅ノードに律速され、スケーラビリティに上限がある。またディスク上のリポジトリが真実源（source of truth）となるため、障害対応・チェックサム管理・修復が常に必要で運用コストが高い。

  これに対しCursorの「Continuity」は、S3上のWAL（先行書き込みログ）を真実源とする設計。プッシュはS3にリニアライズ可能なWALエントリとして永続化され、参照トランクションが準備完了するまで応答しない。ローカルリポジトリはキャッシュであり、どこにあってもWALから再構築可能。ルーティングテーブルや外部DBは不要。リプリケーションはUDPゴシップで通知し、各レプリカはS3のETagによる条件付きGETで整合性を検証する——パケットが失われても必ず正確。コンパクションはプライマリでのみ実施し、その結果をS3経由で全レプリカがダウンロードする。

  この設計により、読み取りはレプリカ数に比例して線形にスケール（100レプリカで実証済み）、プッシュスループットはS3のPUTレイテンシに依存するだけで、MonorepoにもマイクロRepoにも動的に最適なレプリカ数を割り当てられる。一貫性・耐久性・パフォーマンスを両立した、WALベースのGitホスティングの実用的な新アーキテクチャだ。
