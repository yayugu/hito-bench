  # 第34話：おにぃ、目ぇ開けちゃダメ

  　シャワーを浴びた後の体は、格段に軽い。

  　斬新なことでも何でもない。普通にシャワーを浴びれば体が軽くなる。普通の話だ。なのに、今日に限ってこの軽さが異様に際立ってしまうのは、布団の上であかねが待っているからだ。

  　布団に座り、肩には大人用の浴衣を羽織る。一応、きちんと着た。裸よりはマシだろう。いや、やましいことは何一つないんだ。心は清い。清い。清いはずなのに、ドア越しの狼狽みたいな空気を察して、自分の脈拍が速くなるのを感じてしまう。

  「…ふぅ」

  　ため息が出た。必死で落ち着こうとする。探偵は慌てない、とかいう格言が頭をよぎったけど、そもそも今、探偵の身分ではなかった。

  　ドアが開く。

  　ちくりと覗いた顔に目が合う。あかねは自分の肩に上半分だけ浴衣をかけて、残りを抱えている。ふくよかな黒髪はまだ湿り気を帯びて、首筋に貼りついている。そのくせ顔だけは真っ赤で——目線を合わせられずに、何かを隠すように腋の下を締めている。

  「……おにぃ、先に入っちゃったのね」

  「あ、ああ。ごめん、待たせた？」

  「ううん、全然。……おにぃも早く来なさい」

  　言いながら、あかねはふとんに潜り込んで背を向けた。布団の膨らみが、大きく上下しているのが見える。

  　心臓が鳴る。もう勝手に鳴っている。

  　おそるおそる隣に寝ころびると、布団の中に滲みわたったぬくもりが、遠くない場所から伝わってくる。先に脱いだはずの着衣越しの体温というには熱すぎると感じたのは気のせいかもしれない。

  　しばらく、天井と沈黙だけがあった。

  「……」

  「……」

  「おにぃ」

  「ん？」

  「えっち、するの？」

  　まさかと身がすくむ。考えるより先に口が動いた。

  「し、しなくてもいいし、そういう——」

  「あたしは、したい」

  　ゆるりと体を回して、あかねは正対する。まだ頬は赤いのに、瞳だけは真っ直ぐだった。寝返りの勢いで浴衣の襟がわずかに開いて、首の下の白さが掠れる。反射的に視線を逸らした。

  「……かわいすぎるだろ、お前」

  「へ？」

  「いや、なんでもない」

  　無意識に言った一言に、あかねは目を瞬かせた。それから、くくっと笑って、布団の中でつま先が薫の腰に触れる距離まで足を伸ばした。

  「あたし、ずっと憧れてたの。おにぃのこと」

  「憧れ……？」

  「おにぃが田舎を出たとき、ずっと目が離せなかった。あたしの頭の中にしかいなかったのに、実際は大人になっちゃって——だから、正直に言うと」

  　指先が浴衣の胸元をそっと押した。むにゅ、という感触が、ごく弱く伝わる。

  「正直に言ったら？」

  「よ……関係……ない」

  　瞬きした。あかねが「よ……」と口を開いた瞬間、あたしたち、だと思った。それとも、薫って呼ばれるところだった。

  「あたし、あたしもよ……よ、よくわかんないんだ」

  　言い直すのがうまくいかず、あかねは布団の端に目線を落とした。

  「でも、おにぃと恋人になって、こうして寝転がってるだけでも、すごく幸せ。それで足りるはずなのに、もっと——もっと欲しいって思っちゃうのは、おかしい？」

  「おかしくない」

  　俺は即答した。断言する胸の奥の熱が、嘘のない感情であることを知っている。

  「だったら——おにぃ、目ぇ開けちゃダメだ？」

  「何が？」

  「だって、あたし、恥ずかしいから」

  　布団の縁がゆっくりと上がってくる。あかねが寝顔を俺の側へ寄せて、髪の先が唇に触れた。いつもより近い。距離がどれほど詰まっているのか、目をつぶったままでは正確にはわからない。だから目をつぶることが、ここで一番のやましい行為なのだと、頭の片隅で理解する。

  　指先が探り、指を絡める。あかねの手は小さくて、けれど驚くほど熱かった。

  「おにぃ、怖い？」

  「…ちょっとだけ」

  「あたしも」

  「そっか」

  「でも、きもちいいことしてるのに、怖いのは変ね」

  「いーえ、変じゃないよ。俺もそうだ」

  　笑いが、ふふっとこぼれる。笑った声が自分たちの間をくぐると、一気に緊張が緩むというより、それは別の何かに転化する。沈黙が溜まって、溜まって、たまりきれなくなった別の何かに。

  　あかねが俺の肩に触れた。指の腹が鎖骨のあたりをなぞり、浴衣の襟の端を、迷いながら、でも逃がさないように引っ張った。

  「……しても、いい？」

  「うん」

  　もう目をつぶったまま、開く選択肢を捨てる。

  　あかねの手が、ぐっと浴衣を下ろす。肌に触れる指先の温度と、髪からするシャンプーの甘い匂いと、ごく近いところで響く、お互いの呼吸の音。

  　怖くない、はずがないのに——怖いことなんて、一つもなかった。
