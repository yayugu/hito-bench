  ### 34話　湯上がりの距離

  　シャワーを止めると、浴室に静けさが戻ってきた。

  　鏡は湯気で真っ白だ。俺はタオルで髪を拭きながら、さっきのことを思い返していた。

  　あかねが俺の家まで来て、ふたりで出かけて、帰ってきて。それから、あかねが気持ちを伝えてくれて――俺たちは恋人になった。

  　最後に交わしたキスの感触が、まだ唇に残っている気がする。

  「……恋人、か」

  　口に出すと、妙にくすぐったい。

  　タオルを首にかけて脱衣所を出る。部屋着に着替えてリビングへ向かうと、あかねはソファの端にちょこんと座っていた。俺の大きめのＴシャツを借りて、髪をタオルで包んでいる。

  「お、おかえり……おにぃ」

  「ただいま。……って、家の中だけどな」

  「ふふ。なんか言いたくなっちゃった」

  　あかねは笑ったあと、すぐに視線をそらした。頬が赤い。風呂上がりだから、ということにしておきたい。

  　俺は少し離れたところに腰を下ろす。いつもなら何でもない距離なのに、今日はソファの隙間がやけに気になった。

  「髪、乾かしたほうがいいぞ」

  「うん。でも、あとでいいかな」

  「風邪ひくぞ」

  「おにぃが乾かしてくれる？」

  　あかねはそう言って、タオルの端を指でつまんだ。冗談みたいな口調なのに、こちらを見る目はどこか不安そうだ。

  「……いいけど」

  「ほんと？」

  「俺でよければ」

  　ドライヤーを取りに行き、戻ってくる。あかねはソファの前に座り直し、俺に背中を向けた。コンセントをつないでスイッチを入れると、温風の音が部屋に広がる。

  　タオルを外して、髪をそっと乾かす。指に触れるたび、あかねの肩が小さく揺れた。

  「熱くないか？」

  「大丈夫。気持ちいい」

  「ならよかった」

  　言葉が途切れる。ドライヤーの音の向こうで、あかねが小さく息をついた。

  「なんか、まだ夢みたい」

  「今日のこと？」

  「うん。おにぃと恋人になったこと。ずっと好きだったから、ほんとにいいのかなって思っちゃう」

  「いいに決まってるだろ」

  　思ったより強い声が出て、あかねが振り返りかける。俺はドライヤーを少し離した。

  「俺だって、あかねが好きだ。だから、いいんだよ」

  「……うん」

  　あかねは前を向き直った。耳まで赤くなっている。

  　髪を乾かし終えてドライヤーを置くと、あかねは後ろ髪を指で確かめた。

  「ありがと。おにぃ、上手だね」

  「妹みたいな幼なじみの髪を乾かす機会なんて、そうそうないけどな」

  「妹じゃないよ。恋人」

  「そうだった」

  　ふたりで笑う。けれど、笑い終わったあとにはまた、少し照れくさい沈黙が戻ってきた。

  「ねえ、おにぃ」

  「ん？」

  「さっきのキス、嫌じゃなかった？」

  「嫌なわけないだろ」

  「よかった。あたし、緊張してて……変な顔してなかった？」

  「見てない。俺も緊張してたから」

  「ほんと？」

  「ああ。心臓がうるさかった」

  　あかねは、ほっとしたように笑った。それから少し迷って、俺の隣に座る。さっきより近い。肩が触れるか触れないかのところで、あかねは手を膝の上に置いた。

  「もう少し、近くてもいい？」

  「もちろん」

  　あかねの肩が、俺の腕にそっと触れた。俺はそのまま、動かずにいる。急がなくていい。今日は、ふたりでこうしているだけで十分だった。

  「明日になっても、恋人だよね」

  「当たり前だろ」

  「じゃあ、明日も一緒にいようね」

  「うん。どこ行きたい？」

  「朝起きてから考える。今日はもう、このままのんびりしたいな」

  「賛成」

  　あかねは俺の肩に頭を預けた。俺も、そっと肩の力を抜く。

  　窓の外では、夏の夜が静かに更けていく。

  　隣にいるあかねの温度を感じながら、俺はこの時間を忘れないように、ゆっくり息をした。
