  河東解良の出身。故郷を離れたのち劉備と出会い、張飛と義兄弟の契りを結んだ。劉備と苦難をともにし、曹操に捕らわれた際も厚遇に心を動かされず、劉備のもとへ帰還。赤壁の戦いを経て荊州を守り、劉備の蜀建国を支えた。やがて樊城を攻めて曹操軍を追い詰めるが、呉の呂蒙に背後を突かれ、荊州を失う。麦城へ退いた関羽は、脱出の途上で捕らえられ、息子の関平とともに処刑された。義を重んじ、武勇を天下に示したその名は、時代を越えて語り継がれる。  
