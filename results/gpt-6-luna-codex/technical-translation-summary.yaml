response: |-
  Gitのスケールで難しいのは、単にデータを分散保存できるかではなく、GitのDAGをたどるランダムな読み出しと、push後すぐに全クライアントが同じ状態を見る一貫性を両立することだ。オブジェクト単位の分散保存は参照のたびに通信が発生し、分散ファイルシステムもpackfileのランダムアクセスや差分圧縮と相性が悪い。従来のSpokesはローカルNVMe上の通常のGitリポジトリを複製し、3相コミットで参照更新を同期するが、レプリカ数を増やすほど遅延が増し、配置管理や修復も複雑になる。

  CursorのContinuityは、S3上の追記型WALを正本とし、ローカルのGitリポジトリを再生成可能なキャッシュとして扱う。packfileを永続化した後、参照更新をWALインデックスへのCASで線形化するため、特定のprimaryやレプリカ間の合意に依存しない。UDPの通知が失われても、読み出し時にS3のETagを条件付きGETで確認して追いつくので、一貫性を保てる。レプリカは任意に増減でき、圧縮もprimaryだけで行い、結果をWAL経由で配布する。つまり、Git自体は改変せず、耐久性と一貫性の基盤をオブジェクトストレージに移して水平拡張する設計だ。
