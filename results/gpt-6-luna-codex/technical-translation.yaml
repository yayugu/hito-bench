  1月31日のデータベース障害に関する事後分析

  2017年1月31日、当社の製品のひとつであるオンラインサービス、GitLab.comで大規模なサービス停止が発生しました。障害の原因は、プライマリデータベースサーバーからデータを誤って削除したことでした。このインシデントにより、GitLab.comは何時間にもわたって利用できなくなりました。また、本番データの一部が失われ、最終的に復旧できませんでした。

  [...]

  本番データの損失は許されません。同じ事態が二度と起きないよう、GitLab.comの運用および復旧手順を複数の面から改善しています。

  タイムライン

  23:00 UTCごろ：負荷の増加により、PostgreSQLのセカンダリサーバーでレプリケーション処理に遅延が生じ始めました。セカンダリが必要とするWALセグメントがすでにプライマリから削除されていたため、レプリケーションに失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。そのためには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリのデータベースをセカンダリにコピーします。エンジニアの一人がセカンダリに接続してデータディレクトリを消去し、pg_basebackupを実行しました。しかし、--verboseオプションを指定していたにもかかわらず、pg_basebackupは意味のある出力を何も表示せず、停止したような状態になりました。

  23:30 UTCごろ：エンジニアの一人は、以前の実行時にpg_basebackupがセカンダリのPostgreSQLデータディレクトリ内にファイルを作成したのではないかと考えました。通常、このような場合はpg_basebackupがエラーを表示しますが、当のエンジニアは状況をよく把握できていませんでした。後に、当時その場にいなかった別のエンジニアによって、これは正常な動作だと判明しました。pg_basebackupはプライマリがレプリケーションデータの送信を開始するのを待ち、その時点まで何も表示せずに待機します。しかし、この挙動は社内のエンジニアリング手順書にも、pg_basebackupの公式ドキュメントにも明確に記載されていませんでした。

  レプリケーション処理を復旧しようとしていたエンジニアは、セカンダリ上で作業していると思い込み、誤ってPostgreSQLのデータベースディレクトリを消去しました。ところが、この処理はプライマリ上で実行されていました。エンジニアは間違いに気づいて1、2秒後に処理を中断しましたが、その時点ですでに約300GBのデータが削除されていました。

  データベースを復元できることを期待し、関係したエンジニアたちはバックアップを探し、Slackで支援を求めました。しかし、バックアップを見つけることも、それを使って復旧することも、完全に失敗しました。

  機能していなかった復旧手順

  pg_dumpを使ったデータベースのバックアップ

  pg_dumpのバックアップを探したところ、バックアップが存在しないことがわかりました。S3バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調べると、バックアップ手順ではpg_dump 9.2を使用していた一方、データベースはPostgreSQL 9.6で稼働していました（PostgreSQLでは9.xの各リリースをメジャーバージョンとして扱います）。メジャーバージョンが異なるとpg_dumpはエラーを出し、バックアップ処理が終了します。

  [...]

  エラーが発生したcronジョブには通知が設定されていましたが、通知はメールで送信されていました。GitLab.comではDMARCを使用しています。しかし、cronジョブのメールにはDMARCが設定されていなかったため、受信側で拒否されていました。その結果、手遅れになるまでバックアップの失敗に気づきませんでした。

  Azureディスクのスナップショット

  NFSサーバーでは有効になっていましたが、他のバックアップ手順で十分だと考えていたため、データベースサーバーではスナップショットを有効にしていませんでした。

  根本原因の分析

  これらの問題の根本原因を分析するため、「なぜを5回繰り返す」手法を使います。インシデントを大きく2つの問題に分けます。GitLab.comが停止したことと、GitLab.comの復旧に長い時間がかかったことです。

  問題2：GitLab.comの復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使えなかったのか？
  - 標準のバックアップ手順では、pg_dumpを使ってデータベースの論理バックアップを作成します。この手順は、GitLab.comがPostgreSQL 9.6で稼働していたのに対し、PostgreSQL 9.2を使っていたため、エラーが通知されないまま失敗しました。

  なぜバックアップ手順の失敗が通知されなかったのか？
  - 失敗時に通知は送られていましたが、メールが拒否されたため、失敗を示すものがありませんでした。送信元は自動処理で、エラーを報告する他の手段もありませんでした.
