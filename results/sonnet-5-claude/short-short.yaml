  # アマゾン

  「いよいよ明日、出発だ」

  男は装備を机に並べながら、妻に言った。長靴、防水ジャケット、大容量の水筒、そして小さなGPS発信機。

  「本当に行くの? 帰ってこられた人、少ないって聞くわよ」

  「大丈夫。三年前に行った先輩も、ちゃんと生きて戻ってきた。ただ……別人みたいに痩せて、目の光が消えてたけど」

  妻は不安げに窓の外を見た。都会のビル群の向こうに、目的地はある。

  「向こうは迷路みたいに入り組んでいて、一度足を踏み入れたら方角がわからなくなるらしいわ。何時間も同じところをぐるぐる回って、出口にたどり着けない人もいるって」

  「地図アプリがあるから平気さ。それに、あそこで働けば時給もいいしね」

  翌朝、男は始発電車に乗り、郊外にそびえる巨大な建物へと向かった。入り口には大きく「Amazon」のロゴ。男はICカードをかざし、灰色の作業着に着替えると、棚と棚のあいだに広がる、果てのない通路へと足を踏み入れた。

  ヘッドセットからは絶え間なく次の指示が流れてくる。

  「A-7区画、棚番号48213……」

  男は水筒の水を一口飲み、汗を拭った。休憩は、あと六時間後だ。

  ---

  **オチの解説**

  タイトルと冒頭の「装備」「出発」「帰ってこられた人が少ない」といった描写から、読者は南米の密林・アマゾン川流域への探検旅行を連想するように誘導しています。しかし最後の段落で、実は「Amazon」という巨大IT企業の物流倉庫への出勤だったことが明かされます。

  「アマゾン」という単語が持つ二つの意味(地名の熱帯雨林/企業名)を利用した言葉遊びが核になっていますが、単なる駄洒落オチで終わらせず、「棚の迷路」「果てのない通路」「別人みたいに痩せて戻ってきた」といった表現を、密林の過酷さと倉庫労働の過酷さの両方に読めるよう二重写しにしているのがポイントです。探検の比喩を通して、現代の物流労働の非人間的な過酷さを浮かび上がらせる、というのがこの話の狙いです。
