  1月31日のデータベース障害に関するポストモーテム

  2017年1月31日、当社製品の一つであるオンラインサービスGitLab.comで大規模なサービス障害が発生しました。原因は、プライマリデータベースサーバーからデータを誤って削除したことです。この障害により、GitLab.comは何時間にもわたって利用できなくなりました。また、本番データの一部も失われ、最終的に復旧できませんでした。

  [...]

  本番データの喪失はあってはならないことです。再発を防ぐため、GitLab.comの運用手順と復旧手順について、複数の改善に取り組んでいます。

  タイムライン

  UTC 23:00頃：負荷の増加により、PostgreSQLセカンダリのレプリケーションに遅延が出始めました。セカンダリが必要とするWALセグメントがプライマリ側ですでに削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使っていなかったため、セカンダリを手動で再同期する必要がありました。再同期では、セカンダリの既存のデータディレクトリを削除してからpg_basebackupを実行し、プライマリのデータベースをセカンダリにコピーします。エンジニアの一人がセカンダリでデータディレクトリを消去し、pg_basebackupを実行しました。ところが、--verboseオプションを指定していたにもかかわらず、pg_basebackupは意味のある出力を出さないまま止まったように見えました。

  UTC 23:30頃：エンジニアの一人が、それまでの実行でpg_basebackupがセカンダリのPostgreSQLデータディレクトリにファイルを作ったのではないかと考えました。通常、そのような場合にはpg_basebackupがエラーを出しますが、このエンジニアは何が起きているのかよく分かっていませんでした。後日、当時不在だった別のエンジニアの説明で、これは正常な動作だと判明しました。pg_basebackupは、プライマリがレプリケーションデータを送り始めるまで何も出力せずに待ち続けます。残念ながら、この動作は社内のエンジニアリング用ランブックにも、pg_basebackupの公式ドキュメントにも明記されていませんでした。

  レプリケーションを復旧させようとして、エンジニアはPostgreSQLのデータベースディレクトリの消去に取りかかりました。セカンダリで作業していると思い込んでいましたが、実際にはプライマリで実行されていました。エンジニアは誤りに気づいて1〜2秒後に処理を止めましたが、その時点で約300GBのデータがすでに削除されていました。

  関わったエンジニアたちはデータベースを復元しようとバックアップを探し、Slackで助けを求めました。しかし、バックアップを見つけることも、使うことも、まったくできませんでした。

  機能しなかった復旧手順

  pg_dumpによるデータベースバックアップ

  pg_dumpのバックアップを探したところ、存在しないことが分かりました。S3バケットは空で、最近のバックアップはどこにもありませんでした。詳しく調べると、データベースはPostgreSQL 9.6で動いていたのに、バックアップ処理はpg_dump 9.2を使っていました（Postgresでは9.xの各リリースがメジャーバージョンとして扱われます）。メジャーバージョンが違うとpg_dumpはエラーを出し、バックアップ処理はそこで終了します。

  [...]

  エラーになったcronジョブには通知が送られる設定でしたが、通知の手段はメールでした。GitLab.comではDMARCを使っています。ところがcronジョブのメールではDMARCが有効になっておらず、受信側で拒否されていました。そのため、手遅れになるまでバックアップの失敗に誰も気づきませんでした。

  Azureのディスクスナップショット

  このスナップショットはNFSサーバーでは有効でしたが、データベースサーバーではどれも有効にしていませんでした。他のバックアップ手順で十分だと考えていたためです。

  根本原因の分析

  これらの問題の根本原因を分析するため、「なぜなぜ5回（5 Whys）」という手法を使います。インシデントを2つの主な問題に分けます。GitLab.comがダウンしたことと、GitLab.comの復旧に長い時間がかかったことです。

  問題2：GitLab.comの復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使えなかったのか？
  - 標準のバックアップ手順では、pg_dumpでデータベースの論理バックアップを取ります。GitLab.comはPostgreSQL 9.6で動いていたのに、この手順はPostgreSQL 9.2を使っていたため、エラーが表に出ないまま失敗していました。

  なぜバックアップ手順は何も知らせずに失敗したのか？
  - 失敗時には通知が送られていましたが、そのメールが拒否されていたため、失敗を知る手がかりがありませんでした。送信元は自動化されたプロセスで、エラーを報告する手段はほかにありませんでした。
