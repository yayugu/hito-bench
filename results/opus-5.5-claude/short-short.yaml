  箱の側面には見慣れたロゴがあった。笑った口のような、あの矢印だ。

  震える手で箱を開けた。
  中身は水のボトル六本、携帯食、コンパス、防水マッチ。それに地図が一枚あり、現在地から川までのルートが赤いペンで引かれていた。
  納品書も一枚、添えられていた。

  > ご注文ありがとうございました。
