  私は何も注文していない。そもそも、ここは圏外だ。
  だが、そんなことはどうでもよかった。水を飲み、食べ、地図のとおりに歩いた。二日後、私は川沿いの村で保護された。

  帰国すると、私はちょっとした有名人になっていた。「密林の奇跡」「アマゾンがアマゾンで人を救った」。ワイドショーは面白がって取り上げ、会社は「お客様の安全を第一に考えた結果です」とだけコメントした。私の居場所や、私に何が必要かをどうやって知ったのか。その説明は最後までなかった。

  購入履歴を見ると、たしかに私のアカウントから注文されたことになっていた。注文日時は無線機が壊れた翌朝。私が遭難に気づくより、半日早かった。

