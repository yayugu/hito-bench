  **要約（技術的なポイント、約500字）**

  Gitは、SHA-1をキーにして中身を取り出すDAG（有向非巡回グラフ）構造です。オブジェクトをKVストアに分散して置く方法は何度も試されましたが、DAGをたどるたびに往復通信が1回発生して遅くなります。さらにプロトコル上packfileを送る必要があるので、cloneも遅くなりました。GoogleのJGit+DHT案もこの理由で採用されませんでした。NFSやDRBDで分散ファイルシステムにする案も失敗しています。packfileはサイズ最小化を優先して並びがランダムで、差分圧縮もされているため、ランダム読みが大量に発生するからです。

  GitHubのSpokesは、NVMe上に普通のGitリポジトリを置く方式です。pushするとpackfileを全レプリカに配り、小さなref更新だけを3PCで合意します。ただし次の弱点がありました。
  - 一番遅いノードに引きずられるため、レプリカを増やしにくい
  - 最低3台が必要で、エージェントが大量に作る小さなリポジトリには過剰
  - ディスク上のリポジトリが正本なので、ルーティング表や修復の運用が重い

  CursorのContinuityは、S3上のWAL（先行書き込みログ）を正本にしています。
  - **push**：S3のCASでWAL indexを更新して直列化する。バッチ化で高速化している
  - **ローカルのリポジトリ**：ただのキャッシュ。rendezvous hashingで置き場所を決めるので、DBは不要。どのノードがプライマリになっても正しく動く
  - **レプリケーション**：UDPのgossipで通知するが、届かなくても問題ない。読み込みのたびにETag付きの条件付きGETを送り、304（10ms未満）ならそのまま返すので、常に強い整合性が保たれる
  - **レプリカ数**：1台から数百台まで調整でき、使われていないリポジトリはディスクから消す
  - **compaction**：プライマリだけが実行し、他のレプリカは結果をダウンロードする（CPUの代わりに帯域を使う）
  - **性能**：S3 Standardで120 push/s、S3 Express One Zoneで300 push/s超
