  # アマゾン

  エヌ氏の家には、毎日なにかが届いた。歯ブラシ、天体望遠鏡、七面鳥の丸焼き、南極の氷。彼にとっては、買うという行為そのものが趣味なのだった。

  ある日、友人が呆れて言った。

  「そのうち買うものがなくなるぞ」

  「そんなことはない。あの店には、この世のすべてがある」

  「では、アマゾンを注文してみたまえ」

  「アマゾンを?」

  「アマゾンで、アマゾンを買うのさ。できまい」

  エヌ氏は検索窓に打ちこんだ。一件、出てきた。

  **商品名：アマゾン。在庫あり。明日にはお届け。★4.5**

  翌日、小さな箱が届いた。中には黒っぽい種のようなものがひとつと、紙が一枚。

  「設置場所には十分な余裕をお取りください」

  余裕なら、ある。エヌ氏は庭の隅にそれを置いて、寝た。

  夜半、天井が鳴った。起きると、寝室の壁は緑に覆われていた。廊下には茶色い水が流れ、浴槽ではピラニアが泳いでいた。空気は熱く、湿り、どこかで見たことのない色の鳥が笑うように鳴いた。玄関があったはずの方角には、ただ樹があった。三十メートルほどの樹が。

  エヌ氏は端末を探しあて、返品の手続きを試みた。

  「恐れ入りますが、この商品は返品できません。理由：開封済みのため」

  そのすぐ下に、通知が届いた。

  「お届けした商品はいかがでしたか？ レビューをお願いします」

  エヌ氏は蔓にぶら下がり、片手で星をひとつだけ付けた。

  「広すぎる。あと、出られない」

  投稿ボタンを押すと、画面はすぐに次の表示に切り替わった。

  **この商品を買った人は、こんな商品も買っています——『文明』**

  ---

  星新一ふうに寄せました。もっと長く／別のオチ／怖い方向、などご希望あれば書き直します。
