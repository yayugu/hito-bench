  1月31日のデータベース障害のポストモーテム

  2017年1月31日、当社の製品のひとつであるオンラインサービス GitLab.com において大規模なサービス障害が発生しました。この障害は、プライマリのデータベースサーバーからデータを誤って削除してしまったことが原因です。このインシデントにより、GitLab.com のサービスは長時間にわたり利用できない状態となりました。また、最終的に復旧できなかった本番データも一部失われました。

  ［中略］

  本番データを失うことは許容できません。二度と同じことが起こらないよう、GitLab.com の運用手順および復旧手順について複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC: 負荷の増大により、PostgreSQL のセカンダリのレプリケーション処理に遅延が生じ始めました。セカンダリが必要としていた WAL セグメントがプライマリ側で既に削除されていたため、レプリケーションは失敗しました。GitLab.com では WAL アーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。この作業には、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackup を実行してプライマリからセカンダリへデータベースをコピーする手順が含まれます。エンジニアの1人がセカンダリでデータディレクトリを消去し、pg_basebackup を実行しました。しかし残念なことに、--verbose オプションを指定していたにもかかわらず、pg_basebackup は意味のある出力を一切出さないままハングしてしまいました。

  ± 23:30 UTC: エンジニアの1人は、それまでの実行の試みの際に pg_basebackup がセカンダリの PostgreSQL データディレクトリに何らかのファイルを作成してしまったのではないかと考えました。通常、このような場合には pg_basebackup はエラーを表示するのですが、当該エンジニアには何が起きているのかよく分かりませんでした。後になって（その場にいなかった）別のエンジニアにより、これは正常な挙動であることが判明します。pg_basebackup はプライマリがレプリケーションデータの送信を開始するのを待ち、その時が来るまで何も出力せずに待機し続けるのです。あいにく、この点は当社のエンジニアリング・ランブックにも、公式の pg_basebackup のドキュメントにも明確には記載されていませんでした。

  レプリケーション処理を復旧させようとして、あるエンジニアが PostgreSQL のデータベースディレクトリの消去に取りかかりました。セカンダリで作業していると誤って思い込んでいたのです。ところが、この処理は実際にはプライマリ上で実行されてしまいました。そのエンジニアは誤りに気づいた1〜2秒後に処理を中断しましたが、この時点で既に約 300 GB のデータが削除されていました。

  データベースを復元できるのではと期待して、関係したエンジニアたちはデータベースのバックアップを探しに行き、Slack で助けを求めました。しかし残念ながら、バックアップを見つけることも使うことも、いずれも完全に失敗に終わりました。

  機能しなかった復旧手順

  pg_dump によるデータベースバックアップ

  pg_dump のバックアップを探しに行ったところ、それらが存在しないことが分かりました。S3 バケットは空で、最近のバックアップはどこにも見当たりませんでした。詳しく調べたところ、バックアップ手順では pg_dump 9.2 が使われている一方、当社のデータベースは PostgreSQL 9.6 で稼働していることが判明しました（Postgres では 9.x のリリースはメジャーバージョンとして扱われます）。メジャーバージョンが異なると pg_dump はエラーを出力し、バックアップ手順は終了してしまいます。

  ［中略］

  エラーが発生した cron ジョブについては通知が有効になっていますが、これらの通知はメールで送信されます。GitLab.com では DMARC を使用しています。ところが cron ジョブのメールには DMARC が有効化されておらず、その結果、受信側でメールが拒否されていました。つまり、手遅れになるまでバックアップが失敗していることに誰も気づけなかったのです。

  Azure のディスクスナップショット

  NFS サーバーでは有効になっていたものの、他のバックアップ手順で十分だと想定していたため、データベースサーバーではスナップショットが有効になっていませんでした。

  根本原因の分析

  これらの問題の根本原因を分析するため、「なぜなぜ分析（5 Whys）」と呼ばれる手法を用います。インシデントを2つの主要な問題、すなわち GitLab.com がダウンしたことと、GitLab.com の復旧に長時間を要したことに分けて考えます。

  問題 2: GitLab.com の復旧に 18 時間以上かかった。

  なぜ標準のバックアップ手順を使えなかったのか？
  - 標準のバックアップ手順では、pg_dump を用いてデータベースの論理バックアップを取得します。この手順は、GitLab.com が PostgreSQL 9.6 で稼働しているにもかかわらず PostgreSQL 9.2 を使用していたため、何のエラーも表に出ないまま失敗していました。

  なぜバックアップ手順は何のエラーも表に出ないまま失敗したのか？
  - 失敗時には通知が送信されていましたが、メールが拒否されていたため、失敗を示すものが何もありませんでした。送信元は自動化されたプロセスであり、エラーを報告する他の手段を持っていませんでした。
