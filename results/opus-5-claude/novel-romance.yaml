  「だって、変じゃん。付き合ってるのに、おにぃって。……でも、薫くん、とか、薫、とか、そういうの、まだ……無理。言えない」

  「無理か」

  「うん。恥ずかしくて死ぬ」

  「じゃあ、おにぃでいいだろ」

  　あかねは、ぱちぱちと瞬きをした。

  「いいの？」

  「いいよ。十年以上そう呼ばれてきたし。今さら変えられたら、たぶん俺のほうが落ち着かない」

