  「……このまま、時間止まればいいのに」

  「止まらないぞ」

  「わかってるよ。ばか」

  　テレビでは、まだ誰かが笑っている。俺たちはしばらく、何も言わずにそれを見ていた。

  　あかねの髪が、肩の上でまだ少しだけ、湿っていた。

