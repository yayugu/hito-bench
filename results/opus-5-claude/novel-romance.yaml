  ## 34話　髪を乾かす

  　風呂から上がって、俺は先にリビングへ戻っていた。

  　エアコンの効いた部屋は静かで、洗面所から届くシャワーの音だけが、やけに大きく聞こえる。ソファに座ってテレビをつけた。バラエティ番組。芸人が何か言って、笑い声が起こる。内容は一ミリも頭に入ってこない。

