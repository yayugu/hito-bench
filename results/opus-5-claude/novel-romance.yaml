  　スイッチを入れると、温風の音が部屋を満たした。会話をしなくていい理由ができて、正直ほっとした。

  　指を入れて梳く。昔より、ずいぶん髪が長い。

  「伸びたな」

  「ん？」

  「髪」

  「切ってないもん、ずっと」

  「なんで」

  　あかねは少し黙ってから、ドライヤーの音に紛れさせるみたいに言った。

  「……おにぃ、長いほうが好きって言ったから」

  　手が止まりかけた。いつだそれは。中学のとき、村に帰った盆の、たぶん何気なく言ったやつだ。

  「覚えてたのか」

  「覚えてるよ。おにぃが言ったこと、だいたい全部」

