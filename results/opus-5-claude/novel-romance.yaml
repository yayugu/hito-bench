  「めんどくさくなった」

  「風邪ひくぞ」

  「夏だし」

  「エアコン効いてるだろ」

  　俺は立ち上がって洗面所からドライヤーを取ってきた。コンセントに挿して、床のラグを指さす。

  「そこ座れ」

  「……えっ」

  「昔やってただろ。川で遊んだあと、ばあちゃんちで」

