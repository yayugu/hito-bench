  　思い出した瞬間、耳の裏まで熱くなって、俺はクッションに顔を埋めた。十七年生きてきて、自分の心臓がこんなにうるさいと思ったことはない。

  　水音が止まった。

  　背筋が伸びた。ドライヤーの音がして、しばらくして、それも止んで。洗面所のドアが開く。

  「……おまたせ」

  　振り返る。パジャマ姿のあかねが、廊下の入り口で立ち止まっていた。髪はまだ湿っていて、毛先から水滴が落ちそうになっている。

  　俺の視線に気づくと、あかねはさっと胸のあたりを両手で隠した。

  「なに」

  「いや、なんも」

  「見た。今、パジャマ見たでしょ」

  「見てない」

  「見たもん。……子どもっぽいって思ったでしょ、これ」

  　白地に、小さいイチゴがぽつぽつ散っている。確かにまあ、高校生が着るにしては。

  「思ってない」

  「ぜったい思った。しょうがないじゃん、荷物少なくしたかったし、こんなことになるなんて思ってなかったし……」

  　こんなこと、の部分で、あかねの声が急に小さくなった。俺も何も言えなくなった。

  　テレビの笑い声だけが、部屋に響いている。

  　あかねは、そろそろと近づいてきて、ソファの端に、俺との間に人ひとり分の隙間を空けて座った。さっきまで散々くっついてたのに、今さらそこを空けるのか。そう思ったけど、俺だってその隙間を詰められないでいる。

  「……乾かし足りないだろ、それ」

