  　やがて髪が乾いて、俺はスイッチを切った。急に静かになる。

  　あかねは膝を抱えたまま、動かなかった。

  「……ねえ、おにぃ」

  「ん」

  「あたし、いつまで『おにぃ』って呼べばいいの」

