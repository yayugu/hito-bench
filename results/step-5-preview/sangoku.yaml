response: 字は雲長。美髯と青龍偃月刀を誇る、劉備・張飛と義兄弟の契りを交わした漢の軍神。下邳で曹操に捕らわれても劉備への義を曲げず、赤兎馬と漢寿亭侯の位を受け、顔良を斬って恩に報い、過五関斬六将を経て兄の下へ帰還した。後に荊州を任され、樊城の戦いでは于禁を水攻めで降す大勝を収める。しかし孫権の呂蒙が荊州を急襲し、麦城で孤立。臨沮で伏兵に捕らわれ、孫権によって処刑された。生涯、漢室復興という大義を胸に貫き通し、敵味方から畏敬されるその義魂と武勇は千年の時を超えて語り継がれる、不滅の軍神である。関羽の名は、正に義の象徴として、後世の人々の心に燦然と輝き続けている。
