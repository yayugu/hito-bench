  先にシャワーを浴びた俺は、ベッドの端に腰掛けて、落ち着かない気持ちを抑え込むように窓の外を見ていた。

  九月初旬の夜。カーテンの隙間からは、都内のマンション群がオレンジ色の灯りを連ねている。田舎——小鹿村の夜空なら、今頃あんなふうに星が滲むほど降り注いでいただろうに。

  耳を澄ませると、浴室からまだ水滴の音が聞こえる。あかねがまだ髪を洗っているのか、それとも俺と同じようにドキドキしながら湯船に浸かっているのか。

  たった今、この部屋で、あかねは俺に告白した。

  『おにぃのこと、好き。ずっとずっと、大好きなんだ』

  小鹿村で十二年暮らして、東京に出てきた十二年ぶんの歳月が、その一言であっさり飛んだ。再会した夏休みの日々。蛍日の川原で見上げた月。祭りの夜、触れ合った手の温度。そして今、あかねは親の目を盗んで一人で電車に乗り、こうして俺の部屋にいる。

  ——好きだ。付き合ってください。

  なんて、定型文みたいに並べたけれど、あかねの瞳は真剣で、俺の心臓を鷲掴みにして離さなかった。好きに決まっている。返事をする前に、俺たちはもう、恋人同士になっていた。

  浴室のドアが開く気配。

  「……おにぃ」

  呼ばれて振り返ると、湯気をまとってあかねが立っていた。

  「……お、おう」

  思わず息を呑む。

  あかねは俺が用意したバスローブではなく、自分の膝丈のワンピースを脱いで、俺の大きめのTシャツを羽織っていた。肩が落ちて、裾が太ももの半ばを隠すくらい。濡れた黒髪が肩に張り付き、化粧水も付けていない素肌が、うっすら桃色に染まっている。石鹸の香りが、部屋の空気を甘くした。

  「その……借りるよ。洗濯物、汚しちゃったかもって思って」

  「あ、ああ。俺ので良ければ」

  「ふふ。おにぃの匂いがする」

  あかねが頬を染めながら、裾を摘まんでクンクン匂いを嗅ぐ。その仕草だけで、俺の理性が音を立てて傾ぐ。こいつ、そんなことするために田舎から来たんじゃないだろうが。……いや、実際、そういう覚悟で来たのはわかっている。けれど、いざこうして向き合うと、気恥ずかしさの方が勝る。

  ベッドに戻って座ると、あかねもおずおずと隣に腰を下ろした。布団が二人分の重みで軋む。

  「髪、拭いてやる」

  「え、いいよ。自分でできるって」

  「いいから。ほら、後ろ向け」

  タオルを手に取ると、あかねは素直に背中を向けた。長い黒髪を包むように、そっと水分を吸い取る。艶やかな髪が、指の隙間を滑り落ちていく。田舎の川で晒されていたどんな絹よりも、ずっと柔らかい感触だった。

  「……おにぃ」あかねがぼそりと言う。「あたし、今、すっごくドキドキしてる」

  「俺もだ」

  「おにぃも？」

  「ああ。心臓、破裂しそう」

  「……破裂しちゃだめだよ」

  あかねがくすっと笑って、俺の膝に手を置いた。指先が、わずかに震えている。

  髪を拭き終わると、あかねは俺の方を向いた。潤んだ瞳が、間近にある。窓から漏れる街の灯りが、横顔を薄紅色に照らしている。さっき交わしたキスの唇が、今にも触れ合いそうな距離。

  「あかね」

  「……うん」

  「好きだ」

  「あたしも。好き。大好き」

  もう、言葉はいらなかった。ゆっくりと顔を寄せ、唇を重ねる。最初は額に、頬に、瞼に。そして、そっと唇へ。

  「ん……」

  あかねが目蓋を閉じる。俺も目を閉じた。唇の柔らかさと、わずかな塩っぽさ。舌先が触れ合い、電気のような痺れが背筋を駆け抜ける。あかねの手が、俺の背中に回される。Tシャツの布越しに、爪が引っかかる。

  「おにぃ……あたし、おにぃのことが、好きでたまらないよ……」

  「知ってる。……俺も、たまらない」

  そろそろとベッドに押し倒すと、あかねはされるがままに仰向けになった。天蓋から吊るした間接照明が、彼女の瞳に星を映す。俺は片肘をつき、彼女の髪に指を絡めた。

  「あかね……」

  「……おにぃ」

  Tシャツの裾から、素肌がいている。鎖骨の窪みに、未乾の水滴が一筋、滑り落ちていく。それだけで、俺の思考は真っ白に溶けた。

  「……いいんだよな」

  「……うん。あたし、おにぃとなら」

  あかねが目を閉じる。その頬を伝う涙を、親指で拭う。

  窓の外では、都会の夜が更けていく。小鹿村の蛍日はもう遠いけれど、こうして、俺たちは大人になる一歩を、これから踏み出すのだ。

  「……好きだ、あかね」

  「ん……。あたしも。……おにぃ」

  唇を重ねながら、俺は初めて、彼女の腰に手を回した。
