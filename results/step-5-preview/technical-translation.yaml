  1月31日のデータベース障害に関する事後報告

  2017年1月31日、当社製品の一つであるオンラインサービスGitLab.comで大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーからデータが誤って削除されたことによって引き起こされました。このインシデントにより、GitLab.comサービスは数時間にわたり利用不能となり、また最終的に復旧できなかった本番データの一部を失いました。

  [...]

  本番データを失うことは容認できません。このような事態を二度と起こさないため、GitLab.comの運用・復旧手順に関して複数の改善作業を進めています。

  タイムライン

  ± 23:00 UTC：負荷増加に伴い、PostgreSQLセカンダリのレプリケーションプロセスが遅延し始めました。セカンダリが必要としていたWALセグメントがプライマリから既に削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイビングを使用していなかったため、セカンダリは手動で再同期する必要がありました。これにはセカンダリ上の既存データディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーすることが含まれます。あるエンジニアがセカンダリにアクセスしてデータディレクトリを消去し、pg_basebackupを実行しました。残念ながら、--verboseオプションが設定されていたにもかかわらず、pg_basebackupはハングし、意味のある出力を全く生成しませんでした。

  ± 23:30 UTC：あるエンジニアは、pg_basebackupがセカンダリのPostgreSQLデータディレクトリ内に何らかのファイルを作成したのではないかと考えました。通常このような場合pg_basebackupはエラーを出力しますが、当該エンジニアは状況をよく把握していませんでした。後に、その場にいなかった別のエンジニアによって、これは正常な動作であることが判明しました。pg_basebackupはプライマリがレプリケーションデータの送信を開始するのを待ち、その時まで無言で待機し続けるのです。残念ながら、これは当社のエンジニアリング運用手順書にも、公式のpg_basebackupドキュメントにも明確に記載されていませんでした。

  レプリケーションプロセスを復旧しようとして、あるエンジニアがPostgreSQLデータベースディレクトリの消去を進めました。セカンダリ上で行っていると誤って認識していましたが、残念ながらこの処理はプライマリ上で実行されました。エンジニアは自分のミスに気づいてから1、2秒後にプロセスを停止しましたが、この時点で既に約300GBのデータが削除されていました。

  エンジニアたちはデータベースを復元できることを期待してバックアップを探し、Slackで助けを求めました。残念ながら、バックアップの検索と使用のプロセスは完全に失敗しました。

  復旧手順の不備

  pg_dumpによるデータベースバックアップ

  pg_dumpのバックアップを探したところ、それらが存在しないことが判明しました。S3バケットは空で、どこにも最近のバックアップは見つかりませんでした。詳しく調査した結果、バックアップ手順がpg_dump 9.2を使用していたのに対し、データベースはPostgreSQL 9.6を実行していることがわかりました（Postgresでは9.xのリリースはメジャーバージョンと見なされます）。メジャーバージョンの差異により、pg_dumpはエラーを発生させ、バックアップ手順は終了していました。

  [...]

  cronジョブがエラーを起こした際の通知は有効化されていますが、これらの通知はメールで送信されます。GitLab.comではDMARCを使用していますが、cronジョブのメールに対してDMARCが有効化されていなかったため、受信側に拒否されていました。これにより、手遅れになるまでバックアップの失敗に気づくことはありませんでした。

  Azureディスクスナップショット

  NFSサーバーでは有効化されていましたが、データベースサーバーでは有効化されていませんでした。他のバックアップ手順で十分であると想定していたためです。

  根本原因分析

  これらの問題の根本原因を分析するため、「5 Whys（なぜを5回）」と呼ばれる手法を用います。このインシデントは「GitLab.comがダウンしたこと」と「GitLab.comの復旧に長い時間がかかったこと」という2つの主要な問題に分けて分析します。

  問題2：GitLab.comの復旧に18時間以上かかった。

  なぜ標準的なバックアップ手順を使用できなかったのか？
  - 標準的なバックアップ手順はpg_dumpを使用してデータベースの論理バックアップを実行するものです。この手順はPostgreSQL 9.2を使用していたのに対し、GitLab.comはPostgreSQL 9.6上で動作していたため、サイレントに失敗していました。

  なぜバックアップ手順はサイレントに失敗したのか？
  - 失敗時に通知は送信されていましたが、メールが拒否されたため、失敗の兆候はありませんでした。送信者は自動化されたプロセスであり、エラーを報告する他の手段を持っていませんでした。
