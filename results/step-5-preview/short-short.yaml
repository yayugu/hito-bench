  僕はベッドの横で目を覚ますと、そこはもう寝室ではなかった。天井を這う蔦、床を這う苔、微かに聞こえる怪鳥の鳴き声。

  三ヶ月前、Amazonで『本物のアマゾン 卓上森林キット』を注文した。翌日届いた段ボールの中には、湿った土と、青々としたシダ、そして見たこともない芋虫が一匹。商品説明には「あなたの部屋に、地球の肺を」とあった。

  芋虫は蝶になり、部屋中に卵を産んだ。幼虫たちはカーペットを食し、本棚を食し、ベッドの脚を食した。植物は窓を突き破り、外の光を競うように奪っていく。僕は食料が底をつくと、庭先になったバルコニーで果実を齧り、雨水を啜った。

  今朝、僕はスマートフォンに向かって囁いた。
  「おすすめ商品を教えて」。
  画面には、真っ先にそう表示されていた。
  『人間用ケージ、Mサイズ』。

  自然の中の通販って、便利だ。

  ---

  **オチの解説**

  この作品では、「アマゾン」を**通販サイト**と**熱帯雨林**の二重の意味で使っています。

  主人公は便利な通販で「アマゾン（自然）」を手軽に所有しようとしますが、届いたのが「本物」だったために、生活空間を逆に自然に侵食されてしまいます。最終的に自分の部屋がジャングルと化し、人間の方が生態系に組み込まれる“商品側”へと立場が逆転。

  ラストでAmazonのおすすめに「人間用ケージ」が出てくるのは、**消費する側だった人間が、今や消費される対象として陳列されている**というブラックユーモアです。便利さと引き換えに、我々は気づかないうちに何かを「食べられている」のかもしれない——という現代の消費社会への小さな風刺になぞらえていただければ幸いです。
