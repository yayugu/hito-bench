  Gitリポジトリを大規模にホスティングする技術的課題と、それを解決する新アーキテクチャ「Continuity」の興味深いポイントを要約します。

  Gitは分散型設計ですが、大規模ホスティングではそれが逆効果です。根本的な問題は**packfile**にあります。Gitオブジェクトはpackfileにランダムに配置され、デルタ圧縮されるため、アクセスパターンがランダムになります。ネットワークファイルシステム（NFSやブロックレベル複製）では、このランダムな多次元ポインタの追跡が非効率で、スケーリングが困難です。

  GitHubの試行錯誤や「Spokes」の成功的な設計を経て、Cursor社が開発した**Continuity**は、Write-Ahead Log（WAL）をS3オブジェクトストアに格納するアプローチで革新的です。主な技術的特徴は：

  1.  **真実源としてのS3 WAL**: プッシュはまずS3にWALエントリとして永続化されます。参照トランザクションはローカルのGitリポジトリに対して原子的なCompare-And-Swap（CAS）で同期され、すべてのプッシュを線形化します。これにより、外部データベースなしで強い一貫性を実現します。

  2.  **レイテンシを犠牲にしない冗長性**: 本番環境では、各プッシュをpackfileとしてS3に同時書き込みします。更新は非信頼性の高いUDPゴシップパケットで伝播されますが、各レプリカはサービス時にS3とETagベースの条件付きGETで完全な一貫性を検証します（304レスポンスはメタデータのみで高速）。結果として、**任意の数のレプリカ**を線形にスケールさせられます。

  3.  **運用の単純性と耐久性**: リポジトリは「ペット」ではなく、キャッシュとして扱われます。WALからいつでも再構築可能で、ルーティングテーブルなどの外部状態が不要です。コンパクションはプライマリのみで行われ、その結果はWALイベントとして全レプリカに伝播します（CPU負荷を帯域に置き換え）。これにより、2026年の大規模モノレポやエージェントが生成する数百万の小リポジトリにも対応可能です。

  結論として、ContinuityはGitの内部データモデル（packfile）を尊重しつつ、クラウドネイティブなS3を真実源とすることで、**高い一貫性を保ちながら任意のスケールと可用性**を実現する、洗練された設計と言えます。
