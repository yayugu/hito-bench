  2017年1月31日のデータベース障害に関する事後分析

  2017年1月31日、弊社プロダクトの一つであるオンラインサービスGitLab.comで深刻なサービス障害が発生しました。この障害はプライマリデータベースサーバーから誤ってデータが削除されたことが原因でした。この事故によりGitLab.comサービスは長時間にわたり利用できなくなりました。さらに、最終的に回復することができないプロダッションデータも一部失われました。

  [...]

  プロダッションデータの損失は容認できません。このような事態が二度と起きないよう、GitLab.comの運用および復旧手順における複数の改善に取り組んでいます。

  タイムライン

  UTC 23:00頃：負荷増加のため、PostgreSQLセカンダリの複製プロセスが遅れ始めました。セカンダリに必要なWALセグメントがプライマリから既に削除されており、複製は失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これはセカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーすることを伴います。あるエンジニアがセカンダリのデータディレクトリを消去し、pg_basebackupを実行しました。残念なことに、--verboseオプションを設定しているにもかかわらず、pg_basebackupはハングし、有意义な出力は何も Produced されませんでした。

  UTC 23:30頃：あるエンジニアは、以前の試行でpg_basebackupがセカンダリのPostgreSQLデータディレクトリに何らかのファイルを作成したかもしれないと考えました。通常この場合pg_basebackupはエラーを出力しますが、そのエンジニアは状況をあまり把握できていませんでした。後になって別のエンジニア（当時不在）が、これが正常的動作であると判明させました。pg_basebackupはプライマリから複製データの送信が開始されるのを待ち、その時まで静かに待機します。残念なことに、これは弊社のエンジニアリング・ランブックにも公式のpg_basebackup文書にも明確に文書化されていませんでした。

  複製プロセスの復旧を試み、あるエンジニアはPostgreSQLデータベースディレクトリの消去に進みました。誤ってセカンダリに対して実行していると思い込んでいたためです。残念なにもしこのプロセスは代わりにプライマリに対して実行されてしまいました。エンジニアは間違いに気づいた1～2秒後にプロセスを终止しましたが、この時点で既に約300GBのデータが削除されていました。

  関与したエンジニアたちは、データベースを復旧できる可能性を期待して、データベースバックアップを探し、Slackで支援を求めました。残念なことに、バックアップの検索と使用の両方のプロセスは完全に失敗しました。

  破損した復旧手順

  pg_dumpによるデータベースバックアップ

  pg_dumpバックアップを探しに行ったところ、それらが存在しないことが分かりました。S3バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調査したところ、バックアップ手順はpg_dump 9.2を使用していたのに対し、弊社のデータベースはPostgreSQL 9.6で稼働していることが判明しました（PostgreSQLにおいて9.xリリースはメジャーバージョンと見なされます）。メジャーバージョンの違いにより、pg_dumpがエラーを発生させ、バックアップ手順が終了していました。

  [...]

  cronジョブでエラーが発生した場合、通知は有効になっていますが、これらはメールで送信されます。GitLab.comではDMARCを使用しています。残念なことに、cronジョブのメールにはDMARCが有効になっていなかったため、受信者によって拒否されました。これにより、バックアップが失敗していることは、手遅れになるまで認識していませんでした。

  Azureディスクスナップショット

  NFSサーバーには有効にされていましたが、他のバックアップ手順で十分であると想定していたため、データベースサーバーのいずれにも有効にされていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するため、「5つのなぜ」と呼ばれる手法を使用します。事態を2つの主要な問題に分割します：GitLab.comがダウンしたこと、およびGitLab.comの復旧に長い時間がかかったこと。

  問題2：GitLab.comの復旧に18時間以上かかった。

  なぜ標準のバックアップ手順を使用できなかったのか？
  - 標準のバックアップ手順では、pg_dumpを使用してデータベースの論理バックアップを実行します。この手順はGitLab.comがPostgreSQL 9.6で稼働しているのに対し、PostgreSQL 9.2を使用していたため、サイレントに失敗しました。

  なぜバックアップ手順はサイレントに失敗したのか？
  - 失敗時に通知は送信されていましたが、メールが拒否されたため、失敗の兆候はありませんでした。送信者は自動化されたプロセスであり、エラーを報告する他の手段がありませんでした。
