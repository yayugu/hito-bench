  【関羽 ｜ 戦神の忠義】

  蜀の武将にして、古今東西の英傑の中でも屈指の勇者。身長九尺、髯二尺に達し、武聖と畏敬されたその存在は、三国志の歴史に最も鮮やかに刻まれた一筆である。

  河東郡の貧農の家に生まれた雲長（うんちょう）、字關羽。黄巾の賊を討ちてその武名が響き始め、劉備・張飛と共に「桃園の誓い」を立てたことに、彼の生涯の全てが託された。赤兎の駒に跨り、青龍偃月刀を握りしめ、万軍の中から敵将の首級を挙げるその姿は、もはや人業の域を超え、戦場に舞い降りた神の如くであった。

  公孫瓚、曹操、袁紹…幾多の戦を潜り抜け、「武芸天下第一」の評は動かず。しかし、その剛勇の裡に秘められたのは、義への渇望であった。 Patriarch Liu Bei（劉備）への忠義は磐石、一旦その恩義を受ければ、たとえ曹操の高官厚禄に遇そうと、決して揺るがなかった。華容道で恩人曹操を解放した故事は、彼の「義」が「理」をも凌駕した証である。

  蜀漢の建立後、荊州を守りし大将軍として天下に睨みを効かせた。しかし、呂蒙の策略により麥城に追い詰められ、最後は自らの刃で潔く命を絶つ。享年五十八。

  死後、道教・仏教両道で神格化され、「関帝」「関聖帝君」として末永く祀られた。武勇と忠義の極致、それが関雲長の人生である。
