  **【武将名：関羽】**

  桃園の誓いにより劉備・張飛と義兄弟となり、義理と武勇を象徴する伝説の猛将。その端正な容貌と長い髭から「美髯公」と称えられ、その武名は天下に轟いた。曹操の厚遇を受けながらも、劉備への忠義を貫き通して主君のもとへ駆け戻る姿は、義の体現として語り継がれている。

  樊城の戦いでは、水攻めを駆使して魏の勢力を震撼させるほどの快挙を成し遂げるが、その後の窮地により、惜しくもその生涯を閉じた。しかし、死してなおその高潔な精神は人々の心を捉え、後世には「武聖」として神格化されるまでとなった。義のために戦い抜き、その名を歴史に刻んだ、三国志が生んだ至高の武将である。

