  1月31日のデータベース障害に関する事後分析報告書

  2017年1月31日、当社の製品の一つであるオンラインサービス「GitLab.com」において、大規模なサービス停止が発生しました。この障害は、プライマリデータベースサーバーから誤ってデータを削除したことにより引き起こされました。このインシデントにより、GitLab.comのサービスが数時間にわたって利用できない状態となりました。また、一部のプロダクションデータも消失し、最終的に復旧させることはできませんでした。

  [...]

  プロダクションデータの消失は、あってはならないことです。再発を防止するため、GitLab.comの運用および復旧手順に対して、複数の改善策に取り組んでいます。

  タイムライン

  ± 23:00 UTC: 負荷の増大により、PostgreSQLセカンダリのレプリケーションプロセスに遅延が生じ始めました。セカンダリが必要とするWALセグメントが既にプライマリから削除されていたため、レプリケーションが失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、`pg_basebackup`を実行してプライマリからセカンダリへデータベースをコピーする作業が含まれます。エンジニアの一人がセカンダリにアクセスしてデータディレクトリを消去し、`pg_basebackup`を実行しました。しかし、残念ながら`pg_basebackup`は、`--verbose`オプションを設定していたにもかかわらず、意味のある出力を出すことなくハングアップしてしまいました。

  ± 23:30 UTC: エンジニアの一人は、前回の実行試行中に`pg_basebackup`がセカンダリのPostgreSQLデータディレクトリ内に何らかのファイルを作成したのではないかと考えました。通常、このような場合は`pg_basebackup`がエラーを表示しますが、担当したエンジニアは何が起きているのか確信が持てませんでした。後に、当時その場にいなかった別のエンジニアによって、これが正常な動作であることが判明しました。`pg_basebackup`は、プライマリからレプリケーションデータの送信が開始されるのを待ち、それまで静かに待機する仕様でした。残念ながら、このことは当社のエンジニアリング・ランブックにも、`pg_basebackup`の公式ドキュメントにも明確に記載されていませんでした。

  レプリケーションプロセスの復旧を試みる際、エンジニアはセカンダリに対して操作を行っていると思い込み、誤ってPostgreSQLデータベースディレクトリの消去を実行しました。残念ながら、このプロセスは誤ってプライマリ側で実行されてしまいました。エンジニアはミスに気づいてから1、2秒後にプロセスを終了させましたが、その時点で既に約300 GBのデータが削除されていました。

  データベースを復旧できることを願い、関係したエンジニアたちはデータベースのバックアップを探し、Slackで助けを求めました。しかし、残念ながらバックアップの発見および使用のプロセスは完全に失敗しました。

  失敗した復旧手順

  pg_dumpを使用したデータベースバックアップ

  `pg_dump`バックアップを探しに行った際、それらが存在しないことが判明しました。S3バケットは空であり、どこにも最近のバックアップは見当たりませんでした。詳しく調査した結果、バックアップ手順では`pg_dump` 9.2が使用されていた一方で、データベースはPostgreSQL 9.6で動作していることが分かりました（Postgresにおいて、9.xのリリースはメジャーバージョンとして扱われます）。メジャーバージョンが異なると、`pg_dump`はエラーを出力し、バックアップ手順を終了させてしまいます。

  [...]

  エラーが発生したcronジョブに対しては通知が有効になっていますが、これらの通知はメールで送信されます。GitLab.comではDMARCを使用しています。残念ながら、cronジョブのメールにはDMARCが有効になっていなかったため、受信側によってメールが拒否されました。つまり、手遅れになるまで、バックアップの失敗に全く気づくことができなかったのです。

  Azureディスクのスナップショット

  NFSサーバーでは有効になっていましたが、他のバックアップ手順で十分であると考えていたため、データベースサーバーではこれらのスナップショットは有効になっていませんでした。

  原因分析

  これらの問題の根本原因を分析するために、「なぜなぜ分析（5 Whys）」という手法を用います。今回のインシデントを、大きく2つの問題に分けます。「GitLab.comの停止」と「GitLab.comの復旧に時間がかかったこと」です。

  問題2：GitLab.comの復旧に18時間以上かかった。

  なぜ標準的なバックアップ手順を使用できなかったのか？
  - 標準的なバックアップ手順では、`pg_dump`を使用してデータベースの論理バックアップを実行します。この手順は、GitLab.comがPostgreSQL 9.6で動作しているのに対し、PostgreSQL 9.2を使用していたため、エラーを通知することなく静かに失敗していました。

  なぜバックアップ手順は静かに失敗したのか？
  - 失敗時には通知が送信されていましたが、メールが拒否されたため、失敗を示す兆候がありませんでした。送信元は自動プロセスであり、エラーを報告する他の手段も持っていませんでした。
