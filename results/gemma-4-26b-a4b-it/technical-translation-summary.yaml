  Gitのホスティングは、分散型設計ゆえに大規模化が極めて難しい。パックファイルという巨大なバイナリ形式と、DAG（有向非巡回グラフ）構造によるランダムなアクセスパターンが、ネットワーク経由の分散ファイルシステムやDHT（分散ハッシュテーブル）での運用を困難にするからだ。

  従来の「Spokes」方式（GitHub等）は、3相コミット（3PC）を用いてレプリカ間の整合性を保つが、レプリカ数が増えると通信遅延がボトルネックとなり、スケーラビリティに限界がある。また、各サーバーを「ペット」として個別に管理する必要があり、運用負荷も高い。

  これに対し、Cursorが開発した「Continuity」は、S3を真のソース（WAL: Write-Ahead Log）とする設計を採用している。プッシュ内容はS3上のWALに記録され、参照の更新はS3のCAS（Compare-And-Swap）で行う。サーバーはステートレスであり、リポジトリは「キャッシュ」として扱う。レプリカ間の同期にはUDPゴシップを利用し、S3のETagによる検証で整合性を担保する。これにより、読み取りの線形スケーリングと、S3の圧倒的な可用性を活かした、運用負荷の低い高度なスケーラビリティを実現している。
