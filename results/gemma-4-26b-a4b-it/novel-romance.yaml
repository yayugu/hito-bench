  ### 第三十四話　湯上がりの熱、高鳴る鼓動

  　唇が離れた瞬間、部屋の温度が数度上がったような気がした。

  　さっきまでの熱い接触の余韻が、舌の先に、そして火照った頬に残っている。
  　あかねの潤んだ瞳が、すぐ近くで俺を見つめていた。少しだけ潤んで、熱を帯びたその瞳に見つめられると、心臓がうるさいほどに脈打つ。

  「……っ、あ……」

  　あかねが小さく吐息を漏らす。その吐息さえも、今はひどく甘く、官能的に感じられた。
  　俺たちは、ついさっきまで「幼なじみ」だった。
  　小鹿村の田舎道で、泥だらけになって走り回っていた、あの頃のままの俺たちだ。
  　けれど、今この瞬間、俺たちの間にあるのは、決して「兄妹」でも「幼なじみ」でもない、一人の男と一人の女としての、剥き出しの感情だった。

  「……薫、おにぃ……」

  　あかねが、震える声で俺の名前を呼ぶ。
  　その呼び方は、いつもの甘えるような「おにぃ」とは違って、どこか切実で、熱を孕んでいた。

  「……あかね」

  　俺は彼女の肩を抱き寄せたが、触れた肌があまりにも熱くて、思わず指先が震えた。
  　このまま、もっと深く、もっと彼女を求めてしまいたい。そう思う反面、頭のどこかでは「本当にいいのか？」という理性が警鐘を鳴らしている。

  　あまりの緊張と、身体の奥から込み上げてくる熱に、あかねが顔を真っ赤にして俯いた。

  「……あの、ちょっと、汗かいちゃったから……。先に、シャワー浴びてくるね」

  　逃げるように、あかねが立ち上がる。
  　その足取りもどこか危うげで、彼女自身が、今の状況にどれほど翻弄されているかが伝わってきた。

  「あ、ああ。……ゆっくりでいいから」

  　俺は精一杯の平静を装って頷いた。
  　バスルームのドアが閉まり、水が流れる音が聞こえてくる。

  　一人残された部屋で、俺はベッドの端に腰を下ろした。
  　どくん、どくん、と。
  　自分の心音があまりに大きく、静かな部屋に響いている気がして、俺は額を押さえた。

  　あかね。
  　俺の、大切な、可愛すぎる幼なじみ。

  　都会に出て、彼女に会えない日々がどれほど長く感じられたか。
  　帰省して、再会して、彼女がどんどん大人っぽくなっていく姿を見るたびに、俺の心は千切れるような思いだった。
  　あかねが、俺を「おにぃ」ではなく、一人の男として見てくれている。
  　その事実が、嬉しくて、怖くて、たまらない。

  　シャワーの音が止まった。
  　それから、しばらくの間、静寂が訪れる。

  　――来る。

  　自然と、身体が強張る。
  　彼女がどんな姿で現れるのか。どんな表情をしているのか。
  　想像するだけで、下腹部のあたりが熱くなり、喉が渇く。

  　カチリ、と小さな音がして、バスルームのドアが開いた。

  「……お待たせ」

  　微かな湯気と共に、あかねが姿を現した。

  　その瞬間、俺は息をすることさえ忘れた。

  　あかねの髪は、濡れて肩に張り付いている。
  　着ているのは、俺が貸したオーバーサイズのＴシャツだった。
  　彼女の華奢な身体には少し大きすぎて、裾から覗く太ももが、眩しいほどに白く、柔らかそうだ。

  　湯上がりのせいか、彼女の肌はほんのりと桜色に染まっていて、微かに石鹸の、清潔で甘い香りが漂ってくる。

  「……あかね、その……」

  　言葉が出てこない。
  　あまりにも無防備で、あまりにも可愛すぎて。
  　視線をどこに置けばいいのか分からず、泳いでしまう。

  「……そんなに見られると、恥ずかしいよ」

  　あかねが、濡れた髪を耳にかけながら、上目遣いに俺を見た。
  　潤んだ瞳が、揺れている。
  　彼女もまた、緊張で震えているのだ。

  　あかねは、おずおずと俺の隣に腰を下ろした。
  　Ｔシャツの裾から漂う、彼女自身の熱。
  　触れていないのに、隣に座っただけで、その体温が伝わってくるようだ。

  「……薫、おにぃ……。あたし……」

  　あかねが、俺のＴシャツの裾を、ぎゅっと掴んだ。
  　指先が白くなるほど強く。

  「あたし、ずっと……こうしたいって、思ってたの」

  　消え入りそうな、けれど、確かな意志を孕んだ声。
  　彼女の瞳の中に、俺自身の、理性を失いかけている顔が映っていた。

  「……俺もだ。あかね。……ずっと、お前を……」

  　俺は、抗えない衝動に従って、彼女の細い肩を引き寄せた。
  　濡れた髪から伝わる冷たさと、肌から伝わる熱。
  　そのコントラストが、俺の感覚をさらに鋭敏にさせていく。

  　再び重なる唇。
  　さっきよりもずっと、深く、濃密な、熱い口づけ。

  　あかねの小さな手が、俺の背中に回される。
  　彼女の震えが、俺の身体に直接伝わってくる。

  　もう、引き返せない。
  　戻ることも、立ち止まることも、できない。

  　俺たちは、互いの熱を確かめ合うように、深く、深く、重なり合っていった。

