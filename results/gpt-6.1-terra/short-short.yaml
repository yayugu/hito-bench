  **アマゾン**

  箱を開けると、むっとする湿気とともに、鳥の鳴き声があふれ出した。中には、緑の森が地平線まで広がっている。

  恐る恐る指を差し入れると、雨が降り、指先を小さな川が流れた。

  同封の紙には、こうあった。

  「毎度ご利用ありがとうございます。お客様の数多くのご注文により、保管場所が必要となりました。つきましては、こちらをお引き取りください」

  翌日、箱は少し小さくなっていた。切り倒された木々の間に、灰色の建物がいくつも並んでいる。

  スマートフォンに通知が届いた。

  「お客様のご注文は、最寄りの倉庫から発送されました」

  箱の中を見ると、灰色の建物から一台のトラックが走り出し、森を抜けてこちらへ向かってきた。

  やがて、玄関のチャイムが鳴った。

  配達員から受け取った小さな段ボールの送り状には、商品名だけが印刷されていた。

  **アマゾン**

