  **オチの解説**

  「アマゾン」を通販企業と熱帯雨林の両方の意味で使っています。大量の注文に応える倉庫を作るため、熱帯雨林が客の家に押しつけられますが、その箱の中でも森は倉庫に取って代わられ、さらに別の「アマゾン」が配達されてきます。便利な通販と森林の縮小が、終わりなく入れ子になるオチです。
