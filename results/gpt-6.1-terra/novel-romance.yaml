  「だめ」

  「俺のなのに」

  「今はあたしの」

  　昔もこんなやり取りをした気がする。けれど、クッションの向こうからのぞく目が合うと、二人そろって黙ってしまった。

  　沈黙をごまかすように、俺はテレビのリモコンを手に取る。

  「何か見るか？」

  「うん」

  　適当につけた番組では、芸人が大きな声で料理を紹介していた。画面の向こうはにぎやかなのに、俺の意識は隣にばかり向いている。

  　あかねも同じだったらしい。

  　料理の名前を聞き逃したのか、「今の何だった？」と俺に尋ねてきた。

  「……聞いてなかった」

  「あたしも」

