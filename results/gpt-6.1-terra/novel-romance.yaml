  「おにぃも緊張してるんだ」

  「してるよ。あかねは？」

  「すっごく」

  　クッションを抱えたまま、あかねは少しだけ俺に寄りかかった。肩に伝わる重みがくすぐったい。

  「でも、うれしい」

  　小さな声だった。

  「夏におにぃが帰ってきたとき、またすぐ東京に戻っちゃうんだなって思ってたから。こうしておにぃの家に来て、一緒にいられるなんて……それに、恋人になれるなんて、想像もしてなかった」

  「俺もだよ」

  　小鹿村に帰ったとき、再会したあかねは、俺の知っている小さな女の子ではなくなっていた。

  　一緒に過ごすうちに、その笑顔をもっと見ていたいと思うようになった。東京に戻ってからも、気づけばあかねのことばかり考えていた。

  「来てくれてありがとうな」

  「ふふ。言い出したとき、おにぃ、びっくりしてたもんね」

  「そりゃ、一人で来るって言うから」

  「もう子どもじゃないもん」

  「知ってる」

  　俺が即答すると、あかねは少し驚いた顔をした。

