  「いや、別に」

  「別にって顔じゃないよ」

  　そう言いながら、あかねは俺の隣に腰を下ろす。夏休みに小鹿村で会ったときには、こんなふうに隣に座ることなんて何度もあった。

  　なのに今は、肩が触れそうな距離にいるだけで落ち着かない。

  　さっきまでの俺たちと、何が変わったのか。

  　そんなの、わかりきっている。

  「あのさ」

  「うん？」

  「俺たち、付き合ってるんだよな」

  　口に出した途端、顔が熱くなった。

  　あかねはぱちぱちと瞬きをして、それから頬を赤く染める。

  「う、うん。あたしも、まだちょっと信じられない」

