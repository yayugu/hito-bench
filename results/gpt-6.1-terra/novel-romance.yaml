  　まだ恋人になったばかりで、きっとこれからも照れたり、戸惑ったりするだろう。それでも、あかねと一緒なら、そんな時間まで大切に思えそうだった。

  「明日、どこ行こうか」

  　俺が尋ねると、あかねはうれしそうに笑った。

  「おにぃが前に話してた、本屋さん。連れてって」

