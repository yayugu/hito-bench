  関羽（かんう）

  河東郡解県の出身。若き日に劉備、張飛と出会い、苦難の時代を共に戦い抜いた。曹操に捕らえられた際には、その厚遇に報いるため敵将・顔良を討つが、劉備への忠義を貫いてもとへ帰還する。赤壁の戦い後は荊州の守りを任され、建安二十四年、樊城を攻めて于禁を降し、龐徳を討ち取った。その武威は中華を震わせ、曹操に都の移転を考えさせたという。だが、その間に孫権軍の呂蒙に荊州を奪われ、退路を断たれる。麦城へ退いた後に捕らえられ、息子の関平とともに処刑された。後世には忠義と武勇の象徴として敬われ、神格化されて関帝と呼ばれた。
