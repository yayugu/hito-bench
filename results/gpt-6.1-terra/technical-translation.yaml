  # 1月31日のデータベース障害に関する事後報告

  2017年1月31日、当社の製品の一つであるオンラインサービスGitLab.comで、大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーから誤ってデータが削除されたことによって引き起こされました。このインシデントにより、GitLab.comのサービスは何時間にもわたって利用できなくなりました。また、一部の本番データが失われ、最終的に復旧することができませんでした。

  [...]

  本番データの消失はあってはならないことです。このような事態が二度と起こらないよう、GitLab.comの運用および復旧手順について、複数の改善に取り組んでいます。

  ## タイムライン

  **UTC 23:00頃：** 負荷の増大により、PostgreSQLのセカンダリでレプリケーション処理の遅延が発生し始めました。セカンダリが必要とするWALセグメントがすでにプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。この作業では、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーします。エンジニアの一人がセカンダリに接続してデータディレクトリを削除し、pg_basebackupを実行しました。しかし、pg_basebackupは停止したままとなり、--verboseオプションを指定していたにもかかわらず、有用な出力は得られませんでした。

  **UTC 23:30頃：** エンジニアの一人は、それまでにpg_basebackupの実行を試みた際、セカンダリのPostgreSQLデータディレクトリに何らかのファイルが作成されたのではないかと考えました。通常、そのような場合にはpg_basebackupがエラーを出力しますが、このエンジニアは何が起きているのか確信が持てませんでした。後に、当時その場にいなかった別のエンジニアによって、これは正常な動作であることが明らかになりました。pg_basebackupは、プライマリがレプリケーションデータの送信を開始するのを待ち、それまで何も出力せずに待機します。残念ながら、このことは社内のエンジニアリング運用手順書にも、pg_basebackupの公式ドキュメントにも明確には記載されていませんでした。

  レプリケーション処理を復旧しようとして、エンジニアの一人がPostgreSQLのデータベースディレクトリの削除に取りかかりました。本人はセカンダリ上で作業していると誤認していましたが、実際にはプライマリ上で実行していました。エンジニアは間違いに気づいてから1、2秒後に処理を停止しましたが、この時点ですでに約300 GBのデータが削除されていました。

  関係するエンジニアたちは、データベースを復旧できることを願ってバックアップを探し、Slackで支援を求めました。しかし、バックアップを見つけることも、利用することも、どちらも完全に失敗しました。

  ## 機能しなかった復旧手順

  ### pg_dumpによるデータベースのバックアップ

  pg_dumpによるバックアップを探したところ、存在しないことが判明しました。S3バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調べると、データベースはPostgreSQL 9.6で稼働しているにもかかわらず、バックアップ手順ではpg_dump 9.2を使用していることが分かりました（Postgresでは、9.xの各リリースはメジャーバージョンとして扱われます）。メジャーバージョンが異なると、pg_dumpがエラーを出力し、バックアップ処理が終了します。

  [...]

  エラーが発生したcronジョブについては通知が有効になっていましたが、通知は電子メールで送信されていました。GitLab.comではDMARCを使用しています。しかし、cronジョブのメールではDMARCが有効になっていなかったため、受信側に拒否されていました。そのため、手遅れになるまでバックアップが失敗していることに気づきませんでした。

  ### Azureのディスクスナップショット

  これらのスナップショットはNFSサーバーでは有効になっていましたが、他のバックアップ手順で十分だと考えていたため、どのデータベースサーバーでも有効にしていませんでした。

  ## 根本原因の分析

  これらの問題の根本原因を分析するために、「なぜなぜ分析」と呼ばれる手法を使用します。このインシデントを、GitLab.comが停止したことと、GitLab.comの復旧に長時間を要したことの2つの主な問題に分けます。

  ### 問題2：GitLab.comの復旧に18時間以上かかった

  **なぜ標準のバックアップ手順を利用できなかったのか？**

  - 標準のバックアップ手順では、pg_dumpを使用してデータベースの論理バックアップを実行します。GitLab.comはPostgreSQL 9.6で稼働していたにもかかわらず、この手順ではPostgreSQL 9.2を使用していたため、失敗が表面化しないまま処理が失敗していました。

  **なぜバックアップ処理の失敗が表面化しなかったのか？**

  - 失敗時に通知は送信されていましたが、メールが拒否されていたため、失敗を示すものは何もありませんでした。送信元は自動処理であり、エラーを報告する他の手段がありませんでした。
