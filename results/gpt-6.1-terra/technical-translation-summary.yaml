response: |-
  Gitの大規模ホスティングは、オブジェクト間の参照を順にたどる必要があり、packfile内でも圧縮や差分をランダムに読み出すため、分散ストレージやネットワーク越しのファイルシステムでは遅くなりやすい。

  GitHubのSpokesは、通常のGitリポジトリを各サーバーの高速ディスクに複製し、push時に参照更新を同期することで一貫性を確保する。ただし、レプリカ数を増やすと同期が遅くなり、少数のコピーを持つ小規模リポジトリでも運用負担が大きい。

  CursorのContinuityは、**S3上の先行書き込みログ（WAL）を正本**とし、ローカルのGitリポジトリを再生成可能なキャッシュとして扱う。pushはWALへの永続化後、CASで更新順序を確定する。レプリカはUDP通知で追随し、読み取り時にはS3のETagを検証するため、通知が欠落しても古いデータを返さない。大規模リポジトリは多数のレプリカで読み取りを分散でき、未使用の小規模リポジトリはローカルから削除できる。packfileの圧縮も一度だけ行い、結果を共有する。
