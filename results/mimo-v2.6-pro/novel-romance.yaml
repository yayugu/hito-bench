  # 第34話　お風呂のあとの温度

  　告白したあとの空気は、きゅっと甘くなった。

  　それなのに、頬と耳の赤さはまだ引かない。あかねはうつむいたまま、俺の胸ポケットのボタンみたいなものを目で追いかけていた。

  「……にゃんにかにしてるの、おにぃ」

  「いや、なんか、さっきのことが頭から離れないから」

  「あ……そっか。……あたしも」

  　そのうつむき加減が、めちゃくちゃかわいすぎる。

  　俺は首のうしろを掻きながら立ち上がった。

  「一回シャワー浴びてくる。せっかく恋人になったんだし、汗かいたままで甘えるのもあれだし」

  「……うん。じゃあ先に浴びちゃう？」

  「いや、俺が先に」

  「なんで？」

  「だって、お前が先に入ると、その後の俺、落ち着きすぎちゃうだろ」

  「ん？　どういう意味？」

  「……ごめん、なんでもない」

  　何でもないでもない。俺が後にすると、シャワールームから聞こえてくる水音でドキドキしてたまるか。

  　自分のバカさ加減に呆れながら、俺はアキネが持ってきた鞄から着替えを取り出した。ここは親の家だから、俺の部屋にある物がそのまま使える。

  ---

  　シャワーを浴びる。

  　ぬるい湯を浴びながら、さっきのキスのことを考えていた。あかねの唇の感触。かわいかった。あの子が俺に好意を向けてくれていた事実が、体の芯をほんわかと温めている。

  　やっぱり、こういう気持ちってのは本当にあるんだな。

  　でもそのあとを考えて、胸が高鳴った。親がいない家で、恋人となった幼なじみとふたりきり。しかも今夜、あかねはここで泊まっていく。

  　落ち着け、俺。

  　何かを強要するような男にはなりたくない。あかねのペースで、あかねの気持ちのままに進んだい。今日はそのことをずっと頭にいれていよう。

  　そう思って着替えをまとめて、廊下に出た。

  「お風呂空いたよー」

  「あ、そっか。了解」

  　リビングからあかねの声。さっきまでの照れくささはどこへやら、少しおどけた声で答えてくる。そのギャップもかわいすぎる。恋愛ってこんなに幸福なものなのか。

  ---

  　約二十分後。

  　シャワールームの扉がガラリと開いた。

  「……おにぃ、出てきたよ」

  「おう、おかえり」

  「おかえりってー」

  　あかねがリビングに入ってくる。

  　俺は驚いて目を丸くした。

  　あかねは……

  　パジャマではなかった。

  　ふわふわとした、薄いグレーの大きなTシャツ一枚で、その下にショートパンツの裾がちらりと見える。髪はいつもよりしっとりと下ろしていて、頬は湯上がりでほんのり上気している。

  　何がやばいって、Tシャツが大きくて、鎖骨と肩がちらちら見えることだ。首筋から湯気の匂いみたいな甘い香りがうっすらと漂ってくる。

  「……あかね」

  「な、なに？　変？」

  「いや、変じゃない。むしろ、変なくらいかわいい」

  「……っ、急にそういうこと言うなぁー」

  　あかねは顔を赤くして、俺の隣に座った。その距離感が、いつものことなのじゃないかと、心臓が痛い。いつものことなのに、今はどうしても近い。

  　俺は冷静なふりをしてテレビをつけた。アニメの再放送が流れてくる。中身はまったく頭に入ってこない。

  　あかねは膝を抱えて、じっとテレビを見ていた。

  　……見れてないな、これ。

  　俺も見れてない。隣の人の気配ばかりを意識して、呼吸のリズムがおかしい。

  「……おにぃ」

  「なんでもう一回あかねなんだ」

  「うんと……」

  　あかねは膝から顔を上げて、じっと俺の目を見た。

  「……さっき、付き合えたんだよね」

  「合ったよ」

  「本物の恋人なんだよね」

  「本物の恋人だよ」

  「じゃあ……」

  　あかねの手が、ふわりと俺の指に触れた。

  　その小さな指先が、俺の親指の甲をそっと撫でた。くすぐったさとも違う、胸の奥がきゅうっと締まるような感覚。

  「ねえ、もう少し……くっついてもいい？」

  「……いいよ。むしろ、来て」

  　あかねは恥ずかしそうに笑って、すとんと俺の隣に寄りかかった。

  　軽い体。湯上がりの髪が、俺の肩にかかる。シャンプーのいい匂い。

  　俺はそっとあかねの肩を抱いた。触れられるたびに、あかねの体がぴくりと震えている。

  「……くすぐったい」

  「ごめん」

  「ううん、いいの。……へへ」

  　小さく笑うあかねの声が、耳のすぐそばで響いた。

  　このまま時間が止まってくれたらいいのに、と思う。この幸福を、永遠に味わっていたい。

  　でもやっぱり、止まらない。夜は更けていく。あかねと俺の心拍数は、同じくらいに高くなっていく。

  　あかねが俺の胸に顔をうずめた。

  「……おにぃの心臓、すっごい鳴ってる」

  「あかねのだって」

  「……うん。鳴ってる。どうしよう」

  「どうしようって、どうにかしなくていいだろ」

  「そう……かな。でも、なんか、こうしてると……もっと、こう、えっちなこと……考えちゃう」

  「……っ」

  　その言葉に、喉の奥が乾いた。

  　あかねは俺の胸に顔をうずめたまま、耳まで赤くなって、それでも隠していなかった。

  　この子はいつもそうだ。恥ずかしがりながら、でも嘘はつかない。本当の気持ちを、まっすぐに向けてくる。

  　だからこそ、俺はあかねの気持ちに応えたい。

  　でも今はまだ、この甘い瞬間をもっと味わっていたい。

  「……あかね。もうちょっと、こうしていよう」

  「……うん。もうちょっと」

  　ふたりきりの部屋で、交わす言葉は少しずつ、少しずつ消えていく。

  　代わりに伝わるのは、重なる体温と、互いの呼吸と、そしてこれから先へ進むための覚悟の温度だった。

  　テレビの音だけが、二人の時間を静かに照らしている。

