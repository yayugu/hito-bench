  # 関羽

  義侠の鬼神。青龍偃月刀を掲げ、天下に名を轟かせた戦の化身。桃園の誓いを胸に義兄弟劉備と蜀の旗を掲げ、絶対の忠義を貫いた。千里の行軍、五関を踏み切り六将を斬り伏せる猛進は伝説となり、樊城一戦では水をもって七軍を撃ち崩し天下を震え上がらせる。然れども驕りは敵の刃となり、呂蒙の奇謀に落ち麦城の闇に消えてゆく。最後まで義を貫き、地に頭を下げぬまま天へ昇った。その武名は時を越えて永遠に輝き続ける。
