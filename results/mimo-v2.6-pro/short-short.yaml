  ## オチの解説

  物語の核心は**伝票の一節**です。

  > **発送者：アマゾン　／　お届け先：アマゾン**

  発送者も受取人も同じ「アマゾン」──。この対称構造がオチです。「アマゾンは、アマゾンに届く」という一文には、**三重の意味**が重なっています。

  **① Amazon（企業）が、アマゾン（地名）に配達した。**
  文字通りの読み。ECサイトのAmazonが、世界最大の森のアマゾンに届けた、という皮肉めいた読み方。

  **② アマゾン（森・自然）が、そこにいる者に恵みを与えた。**
  「注文した覚えはない。でも、ここに来たから、届いたのだ」──注文したのは誰でもなく、**「森に来た」という行為そのものが注文だった**。森が生き物を慈しむように、必要なものだけを届けてくれた。

  **③ 同じ名前同士は、引き寄せ合う。**
  「配送方法：河川便」──ドローンでもトラックでもなく**川**が運んだ。アマゾン川が、アマゾンの森にいる人間へ、Amazonの箱を運んだ。名前が同じもの同士は、こうして巡り合う。

  **最後の「矢」の多義性**
  「木漏れ日が、矢のようだった」──ここには三つの矢が重なっています。
  - Amazonのロゴの**矢印**
  - ギリシャ神話の女戦士**アマゾン**の弓矢
  - 木漏れ日という**光の矢**

  戦いの矢ではなく、優しい矢が降っている。森は、こうして「アマゾン」に届け続けている──それが、この短編の静かな結論です。
