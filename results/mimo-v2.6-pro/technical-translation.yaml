  1月31日のデータベース障害の事後分析

  2017年1月31日、当社の製品の一つであるオンラインサービス GitLab.com にて、重大なサービス障害が発生しました。この障害は、プライマリデータベースサーバーからのデータの誤削除によって引き起こされました。このインシデントにより、GitLab.com サービスは長時間にわたり利用不能となりました。また、最終的に復元することができなかった本番データの一部が失われました。

  [...]

  本番データを失うことは許されません。再発防止のため、GitLab.com の運用・復旧手順に対する複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC：負荷の増加により、PostgreSQLセカンダリのレプリケーションプロセスが遅れ始めました。セカンダリに必要なWALセグメントがプライマリからすでに削除されていたため、レプリケーションは失敗しました。GitLab.com はWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackup を実行してプライマリからセカンダリへデータベースをコピーする作業が含まれます。エンジニアの一人がセカンダリにアクセスし、データディレクトリを消去してから pg_basebackup を実行しました。残念ながら、--verbose オプションを設定していたにもかかわらず、pg_basebackup はハングし、意味のある出力を一切生成しませんでした。

  ± 23:30 UTC：エンジニアの一人は、以前の実行試行の際に pg_basebackup がセカンダリのPostgreSQLデータディレクトリにいくつかのファイルを作成したのかもしれないと考えました。通常であれば pg_basebackup はこの場合エラーを表示しますが、当該エンジニアは状況がよく分かりませんでした。後になって、別のエンジニア（当時は不在）によってこれが正常な動作であることが判明します。pg_basebackup はプライマリがレプリケーションデータの送信を開始するまで待機し、その時まで黙って座って待機するのです。残念ながら、この動作は当社のエンジニアリング運用手順書にも公式の pg_basebackup 文書にも明確に記載されていませんでした。

  レプリケーションプロセスを復元しようとして、あるエンジニアはPostgreSQLのデータベースディレクトリを消去しましたが、セカンダリ上で消去していると誤認していました。不幸なことに、この処理はプライマリ上で実行されてしまいました。エンジニアは過ちに気づいてから1〜2秒後に処理を中止しましたが、その時点で約300GBのデータがすでに削除されていました。

  データベースを復元できるかもしれないと期待し、関与したエンジニアたちはデータベースのバックアップを探し、Slackで助けを求めました。残念ながら、バックアップの検索と使用の両方のプロセスが完全に失敗しました。

  壊れていた復旧手順

  pg_dump を使用したデータベースバックアップ

  pg_dump のバックアップを探しに行ったところ、バックアップが存在しないことが判明しました。S3バケットは空で、直近のバックアップはどこにも見つかりませんでした。詳細に調査したところ、バックアップ手順は pg_dump 9.2 を使用していたのに対し、当社のデータベースは PostgreSQL 9.6 を実行していることが分かりました（Postgresにおいて、9.x リリースはメジャーバージョンとみなされます）。メジャーバージョンの相違により、pg_dump がエラーを生成し、バックアップ手順が終了してしまうのです。

  [...]

  エラーが発生した cron ジョブには通知が有効になっていますが、これらの通知は電子メールで送信されます。GitLab.com ではDMARCを使用しています。残念ながら、cron ジョブのメールにはDMARCが有効化されておらず、受信側によって拒否されていました。つまり、手遅れになるまで、バックアップの失敗を認識することができなかったのです。

  Azureディスクスナップショット

  NFSサーバーでは有効化されていましたが、データベースサーバーにはスナップショットが有効化されていませんでした。他のバックアップ手順で十分だろうと考えていたためです。

  根本原因の分析

  これらの問題の根本原因を分析するために、「5つのなぜ」と呼ばれる手法を使用します。このインシデントを2つの主要な問題に分けます。すなわち、GitLab.com のダウンと、GitLab.com の復元に長い時間がかかったことです。

  問題2：GitLab.com の復元に18時間以上かかった。

  なぜ標準のバックアップ手順を使用できなかったのか？
  - 標準のバックアップ手順では、データベースの論理バックアップを行うために pg_dump を使用しています。この手順は、PostgreSQL 9.2 を使用していた一方、GitLab.com は PostgreSQL 9.6 で動作していたため、静かに失敗しました。

  なぜバックアップ手順が静かに失敗したのか？
  - 失敗時には通知が送信されましたが、メールが拒否されていたため、失敗の兆候が一切ありませんでした。送信元は自動化されたプロセスであり、エラーを報告する他の手段がありませんでした。
