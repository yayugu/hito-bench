  『アマゾンを買った男』

  佐藤は何でもアマゾンで買う男だった。米も、靴下も、恋人へのプレゼントも、ワンクリックで翌日届く。

  ある夜、泥酔してスマホを眺めていると、タイムセールのページに奇妙な商品を見つけた。

  『アマゾン熱帯雨林　約550万平方キロメートル【中古・やや傷や汚れあり】　通常価格：要相談 → 特別価格：980円　プライム会員送料無料』

  「安いな」

  佐藤はポチった。

  翌朝、玄関に小さな段ボール箱が届いた。中に入っていたのは、分厚い権利書と、小さな苗木が一株だけだった。

  その日の昼、世界中のニュースがトップで報じた。

  「ブラジル・アマゾン熱帯雨林の所有権、日本の一般男性に移転。国際社会に衝撃」

  国連からは電話が鳴り、環境団体は家の前に押しかけ、記者のドローンがベランダを埋め尽くした。

  「面倒くさい……」

  佐藤はアプリを開き、返品ボタンを押した。理由の欄には、こう入力した。

  「思っていたのと違ったため」

  翌日、巨大な集荷ドローンが空を覆った。スピーカーから、聞き慣れた丁寧な音声が流れる。

  「返品商品の集荷に参りました。なお、商品はお届け時と同じ状態で、梱包しておいてください」

  一か月後、テレビのニュースキャスターが青い顔で原稿を読んだ。

  「アマゾン熱帯雨林が、ほぼ完全に消失しました。返品処理のため、すべての樹木が伐採・梱包され、現在、配送センターへ輸送中とのことです」

  佐藤のスマホが、ぴろんと鳴った。

  『返金手続きが完了しました：980円』
  『この商品を見た人は、こんな商品も見ています：シベリア永久凍土【新品】、サハラ砂漠【定期便で10％OFF】』

  佐藤は少しだけ迷ってから、ポチった。

  ---
  【オチの解説】

  お題の「アマゾン」を、通販サイトのAmazonと、南米のアマゾン熱帯雨林という二つの意味で重ねた話です。

  何でもワンクリックで買え、気に入らなければ無料で返品できる便利な通販の仕組みを、そのまま「熱帯雨林」という巨大な自然にまで適用してしまったため、「面倒くさい」という軽い理由の返品が、集荷のための伐採＝森林消失を引き起こしてしまいます。

  980円という値段や返金額の小ささ、最後に「シベリア永久凍土」までおすすめされてついまた買ってしまう主人公の姿で、便利さに慣れて対象の大きさや重大さを感じられなくなる現代の消費行動を皮肉っています。
