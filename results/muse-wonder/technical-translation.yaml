  1月31日のデータベース障害に関するポストモーテム

  2017年1月31日、当社の製品の一つであるオンラインサービスGitLab.comにおいて、大規模なサービス障害が発生しました。この障害は、当社のプライマリデータベースサーバーから誤ってデータが削除されたことが原因でした。このインシデントにより、GitLab.comサービスは長時間にわたって利用不能となりました。また、一部の本番データを失い、最終的に復旧できませんでした。

  [...]

  本番データを失うことは決して許されません。再発を防ぐため、私たちはGitLab.comの運用および復旧手順に対する複数の改善に取り組んでいます。

  タイムライン

  23:00 UTC頃：負荷の増加により、当社のPostgreSQLセカンダリのレプリケーションプロセスに遅延が生じ始めました。セカンダリが必要とするWALセグメントがプライマリからすでに削除されていたため、レプリケーションは失敗しました。GitLab.comではWALアーカイビングを使用していなかったため、セカンダリを手動で再同期しなければなりませんでした。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリへデータベースをコピーすることが含まれます。エンジニアの一人がセカンダリにアクセスしてデータディレクトリを消去し、pg_basebackupを実行しました。しかし残念ながら、--verboseオプションが設定されていたにもかかわらず、pg_basebackupはハングし、意味のある出力を何も生成しませんでした。

  23:30 UTC頃：エンジニアの一人は、おそらくpg_basebackupが前回の実行試行中にセカンダリのPostgreSQLデータディレクトリ内にいくつかのファイルを作成したのではないかと考えました。通常、このような場合pg_basebackupはエラーを表示しますが、問題のエンジニアは、何が起きているのかあまり確信が持てませんでした。後に（当時その場にいなかった）別のエンジニアによって、これは正常な動作であることが判明しました。pg_basebackupは、プライマリがレプリケーションデータの送信を開始するまで待機し、その間は黙って待機し続けるのです。残念ながら、このことは当社のエンジニアリング用ランブックにも、pg_basebackupの公式ドキュメントにも明確に記載されていませんでした。

  レプリケーションプロセスを復旧しようとして、あるエンジニアが、セカンダリ上で行っているつもりで、PostgreSQLデータベースディレクトリの消去を進めました。しかし残念ながら、このプロセスは代わりにプライマリ上で実行されました。エンジニアは間違いに気づいて1～2秒後にプロセスを終了しましたが、この時点で約300 GBのデータがすでに削除されていました。

  データベースを復旧できることを期待して、関係したエンジニアたちはデータベースのバックアップを探しに行き、Slackで助けを求めました。しかし残念ながら、バックアップの発見と利用の両方のプロセスは完全に失敗しました。

  機能していなかった復旧手順

  pg_dumpを使用したデータベースバックアップ

  pg_dumpのバックアップを探しに行ったところ、それが存在しないことが分かりました。S3バケットは空で、最近のバックアップはどこにも見当たりませんでした。詳しく調査したところ、バックアップ手順ではpg_dump 9.2が使用されていたのに対し、当社のデータベースはPostgreSQL 9.6で稼働していることが判明しました（Postgresでは、9.xリリースはメジャーリリースとみなされます）。メジャーバージョンの違いによりpg_dumpはエラーを生成し、バックアップ手順が終了していました。

  [...]

  エラーが発生したcronジョブについては通知が有効になっていますが、これらの通知はメールで送信されます。GitLab.comではDMARCを使用しています。しかし残念ながら、cronジョブのメールに対してDMARCが有効になっていなかったため、受信側に拒否される結果となりました。つまり、手遅れになるまで、私たちはバックアップが失敗していたことに全く気づいていなかったのです。

  Azureディスクスナップショット

  NFSサーバーについては有効になっていましたが、当社の他のバックアップ手順で十分だと想定していたため、データベースサーバーのいずれについてもこれらのスナップショットは有効になっていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するために、「5つのなぜ」と呼ばれる手法を用います。このインシデントを、GitLab.comがダウンしたことと、GitLab.comの復旧に長時間を要したことという、2つの主な問題に分けて考えます。

  問題2：GitLab.comの復旧に18時間以上を要した。

  なぜ標準のバックアップ手順を使用できなかったのか？
  - 標準のバックアップ手順では、pg_dumpを使用してデータベースの論理バックアップを実行します。この手順は、GitLab.comがPostgreSQL 9.6で稼働しているのに対し、PostgreSQL 9.2を使用していたため、サイレントに失敗していました。

  なぜバックアップ手順はサイレントに失敗したのか？
  - 失敗時に通知は送信されましたが、メールが拒否されたため、失敗を示すものは何もありませんでした。送信元は自動化されたプロセスであり、エラーを報告する他の手段はありませんでした。
