response: |-
  大規模Gitホスティングの本質的困難はpackfileにある。オブジェクトはDAGを辿らねばならず、pack内でもデルタ圧縮によりランダムアクセスが発生するため、分散ファイルシステムや、SHAをキーとするKVSでは往復遅延で破綻する。GitHubのSpokesはこれを回避すべく、NVMe上の通常リポジトリを3台複製し、pack転送は非同期、参照更新だけを3相コミットで多数決合意する設計で強整合性を得た。しかし3PCは最遅ノードに律速され、巨大モノレポ向けに複製を増やせず、逆にエージェントが生む大量の小規模リポジトリでも最低3台が必要で、配置DBや修復運用も重い。

  CursorのContinuityは、S3上のWALを唯一の真実とし、ローカルリポジトリをキャッシュに降格させた。pushはWALへの永続化と、S3へのCASによる参照インデックス更新で線形化され、合意やルーティング表なしに任意のノードがプライマリになれる。複製通知は信頼性の低いUDPゴシップで送り、読み取り時にETag付き条件付きGETでS3と照合して強整合性を保証する割り切りが巧妙だ。これにより複製数を0〜100台まで伸縮でき、圧縮（repack）はプライマリだけが行い結果をWAL経由で配るため、帯域と引き換えにCPUを節約できる。
