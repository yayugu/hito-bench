response: 蜀漢の礎を築いた、義に生きる武将。桃園の誓いで劉備・張飛と義兄弟の契りを結び、生涯その絆を貫いた。万軍の中でも怯まず、青龍偃月刀を振るう姿は鬼神の如く、敵からは「万人敵」「美髯公」と恐れられた。一時曹操に身を寄せ手厚い恩遇を受けながらも、劉備への忠誠を捨てず千里を駆けて帰参。赤壁などで武勇を轟かせ、荊州を任される重臣となる。樊城では水攻めで魏軍を破り、于禁を降伏させて中華全土を震撼させたが、背後から呂蒙率いる呉軍の奇襲を受け荊州を失い、麦城へ追い詰められる。捕らわれても降伏を拒み、子の関平と共に処刑された。死後は忠義の象徴として神格化され、「関帝」として後世まで祀り続けられた。
