  1月31日のデータベース障害に関する事後分析

  2017年1月31日、当社の製品の1つであるオンラインサービスGitLab.comで大規模なサービス障害が発生しました。この障害は、プライマリデータベースサーバーからのデータの誤った削除によって引き起こされました。このインシデントにより、GitLab.comサービスは何時間も利用できなくなりました。また、最終的に復旧できなかった本番データも失いました。

  本番データを失うことは許されません。これが二度と起こらないようにするため、GitLab.comの運用および復旧手順について複数の改善に取り組んでいます。

  タイムライン

  ± 23:00 UTC：負荷の増大により、PostgreSQLのセカンダリのレプリケーションプロセスが遅れ始めました。セカンダリに必要なWALセグメントが既にプライマリから削除されていたため、レプリケーションは失敗しました。GitLab.comはWALアーカイブを使用していなかったため、セカンダリを手動で再同期する必要がありました。これには、セカンダリ上の既存のデータディレクトリを削除し、pg_basebackupを実行してプライマリからセカンダリにデータベースをコピーすることが含まれます。エンジニアの一人がセカンダリに移動してデータディレクトリをワイプし、その後pg_basebackupを実行しました。残念ながら、--verboseオプションが設定されていたにもかかわらず、pg_basebackupはハングし、意味のある出力を生成しませんでした。

  ± 23:30 UTC：エンジニアの一人は、以前に実行した際にpg_basebackupがセカンダリのPostgreSQLデータディレクトリにいくつかのファイルを作成したのではないかと考えました。通常、このような場合にはpg_basebackupはエラーを出力しますが、当該エンジニアは何が起こっているのかよくわかっていませんでした。後に別のエンジニア（当時現場にいなかった）によって、これは正常な動作であることが明らかになりました。つまり、pg_basebackupはプライマリがレプリケーションデータの送信を開始するのを待ち、その時まで黙って待機します。残念ながら、これはエンジニアリングのランブックにも、pg_basebackupの公式ドキュメントにも明確に文書化されていませんでした。

  レプリケーションプロセスを復旧しようとして、エンジニアはセカンダリで実行しているつもりでPostgreSQLデータベースディレクトリをワイプしました。残念ながら、このプロセスは実際にはプライマリで実行されてしまいました。エンジニアはミスに気づいてから1、2秒後にプロセスを停止しましたが、この時点で既に約300GBのデータが削除されていました。

  データベースを復旧できることを期待して、関係するエンジニアたちはデータベースのバックアップを探しに行き、Slackで助けを求めました。残念ながら、バックアップの検索と使用の両方のプロセスが完全に失敗しました。

  壊れた復旧手順

  pg_dumpを使用したデータベースバックアップ

  pg_dumpのバックアップを探しに行ったところ、それらが存在しないことがわかりました。S3バケットは空で、最近のバックアップはどこにも見つかりませんでした。詳しく調べたところ、バックアップ手順はpg_dump 9.2を使用していましたが、私たちのデータベースはPostgreSQL 9.6で動作しています（Postgresでは、9.xリリースはメジャーバージョンと見なされます）。メジャーバージョンの違いにより、pg_dumpはエラーを生成し、バックアップ手順を終了させます。

  エラーが発生したcronジョブに対して通知は有効になっていますが、これらの通知はメールで送信されます。GitLab.comではDMARCを使用しています。残念ながら、cronジョブのメールに対してDMARCが有効になっていなかったため、受信者によって拒否されてしまいました。これは、バックアップが失敗していることに気づかないまま、手遅れになるまで気づかなかったことを意味します。

  Azureディスクスナップショット

  NFSサーバーでは有効になっていましたが、他のバックアップ手順で十分だと仮定していたため、これらのスナップショットはデータベースサーバーでは有効になっていませんでした。

  根本原因分析

  これらの問題の根本原因を分析するために、「5つのなぜ（The 5 Whys）」と呼ばれる手法を使用します。このインシデントを2つの主要な問題に分けます。GitLab.comが停止していることと、GitLab.comの復旧に長時間かかることです。

  問題2：GitLab.comの復旧に18時間以上かかりました。

  なぜ標準のバックアップ手順を使用できなかったのでしょうか？
  - 標準のバックアップ手順は、pg_dumpを使用してデータベースの論理バックアップを実行します。この手順は、PostgreSQL 9.2を使用していたのに対し、GitLab.comはPostgreSQL 9.6で動作しているため、サイレントに失敗しました。

  なぜバックアップ手順はサイレントに失敗したのでしょうか？
  - 失敗時に通知は送信されましたが、メールが拒否されたため、失敗の兆候はありませんでした。送信者は自動化されたプロセスであり、他にエラーを報告する手段がありませんでした。
