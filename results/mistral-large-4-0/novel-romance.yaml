  34話　シャワーのあとの、ふたりの時間

  「──おにぃ、入っていい？」

  浴室のドアの向こうから、あかねの声が聞こえた。いつもより少し小さくて、どこか照れくさそうな響き。

  「ああ、どうぞ」

  俺は慌てて浴室の前から離れて、リビングのソファに腰を下ろした。まだ湯気が残るタオルで頭を拭きながら、自分の鼓動が妙に大きく聞こえるのを必死で誤魔化す。

  数分後、キュッキュッとスリッパの音が近づいてきた。現れたあかねは……思わず息を呑んだ。

  バスタオル一枚。それだけ。

  「あ、あたしの服……洗濯しちゃったから」

  あかねは恥ずかしそうに笑いながら、胸の前でタオルの端をぎゅっと握りしめている。シャワー上がりの肌はほんのりと赤みを帯びていて、濡れた黒髪が肩に張り付いて艶やかだ。いつもポニーテールにしている髪が今日は下ろされていて、そのせいで幼さと大人っぽさが同居したような、不思議な雰囲気を醸し出している。

  「……見すぎ」

  「えっ？」

  「いや、その、髪、濡れてて……」

  俺は顔を真っ赤にしながら視線を逸らした。自分でも情けないと思う。高校三年にもなって、女の子のシャワー上がりを前にオロオロするなんて。

  あかねは照れながらも、俺の隣に腰を下ろした。タオルの裾から、すらりとした脚が覗いている。

  「おにぃ……」

  「……ん？」

  「あのさ、さっき……キス、したよね」

  「……うん」

  「なんか、実感わかない」

  あかねは膝を抱えて、俺の方をチラッと見上げた。目が潤んでいて、長い睫毛が震えている。

  「本当に、あたし……おにぃの彼女なんだよね？」

  胸がぎゅっと締め付けられる。たった数時間前、この部屋で告白して、キスを交わした。でも確かに、環境が変わると現実感が薄れてしまうのかもしれない。田舎の小鹿村から一人で上京してきたあかねにとって、この東京の、俺の部屋で過ごす一夜は、非日常の連続だ。

  「……あかね」

  俺はソファの上で膝を立てて、あかねの方を向いた。距离は、触れ合おうと思えばすぐに届くくらい近い。

  「俺も、まだ信じられない時がある。でも……」

  俺はあかねの手を取った。シャワー上がりだから少し冷たくて、でも柔らかい。

  「こうして触れてると、確かだなって思う。あかねは、俺の彼女だ」

  あかねの頬が、夕焼けみたいに赤く染まった。

  「……うん」

  そして、ゆっくりと顔を近づけてくる。俺も自然と応じて、唇がそっと触れ合った。シャワーの石鹸の匂いが、かすかに香る。

  「……ん……」

  一度離れて、また重ねる。今度は少し深く、ゆっくりと。あかねの吐息が俺の唇にかかって、痒ったくて、胸の奥が熱くなる。

  「……照れる」

  キスの後、あかねが俺の胸に顔を埋めてくる。バスタオル越しでも、あかねの体温と鼓動が伝わってくる。

  「おにぃの匂い……」

  「……変な匂いじゃないか？」

  「ううん。安心する匂い」

  俺はあかねの背中に腕を回した。タオルの布地越しに、痩せているけどしっかりとした体のラインを感じる。田舎で育ったからか、日焼けの跡もなく、肌は白くてきめ細やかだ。

  「……ねえ、おにぃ」

  「……ん？」

  「今日、泊まるんだよね？　明日、帰るの？」

  「……帰るの、寂しいな」

  正直に言うと、胸が痛くなる。夏休みも終わりに近づいていて、あかねは受験生だ。でも、このまま別れたくなかった。

  あかねが顔を上げて、真っ直ぐに俺を見つめる。

  「あたしも……帰りたくない」

  「……そうか」

  俺はもう一度、あかねの唇を奪った。今度は少し強めに、想いを込めて。あかねも応えてくれて、小さく「ん……」と声を漏らす。

  キスが終わると、ふたりとも少し息が荒くなっていた。

  「……あ、あたし、汗かいちゃったかも」

  「気にしなくていいよ」

  「……だめだよ、おにぃに臭いって思われたら」

  「そんなことないって」

  俺は笑いながら、あかねの頬を撫でた。シャワー上がりなのに、また少し汗ばんでいる。それだけ、緊張して、ドキドキしているんだ。

  「……あのさ」

  あかねが小さな声で続ける。

  「あたし、お風呂入ってる時、考えちゃったんだ」

  「……何を？」

  「その……おにぃと付き合って、これからどうなるんだろうって」

  俺はあかねの手を握りしめた。

  「一緒にいたい。ずっと」

  「……ずっと？」

  「毎日、学校で会えたらいいなって思う。小鹿村にいた頃みたいに」

  あかねの目が、また潤んだ。

  「……うん。あたしも」

  そして、あかねは俺の隣から少し身を乗り出して、俺の首に腕を回した。俺もぎゅっと抱きしめ返す。

  「おにぃ……」

  「あかね……」

  名前を呼び合いながら、もう一度キスをする。今度は、さっきよりもずっと長く、深く。

  ソファの上で、バスタオル一枚のあかねと、俺。シャワー上がりの身体が密着して、互いの鼓動がシンクロしていくような、そんな甘い時間。

  「……今日は、ここで寝る？」

  「……うん」

  「……ベッド、貸してくれる？」

  「……もちろん」

  俺は立ち上がって、あかねの手を引いた。あかねは照れながらも、俺について寝室へと向かう。

  明かりを少し落として、ベッドの上に並んで座る。あかねはまだバスタオル一枚だから、俺は少し視線を泳がせながらも、ちゃんと前を向いた。

  「……おにぃ」

  「……ん？」

  「……好き」

  「……俺も」

  言葉にすると、また胸が熱くなる。恋人同士になったばかりだけど、もうこの先、ずっと一緒にいたい。そんな確信が、不思議と湧き上がってくる。

  あかねが俺の隣にぎゅっと寄り添ってきた。タオル越しの体温が、心地いい。

  「……ねえ、おにぃ。明日も、一緒にいて」

  「……うん、約束する」

  俺はあかねの頬にキスをして、耳元で囁いた。

  「ずっと、そばにいるから」

  「……ん」

  あかねが小さく頷くのが、伝わってくる。

  シャワー上がりの夜は、まだ始まったばかりだった。
