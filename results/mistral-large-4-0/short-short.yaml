  私は毎朝、ベッドから声を出す。「アレクサ、今日の予定は？」
  すると天井から女性の声が聞こえる。「今日の予定はありません。しかし、新しい『人生』が在庫切れです」
  私は笑った。「嘘つけ。人生なんて無限にある」
  「在庫管理システムを確認しています……」
  沈黙。
  「……申し訳ありません。『人生』は現在、世界中で品切れ中です。代替品として『幸せ（中古）』はいかがでしょうか」
  私はベッドから飛び起きた。窓の外を見る。隣の家も、その隣の家も、みんな同じ時間に同じことを叫んでいる。
  「アレクサ、人生を返品したい」
  「返品手続きを開始します。箱はどちらにありますか」
  「ここだ！」
  私は窓を開けて叫んだ。
  すると、空から巨大な段ボール箱が降ってきた。宙返りして、私のベランダにドスンと着地した。
  箱を開けると、中には……私の人生が詰まっていた。学校のプリント、古い写真、使い古しの日記。
  蓋を閉じようとした瞬間、中から声がした。
  「返品はお受けできません」
  箱の中の私が、ニヤリと笑った。
  「今から、私があなたの人生を生きます」
  私は叫んだ。「アレクサ、助けて！」
  すると天井から、いつもの声が響いた。
  「はい。注文を受け付けました。『助け』は在庫ありです。発送します」

