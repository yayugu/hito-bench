response: 「義」を何より重んじる武人。劉備・張飛との桃園の誓いを胸に、蜀漢の柱石として戦場を駆け抜けた。赤兎馬と青龍偃月刀を携え、五関六将を斬り伏せ、華容道で曹操を見逃すなど、その武勇と仁義は天下に轟いた。水攻め七軍では于禁の七軍を水没させ、単刀赴会では敵陣に乗り込む豪胆も見せ、荊州の守りを固めた。しかし、留守を呉の呂蒙に襲われ、荊州を失陥。徐晃との戦いに敗れ、ついに麦城に籠り、孤立無援の中で脱出を図るも失敗。建業で捕らえられ、処刑された。だが、その忠義は死後も讃えられ、「武聖」関帝として祀られ、今もなお義を貫く者たちの規範となっている。赤髯の男は、最期まで「義」を貫き通したのだ。
