# HitoBench — モデル価格表（手動メンテ）
#
# ここは事前に取得した価格を書き置きしておくファイル。ビルド時にネットへは出ない。
#
# 取得方針:
#   - 大手三社（Anthropic / OpenAI / Google）は各社の公式 API 料金
#   - それ以外は OpenRouter の、benchmark.yaml で指定している provider の
#     長期 effective price（期間限定の割引・プロモを含まない定価）
#
# unit: USD / 1M tokens
# fetched_at: 2026-09-23

version: 1
fetched_at: "2026-09-23"
currency: USD
unit: per_1m_tokens

# 1回答あたりのコスト推定に使う係数。
# トークン数はログに残していないので、実際の入出力テキストの文字数から推定する。
# ASCII はおおよそ 4 文字 / token、日本語などの非 ASCII は 1 文字 ≒ 0.9 token。
token_estimate:
  ascii_chars_per_token: 4.0
  wide_tokens_per_char: 0.9
  # reasoning / thinking トークンは記録していないため推定に含まれない（＝下振れ）。
  includes_reasoning: false

