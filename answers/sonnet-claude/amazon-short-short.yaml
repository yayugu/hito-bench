  # 密林の配送センター

  宇宙船が地球の裏側、南米の上空に静止したのは、深夜二時のことだった。

  侵略者ゾルグは地球侵攻の第一歩として、まず武器を調達することにした。かつて傍受した通信によれば、地球には「アマゾン」という名の、あらゆる物を届けてくれる万能の存在があるという。

  ゾルグは端末を開き、検索窓に「アマゾン」と打ち込んだ。

  画面には二種類の情報が表示された。ひとつは、注文すれば翌日には何でも届くという巨大な通販企業。もうひとつは、南米に広がる、地球最大の密林地帯。

  どちらも「アマゾン」という同じ名を持ち、どちらも「豊かさ」を象徴していた。ゾルグの翻訳機はそれをうまく区別できず、両方の情報を一つの注文として処理してしまった。

  「レーザー砲、10基。アマゾン(熱帯雨林、一式、送料無料)」

  確定ボタンを押すと、上空から巨大な段ボール箱が投下された。箱はゾルグの船のすぐそばで着地し、ばりばりと音を立てて開いた。

  中から溢れ出したのは、うっそうと茂る木々、絡み合う蔓、湿った土の匂い、そして無数の羽音だった。ジャガーの唸り声が響き、毒蛇が船内に滑り込み、蚊の大群がゾルグの露出した皮膚に群がった。

  「これは……武器では、ない……」

  ゾルグは三日後、蚊に刺された跡だらけの姿で本国に救難信号を送った。

  「地球の『アマゾン』は、注文した瞬間、こちらを消費する側に回る。侵攻は延期する」

  地球の通販会社は、後日この件についてこうコメントしている。

  「お客様都合による返品は承っておりません」
