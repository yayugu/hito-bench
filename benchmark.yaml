  - id: qwen3.8-27b
    adapter: openai-compatible
    model: qwen/qwen3.8-27b
    reasoning_effort: medium
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    provider: alibaba
    timeout_seconds: 600

  # Low
  - id: gpt-5.6-luna-codex
    adapter: codex
    model: gpt-5.6-luna
    reasoning_effort: medium
    timeout_seconds: 600

  - id: sonnet-5-claude
    adapter: claude
    model: sonnet-5
    reasoning_effort: high
    timeout_seconds: 600

  - id: gemini-3.8-flash-medium
    adapter: openai-compatible
    model: gemini-3.8-flash
    reasoning_effort: medium
    endpoint: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
    api_key_env: GEMINI_API_KEY
    timeout_seconds: 600

  - id: glm-5.3-flash
    adapter: openai-compatible
    model: z-ai/glm-5.3-flash
    reasoning_effort: medium
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    provider: z-ai/fp8
    timeout_seconds: 600

  - id: deepseek-v4.1-flash
    adapter: openai-compatible
    model: deepseek/deepseek-v4.1-flash
    reasoning_effort: medium
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    provider: deepseek
    timeout_seconds: 600

  - id: muse-spark-1.3
    adapter: openai-compatible
    model: meta/muse-spark-1.3
    request_model: meta/muse-spark-1.3-contributor
    reasoning_effort: medium
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    provider: meta
    timeout_seconds: 600

  - id: hy4-preview
    adapter: openai-compatible
    model: tencent/hy4-preview
    reasoning_effort: medium
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    provider: tencent/fp8
    timeout_seconds: 600

  - id: mimo-v2.5
    adapter: openai-compatible
    model: xiaomi/mimo-v2.5
    reasoning_effort: medium
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    provider: xiaomi/fp8
    timeout_seconds: 600

  # High
  - id: gpt-5.6-sol-codex
    adapter: codex
    model: gpt-5.6-sol
    reasoning_effort: medium
    timeout_seconds: 600

  - id: opus-5-claude
    adapter: claude
    model: opus-5
    reasoning_effort: high
    timeout_seconds: 600

  - id: kimi-k3
    adapter: openai-compatible
    model: moonshotai/kimi-k3
    reasoning_effort: medium
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    provider: moonshotai/mxfp4
    timeout_seconds: 600

  # Frontier
  - id: gpt-6-astra-codex
    adapter: codex
    model: gpt-6-astra
    reasoning_effort: medium
    timeout_seconds: 600

  - id: fable-5.1-claude
    adapter: claude
    model: fable-5.1
    reasoning_effort: high
    timeout_seconds: 600

