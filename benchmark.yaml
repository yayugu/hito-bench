version: 1
runners:
  # Low
  - id: gpt-5.6-luna-codex
    adapter: codex
    model: gpt-5.6-luna
    reasoning_effort: medium
    enabled: true
    timeout_seconds: 600

  - id: sonnet-5-claude
    adapter: claude
    model: sonnet
    reasoning_effort: high
    enabled: true
    timeout_seconds: 600

  - id: gemini-3.8-flash-medium-agy
    adapter: agy
    model: gemini-3.8-flash-medium
    reasoning_effort: medium
    enabled: true
    timeout_seconds: 600

  # High
  - id: gpt-5.6-sol-codex
    adapter: codex
    model: gpt-5.6-sol
    reasoning_effort: medium
    enabled: true
    timeout_seconds: 600

  - id: opus-5-claude
    adapter: claude
    model: opus
    reasoning_effort: high
    enabled: true
    timeout_seconds: 600

  # endpoint と API key の環境変数を設定してから enabled: true にする。
  - id: example-model-rest
    adapter: openai-compatible
    model: example-model
    reasoning_effort: medium
    endpoint: ${OPENAI_COMPAT_ENDPOINT}
    api_key_env: OPENAI_COMPAT_API_KEY
    enabled: false
    timeout_seconds: 600
